    <a href="/tripos-notes/Lectures/IB/Lent/Numerical-Analysis-NA/Notes/LU-factorisation.html">LU factorisation</a> is unique,
    i.e. if <span class="inline-math">$L_1U_1=L_2U_2$</span> are two LU factorisations
    (<span class="inline-math">$L_i$</span> lower unitriangular, <span class="inline-math">$U_i$</span> non-singular and upper triangular),
    then <span class="inline-math">$L_1=L_2$</span> and <span class="inline-math">$U_1=U_2$</span>.
