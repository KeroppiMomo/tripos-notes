<h1>Uniqueness</h1>

<p>
    Suppose <span class="inline-math">$p,q\in \mathcal{P}_n$</span> satisfy <span class="inline-math">$p(x_i) = q(x_i)$</span> for <span class="inline-math">$i=0,\ldots,n$</span>.
    Then <span class="inline-math">$r := p - q$</span> has degree at most <span class="inline-math">$n$</span> and has <span class="inline-math">$(n+1)$</span> roots, namely <span class="inline-math">$x_0, \ldots, x_n$</span>.
    Therefore <span class="inline-math">$r\equiv 0$</span> and thus <span class="inline-math">$p=q$</span>.
</p>
