<p>
    For the nodes <span class="inline-math">$x_0, \ldots, x_n$</span>,
    take the polynomial <span class="inline-math">$p(x) = \prod_{i=0}^{n} (x-x_i)^2\in \mathcal{P}_{2n+2}$</span>.
    Then <span class="inline-math">$0 = \sum_{i=0}^{n} a_i p(x_i) \neq \int_{a}^{b} p(x) \d x &gt; 0$</span>.
</p>
