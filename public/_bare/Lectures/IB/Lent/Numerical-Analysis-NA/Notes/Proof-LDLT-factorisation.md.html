<p>
    Let <span class="inline-math">$A = LDU$</span> be the <a href="/tripos-notes/Lectures/IB/Lent/Numerical-Analysis-NA/Notes/Corollary-LDU-factorisation.html">LDU factorisation</a> of <span class="inline-math">$A$</span>.
    Then by symmetry,
    <span class="display-math">$$ \begin{align*}
        LDU = A = A^T = U^T D L^T,
    \end{align*} $$</span>
    which is another LDU decomposition of <span class="inline-math">$A$</span>.
    By uniqueness, <span class="inline-math">$U = L^T$</span>.
</p>
