<p>
    For a <a href="/tripos-notes/Lectures/IB/Lent/Numerical-Analysis-NA/Notes/Polynomial-interpolation.html">polynomial interpolation problem</a>,
    the interpolating polynomial is given by
    <span class="display-math">$$ \begin{align*}
        p_n(x) = \sum_{k=0}^{n} f[x_0, \ldots, x_k] \prod_{i=0}^{k-1} (x-x_i)
    \end{align*} $$</span>
    where <span class="inline-math">$f[x_0, \ldots, x_k]$</span> is the <a href="/tripos-notes/Lectures/IB/Lent/Numerical-Analysis-NA/Notes/Definition-divided-difference.html">divided difference</a>.
</p>
