<p>
    Check that
    <span class="display-math">$$ \begin{align*}
        H_\v u \v u ={}&amp; \v u - \frac{2}{\|\v u\|^2}\v u(\v u^T \v u) = -\v u, \\
        H_\v u \v v ={}&amp; \v v &amp;\forall \v v\perp \v u.
    \end{align*} $$</span>
    Thus <span class="inline-math">$H_\v u$</span> agrees with the action of a reflection on a basis.
</p>
