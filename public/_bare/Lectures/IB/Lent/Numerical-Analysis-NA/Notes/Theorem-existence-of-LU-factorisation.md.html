<p>
    A square matrix <span class="inline-math">$A\in \R^{n\times n}$</span> admits an <a href="/tripos-notes/Lectures/IB/Lent/Numerical-Analysis-NA/Notes/LU-factorisation.html">LU factorisation</a>
    iff <span class="inline-math">$A$</span> is <a href="/tripos-notes/Lectures/IB/Lent/Numerical-Analysis-NA/Notes/Definition-strictly-regular-matrix.html">strictly regular</a>.
</p>
<p>
    <a href="/tripos-notes/Lectures/IB/Lent/Numerical-Analysis-NA/Notes/Proof-existence-of-LU-factorisation.html">Proof</a>
</p>
<ul>
<li>
    <p>
        Every non-singular matrix <span class="inline-math">$A$</span> admits an LU factorisation with pivoting,
        i.e. <span class="inline-math">$PA = LU$</span> for some permutation matrix.
    </p>
    
</li>
</ul>
