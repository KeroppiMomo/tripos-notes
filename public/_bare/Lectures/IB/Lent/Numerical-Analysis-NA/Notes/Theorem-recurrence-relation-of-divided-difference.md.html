<p>
    The <a href="/tripos-notes/Lectures/IB/Lent/Numerical-Analysis-NA/Notes/Definition-divided-difference.html">divided differences</a> satisfy the recurrence relation
    <span class="display-math">$$ \begin{align*}
        f[x_0, x_1, \ldots, x_{k-1}, x_k] = \frac{f[x_1, \ldots, x_{k-1}, x_k] - f[x_0, x_1, \ldots, x_{k-1}]}{x_k - x_0}.
    \end{align*} $$</span>
