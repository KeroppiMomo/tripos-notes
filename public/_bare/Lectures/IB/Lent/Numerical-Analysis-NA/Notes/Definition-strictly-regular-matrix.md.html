<p>
    A square matrix <span class="inline-math">$A\in \R^{n\times n}$</span> is said to be <em>strictly regular</em>
    if all its principal minors (top left blocks of <span class="inline-math">$A$</span>, i.e.
    <span class="inline-math">$A_1 = \pmat{a_{11}}, A_2 = \pmat{a_{11} &amp; a_{12} \\ a_{21} &amp; a_{22}}, \ldots, A_n = A$</span>)
    are non-singular.
</p>
