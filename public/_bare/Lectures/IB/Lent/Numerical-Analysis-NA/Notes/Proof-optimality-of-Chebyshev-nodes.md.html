<p>
    <span class="inline-math">$x_i^\ast$</span> are precisely the roots of the <a href="/tripos-notes/Lectures/IB/Lent/Numerical-Analysis-NA/Notes/Definition-Chebyshev-polynomial.html">Chebyshev polynomial</a>,
    so <span class="inline-math">$ω_{Δ^\ast}(x) = \prod_{i=0}^{n} (x-x_i^\ast) = \frac{1}{2^n} T_{n+1}(x)$</span>
    has the <a href="/tripos-notes/Lectures/IB/Lent/Numerical-Analysis-NA/Notes/Theorem-Chebyshev-polynomial-has-minimum-L-inf-norm.html">smallest <span class="inline-math">$L^\infty$</span> norm</a> among all monic polynomials <span class="inline-math">$ω_Δ\in \mathcal{P}_{n+1}$</span>.
</p>
