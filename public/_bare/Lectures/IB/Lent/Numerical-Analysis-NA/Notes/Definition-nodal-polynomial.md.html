<p>
    For a <a href="/tripos-notes/Lectures/IB/Lent/Numerical-Analysis-NA/Notes/Polynomial-interpolation.html">polynomial interpolation problem</a>,
    the <em>nodal polynomial</em> is defined as
    <span class="display-math">$$ \begin{align*}
        ω(x) = \prod_{i=0}^{n} (x-x_i) \in \mathcal{P}_{n+1}.
    \end{align*} $$</span>
</p>
<ul>
<li>
    <p>
        The roots of <span class="inline-math">$ω$</span> is precisely <span class="inline-math">$x_0, \ldots, x_n$</span>.
    </p>
    
</li><li>
    <p>
        <span class="inline-math">$ω&#x27;(x_i) = \prod_{j\neq i} (x_i-x_j)$</span>.
    </p>
    
</li>
</ul>
