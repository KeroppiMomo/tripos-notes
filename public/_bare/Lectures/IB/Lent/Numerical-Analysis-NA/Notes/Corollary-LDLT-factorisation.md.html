<p>
    <span class="inline-math">$A\in \R^{n\times n}$</span> is strictly regular and symmetric
    iff it admits a factorisation <span class="inline-math">$A = LDL^T$</span>
    where <span class="inline-math">$L$</span> is lower unitriangular and <span class="inline-math">$D$</span> is non-singular and diagonal.
</p>
<p>
    Moreover the factorisation is unique.
</p>
