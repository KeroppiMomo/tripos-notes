<p>
    A <a href="/tripos-notes/Lectures/IB/Lent/Numerical-Analysis-NA/Notes/Multistep-methods.html">multistep method</a> is <a href="/tripos-notes/Lectures/IB/Lent/Numerical-Analysis-NA/Notes/Definition-convergent-method.html">convergent</a> iff
</p>
<ul>
<li>
    <p>
        it is of order <span class="inline-math">$p\geq 1$</span>; and
    </p>
    
</li><li>
    <p>
        the polynomial <span class="inline-math">$ρ$</span> satisfies the <em>root condition</em>,
        i.e. all complex roots of <span class="inline-math">$ρ$</span> lie in <span class="inline-math">$|z|\leq 1$</span>
        and all roots with modulus 1 are simple.
    </p>
    
</li>
</ul>
