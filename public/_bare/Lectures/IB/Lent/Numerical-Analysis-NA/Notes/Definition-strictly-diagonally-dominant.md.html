<p>
    A square matrix <span class="inline-math">$A\in \R^{n\times n}$</span>
    is said to be <em>strictly diagonally dominant</em> (by rows) if
    <span class="display-math">$$ \begin{align*}
        |a_{ii}| &gt; \sum_{\substack{j=1 \\j\neq i}}^n |a_{ij}| \qquad \forall \text{row }i=1,\ldots,n.
    \end{align*} $$</span>
</p>
