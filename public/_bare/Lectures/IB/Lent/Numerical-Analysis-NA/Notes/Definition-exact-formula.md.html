<p>
    Consider a linear functional <span class="inline-math">$λ: C^{n+1}[a,b]\to\R$</span>
    and an approximation <span class="inline-math">$λ(f) \approx \sum_{i=0}^{N} a_if(x_i)$</span>.
</p>
<p>
    We say the formula is <em>exact</em> on <span class="inline-math">$\mathcal{P}_n$</span> if equality holds when <span class="inline-math">$f\in \mathcal{P}_n$</span>.
</p>
<p>
    If <span class="inline-math">$N&lt;n$</span>, we say it is of <em>high accuracy</em>.
</p>
