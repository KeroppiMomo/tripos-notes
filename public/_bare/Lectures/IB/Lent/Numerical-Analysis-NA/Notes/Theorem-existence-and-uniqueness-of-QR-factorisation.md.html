<p>
    Any matrix <span class="inline-math">$A$</span> has a <a href="/tripos-notes/Lectures/IB/Lent/Numerical-Analysis-NA/Notes/QR-factorisation.html">QR factorisation</a>.
</p>
<p>
    If <span class="inline-math">$A$</span> is square and non-singular, then
    <span class="inline-math">$A$</span> admits a unique factorisation <span class="inline-math">$A = QR$</span> with <span class="inline-math">$R$</span> having
    a positive diagonal.
</p>
<p>
    Proof of existence: see Gram-Schmidt, Givens rotations, or Householder reflections.
</p>

</p>
