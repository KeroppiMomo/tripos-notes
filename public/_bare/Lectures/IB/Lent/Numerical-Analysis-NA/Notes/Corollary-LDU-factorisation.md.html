<p>
    <span class="inline-math">$A\in \R^{n\times n}$</span> is <a href="/tripos-notes/Lectures/IB/Lent/Numerical-Analysis-NA/Notes/Definition-strictly-regular-matrix.html">strictly regular</a>
    iff it admits a factorisation <span class="inline-math">$A = LDU$</span>,
    where <span class="inline-math">$L$</span> is lower unitriangular, <span class="inline-math">$D$</span> is non-singular and diagonal,
    and <span class="inline-math">$U$</span> is upper unitriangular.
</p>
<p>
    Moreover the factorisation is unique.
</p>
