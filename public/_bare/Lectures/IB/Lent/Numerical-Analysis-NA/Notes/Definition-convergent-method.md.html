<p>
    Suppose given a step size <span class="inline-math">$h&gt;0$</span>,
    a <a href="/tripos-notes/Lectures/IB/Lent/Numerical-Analysis-NA/Notes/Numerical-methods-for-ODEs.html">numerical method</a> generates
    <span class="inline-math">$(\v y_n^{(h)})_{n=0}^N$</span> where <span class="inline-math">$N = \lfloor T/h\rfloor$</span>.
</p>
<p>
    We say the method is <em>convergent</em> if
    <span class="display-math">$$ \begin{align*}
        \max_{n} \|\v y_n^{(h)} - \v y(t_n)\| \to 0 \qquad \text{as }h\to 0.
    \end{align*} $$</span>
</p>
