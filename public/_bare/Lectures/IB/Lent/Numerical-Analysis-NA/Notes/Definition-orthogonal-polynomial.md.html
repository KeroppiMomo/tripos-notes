<p>
    Given a <a href="/tripos-notes/Lectures/IB/Michaelmas/Methods-Me/Notes/Definition-weighted-inner-product.html">weighted inner product</a>,
    a polynomial <span class="inline-math">$Q_n \in \mathcal{P}_n$</span> is said to be the <em><span class="inline-math">$n$</span>-th orthogonal polynomial</em> if
    <span class="display-math">$$ \begin{align*}
        \langle Q_n, p\rangle = 0 \qquad \text{for all }p\in \mathcal{P}_{n-1}.
    \end{align*} $$</span>
</p>
