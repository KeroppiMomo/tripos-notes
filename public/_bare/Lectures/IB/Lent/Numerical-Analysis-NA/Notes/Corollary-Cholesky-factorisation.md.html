<p>
    <span class="inline-math">$A\in \R^{n\times n}$</span> is <a href="/tripos-notes/Lectures/IA/Michaelmas/Vectors-and-Matrices-VM/Definition-symmetric-matrix.html">symmetric</a> <a href="/tripos-notes/Lectures/IB/Easter/Optimisation-Op/Notes/Notation-definite-matrix.html">positive definite</a>
    iff it admits a factorisation <span class="inline-math">$A = LL^T$</span>
    where <span class="inline-math">$L$</span> is lower triangular with a positive diagonal.
</p>
<p>
    Moreover the factorisation is unique.
</p>
