<p>
    Among all monic polynomials <span class="inline-math">$\mathcal{P}_n$</span>,
    the Chebyshev polynomial <span class="inline-math">$γT_{n}$</span> has the smallest <span class="inline-math">$L^\infty$</span> norm
    <span class="display-math">$$ \begin{align*}
        \inf_{a_i} \max_{x\in [-1,1]} |x^n + a_{n-1} x^{n+1} + \ldots + a_0| = \|γT_n\| = γ
    \end{align*} $$</span>
    where <span class="inline-math">$γ = 1/2^{n-1}$</span>.
</p>
