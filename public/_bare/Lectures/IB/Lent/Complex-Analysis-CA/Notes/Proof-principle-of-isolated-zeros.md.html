<p>
    If <span class="inline-math">$f(a)\neq 0$</span>,
    then such <span class="inline-math">$ρ$</span> exists by continuity.
</p>
<p>
    If <span class="inline-math">$f(a) = 0$</span>,
    find the <a href="/tripos-notes/Lectures/IB/Lent/Complex-Analysis-CA/Notes/Definition-order-of-vanishing.html">order of vanishing</a> <span class="inline-math">$m$</span> and write
    <span class="display-math">$$ \begin{align*}
        f(z) = (z-a)^m g(z)
    \end{align*} $$</span>
    where <span class="inline-math">$g$</span> is holomorphic and <span class="inline-math">$g(a) \neq 0$</span>.
    Such <span class="inline-math">$ρ$</span> exists for <span class="inline-math">$g$</span>, and it works for <span class="inline-math">$f$</span> as well.
</p>
