<p>
    If <span class="inline-math">$f: U\to \C$</span> is continuous on a domain <span class="inline-math">$U$</span>
    and holomorphic away from a finite set <span class="inline-math">$S\subseteq U$</span>,
    then <span class="inline-math">$f$</span> is holomorphic on all of <span class="inline-math">$U$</span>.
