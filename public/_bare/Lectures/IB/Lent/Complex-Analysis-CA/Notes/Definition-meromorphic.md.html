<p>
    We say <span class="inline-math">$f$</span> is <em>meromorphic</em> on a domain <span class="inline-math">$U$</span>
    if <span class="inline-math">$f$</span> is holomorphic on <span class="inline-math">$U$</span>
    except for a set of isolated singularities
    which are at worst poles (<a href="/tripos-notes/Lectures/IB/Lent/Complex-Analysis-CA/Notes/Definition-removable-singularity-pole-essential-singularity.html">poles</a> or <a href="/tripos-notes/Lectures/IB/Lent/Complex-Analysis-CA/Notes/Definition-removable-singularity-pole-essential-singularity.html">removable</a>).
</p>
