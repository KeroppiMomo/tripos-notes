<p>
    Let <span class="inline-math">$U$</span> be a domain.
</p>
<p>
    If <span class="inline-math">$f:U\to \C$</span> is continuous and <span class="inline-math">$\oint_γ f=0$</span> for all closed curves <span class="inline-math">$γ$</span> in <span class="inline-math">$U$</span>,
    then <span class="inline-math">$f$</span> is <a href="/tripos-notes/Lectures/IB/Lent/Complex-Analysis-CA/Notes/Definition-complex-differentiation-holomorphic-entire.html">holomorphic</a> on <span class="inline-math">$U$</span>.
</p>
