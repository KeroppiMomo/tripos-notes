<p>
    Using <a href="/tripos-notes/Lectures/IB/Lent/Complex-Analysis-CA/Notes/Proposition-sup-norm-bound-on-complex-integral.html">this bound</a>,
    <span class="display-math">$$ \begin{align*}
        \left|\int_{γ} f(z) \d z\right| ={}&amp; \left|\int_{a}^{b} f(γ(t))\, γ&#x27;(t) \d t\right| \\
        \leq{} &amp; \int_{a}^{b} |f(γ(t))| \, |γ&#x27;(t)| \d t \\
        \leq{} &amp; \sup_γ |f|\cdot \int_{a}^{b} |γ&#x27;(t)| \d t \\
        ={}&amp; \sup_γ |f| \cdot \mathrm{length}(γ).
    \end{align*} $$</span>
</p>
