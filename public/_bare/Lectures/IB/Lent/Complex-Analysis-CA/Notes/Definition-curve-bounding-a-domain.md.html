<p>
    We say a closed curve <span class="inline-math">$γ$</span> bounds a domain <span class="inline-math">$U$</span> if the <a href="/tripos-notes/Lectures/IB/Lent/Complex-Analysis-CA/Notes/Definition-winding-number.html">winding number</a> is
    <span class="display-math">$$ \begin{align*}
        I(γ; w) = \begin{cases}
            1, &amp; w\in U, \\
            0, &amp; w\not\in U.
        \end{cases}
    \end{align*} $$</span>
</p>
