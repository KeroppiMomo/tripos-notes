<p>
    Define the <em>integral</em> of a continuous complex-valued function <span class="inline-math">$f: [a,b]\to \C$</span> as
    <span class="display-math">$$ \begin{align*}
        \int_{a}^{b} f(t) \d t := \int_{a}^{b} \Re(f(t)) \d t + i \int_{a}^{b} \Im(f(t)) \d t.
    \end{align*} $$</span>
</p>
<ul>
<li>
    <p>
        <span class="inline-math">$\Re(f(t))$</span> and <span class="inline-math">$\Im(f(t))$</span> are integrable <a href="/tripos-notes/Lectures/IA/Lent/Analysis-I-An/Notes/Theorem-continuous-function-is-integrable.html">since</a> they are continuous.
    </p>
    
</li>
</ul>
