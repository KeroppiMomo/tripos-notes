<p>
    Let <span class="inline-math">$f$</span> be <a href="/tripos-notes/Lectures/IB/Lent/Complex-Analysis-CA/Notes/Definition-complex-differentiation-holomorphic-entire.html">holomorphic</a> on a domain <span class="inline-math">$U$</span>.
</p>
<p>
    A point <span class="inline-math">$a\in \C\setminus U$</span> is called an <em>isolated singularity</em> of <span class="inline-math">$f$</span>
    if <span class="inline-math">$f$</span> is holomorphic on a punctured neighbourhood of <span class="inline-math">$a$</span>,
    i.e. there exists <span class="inline-math">$r&gt;0$</span> such that <span class="inline-math">$B(a,r)^\times := B(a,r) \setminus \set{a} \subseteq U$</span>.
</p>
