<p>
    Let <span class="inline-math">$f: B(a,r)^\times\to \C$</span> be holomorphic with an
    <a href="/tripos-notes/Lectures/IB/Lent/Complex-Analysis-CA/Notes/Definition-removable-singularity-pole-essential-singularity.html">essential singularity</a> at <span class="inline-math">$z=a$</span>.
    Then for any <span class="inline-math">$w\in \C$</span>, <span class="inline-math">$0&lt;ρ&lt;r$</span>, <span class="inline-math">$ε&gt;0$</span>,
    there exists <span class="inline-math">$z\in B(a,ρ)^\times$</span> such that <span class="inline-math">$f(z)\in B(w,ε)^\times$</span>.
