<p>
    Let <span class="inline-math">$U$</span> be a <a href="/tripos-notes/Lectures/IB/Lent/Complex-Analysis-CA/Notes/Definition-domain.html">domain</a>.
</p>
<p>
    If <span class="inline-math">$f: U\to \C$</span> is either
</p>
<ul>
<li>
    <p>
        <a href="/tripos-notes/Lectures/IB/Lent/Complex-Analysis-CA/Notes/Definition-complex-differentiation-holomorphic-entire.html">holomorphic</a> on <span class="inline-math">$U$</span>; or
    </p>
    
</li><li>
    <p>
        continuous on <span class="inline-math">$U$</span>, and holomorphic on <span class="inline-math">$U$</span> possibly except finitely many points,
    </p>
    
</li>
</ul>
<p>
    then for any <a href="/tripos-notes/Lectures/IB/Lent/Complex-Analysis-CA/Notes/Definition-triangle.html">triangle</a> <span class="inline-math">$T\subseteq U$</span>,
    <span class="display-math">$$ \begin{align*}
        \oint_{\partial T} f = 0.
    \end{align*} $$</span>
</p>
