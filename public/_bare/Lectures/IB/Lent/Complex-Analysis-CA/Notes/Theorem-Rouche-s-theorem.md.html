<p>
    Let <span class="inline-math">$γ$</span> be a closed curve <a href="/tripos-notes/Lectures/IB/Lent/Complex-Analysis-CA/Notes/Definition-curve-bounding-a-domain.html">bounding</a> a domain <span class="inline-math">$D$</span>,
    and <span class="inline-math">$f,g$</span> are <a href="/tripos-notes/Lectures/IB/Lent/Complex-Analysis-CA/Notes/Definition-complex-differentiation-holomorphic-entire.html">holomorphic</a> functions on <span class="inline-math">$D\cup γ$</span>.
</p>
<p>
    If <span class="inline-math">$|f(z)| &gt; |g(z)|$</span> on <span class="inline-math">$γ$</span>,
    then <span class="inline-math">$f$</span> and <span class="inline-math">$f+g$</span> have the same number of zeros in <span class="inline-math">$D$</span>,
    counting multiplicity (<a href="/tripos-notes/Lectures/IB/Lent/Complex-Analysis-CA/Notes/Definition-order-of-vanishing.html">order of vanishing</a>).
</p>
