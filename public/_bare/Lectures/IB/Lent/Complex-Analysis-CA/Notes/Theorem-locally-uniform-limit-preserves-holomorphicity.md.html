<p>
    Let <span class="inline-math">$\set{f_n}$</span> be a sequence on a domain <span class="inline-math">$U$</span>.
</p>
<p>
    If <span class="inline-math">$f_n$</span> is <a href="/tripos-notes/Lectures/IB/Lent/Complex-Analysis-CA/Notes/Definition-complex-differentiation-holomorphic-entire.html">holomorphic</a> and <a href="/tripos-notes/Lectures/IB/Lent/Complex-Analysis-CA/Notes/Definition-locally-uniform-convergence.html">locally uniformly</a> converges to <span class="inline-math">$f:U\to \C$</span>,
    then <span class="inline-math">$f$</span> is holomorphic and <span class="inline-math">$f_n&#x27; \to f&#x27;$</span> locally uniformly.
</p>
