<p>
    Let <span class="inline-math">$f$</span> be holomorphic and non-constant
    on a neighbourhood of <span class="inline-math">$a\in \C$</span>.
</p>
<p>
    The <em>local (mapping) degree</em> of <span class="inline-math">$f$</span> at <span class="inline-math">$a$</span>
    (denoted as <span class="inline-math">$\deg_{z=a} f(z)$</span>) is
    the <a href="/tripos-notes/Lectures/IB/Lent/Complex-Analysis-CA/Notes/Definition-order-of-vanishing.html">order of vanishing</a> of <span class="inline-math">$z\mapsto f(z) - f(a)$</span> at <span class="inline-math">$z=a$</span>.
</p>
