<p>
    The <a href="/tripos-notes/Lectures/IB/Lent/Complex-Analysis-CA/Notes/Theorem-converse-of-fundamental-theorem-of-calculus.html">converse of the fundamental theorem of calculus</a>
    implies that <span class="inline-math">$f = F&#x27;$</span> for some holomorphic <span class="inline-math">$F: U\to \C$</span>.
</p>
<p>
    By <a href="/tripos-notes/Lectures/IB/Lent/Complex-Analysis-CA/Notes/Theorem-Taylor-expansion-of-holomorphic-functions.html">Taylor expansion</a>,
    <span class="inline-math">$f = F&#x27;$</span> is holomorphic.
</p>
