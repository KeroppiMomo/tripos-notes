<p>
    Let <span class="inline-math">$f,g: U\to \C$</span> be <a href="/tripos-notes/Lectures/IB/Lent/Complex-Analysis-CA/Notes/Definition-complex-differentiation-holomorphic-entire.html">holomorphic</a> on a domain <span class="inline-math">$U$</span>.
</p>
<p>
    If <span class="inline-math">$\sb{z\in U}{f(z) = g(z)}$</span> has an <a href="/tripos-notes/Lectures/IB/Michaelmas/Analysis-and-Topology-AT/Notes/Definition-accumulation-point-derived-set.html">accumulation point</a> in <span class="inline-math">$U$</span>,
    then <span class="inline-math">$f(z)\equiv g(z)$</span>.
</p>
