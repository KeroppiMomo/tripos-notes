<p>
    Let <span class="inline-math">$γ: [a,b]\to \C\setminus \set{w}$</span> be a continuous curve.
</p>
<p>
    Then there exists a continuous function <span class="inline-math">$θ: [a,b]\to \R$</span>
    such that <span class="inline-math">$γ(t) = w + r(t) e^{iθ(t)}$</span>
    where <span class="inline-math">$r(t) = |γ(t) - w|$</span>.
</p>
<p>
    Moreover <span class="inline-math">$θ$</span> is unique up to a shift by any multiple of <span class="inline-math">$2π$</span>.
</p>
