<p>
    Let <span class="inline-math">$U\subseteq \C$</span> be a domain.
</p>
<p>
    If <span class="inline-math">$U$</span> is bounded, and <span class="inline-math">$f:U\cup \partial U\to \C$</span> is continuous on <span class="inline-math">$U\cup \partial U$</span>
    and <a href="/tripos-notes/Lectures/IB/Lent/Complex-Analysis-CA/Notes/Definition-complex-differentiation-holomorphic-entire.html">holomorphic</a> on <span class="inline-math">$U$</span>,
    then <span class="inline-math">$|f|$</span> achieves its maximum on <span class="inline-math">$\partial U$</span>.
</p>
