<p>
    Let <span class="inline-math">$γ: [a,b]\to γ$</span> be a closed curve and <span class="inline-math">$w\not\in γ$</span>.
    Then the <a href="/tripos-notes/Lectures/IB/Lent/Complex-Analysis-CA/Notes/Definition-winding-number.html">winding number</a> is
    <span class="display-math">$$ \begin{align*}
        I(γ; w) = \frac{1}{2πi} \oint_{γ} \frac{\d z}{z - w}.
    \end{align*} $$</span>
</p>
