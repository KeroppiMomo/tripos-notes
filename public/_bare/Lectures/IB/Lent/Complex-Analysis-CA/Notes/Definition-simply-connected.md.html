<p>
    A subset <span class="inline-math">$U\subseteq \C$</span> is <em>simply connected</em>
    if every simple closed curve <span class="inline-math">$U$</span> is contractible,
    i.e. for any simple closed curve <span class="inline-math">$γ: \mathbb{S}^1 \to U$</span>,
    there exists some continuous <span class="inline-math">$\hat γ: \overline{B(0,1)} \to U$</span>
    with <span class="inline-math">$\hat γ|_{\mathbb{S}^1} = γ$</span>.
</p>
