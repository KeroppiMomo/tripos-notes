<p>
    Let <span class="inline-math">$f: B(a,r)\to \C$</span> be <a href="/tripos-notes/Lectures/IB/Lent/Complex-Analysis-CA/Notes/Definition-complex-differentiation-holomorphic-entire.html">holomorphic</a>.
</p>
<p>
    For all <span class="inline-math">$0&lt;ρ&lt;r$</span>,
    <span class="display-math">$$ \begin{align*}
        f(a) = \int_{0}^{1} f(a+ρe^{2πit}) \d t,
    \end{align*} $$</span>
    i.e. <span class="inline-math">$f(a)$</span> takes the average value around the boundary of any disk centred at <span class="inline-math">$a$</span>.
</p>
