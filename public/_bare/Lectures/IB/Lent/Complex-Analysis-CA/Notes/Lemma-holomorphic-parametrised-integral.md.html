<p>
    Let <span class="inline-math">$U\subseteq \C$</span> be open.
</p>
<p>
    If <span class="inline-math">$ϕ: U\times [a,b]\to \C$</span> is continuous and <span class="inline-math">$z\mapsto ϕ(z,s)$</span>
    is <a href="/tripos-notes/Lectures/IB/Lent/Complex-Analysis-CA/Notes/Definition-complex-differentiation-holomorphic-entire.html">holomorphic</a> for all fixed <span class="inline-math">$s\in [a,b]$</span>, then
    <span class="display-math">$$ \begin{align*}
        g(z) := \int_{a}^{b} ϕ(z,s) \d s
    \end{align*} $$</span>
    is a holomorphic function on <span class="inline-math">$U$</span>.
</p>
