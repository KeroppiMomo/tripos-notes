<p>
    A <a href="/tripos-notes/Lectures/IB/Lent/Complex-Analysis-CA/Notes/Definition-domain.html">domain</a> <span class="inline-math">$U\subseteq \C$</span> is said to be <em>starlike</em>
    if there exists <span class="inline-math">$a_0\in U$</span> such that
    for all <span class="inline-math">$w\in U$</span>, the line segment from <span class="inline-math">$a_0$</span> to <span class="inline-math">$w$</span> lie inside <span class="inline-math">$U$</span>.
</p>
