<p>
    Let <span class="inline-math">$f: B(a,r)^\times\to \C$</span> be holomorphic
    with an <a href="/tripos-notes/Lectures/IB/Lent/Complex-Analysis-CA/Notes/Definition-removable-singularity-pole-essential-singularity.html">essential singularity</a> at <span class="inline-math">$a$</span>.
    Then for all <span class="inline-math">$0&lt;ρ&lt;r$</span>, the image <span class="inline-math">$f(B(a,ρ)^\times) = \C$</span> or <span class="inline-math">$\C\setminus\set{b}$</span> for some <span class="inline-math">$b\in \C$</span>.
</p>
<ul>
<li>
    <p>
        Weaker (but easier to prove) result: the <a href="/tripos-notes/Lectures/IB/Lent/Complex-Analysis-CA/Notes/Theorem-Casorati-Weierstrass.html">Casorati-Weierstrass theorem</a>.
    </p>
    
</li>
</ul>
