<p>
    Let <span class="inline-math">$f: U\to \C$</span> be continuous and <span class="inline-math">$γ: [a,b]\to U$</span> be a curve.
    Then
    <span class="display-math">$$ \begin{align*}
        \left|\int_{γ} f(z) \d z\right| \leq \mathrm{length}(γ) \cdot \sup_{γ} |f|.
    \end{align*} $$</span>
