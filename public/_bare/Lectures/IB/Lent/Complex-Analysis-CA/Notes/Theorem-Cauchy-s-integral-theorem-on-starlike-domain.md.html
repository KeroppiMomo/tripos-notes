<p>
    If <span class="inline-math">$U$</span> is a <a href="/tripos-notes/Lectures/IB/Lent/Complex-Analysis-CA/Notes/Definition-starlike-domain.html">starlike domain</a> and <span class="inline-math">$f: U\to \C$</span>
    is continuous on <span class="inline-math">$U$</span> and <a href="/tripos-notes/Lectures/IB/Lent/Complex-Analysis-CA/Notes/Definition-complex-differentiation-holomorphic-entire.html">holomorphic</a> on <span class="inline-math">$U$</span> except at finitely many points,
    then for any closed curve <span class="inline-math">$γ$</span> in <span class="inline-math">$U$</span>,
    <span class="display-math">$$ \begin{align*}
        \oint_γ f = 0.
    \end{align*} $$</span>
