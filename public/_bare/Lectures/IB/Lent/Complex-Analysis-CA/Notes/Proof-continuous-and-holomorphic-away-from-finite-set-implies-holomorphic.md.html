<p>
    For each <span class="inline-math">$a\in S$</span>,
    pick a disk <span class="inline-math">$B(a,r)\subseteq U$</span> sufficiently small
    such that <span class="inline-math">$B(a,r)\cap S=\set{a}$</span>.
</p>
<p>
    <a href="/tripos-notes/Lectures/IB/Lent/Complex-Analysis-CA/Notes/Theorem-Cauchy-s-integral-theorem-on-starlike-domain.html">Cauchy's theorem in a disk</a> implies
    <span class="inline-math">$\oint_γ f=0$</span> for any closed curve <span class="inline-math">$γ$</span> on <span class="inline-math">$B(a,r)$</span>.
    <span class="inline-math">$f$</span> is continuous, so <a href="/tripos-notes/Lectures/IB/Lent/Complex-Analysis-CA/Notes/Corollary-Morera-s-theorem.html">Morera</a> applies.
</p>
