<p>
    Let <span class="inline-math">$f$</span> be holomorphic on <span class="inline-math">$B(a,R)^\times$</span>
    with a simple pole at <span class="inline-math">$z=a$</span>.
    Let <span class="inline-math">$γ_r(t) = a+re^{it}$</span> for <span class="inline-math">$t\in [α,β]$</span>
    be a family of curves for <span class="inline-math">$0&lt;r&lt;R$</span>.
    Then
    <span class="display-math">$$ \begin{align*}
        \int_{γ_r} f(z) \d z \to \Res_{z=a} f(z) \cdot (β-α)i \qquad \text{as }r\to 0.
    \end{align*} $$</span>
</p>
