<p>
    A holomorphic function <span class="inline-math">$f: B(a,r)^\times\to \C$</span> has a <a href="/tripos-notes/Lectures/IB/Lent/Complex-Analysis-CA/Notes/Definition-removable-singularity-pole-essential-singularity.html">removable singularity</a> at <span class="inline-math">$z=a$</span>
    iff <span class="inline-math">$\lim_{z\to a} (z-a)f(z) = 0$</span>.
</p>
<p>
    <a href="/tripos-notes/Lectures/IB/Lent/Complex-Analysis-CA/Notes/Proof-limit-definition-of-removable-singularity.html">Proof</a>
</p>
<ul>
<li>
    <p>
        This is satisfied if <span class="inline-math">$f$</span> is continuous at <span class="inline-math">$a$</span>, or is bounded on <span class="inline-math">$B(a,r)$</span>.
    </p>
    
</li>
</ul>
