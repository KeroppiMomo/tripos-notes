<p>
    Let <span class="inline-math">$U$</span> be a <a href="/tripos-notes/Lectures/IB/Lent/Complex-Analysis-CA/Notes/Definition-domain.html">domain</a> in <span class="inline-math">$\C$</span>.
</p>
<p>
    If <span class="inline-math">$U\subset \C$</span> is proper and <span class="inline-math">$U$</span> is <a href="/tripos-notes/Lectures/IB/Lent/Complex-Analysis-CA/Notes/Definition-homologous-to-zero-simply-connected.html">simply connected</a>,
    then <span class="inline-math">$U$</span> is <a href="/tripos-notes/Lectures/IB/Lent/Complex-Analysis-CA/Notes/Definition-conformal-equivalence.html">conformally equivalent</a> to the unit disk.
</p>
