<p>
    <span class="inline-math">$\Log(z)$</span> is holomorphic in <span class="inline-math">$C\setminus \sb{x\in \R}{x\leq 0}$</span> with
    <span class="display-math">$$ \begin{align*}
        \dd{z} \Log(z) = \frac{1}{z}.
    \end{align*} $$</span>
</p>
<p>
    Moreover if <span class="inline-math">$|z|&lt;1$</span>, then
    <span class="display-math">$$ \begin{align*}
        \Log(1+z) = \sum_{n=1}^{\infty} \frac{(-1)^{n-1} z^n}{n}.
    \end{align*} $$</span>
</p>
