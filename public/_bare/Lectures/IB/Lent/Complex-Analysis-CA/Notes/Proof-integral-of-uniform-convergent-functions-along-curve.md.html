<p>
    Let
    <span class="display-math">$$ \begin{align*}
        m_n = \sup_γ |f-f_n|.
    \end{align*} $$</span>
    By uniform convergence, <span class="inline-math">$m_n \to 0$</span> as <span class="inline-math">$n\to \infty$</span>,
    so using <a href="/tripos-notes/Lectures/IB/Lent/Complex-Analysis-CA/Notes/Proposition-sup-norm-bound-on-integral-along-curve.html">the bound</a>,
    <span class="display-math">$$ \begin{align*}
        \left|\int_γ f - \int_γ f_n\right| \leq m_n \, \mathrm{length}(γ) \to 0
    \end{align*} $$</span>
    so <span class="inline-math">$\int_γ f_n \to \int_γ f$</span> by comparison.
</p>
