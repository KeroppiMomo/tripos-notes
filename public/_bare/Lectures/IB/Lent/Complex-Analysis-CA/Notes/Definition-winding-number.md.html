<p>
    Let <span class="inline-math">$γ: [a,b]\to \C$</span> be a closed curve and <span class="inline-math">$w\in \C\setminus γ$</span>.
</p>
<p>
    The <em>winding number</em> (or <em>winding index</em>) of <span class="inline-math">$γ$</span> about <span class="inline-math">$w$</span> is
    <span class="display-math">$$ \begin{align*}
        I(γ; w) = \frac{θ(b) - θ(a)}{2π}\in \Z
    \end{align*} $$</span>
    where <span class="inline-math">$θ: [a,b]\to \R$</span> is a continuous polar angle defined <a href="/tripos-notes/Lectures/IB/Lent/Complex-Analysis-CA/Notes/Theorem-existence-of-continuous-winding-angle.html">here</a>.
</p>
