<p>
    If <span class="inline-math">$f: [a,b]\times [c,d]\to \C$</span> is continuous,
    then
    <span class="display-math">$$ \begin{align*}
        \int_{a}^{b} \left(\int_{c}^{d} f(x,y) \d y\right) \d x = \int_{c}^{d} \left(\int_{a}^{b} f(x,y) \d x\right) \d y.
    \end{align*} $$</span>
