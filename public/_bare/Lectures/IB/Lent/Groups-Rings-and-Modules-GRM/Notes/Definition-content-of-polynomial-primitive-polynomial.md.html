<p>
    Let <span class="inline-math">$R$</span> be a <a href="/tripos-notes/Lectures/IB/Lent/Groups-Rings-and-Modules-GRM/Notes/Definition-unique-factorisation-domain.html">unique factorisation domain</a>.
</p>
<p>
    The <em>content</em> of <span class="inline-math">$f = a_0 + a_1 X + \ldots + a_n X^n \in$</span> <a href="/tripos-notes/Lectures/IB/Lent/Groups-Rings-and-Modules-GRM/Notes/Definition-polynomial-ring.html"><span class="inline-math">$R[X]$</span></a> is
    <span class="display-math">$$ \begin{align*}
        c(f) = \op{gcd}(a_0, a_1, \ldots, a_n) \in R,
    \end{align*} $$</span>
    <a href="/tripos-notes/Lectures/IB/Lent/Groups-Rings-and-Modules-GRM/Notes/Theorem-existence-and-uniqueness-of-GCD-and-LCM-in-UFD.html">defined up to associates</a>.
</p>
<p>
    We say <span class="inline-math">$f$</span> is <em>primitive</em> if <span class="inline-math">$c(f)$</span> is a unit.
</p>
