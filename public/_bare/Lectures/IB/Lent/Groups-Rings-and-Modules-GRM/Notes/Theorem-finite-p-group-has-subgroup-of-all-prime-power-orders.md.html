<p>
    Let <span class="inline-math">$G$</span> be a finite group.
</p>
<p>
    If <span class="inline-math">$G$</span> has order <span class="inline-math">$p^n$</span> where <span class="inline-math">$p$</span> is prime,
    then for all <span class="inline-math">$0\leq k\leq n$</span>,
    <span class="inline-math">$G$</span> has a subgroup of order <span class="inline-math">$p^k$</span>.
</p>
