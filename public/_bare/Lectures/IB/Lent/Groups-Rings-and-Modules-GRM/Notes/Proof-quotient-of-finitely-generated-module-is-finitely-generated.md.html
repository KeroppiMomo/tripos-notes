<p>
    We can produce a surjective <span class="inline-math">$R$</span>-module homomorphism
    <span class="display-math">$$ \begin{align*}
        R^k \xtwoheadrightarrow{ϕ} M \xtwoheadrightarrow{q} M/N
    \end{align*} $$</span>
    where <span class="inline-math">$ϕ$</span> exists <a href="/tripos-notes/Lectures/IB/Lent/Groups-Rings-and-Modules-GRM/Notes/Lemma-finitely-generated-iff-surjective-homomorphism.html">as</a> <span class="inline-math">$M$</span> is finitely generated,
    and <span class="inline-math">$q: m\mapsto m+N$</span> is the quotient map.
</p>
