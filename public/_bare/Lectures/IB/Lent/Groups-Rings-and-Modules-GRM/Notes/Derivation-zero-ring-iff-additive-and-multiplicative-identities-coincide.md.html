<p>
    Check that if <span class="inline-math">$R=\set{0}$</span>, then <span class="inline-math">$(R,+,\cdot,0,0)$</span> is a ring.
</p>
<p>
    Suppose <span class="inline-math">$R$</span> is a ring with <span class="inline-math">$0_R = 1_R$</span>.
    Then for all <span class="inline-math">$r\in R$</span>,
    <span class="display-math">$$ \begin{align*}
        0_R = r\cdot 0_R = r\cdot 1_R = r
    \end{align*} $$</span>
    so <span class="inline-math">$R = \set{0}$</span>.
</p>
