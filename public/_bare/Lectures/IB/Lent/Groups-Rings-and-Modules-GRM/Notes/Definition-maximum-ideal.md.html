<p>
    An <a href="/tripos-notes/Lectures/IB/Lent/Groups-Rings-and-Modules-GRM/Notes/Definition-ideal.html">ideal</a> <span class="inline-math">$I\lhd R$</span> of a ring is called <em>maximal</em>
    if
</p>
<ol start="1">
<li>
    <p>
        <span class="inline-math">$I\neq R$</span>; and
    </p>
    
</li><li>
    <p>
        for any <span class="inline-math">$J\lhd R$</span>,
        <span class="display-math">$$ \begin{align*}
        I\subseteq J\subseteq R \implies J=I \quad \text{or} \quad J=R.
        \end{align*} $$</span>
    </p>
    
</li>
</ol>
<ul>
<li>
    <p>
        A maximal ideal always exists for any ring,
        a consequence of Zorn's lemma.
    </p>
    
</li>
</ul>
