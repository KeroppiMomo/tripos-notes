<p>
    The <em>ring of formal power series in <span class="inline-math">$X$</span> with coefficients in <span class="inline-math">$R$</span></em> is
    <span class="display-math">$$ \begin{align*}
        R[[X]] = \sb{\sum_{i=0}^{\infty} r_i X^i}{r\in R}
    \end{align*} $$</span>
    with the usual operations.
</p>
