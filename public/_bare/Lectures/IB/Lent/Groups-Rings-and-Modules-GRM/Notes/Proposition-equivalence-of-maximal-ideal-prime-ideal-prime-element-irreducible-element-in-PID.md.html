<p>
    Let <span class="inline-math">$R$</span> be a <a href="/tripos-notes/Lectures/IB/Lent/Groups-Rings-and-Modules-GRM/Notes/Definition-principal-ideal-domain.html">principal ideal domain</a>,
    and <span class="inline-math">$r\in R$</span>.
    If <span class="inline-math">$r\neq 0$</span>, the following are equivalent:
</p>
<ol start="1">
<li>
    <p>
        <span class="inline-math">$r$</span> is <a href="/tripos-notes/Lectures/IB/Lent/Groups-Rings-and-Modules-GRM/Notes/Definition-irreducible.html">irreducible</a>;
    </p>
    
</li><li>
    <p>
        <span class="inline-math">$r$</span> is <a href="/tripos-notes/Lectures/IB/Lent/Groups-Rings-and-Modules-GRM/Notes/Definition-prime-element.html">prime</a>;
    </p>
    
</li><li>
    <p>
        <span class="inline-math">$(r)$</span> is a <a href="/tripos-notes/Lectures/IB/Lent/Groups-Rings-and-Modules-GRM/Notes/Definition-prime-element.html">prime ideal</a>;
    </p>
    
</li><li>
    <p>
        <span class="inline-math">$(r)$</span> is a <a href="/tripos-notes/Lectures/IB/Lent/Groups-Rings-and-Modules-GRM/Notes/Definition-maximum-ideal.html">maximal ideal</a>.
    </p>
    
</li>
</ol>
<p>
    In particular, if <span class="inline-math">$I\lhd R$</span> is non-zero, then <span class="inline-math">$I$</span> is prime iff <span class="inline-math">$I$</span> is maximal.
</p>

</p>
