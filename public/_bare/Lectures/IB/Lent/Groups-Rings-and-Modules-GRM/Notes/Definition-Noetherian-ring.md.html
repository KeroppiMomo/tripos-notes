<p>
    A ring <span class="inline-math">$R$</span> is <em>Noetherian</em> if every chain of <a href="/tripos-notes/Lectures/IB/Lent/Groups-Rings-and-Modules-GRM/Notes/Definition-ideal.html">ideals</a>
    <span class="display-math">$$ \begin{align*}
        I_1 \subseteq I_2 \subseteq I_3 \subseteq \ldots
    \end{align*} $$</span>
    eventually stabilises, i.e. there exists <span class="inline-math">$N\in \N$</span>
    such that <span class="inline-math">$I_n = I_{n+1}$</span> for all <span class="inline-math">$n\geq N$</span>.
    This is known as the <em>ascending chain condition</em>.
</p>
