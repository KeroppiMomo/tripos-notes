<p>
    If <span class="inline-math">$I\lhd R$</span> is an ideal and a unit <span class="inline-math">$u\in I$</span>,
    then <span class="inline-math">$u\cdot u\inv = 1\in I$</span> by the absorbing property.
    Therefore <span class="inline-math">$r=r\cdot 1\in I$</span> for all <span class="inline-math">$r\in R$</span>.
    Hence <span class="inline-math">$I = R$</span>.
</p>
