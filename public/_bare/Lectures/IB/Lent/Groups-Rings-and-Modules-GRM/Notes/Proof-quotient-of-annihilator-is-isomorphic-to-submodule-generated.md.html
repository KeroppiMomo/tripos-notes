<p>
    Consider the function
    <span class="display-math">$$ \begin{align*}
        f: R&amp;\to M \\
        r &amp;\mapsto r\cdot m.
    \end{align*} $$</span>
    This is an <span class="inline-math">$R$</span>-module homomorphism,
    with <span class="inline-math">$\ker(f) = \mathrm{Ann}(m)$</span> and <span class="inline-math">$\im(f) = Rm$</span>.
    Then apply the <a href="/tripos-notes/Lectures/IB/Lent/Groups-Rings-and-Modules-GRM/Notes/Theorem-first-isomorphism-theorem-for-modules.html">first isomorphism theorem</a>.
</p>
