<p>
    Let <span class="inline-math">$M$</span> be an <span class="inline-math">$R$</span>-<a href="/tripos-notes/Lectures/IB/Lent/Groups-Rings-and-Modules-GRM/Notes/Definition-module.html">module</a> and <span class="inline-math">$m_1, \ldots, m_k\in M$</span>.
</p>
<p>
    <span class="inline-math">$\set{m_1, \ldots, m_k}$</span> is <em><span class="inline-math">$R$</span>-linearly independent</em> if
    for any <span class="inline-math">$r_1, \ldots, r_k\in R$</span>,
    <span class="display-math">$$ \begin{align*}
        \sum_{i=1}^{k} r_i m_i = 0 \implies r_1 = \ldots = r_k = 0.
    \end{align*} $$</span>
</p>
