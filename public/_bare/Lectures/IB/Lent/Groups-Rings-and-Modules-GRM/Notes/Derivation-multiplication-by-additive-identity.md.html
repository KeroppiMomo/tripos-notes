<p>
    Let <span class="inline-math">$R$</span> be a ring.
    By distributivity,
    <span class="display-math">$$ \begin{align*}
        r\cdot 0_R = r\cdot (0_R + 0_R) = r\cdot 0_R + r\cdot 0_R.
    \end{align*} $$</span>
    Adding <span class="inline-math">$-(r\cdot 0_R)$</span> to both sides yields
    <span class="display-math">$$ \begin{align*}
        r\cdot 0_R = 0_R.
    \end{align*} $$</span>
</p>
