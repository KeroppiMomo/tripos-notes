<p>
    Let <span class="inline-math">$R$</span> be a <a href="/tripos-notes/Lectures/IB/Lent/Groups-Rings-and-Modules-GRM/Notes/Definition-ring.html">ring</a>.
    An element <span class="inline-math">$p\in R$</span> is said to be <em>prime</em> if
</p>
<ol start="1">
<li>
    <p>
        <span class="inline-math">$p\neq 0$</span>;
    </p>
    
</li><li>
    <p>
        <span class="inline-math">$p$</span> is not a <a href="/tripos-notes/Lectures/IB/Lent/Groups-Rings-and-Modules-GRM/Notes/Definition-unit.html">unit</a>; and
    </p>
    
</li><li>
    <p>
        for all <span class="inline-math">$x,y\in R$</span>, if <span class="inline-math">$p\mid xy$</span>, then <span class="inline-math">$p\mid x$</span> or <span class="inline-math">$p\mid y$</span>.
    </p>
    
</li>
</ol>
