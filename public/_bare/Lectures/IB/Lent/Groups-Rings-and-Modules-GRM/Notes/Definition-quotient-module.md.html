<p>
    Let <span class="inline-math">$M$</span> be an <span class="inline-math">$R$</span>-module and <span class="inline-math">$N\leq M$</span> be an <span class="inline-math">$R$</span>-<a href="/tripos-notes/Lectures/IB/Lent/Groups-Rings-and-Modules-GRM/Notes/Definition-submodule.html">submodule</a>.
</p>
<p>
    The <em>quotient module</em> is the <a href="/tripos-notes/Lectures/IA/Michaelmas/Groups-Gp/Definition-quotient-group.html">quotient group</a> <span class="inline-math">$M/N$</span>
    equipped with
    <span class="display-math">$$ \begin{align*}
        R \times M/N &amp;\to M/N \\
        (r, m + N) &amp;\mapsto rm + N.
    \end{align*} $$</span>
</p>
