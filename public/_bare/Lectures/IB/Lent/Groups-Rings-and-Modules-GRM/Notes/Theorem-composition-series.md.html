<p>
    Let <span class="inline-math">$G$</span> be a group.
</p>
<p>
    If <span class="inline-math">$G$</span> is finite, then there exists subgroups
    <span class="display-math">$$ \begin{align*}
        G = H_1 \rhd H_2 \rhd \ldots \rhd H_n = \set{e}
    \end{align*} $$</span>
    such that <span class="inline-math">$H_{i}/H_{i+1}$</span> is <a href="/tripos-notes/Lectures/IA/Michaelmas/Groups-Gp/Definition-simple-group.html">simple</a>.
</p>
