<p>
    Let <span class="inline-math">$R$</span> be a unique factorisation domain
    and <span class="inline-math">$F$</span> be its <a href="/tripos-notes/Lectures/IB/Lent/Groups-Rings-and-Modules-GRM/Notes/Definition-field-of-fractions.html">field of fractions</a>.
</p>
<p>
    For a <a href="/tripos-notes/Lectures/IB/Lent/Groups-Rings-and-Modules-GRM/Notes/Definition-content-of-polynomial-primitive-polynomial.html">primitive</a> polynomial <span class="inline-math">$f\in R[X]$</span>,
    <span class="inline-math">$f$</span> is irreducible in <span class="inline-math">$R[X]$</span> iff <span class="inline-math">$f$</span> is irreducible in <span class="inline-math">$F[X]$</span>.
</p>
