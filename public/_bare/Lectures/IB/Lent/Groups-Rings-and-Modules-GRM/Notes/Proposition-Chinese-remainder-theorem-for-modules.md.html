<p>
    Let <span class="inline-math">$R$</span> be a Euclidean domain and <span class="inline-math">$a,b\in R$</span>.
    If <span class="inline-math">$\mathrm{gcd}(a,b) = 1$</span>, then as <span class="inline-math">$R$</span>-modules,
    <span class="display-math">$$ \begin{align*}
        R/(a) \oplus R/(b) \isom R/(ab).
    \end{align*} $$</span>
