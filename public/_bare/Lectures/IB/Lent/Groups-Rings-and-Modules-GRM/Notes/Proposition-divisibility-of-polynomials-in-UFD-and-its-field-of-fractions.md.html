<p>
    Let <span class="inline-math">$R$</span> be a unique factorisation domain
    and <span class="inline-math">$F$</span> be its <a href="/tripos-notes/Lectures/IB/Lent/Groups-Rings-and-Modules-GRM/Notes/Definition-field-of-fractions.html">field of fractions</a>.
</p>
<p>
    For a <a href="/tripos-notes/Lectures/IB/Lent/Groups-Rings-and-Modules-GRM/Notes/Definition-content-of-polynomial-primitive-polynomial.html">primitive</a> polynomial <span class="inline-math">$g\in R[X]$</span>,
    a polynomial <span class="inline-math">$f\in R[X]$</span> is divisible by <span class="inline-math">$g$</span> in <span class="inline-math">$R[X]$</span>
    iff it is divisible by <span class="inline-math">$g$</span> in <span class="inline-math">$F[X]$</span>.
</p>
<p>
    Equivalently, if <span class="inline-math">$J=(g)\lhd R[X]$</span> and <span class="inline-math">$I=(g)\lhd F[X]$</span>,
    then <span class="inline-math">$J = I \cap R[X]$</span>.
</p>
