<p>
    Let <span class="inline-math">$M_1, \ldots, M_k$</span> be modules,
    with submodules <span class="inline-math">$N_i\leq M_i$</span> for each <span class="inline-math">$i$</span>.
    Then
    <span class="display-math">$$ \begin{align*}
        \bigoplus_{i=1}^k (M_i/N_i) \isom \left(\bigoplus_{i=1}^k M_i\right)/\left(\bigoplus_{i=1}^k N_i\right).
    \end{align*} $$</span>
