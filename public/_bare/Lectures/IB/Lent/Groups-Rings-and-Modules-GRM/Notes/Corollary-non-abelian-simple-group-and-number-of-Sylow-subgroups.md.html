<p>
    Let <span class="inline-math">$G$</span> be a finite group.
</p>
<p>
    If <span class="inline-math">$G$</span> is non-abelian and <a href="/tripos-notes/Lectures/IA/Michaelmas/Groups-Gp/Definition-simple-group.html">simple</a>,
    then for each prime <span class="inline-math">$p\mid |G|$</span>,
    we have <span class="inline-math">$|G| \mid$</span> <a href="/tripos-notes/Lectures/IB/Lent/Groups-Rings-and-Modules-GRM/Notes/Theorem-Sylow.html"><span class="inline-math">$n_p$</span></a><span class="inline-math">$!/2$</span>
    and <span class="inline-math">$n_p \geq 5$</span>.
</p>
