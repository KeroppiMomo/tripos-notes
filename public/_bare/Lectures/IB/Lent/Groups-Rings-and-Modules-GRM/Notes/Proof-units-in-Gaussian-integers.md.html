<p>
    If <span class="inline-math">$u\in \Z[i]$</span> is a unit, then <span class="inline-math">$u\mid 1$</span> and so since <span class="inline-math">$ϕ(z) = |z|^2$</span> is multiplicative,
    <span class="display-math">$$ \begin{align*}
        ϕ(u) \mid ϕ(1) = 1 \implies ϕ(u) = 1.
    \end{align*} $$</span>
</p>
<p>
    The only norm-1 elements are <span class="inline-math">$\pm 1, \pm i$</span>, and they all have multiplicative inverses.
</p>
