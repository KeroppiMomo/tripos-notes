<p>
    The primes in <a href="/tripos-notes/Lectures/IB/Lent/Groups-Rings-and-Modules-GRM/Notes/Gaussian-integers.html"><span class="inline-math">$\Z[i]$</span></a> are, up to associates, exactly
</p>
<ul>
<li>
    <p>
        the primes <span class="inline-math">$p$</span> in <span class="inline-math">$\Z$</span> such that <span class="inline-math">$p\equiv 3\pmod 4$</span>; and
    </p>
    
</li><li>
    <p>
        Gaussian integers <span class="inline-math">$z\in \Z[i]$</span>
        such that <span class="inline-math">$N(z) = z\bar z = p$</span> is prime in <span class="inline-math">$\Z$</span> with <span class="inline-math">$p\equiv 1$</span> or <span class="inline-math">$p\equiv 2\pmod 4$</span>.
    </p>
    
</li>
</ul>
