<p>
    Let <span class="inline-math">$H\leq G$</span> be groups.
</p>
<p>
    The <em>normaliser</em> of <span class="inline-math">$H$</span> in <span class="inline-math">$G$</span> is the largest subgroup of <span class="inline-math">$G$</span> containing <span class="inline-math">$H$</span>
    in which <span class="inline-math">$H$</span> is <a href="/tripos-notes/Lectures/IA/Michaelmas/Groups-Gp/Definition-normal-subgroup.html">normal</a>:
    <span class="display-math">$$ \begin{align*}
        N_G(H) = \sb{g\in G}{ghg\inv \in H \quad \forall h\in H}.
    \end{align*} $$</span>
</p>
