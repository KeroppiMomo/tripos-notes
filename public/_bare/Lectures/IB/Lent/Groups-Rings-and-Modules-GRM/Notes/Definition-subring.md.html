<p>
    A subset <span class="inline-math">$S$</span> of a <a href="/tripos-notes/Lectures/IB/Lent/Groups-Rings-and-Modules-GRM/Notes/Definition-ring.html">ring</a> <span class="inline-math">$R$</span> is called a <em>subring</em>,
    denoted as <span class="inline-math">$S\leq R$</span>, if
</p>
<ul>
<li>
    <p>
        <span class="inline-math">$0_R, 1_R \in S$</span>;
    </p>
    
</li><li>
    <p>
        <span class="inline-math">$s_1 + s_2\in S$</span> and <span class="inline-math">$s_1\cdot s_2 \in S$</span> for all <span class="inline-math">$s_1, s_2\in S$</span>; and
    </p>
    
</li><li>
    <p>
        <span class="inline-math">$(S, +, \cdot , 0_R, 1_R)$</span> is a ring.
    </p>
    
</li>
</ul>
