<p>
    Let <span class="inline-math">$G$</span> be a group with order <span class="inline-math">$p^2$</span>.
    <a href="/tripos-notes/Lectures/IB/Lent/Groups-Rings-and-Modules-GRM/Notes/Theorem-finite-p-group-has-non-trivial-centre.html"><span class="inline-math">$Z(G)$</span> is non-trivial</a>,
    so by <a href="/tripos-notes/Lectures/IA/Michaelmas/Groups-Gp/Theorem-Lagrange-s-theorem.html">Lagrange</a>,
    <span class="inline-math">$|Z(G)| = p$</span> or <span class="inline-math">$p^2$</span>.
</p>
<p>
    If <span class="inline-math">$|Z(G)| = p$</span>, then <span class="inline-math">$G/Z(G) \isom C_p$</span> is cyclic,
    <a href="/tripos-notes/Lectures/IB/Lent/Groups-Rings-and-Modules-GRM/Notes/Lemma-cyclic-quotient-mod-centre-implies-abelian.html">so</a> <span class="inline-math">$G$</span> is abelian,
    so in fact <span class="inline-math">$Z(G) = G$</span>.
</p>
