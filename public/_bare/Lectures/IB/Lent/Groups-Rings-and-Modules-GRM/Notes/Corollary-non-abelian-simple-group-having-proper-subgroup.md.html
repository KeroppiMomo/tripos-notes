<p>
    Let <span class="inline-math">$G$</span> be a group.
</p>
<p>
    If <span class="inline-math">$G$</span> is non-abelian, <a href="/tripos-notes/Lectures/IA/Michaelmas/Groups-Gp/Definition-simple-group.html">simple</a> and has a proper subgroup of index <span class="inline-math">$n&gt;1$</span>,
    then <span class="inline-math">$G$</span> is isomorphic to a subgroup of <span class="inline-math">$A_n$</span>.
    Moreover, <span class="inline-math">$n\geq 5$</span>.
</p>
