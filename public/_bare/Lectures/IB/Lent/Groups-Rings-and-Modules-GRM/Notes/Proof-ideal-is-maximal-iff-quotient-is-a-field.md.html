<p>
    <span class="inline-math">$R/I$</span> is a field <a href="/tripos-notes/Lectures/IB/Lent/Groups-Rings-and-Modules-GRM/Notes/Derivation-field-iff-ideals-are-trivial.html">iff</a>
    the ideals in <span class="inline-math">$R/I$</span> are <span class="inline-math">$R/I$</span> and <span class="inline-math">$(0)$</span>.
    Then by <a href="/tripos-notes/Lectures/IB/Lent/Groups-Rings-and-Modules-GRM/Notes/Theorem-correspondence-theorem-for-rings.html">ideal correspondence</a>,
    this is equivalent to saying
    the ideals in <span class="inline-math">$R$</span> containing <span class="inline-math">$I$</span> are <span class="inline-math">$I$</span> and <span class="inline-math">$R$</span>.
</p>
