<p>
    An <span class="inline-math">$R$</span>-<a href="/tripos-notes/Lectures/IB/Lent/Groups-Rings-and-Modules-GRM/Notes/Definition-module.html">module</a> <span class="inline-math">$M$</span> is said to be <em>finitely generated</em>
    if there exists <span class="inline-math">$m_1, m_2, \ldots, m_k\in M$</span>
    such that
    <span class="display-math">$$ \begin{align*}
        M = Rm_1 + \ldots + Rm_k = \sb{r_1 m_1 + \ldots + r_k m_k}{r_i\in R}.
    \end{align*} $$</span>
</p>
