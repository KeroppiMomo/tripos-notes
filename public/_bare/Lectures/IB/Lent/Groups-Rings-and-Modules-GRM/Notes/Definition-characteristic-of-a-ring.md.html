<p>
    The <em>characteristic</em> of a ring <span class="inline-math">$R$</span>
    is the non-negative integer <span class="inline-math">$n$</span> such that
    <span class="inline-math">$n\Z\lhd \Z$</span> is the kernel of the unique ring homomorphism <span class="inline-math">$\Z\to R$</span>.
</p>
