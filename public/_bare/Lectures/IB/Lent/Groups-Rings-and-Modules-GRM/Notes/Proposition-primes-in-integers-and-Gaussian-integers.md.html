<p>
    Let <span class="inline-math">$p$</span> be a prime in <span class="inline-math">$\Z$</span>.
    The following are equivalent:
</p>
<ol start="1">
<li>
    <p>
        <span class="inline-math">$p$</span> is not a prime in <a href="/tripos-notes/Lectures/IB/Lent/Groups-Rings-and-Modules-GRM/Notes/Gaussian-integers.html"><span class="inline-math">$\Z[i]$</span></a>;
    </p>
    
</li><li>
    <p>
        <span class="inline-math">$p$</span> is a sum of two squares, i.e. <span class="inline-math">$p=a^2 + b^2$</span> for some <span class="inline-math">$a,b\in \Z$</span>;
    </p>
    
</li><li>
    <p>
        <span class="inline-math">$p\equiv 1$</span> or <span class="inline-math">$p\equiv 2\pmod 4$</span>.
    </p>
    
</li>
</ol>
<p>
