<p>
    For any ideal <span class="inline-math">$J\lhd R/I$</span>,
    by <a href="/tripos-notes/Lectures/IB/Lent/Groups-Rings-and-Modules-GRM/Notes/Theorem-correspondence-theorem-for-rings.html">correspondence</a>
    there exists <span class="inline-math">$I\subseteq K\lhd R$</span> such that <span class="inline-math">$J = K/I$</span>.
    <span class="inline-math">$R$</span> is Noetherian, <a href="/tripos-notes/Lectures/IB/Lent/Groups-Rings-and-Modules-GRM/Notes/Proposition-Noetherian-iff-all-ideals-are-finitely-generated.html">so</a>
    <span class="inline-math">$K$</span> is finitely generated by say <span class="inline-math">$r_1, \ldots, r_m\in R$</span>.
    Then <span class="inline-math">$J$</span> is finitely generated by <span class="inline-math">$r_1 + I, \ldots, r_m + I$</span>.
</p>
