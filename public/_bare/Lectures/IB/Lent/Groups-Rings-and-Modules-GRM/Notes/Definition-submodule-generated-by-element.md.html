<p>
    Let <span class="inline-math">$M$</span> be an <span class="inline-math">$R$</span>-<a href="/tripos-notes/Lectures/IB/Lent/Groups-Rings-and-Modules-GRM/Notes/Definition-module.html">module</a>.
</p>
<p>
    For an element <span class="inline-math">$m\in M$</span>,
    the <em>submodule generated by <span class="inline-math">$m$</span></em> is
    <span class="display-math">$$ \begin{align*}
        Rm = \sb{r\cdot m}{r\in R} \leq M.
    \end{align*} $$</span>
</p>
