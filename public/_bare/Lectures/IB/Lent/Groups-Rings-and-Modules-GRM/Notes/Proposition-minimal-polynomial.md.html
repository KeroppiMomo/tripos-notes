<p>
    Let <span class="inline-math">$α\in \C$</span> be a <a href="/tripos-notes/Lectures/IB/Lent/Groups-Rings-and-Modules-GRM/Notes/Definition-algebraic-integer.html">algebraic integer</a>.

<p>
    The ideal <span class="inline-math">$I = \ker($</span><a href="/tripos-notes/Lectures/IB/Lent/Groups-Rings-and-Modules-GRM/Notes/Definition-algebraic-integer.html"><span class="inline-math">$e_α$</span></a><span class="inline-math">$)\lhd \Z[X]$</span> is <a href="/tripos-notes/Lectures/IB/Lent/Groups-Rings-and-Modules-GRM/Notes/Definition-ideal-generated-by-a-set-principal-ideal.html">principal</a>,
    generated by a monic and irreducible polynomial <span class="inline-math">$f_α\in \Z[X]$</span>
    known as the <em>minimal polynomial</em>.
