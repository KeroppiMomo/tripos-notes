<p>
    Let <span class="inline-math">$M$</span> be a <a href="/tripos-notes/Lectures/IB/Lent/Groups-Rings-and-Modules-GRM/Notes/Definition-finite-generation.html">finitely generated</a> modules,
    with generators <a href="/tripos-notes/Lectures/IB/Lent/Groups-Rings-and-Modules-GRM/Notes/Lemma-finitely-generated-iff-surjective-homomorphism.html">given</a>
    by a surjective homomorphism <span class="inline-math">$θ: R^k \twoheadrightarrow M$</span>.
</p>
<p>
    <span class="inline-math">$\ker θ$</span> is the <em>module of relations</em> for <span class="inline-math">$M$</span> with respect to <span class="inline-math">$θ$</span>.
</p>
<p>
    <span class="inline-math">$M$</span> is said to be <em>finitely presented</em> if <span class="inline-math">$\ker θ$</span> is finitely generated.
</p>
