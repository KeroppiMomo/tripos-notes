<p>
    Let <span class="inline-math">$G$</span> be a group.
    A <a href="/tripos-notes/Lectures/IA/Michaelmas/Groups-Gp/Definition-permutation.html">permutation</a> <span class="inline-math">$G\to G$</span>
    that is also a <a href="/tripos-notes/Lectures/IA/Michaelmas/Groups-Gp/Definition-homomorphism.html">homomorphism</a>
    is called an <em>automorphism</em>.
</p>
<p>
    The set of all automorphisms of <span class="inline-math">$G$</span>, denoted as <span class="inline-math">$\mathrm{Aut}(G)$</span>,
    is a subgroup of <span class="inline-math">$\mathrm{Sym}(G)$</span>
    called the <em>automorphism group</em> of <span class="inline-math">$G$</span>.
</p>
