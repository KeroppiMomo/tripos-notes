<p>
    Let <span class="inline-math">$N\leq M$</span> be <a href="/tripos-notes/Lectures/IB/Lent/Groups-Rings-and-Modules-GRM/Notes/Definition-submodule.html">submodules</a>.
    There is a bijection
    <span class="display-math">$$ \begin{align*}
        \set{\text{submodules of $M$ containing $N$}}  &amp;\xleftrightarrow{\quad} \set{\text{submodules of $M/N$}}.
