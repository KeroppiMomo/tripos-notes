<p>
    Let <span class="inline-math">$R$</span> be a <a href="/tripos-notes/Lectures/IB/Lent/Groups-Rings-and-Modules-GRM/Notes/Definition-ring.html">ring</a>.
</p>
<p>
    An element <span class="inline-math">$u\in R$</span> is called a <em>unit</em>
    if it has a multiplicative inverse,
    i.e. there exists <span class="inline-math">$v\in R$</span> such that <span class="inline-math">$u\cdot v = 1_R$</span>.
</p>
