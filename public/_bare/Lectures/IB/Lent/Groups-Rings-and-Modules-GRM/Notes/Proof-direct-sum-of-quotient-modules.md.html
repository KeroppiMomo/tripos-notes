<p>
    Apply the <a href="/tripos-notes/Lectures/IB/Lent/Groups-Rings-and-Modules-GRM/Notes/Theorem-first-isomorphism-theorem-for-modules.html">first isomorphism theorem</a>
    to the surjective module homomorphism
    <span class="display-math">$$ \begin{align*}
        \bigoplus_{i=1}^k M_i &amp;\to \bigoplus_{i=1}^k (M_i/N_i) \\
        (m_1, \ldots, m_k) &amp;\mapsto (m_1 + N_1, \ldots, m_k + N_k)
    \end{align*} $$</span>
    with kernel <span class="inline-math">$\bigoplus_{i=1}^k N_i$</span>.
</p>
