<p>
    Let <span class="inline-math">$R$</span> be a ring, <span class="inline-math">$S\leq R$</span> be a <a href="/tripos-notes/Lectures/IB/Lent/Groups-Rings-and-Modules-GRM/Notes/Definition-subring.html">subring</a>, and <span class="inline-math">$I\lhd R$</span> be an <a href="/tripos-notes/Lectures/IB/Lent/Groups-Rings-and-Modules-GRM/Notes/Definition-ideal.html">ideal</a>.
    Then
</p>
<ul>
<li>
    <p>
        <span class="inline-math">$S + I\leq R$</span> is a subring of <span class="inline-math">$R$</span>;
    </p>
    
</li><li>
    <p>
        <span class="inline-math">$S\cap I \lhd S$</span> is an ideal of <span class="inline-math">$S$</span>; and
    </p>
    
</li><li>
    <p>
        <span class="inline-math">$(S+I)/I \isom S/(S\cap I)$</span>.
    </p>
    
</li>
</ul>
<p>
    <a href="/tripos-notes/Lectures/IB/Lent/Groups-Rings-and-Modules-GRM/Notes/Proof-second-isomorphism-theorem-for-rings.html">Proof</a>
</p>
