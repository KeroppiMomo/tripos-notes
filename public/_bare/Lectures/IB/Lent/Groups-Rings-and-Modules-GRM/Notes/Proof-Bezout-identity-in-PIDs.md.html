<p>
    Since <span class="inline-math">$R$</span> is a principal ideal domain,
    <span class="inline-math">$(a,b) = (d)\lhd R$</span> for some <span class="inline-math">$d\in R$</span>.
    As <span class="inline-math">$a,b\in (d)$</span>, we have <span class="inline-math">$d\mid a$</span> and <span class="inline-math">$d\mid b$</span>.
    Moreover if <span class="inline-math">$d&#x27;\mid a$</span> and <span class="inline-math">$d&#x27;\mid b$</span>,
    then <span class="inline-math">$(d) =(a,b) \subseteq (d&#x27;)$</span>, so <span class="inline-math">$d&#x27; \mid d$</span>.
    Hence <span class="inline-math">$d=\mathrm{gcd}(a,b)$</span>.
</p>
