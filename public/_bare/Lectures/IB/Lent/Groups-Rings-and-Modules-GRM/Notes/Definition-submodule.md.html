<p>
    Let <span class="inline-math">$M$</span> be an <span class="inline-math">$R$</span>-<a href="/tripos-notes/Lectures/IB/Lent/Groups-Rings-and-Modules-GRM/Notes/Definition-module.html">module</a>.
</p>
<p>
    An <em><span class="inline-math">$R$</span>-submodule</em> <span class="inline-math">$N$</span> of <span class="inline-math">$M$</span>, denoted as <span class="inline-math">$N\leq M$</span>,
    is a subgroup of <span class="inline-math">$M$</span> such that <span class="inline-math">$rn\in N$</span> for all <span class="inline-math">$r\in R$</span> and <span class="inline-math">$n\in N$</span>.
</p>
