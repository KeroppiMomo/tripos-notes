<p>
    Let <span class="inline-math">$H\leq G$</span> be groups.
</p>
<p>
    The largest <a href="/tripos-notes/Lectures/IA/Michaelmas/Groups-Gp/Definition-normal-subgroup.html">normal subgroup</a> of <span class="inline-math">$G$</span> contained in <span class="inline-math">$H$</span> is
    <span class="display-math">$$ \begin{align*}
        K = \bigcap_{g\in G} gHg\inv.
    \end{align*} $$</span>
    In particular, if <span class="inline-math">$G$</span> is finite and <span class="inline-math">$|G:H| = n$</span>,
    then <span class="inline-math">$G/K$</span> is isomorphic to a subgroup of <span class="inline-math">$S_n$</span>.
    Thus <span class="inline-math">$|G/K| \mid n!$</span> and <span class="inline-math">$|G/K|\geq n$</span>.
</p>
