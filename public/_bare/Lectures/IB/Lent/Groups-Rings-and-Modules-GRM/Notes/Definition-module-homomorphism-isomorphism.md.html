<p>
    Let <span class="inline-math">$M,N$</span> be <span class="inline-math">$R$</span>-<a href="/tripos-notes/Lectures/IB/Lent/Groups-Rings-and-Modules-GRM/Notes/Definition-module.html">modules</a>.
</p>
<p>
    A function <span class="inline-math">$ϕ: M\to N$</span> is an <em><span class="inline-math">$R$</span>-module homomorphism</em>
    if it is a <a href="/tripos-notes/Lectures/IA/Michaelmas/Groups-Gp/Definition-homomorphism.html">group homomorphism</a>
    such that
    <span class="display-math">$$ \begin{align*}
        ϕ(r\cdot m) = r\cdot ϕ(m) \qquad \forall r\in R, \,m\in M.
    \end{align*} $$</span>
</p>
<p>
    A bijective homomorphism is called an <em>isomorphism</em>.
</p>
