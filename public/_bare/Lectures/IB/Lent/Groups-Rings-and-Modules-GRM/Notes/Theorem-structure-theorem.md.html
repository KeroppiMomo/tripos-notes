<p>
    Let <span class="inline-math">$R$</span> be a Euclidean domain.
</p>
<p>
    For any <a href="/tripos-notes/Lectures/IB/Lent/Groups-Rings-and-Modules-GRM/Notes/Definition-finite-generation.html">finitely generated</a> <span class="inline-math">$R$</span>-module <span class="inline-math">$M$</span>,
    <span class="display-math">$$ \begin{align*}
        M \isom R \oplus \ldots \oplus R \oplus R/(d_1) \oplus \ldots\oplus R/(d_r)
    \end{align*} $$</span>
    where <span class="inline-math">$d_i\neq 0$</span> and <span class="inline-math">$d_i\mid d_{i+1}$</span>.
