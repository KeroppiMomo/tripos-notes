<p>
    Let <span class="inline-math">$f_α$</span> be the <a href="/tripos-notes/Lectures/IB/Michaelmas/Linear-Algebra-LA/Notes/Definition-minimal-polynomial.html">minimal polynomial</a> of <span class="inline-math">$α$</span>,
    which is irreducible over <span class="inline-math">$\Z$</span>.
    By <a href="/tripos-notes/Lectures/IB/Lent/Groups-Rings-and-Modules-GRM/Notes/Lemma-Gauss-s-lemma-reducibility-of-polynomials-in-UFD-and-its-field-of-fractions.html">Gauss</a>,
    <span class="inline-math">$f_α$</span> is also irreducible over <span class="inline-math">$\Q$</span>.
    Since <span class="inline-math">$X-α\mid f_α$</span> in <span class="inline-math">$\Q[X]$</span>,
    <span class="inline-math">$f_α = X-α$</span>.
    But <span class="inline-math">$f_α\in \Z[X]$</span>,
    so <span class="inline-math">$α\in \Z$</span>.
</p>
