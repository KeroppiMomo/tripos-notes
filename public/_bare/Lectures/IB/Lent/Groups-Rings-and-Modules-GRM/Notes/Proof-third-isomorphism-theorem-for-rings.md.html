<p>
    Define a function
    <span class="display-math">$$ \begin{align*}
        ϕ: R/I &amp;\to R/J \\
        r + I &amp; \mapsto  r+J.
    \end{align*} $$</span>
    From the <a href="/tripos-notes/Lectures/IB/Lent/Groups-Rings-and-Modules-GRM/Notes/Proof-third-isomorphism-theorem-for-groups.html">proof for groups</a>,
    <span class="inline-math">$ϕ$</span> is a well-defined surjective group homomorphism,
    with kernel <span class="inline-math">$\ker(ϕ) = J/I$</span>.
    We can easily see <span class="inline-math">$ϕ$</span> is a ring homomorphism.
    Then apply the <a href="/tripos-notes/Lectures/IB/Lent/Groups-Rings-and-Modules-GRM/Notes/Theorem-first-isomorphism-theorem-for-rings.html">first isomorphism theorem</a>.
</p>
