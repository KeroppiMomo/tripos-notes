<p>
    Let <span class="inline-math">$L,K\leq M$</span> be <span class="inline-math">$R$</span>-<a href="/tripos-notes/Lectures/IB/Lent/Groups-Rings-and-Modules-GRM/Notes/Definition-submodule.html">submodules</a>.
    Then
</p>
<ol start="1">
<li>
    <p>
        <span class="inline-math">$L+K$</span> is an <span class="inline-math">$R$</span>-submodule of <span class="inline-math">$K$</span>; and
    </p>
    
</li><li>
    <p>
        <span class="inline-math">$(L+K)/K \isom L/(L\cap K)$</span>.
    </p>
    
</li>
</ol>
<p>
    Proof: follows from the <a href="/tripos-notes/Lectures/IB/Lent/Groups-Rings-and-Modules-GRM/Notes/Theorem-second-isomorphism-theorem-for-groups.html">second isomorphism theorem for groups</a>.
</p>
