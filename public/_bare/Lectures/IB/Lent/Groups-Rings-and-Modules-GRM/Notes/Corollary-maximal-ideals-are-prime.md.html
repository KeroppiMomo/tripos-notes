<p>
    If <span class="inline-math">$R$</span> is a ring and <span class="inline-math">$I\lhd R$</span> is <a href="/tripos-notes/Lectures/IB/Lent/Groups-Rings-and-Modules-GRM/Notes/Definition-maximum-ideal.html">maximal</a>,
    then <span class="inline-math">$I$</span> is <a href="/tripos-notes/Lectures/IB/Lent/Groups-Rings-and-Modules-GRM/Notes/Definition-prime-ideal.html">prime</a>.
</p>
<p>
    Proof: <span class="inline-math">$I$</span> is maximal <a href="/tripos-notes/Lectures/IB/Lent/Groups-Rings-and-Modules-GRM/Notes/Proposition-ideal-is-maximal-iff-quotient-is-a-field.html"><span class="inline-math">$\iff$</span></a>
    <span class="inline-math">$R/I$</span> is a field <span class="inline-math">$\implies$</span> <span class="inline-math">$R/I$</span> is an integral domain
    <a href="/tripos-notes/Lectures/IB/Lent/Groups-Rings-and-Modules-GRM/Notes/Proposition-ideal-is-prime-iff-quotient-is-an-integral-domain.html"><span class="inline-math">$\iff$</span></a> <span class="inline-math">$I$</span> is prime.
</p>
