<p>
    Let <span class="inline-math">$p$</span> be a prime number.
</p>
<p>
    The group <span class="inline-math">$\mathbb{F}_p^\times$</span>
    of non-zero integers mod <span class="inline-math">$p$</span> under multiplication
    is <a href="/tripos-notes/Lectures/IA/Michaelmas/Groups-Gp/Definition-cyclic-group.html">cyclic</a>, i.e. <span class="inline-math">$\mathbb{F}_p^\times \isom C_{p-1}$</span>.
</p>
