<p>
    An <a href="/tripos-notes/Lectures/IB/Lent/Groups-Rings-and-Modules-GRM/Notes/Definition-ideal.html">ideal</a> <span class="inline-math">$I\lhd R$</span> of a ring <span class="inline-math">$R$</span> is said to be <em>finitely generated</em>
    if there exists <span class="inline-math">$r_1, \ldots, r_k\in R$</span> such that
    <span class="inline-math">$I =$</span> <a href="/tripos-notes/Lectures/IB/Lent/Groups-Rings-and-Modules-GRM/Notes/Definition-ideal-generated-by-a-set-principal-ideal.html"><span class="inline-math">$(r_1, \ldots, r_k)$</span></a><span class="inline-math">$.$</span>
</p>
<p>
    Equivalently, if <span class="inline-math">$I$</span> is a <a href="/tripos-notes/Lectures/IB/Lent/Groups-Rings-and-Modules-GRM/Notes/Definition-finite-generation.html">finitely generated</a> <span class="inline-math">$R$</span>-module.
</p>
