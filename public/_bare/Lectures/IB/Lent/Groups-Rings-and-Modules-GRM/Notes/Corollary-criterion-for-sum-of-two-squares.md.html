<p>
    Let <span class="inline-math">$n\in \Z$</span> have prime factorisation <span class="inline-math">$n = p_1^{n_1} \ldots p_k^{n_k}$</span>.
</p>
<p>
    <span class="inline-math">$n$</span> can be written as the sum of two squares
    iff <span class="inline-math">$n_i$</span> is even whenever <span class="inline-math">$p_i \equiv 3\pmod 4$</span>.
</p>
