<p>
    Let <span class="inline-math">$R$</span> be a ring and <span class="inline-math">$A$</span> be a matrix over <span class="inline-math">$R$</span>.
</p>
<p>
    The <span class="inline-math">$k$</span>-th <em>Fitting ideal</em> <span class="inline-math">$\mathrm{Fit}_k(A)\lhd R$</span>
    is the ideal generated by the determinants of all <span class="inline-math">$k\times k$</span>
    <a href="/tripos-notes/Lectures/IB/Michaelmas/Linear-Algebra-LA/Notes/Definition-minor.html">submatrices</a> of <span class="inline-math">$A$</span>.
</p>
