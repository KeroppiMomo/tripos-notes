<p>
    An ideal <span class="inline-math">$I\lhd R$</span> of a ring
    is called <em>prime</em>
    if
</p>
<ol start="1">
<li>
    <p>
        <span class="inline-math">$I\neq R$</span>; and
    </p>
    
</li><li>
    <p>
        for all <span class="inline-math">$a,b\in R$</span>,
        <span class="display-math">$$ \begin{align*}
        ab\in I \implies a\in I \quad \text{or} \quad b\in I.
        \end{align*} $$</span>
    </p>
    
</li>
</ol>
