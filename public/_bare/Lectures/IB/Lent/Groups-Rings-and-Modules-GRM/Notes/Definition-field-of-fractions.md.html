<p>
    Let <span class="inline-math">$R$</span> be an <a href="/tripos-notes/Lectures/IB/Lent/Groups-Rings-and-Modules-GRM/Notes/Definition-integral-domain.html">integral domain</a>.
</p>
<p>
    A <em>field of fractions</em> for <span class="inline-math">$R$</span> is a field <span class="inline-math">$F$</span> such that
</p>
<ol start="1">
<li>
    <p>
        <span class="inline-math">$R\leq F$</span> is a <a href="/tripos-notes/Lectures/IB/Lent/Groups-Rings-and-Modules-GRM/Notes/Definition-subring.html">subring</a>; and
    </p>
    
</li><li>
    <p>
        every <span class="inline-math">$λ\in F$</span> can be written as <span class="inline-math">$ab\inv$</span>,
        where <span class="inline-math">$a,b\in R$</span> and <span class="inline-math">$b\inv$</span> is the multiplicative inverse in <span class="inline-math">$F$</span>.
    </p>
    
</li>
</ol>
