<p>
    Let <span class="inline-math">$ϕ: R\to S$</span> be a <a href="/tripos-notes/Lectures/IB/Lent/Groups-Rings-and-Modules-GRM/Notes/Definition-ring-homomorphism-isomorphism.html">ring homomorphism</a>.
</p>
<p>
    Then <span class="inline-math">$\ker ϕ$</span> <a href="/tripos-notes/Lectures/IB/Lent/Groups-Rings-and-Modules-GRM/Notes/Definition-ideal.html"><span class="inline-math">$\lhd$</span></a> <span class="inline-math">$R$</span>, and
    <span class="display-math">$$ \begin{align*}
        f:\quad  R/\ker(ϕ) &amp;\to \im(ϕ) \leq S \\
        r + \ker(ϕ) &amp;\mapsto ϕ(r)
    \end{align*} $$</span>
    is a well-defined <a href="/tripos-notes/Lectures/IB/Lent/Groups-Rings-and-Modules-GRM/Notes/Definition-ring-homomorphism-isomorphism.html">ring isomorphism</a>.
</p>
