<p>
    Let <span class="inline-math">$R$</span> be a <a href="/tripos-notes/Lectures/IB/Lent/Groups-Rings-and-Modules-GRM/Notes/Definition-unique-factorisation-domain.html">unique factorisation domain</a>,
    and <span class="inline-math">$r\in R$</span> be an element.
</p>
<p>
    Then <span class="inline-math">$r$</span> is <a href="/tripos-notes/Lectures/IB/Lent/Groups-Rings-and-Modules-GRM/Notes/Definition-irreducible.html">irreducible</a> iff <span class="inline-math">$r$</span> is <a href="/tripos-notes/Lectures/IB/Lent/Groups-Rings-and-Modules-GRM/Notes/Definition-prime-element.html">prime</a>.
</p>
<p>
    <a href="/tripos-notes/Lectures/IB/Lent/Groups-Rings-and-Modules-GRM/Notes/Proof-irreducible-iff-prime-in-UFD.html">Proof</a>
</p>
<ul>
<li>
    <p>
        <a href="/tripos-notes/Lectures/IB/Lent/Groups-Rings-and-Modules-GRM/Notes/Proposition-prime-element-is-irreducible.html">"<span class="inline-math">$\Leftarrow$</span>"</a> is true in all rings.
    </p>
    
</li><li>
    <p>
        Comparing with <a href="/tripos-notes/Lectures/IB/Lent/Groups-Rings-and-Modules-GRM/Notes/Proposition-equivalence-of-maximal-ideal-prime-ideal-prime-element-irreducible-element-in-PID.html">the case in a PID</a>,
        in fact <a href="https://math.stackexchange.com/q/78006">a UFD is a PID iff every non-zero prime ideal is maximal</a>.
    </p>
    
</li>
</ul>
