<p>
    A ring is called a <em>principal ideal domain</em> (PID) if
    it is an <a href="/tripos-notes/Lectures/IB/Lent/Groups-Rings-and-Modules-GRM/Notes/Definition-integral-domain.html">integral domain</a> and every ideal is <a href="/tripos-notes/Lectures/IB/Lent/Groups-Rings-and-Modules-GRM/Notes/Definition-ideal-generated-by-a-set-principal-ideal.html">principal</a>.
</p>
