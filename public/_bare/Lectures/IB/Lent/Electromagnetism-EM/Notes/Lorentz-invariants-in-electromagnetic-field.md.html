<p>
    We obtain a (Lorentz invariant) scalar
    <span class="display-math">$$ \begin{align*}
        F_{μν} F^{μν} \propto |\v E|^2 - c^2 |\v B|^2

    and a pseudo-scalar (transforming with a minus sign if <span class="inline-math">$\det Λ = -1$</span>)
    <span class="display-math">$$ \begin{align*}
        ε_{μνρσ} F^{μν} F^{ρσ} \propto \v E \cdot \v B.
    \end{align*} $$</span>
