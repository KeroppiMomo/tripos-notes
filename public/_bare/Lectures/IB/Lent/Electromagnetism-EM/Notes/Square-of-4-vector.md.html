<p>
    The <em>square</em> of a 4-vector <span class="inline-math">$V$</span>
    <span class="display-math">$$ \begin{align*}
        V\cdot V = η_{μν}V^μ V^ν
    \end{align*} $$</span>
    is a scalar thus a Lorentz invariant.
</p>
<p>
    <span class="inline-math">$V$</span> is
</p>
<ul>
<li>
    <p>
        timelike if <span class="inline-math">$V\cdot V&lt;0$</span>;
    </p>
    
</li><li>
    <p>
        null/lightlike if <span class="inline-math">$V\cdot V = 0$</span>;
    </p>
    
</li><li>
    <p>
        spacelike if <span class="inline-math">$V\cdot V&gt;0$</span>.
    </p>
    
</li>
</ul>
