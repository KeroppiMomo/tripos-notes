<p>
    The <em>4-current density</em> (or <em>charge-current density 4-vector</em>)
    is defined as
    <span class="display-math">$$ \begin{align*}
        J^μ = (ρc, \v J).
    \end{align*} $$</span>
</p>
<p>
    <a href="/tripos-notes/Lectures/IB/Lent/Electromagnetism-EM/Notes/Charge-conservation.html">Charge conservation</a> is expressed as
    <span class="display-math">$$ \begin{align*}
        \partial_μ J^μ = 0.
    \end{align*} $$</span>
</p>
