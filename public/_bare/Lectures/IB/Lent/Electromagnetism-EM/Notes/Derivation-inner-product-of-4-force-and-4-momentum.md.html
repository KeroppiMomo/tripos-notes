<p>
    <span class="display-math">$$ \begin{align*}
        0 ={}&amp; \dd{τ}(η_{μν} P^μ P^ν) \\
        ={}&amp; η_{μν}\left(\dfd{P^μ}{τ} P^ν + P^μ \dfd{P^ν}{τ}\right) \\
        ={}&amp; η_{μν}\bigl(f^μ P^ν + P^μ f^ν\bigr) \\
        ={}&amp; 2η_{μν} f^μ P^ν
    \end{align*} $$</span>
    because <span class="inline-math">$η_{μν}$</span> is symmetric.
</p>
