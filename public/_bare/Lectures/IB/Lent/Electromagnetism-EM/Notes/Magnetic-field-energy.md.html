<p>
    The energy required to reach a magnetostatic state <span class="inline-math">$\v J(\v x)$</span>
    is
    <span class="display-math">$$ \begin{align*}
        U = \frac{1}{2}\int_{V} \v J\cdot \v A \d^3 \v x = \int_{\R^3} \frac{1}{2μ_0} |\v B|^2 \d^3 \v x,
    \end{align*} $$</span>
    which can be interpreted as the energy stored in the magnetic field.
    (<a href="/tripos-notes/Lectures/IB/Lent/Electromagnetism-EM/Notes/Derivation-magnetic-field-energy.html">Derivation</a>)
</p>
