<p>
    For a long cylindrical wire of radius <span class="inline-math">$R$</span>
    carrying a total current <span class="inline-math">$I$</span> parallel to its axis,
    the magnetic field outside <span class="inline-math">$r&gt;R$</span> is
    <span class="display-math">$$ \begin{align*}
        \v B = \frac{μ_0 I}{2πr} \v e_ϕ.
    \end{align*} $$</span>
    (<a href="/tripos-notes/Lectures/IB/Lent/Electromagnetism-EM/Notes/Derivation-magnetic-field-due-to-long-straight-wire.html">Derivation</a>)
</p>
