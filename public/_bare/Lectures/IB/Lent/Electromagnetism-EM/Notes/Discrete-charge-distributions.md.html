<p>
    For <span class="inline-math">$N$</span> particles, each of charge <span class="inline-math">$q_i$</span> at position <span class="inline-math">$\v x_i(t)$</span>,
    the charge distribution is
    <span class="display-math">$$ \begin{align*}
        ρ(\v x, t) ={}&amp; \sum_{i=1}^{N} q_i\, δ(\v x - \v x_i(t)), \\
        \v J(\v x, t) ={}&amp; \sum_{i=1}^{N} q_i\, \dv x_i\, δ(\v x - \v x_i(t)).
    \end{align*} $$</span>
</p>
