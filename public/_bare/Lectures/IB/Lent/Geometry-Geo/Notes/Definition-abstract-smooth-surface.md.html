<p>
    An <em>abstract smooth surface</em> <span class="inline-math">$Σ$</span>
    is a <a href="/tripos-notes/Lectures/IB/Lent/Geometry-Geo/Notes/Definition-topological-surface.html">topological surface</a>
    with an <a href="/tripos-notes/Lectures/IB/Lent/Geometry-Geo/Notes/Definition-chart-atlas-local-parametrisation.html">atlas</a> of charts
    such that all <a href="/tripos-notes/Lectures/IB/Lent/Geometry-Geo/Notes/Definition-transition-map.html">transition maps</a> are <a href="/tripos-notes/Lectures/IB/Lent/Geometry-Geo/Notes/Definition-smooth-functions-diffeomorphism.html">diffeomorphisms</a> (of open sets in <span class="inline-math">$\R^2$</span>).
</p>
