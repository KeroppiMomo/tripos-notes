<p>
    Let <span class="inline-math">$Σ$</span> be an abstract smooth surface
    with an <a href="/tripos-notes/Lectures/IB/Lent/Geometry-Geo/Notes/Definition-Riemannian-metric-on-abstract-smooth-surface.html">abstract Riemannian metric</a> <span class="inline-math">$g$</span>.
</p>
<p>
    If <span class="inline-math">$R$</span> is a <a href="/tripos-notes/Lectures/IB/Lent/Geometry-Geo/Notes/Definition-geodesic-polygon.html">geodesic <span class="inline-math">$n$</span>-gon</a>
    with internal angle <span class="inline-math">$α_1, α_2, \ldots, α_n$</span>, then
    <span class="display-math">$$ \begin{align*}
        \int_{R} κ_Σ \d A = \sum_{i=1}^{n} α_i - (n-2)π,
    \end{align*} $$</span>
    where <span class="inline-math">$κ_Σ$</span> is the <a href="/tripos-notes/Lectures/IB/Lent/Geometry-Geo/Notes/Definition-Gauss-curvature.html">Gauss curvature</a> of the surface.
</p>
