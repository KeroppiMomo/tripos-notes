<p>
    Let <span class="inline-math">$Σ$</span> be a smooth surface in <span class="inline-math">$\R^3$</span>.
</p>
<ol start="1">
<li>
    <p>
        If <a href="/tripos-notes/Lectures/IB/Lent/Geometry-Geo/Notes/Definition-Gauss-curvature.html"><span class="inline-math">$κ$</span></a> <span class="inline-math">$\equiv 0$</span>,
        then <span class="inline-math">$Σ$</span> is <a href="/tripos-notes/Lectures/IB/Lent/Geometry-Geo/Notes/Definition-isometric-locally-isometric.html">locally isometric</a> to the plane <span class="inline-math">$\R^2$</span> (first fundamental form <span class="inline-math">$\d u^2 + \d v^2$</span>).
    </p>
    
</li><li>
    <p>
        If <span class="inline-math">$κ \equiv 1$</span>,
        then <span class="inline-math">$Σ$</span> is locally isometric to the sphere <span class="inline-math">$S^2$</span> (first fundamental form <span class="inline-math">$\d u^2 + \cos^2 u \d v^2$</span>).
    </p>
    
</li>
</ol>
