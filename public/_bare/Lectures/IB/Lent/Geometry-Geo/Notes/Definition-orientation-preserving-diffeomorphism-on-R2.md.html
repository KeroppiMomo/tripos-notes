<p>
    Let <span class="inline-math">$\GL^+(2, \R) \leq \GL(2, \R)$</span>
    be the subgroup of <span class="inline-math">$2\times 2$</span> real matrices with positive determinants.
</p>
<p>
    A <a href="/tripos-notes/Lectures/IB/Lent/Geometry-Geo/Notes/Definition-smooth-functions-diffeomorphism.html">diffeomorphism</a> <span class="inline-math">$f: V\to V&#x27;$</span> between open sets <span class="inline-math">$V,V&#x27;\subseteq \R^2$</span>
    is said to be <em>orientation-preserving</em> if <span class="inline-math">$Df|_x \in \GL^+(2,\R)$</span> for all <span class="inline-math">$x\in V$</span>.
</p>
