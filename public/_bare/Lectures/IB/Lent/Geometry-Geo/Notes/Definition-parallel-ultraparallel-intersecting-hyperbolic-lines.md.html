<p>
    Two <a href="/tripos-notes/Lectures/IB/Lent/Geometry-Geo/Notes/Lemma-geodesics-on-hyperbolic-disc.html">hyperbolic lines</a> are said to be
</p>
<ol start="1">
<li>
    <p>
        <em>parallel</em> if they meet at infinity (i.e. at <span class="inline-math">$\partial H$</span> but not in <span class="inline-math">$\mathbb{H}$</span>);
    </p>
    
</li><li>
    <p>
        <em>ultraparallel</em> if they don't meet in <span class="inline-math">$\mathbb{H}\cup \partial\mathbb{H}$</span>;
    </p>
    
</li><li>
    <p>
        <em>intersecting</em> otherwise, i.e. if they meet at one point in <span class="inline-math">$\mathbb{H}$</span>.
    </p>
    
</li>
</ol>
