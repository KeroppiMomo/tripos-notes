<p>
    The <em>hyperbolic upper half plane</em> <span class="inline-math">$(h, g_{\text{hyp}})$</span> is
    the surface <span class="inline-math">$h=\sb{z\in \C}{\Im(z) &gt; 0}$</span>
    with the <a href="/tripos-notes/Lectures/IB/Lent/Geometry-Geo/Notes/Definition-Riemannian-metric-on-abstract-smooth-surface.html">Riemannian metric</a>
    <span class="display-math">$$ \begin{align*}
        \frac{\d x^2 + \d y^2}{y^2} = \frac{\left|\d z\right|^2}{\Im(z)^2}.
    \end{align*} $$</span>
</p>
