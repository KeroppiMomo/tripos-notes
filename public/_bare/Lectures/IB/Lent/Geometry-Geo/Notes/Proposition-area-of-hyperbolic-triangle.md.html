<p>
    Let <span class="inline-math">$T$</span> be a <a href="/tripos-notes/Lectures/IB/Lent/Geometry-Geo/Notes/Definition-hyperbolic-triangle.html">hyperbolic triangle</a>
    with internal angles <span class="inline-math">$α, β, γ$</span>.
    (At an ideal vertex, the internal angle is zero.)
    Then
    <span class="display-math">$$ \begin{align*}
        \mathrm{area}_\text{hyp}(T) = π - α - β - γ.
    \end{align*} $$</span>
</p>
