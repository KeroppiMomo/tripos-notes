<p>
    The isometry group <span class="inline-math">$\mathrm{Isom}(D)$</span> of the <a href="/tripos-notes/Lectures/IB/Lent/Geometry-Geo/Notes/Definition-hyperbolic-disc.html">hyperbolic disc</a>
    is generated by <a href="/tripos-notes/Lectures/IB/Lent/Geometry-Geo/Notes/Definition-circle-inversion.html">inversions</a> in hyperbolic lines (i.e. circles/lines orthogonal to <span class="inline-math">$\partial D$</span>).
</p>
<p>
    The orientation-preserving isometries <span class="inline-math">$\mathrm{Isom}^+(D)$</span> are <a href="/tripos-notes/Lectures/IB/Lent/Geometry-Geo/Notes/Lemma-Mobius-group-on-unit-disc.html"><span class="inline-math">$\mathrm{Möb}(D)$</span></a>.
</p>
