<p>
    Let <span class="inline-math">$Σ$</span> be a topological surface.
</p>
<p>
    The <em>transition map</em> between two <a href="/tripos-notes/Lectures/IB/Lent/Geometry-Geo/Notes/Definition-chart-atlas-local-parametrisation.html">charts</a> <span class="inline-math">$(U_1,ϕ_1), (U_2, ϕ_2)$</span> is
    <span class="display-math">$$ \begin{align*}
        ϕ_2 \circ ϕ_1\inv : ϕ_1(U_1 \cap U_2) \to ϕ_2(U_1 \cap U_2).
    \end{align*} $$</span>
</p>
<ul>
<li>
    <p>
        Since <span class="inline-math">$ϕ_1, ϕ_2$</span> are homeomorphisms, so is the transition map.
    </p>
    
</li>
</ul>
