<p>
    Let <span class="inline-math">$Σ$</span> be a smooth surface in <span class="inline-math">$\R^3$</span>.
</p>
<p>
    The <em>Gauss curvature</em> of <span class="inline-math">$Σ$</span> at <span class="inline-math">$p\in Σ$</span> is
    the determinant of the <a href="/tripos-notes/Lectures/IB/Lent/Geometry-Geo/Notes/Definition-shape-operator.html">shape operator</a>
    <span class="display-math">$$ \begin{align*}
        κ(p) = \det(\mathbb{S}_p) = \det (Dn|_p: T_p Σ \to T_p Σ).
    \end{align*} $$</span>
</p>
