<p>
    Let <span class="inline-math">$Σ$</span> be a smooth surface in <span class="inline-math">$\R^3$</span>
    and <span class="inline-math">$σ: V\to U$</span> be an allowable parametrisation.
</p>
<p>
    If <span class="inline-math">$V$</span> is connected and the <a href="/tripos-notes/Lectures/IB/Lent/Geometry-Geo/Notes/Definition-second-fundamental-form.html">second fundamental form</a> vanishes identically,
    then <span class="inline-math">$U$</span> lies in an affine plane in <span class="inline-math">$\R^3$</span>.
</p>
