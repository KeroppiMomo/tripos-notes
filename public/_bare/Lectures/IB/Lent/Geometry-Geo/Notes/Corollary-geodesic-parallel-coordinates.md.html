<p>
    Any smooth surface in <span class="inline-math">$\R^3$</span> has allowable parametrisation
    near any point with the <a href="/tripos-notes/Lectures/IB/Lent/Geometry-Geo/Notes/Definition-first-fundamental-form.html">first fundamental form</a>
    <span class="display-math">$$ \begin{align*}
        \d u^2 + G(u,v) \d v^2,
    \end{align*} $$</span>
    satisfying
    <span class="display-math">$$ \begin{align*}
        G(0, v) = 1, \qquad G_u(0, v) = 0.
    \end{align*} $$</span>
</p>
