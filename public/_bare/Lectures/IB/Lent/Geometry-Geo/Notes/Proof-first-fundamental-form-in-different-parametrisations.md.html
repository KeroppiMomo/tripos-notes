<p>
    Writing <span class="inline-math">$σ = \tilde σ\circ ϕ$</span>,
    we apply chain rule to get
    <span class="display-math">$$ \begin{align*}
        \pmat{E &amp; F \\ F &amp; G} ={}&amp; (Dσ)^T (Dσ) \\
        ={}&amp; (D\tilde σ \circ Dϕ)^T (D\tilde σ\circ Dϕ) \\
        ={}&amp; (Dϕ)^T (D\tilde σ)^T (D\tilde σ)(Dϕ) = (Dϕ)^T \pmat{\tilde E &amp; \tilde F\\ \tilde F &amp; \tilde G} (Dϕ).
    \end{align*} $$</span>
</p>
