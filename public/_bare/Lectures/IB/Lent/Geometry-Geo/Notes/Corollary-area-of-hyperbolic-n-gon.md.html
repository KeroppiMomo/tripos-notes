<p>
    The area of a hyperbolic <span class="inline-math">$n$</span>-gon (region bound by <span class="inline-math">$n$</span> <a href="/tripos-notes/Lectures/IB/Lent/Geometry-Geo/Notes/Lemma-geodesics-on-hyperbolic-disc.html">hyperbolic geodesics</a>)
    has an area
    <span class="display-math">$$ \begin{align*}
        (n-2)π - \sum_{i=1}^{n} α_i
    \end{align*} $$</span>
    where <span class="inline-math">$α_i$</span> is the internal angles.
</p>
<p>
    Proof: split the <span class="inline-math">$n$</span>-gon into <span class="inline-math">$(n-2)$</span> <a href="/tripos-notes/Lectures/IB/Lent/Geometry-Geo/Notes/Proposition-area-of-hyperbolic-triangle.html">hyperbolic triangles</a>.
</p>
