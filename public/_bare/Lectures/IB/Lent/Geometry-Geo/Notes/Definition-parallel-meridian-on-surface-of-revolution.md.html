<p>
    On a <a href="/tripos-notes/Lectures/IB/Lent/Geometry-Geo/Notes/Surface-of-revolution.html">surface of revolution</a>,
</p>
<ul>
<li>
    <p>
        a curve obtained by rotating a point on <span class="inline-math">$η$</span> is called a <em>parallel</em>;
    </p>
    
</li><li>
    <p>
        a curve obtained by a fixed angle rotation of the entire <span class="inline-math">$η$</span> is called a <em>meridian</em>.
    </p>
    
</li>
</ul>
