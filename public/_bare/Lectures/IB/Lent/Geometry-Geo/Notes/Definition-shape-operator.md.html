<p>
    For a smooth surface <span class="inline-math">$Σ$</span> in <span class="inline-math">$\R^3$</span>,
    the shape operator at a point <span class="inline-math">$p\in Σ$</span> is
    the negative derivative of the <a href="/tripos-notes/Lectures/IB/Lent/Geometry-Geo/Notes/Definition-normal-direction-Gauss-map.html">Gauss map</a>
    <span class="display-math">$$ \begin{align*}
        \mathbb{S}_p = -Dn|_p\in \mathrm{End}(T_p Σ).
    \end{align*} $$</span>
</p>
<ul>
<li>
    <p>
        The Gauss map is <span class="inline-math">$n: Σ\to S^2$</span>, <a href="/tripos-notes/Lectures/IB/Lent/Geometry-Geo/Notes/Lemma-derivative-of-map-between-surfaces-preserves-tangent-spaces.html">so</a>
        <span class="inline-math">$Dn_p: T_pΣ \to T_{n(p)}S^2 = T_pΣ$</span>.
    </p>
    
</li>
</ul>
