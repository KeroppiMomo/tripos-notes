<p>
    We say a smooth surface <span class="inline-math">$Σ$</span> in <span class="inline-math">$\R^3$</span> is <em>flat</em>
    if <a href="/tripos-notes/Lectures/IB/Lent/Geometry-Geo/Notes/Definition-Gauss-curvature.html"><span class="inline-math">$κ$</span></a> <span class="inline-math">$\equiv 0$</span>.
</p>
<ul>
<li>
    <p>
        <span class="inline-math">$κ\equiv 0 \iff \det Dn \equiv 0 \iff Dn$</span> has rank <span class="inline-math">$&lt;2$</span> <span class="inline-math">$\iff n_u \times n_v \equiv 0$</span>.
    </p>
    
</li>
</ul>
