<p>
    A <a href="/tripos-notes/Lectures/IB/Lent/Geometry-Geo/Notes/Definition-hyperbolic-triangle.html">hyperbolic triangle</a> with side lengths <span class="inline-math">$A,B,C$</span>
    and opposite angles are <span class="inline-math">$α,β,γ$</span>
    satisfies
    <span class="display-math">$$ \begin{align*}
        \cosh C = \cosh A \cosh B - \sinh A \sinh B \cos γ.
    \end{align*} $$</span>
