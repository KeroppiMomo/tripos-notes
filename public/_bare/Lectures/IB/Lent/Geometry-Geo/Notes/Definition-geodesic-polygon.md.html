<p>
    Let <span class="inline-math">$Σ$</span> be an abstract smooth surface
    with an <a href="/tripos-notes/Lectures/IB/Lent/Geometry-Geo/Notes/Definition-Riemannian-metric-on-abstract-smooth-surface.html">abstract Riemannian metric</a> <span class="inline-math">$g$</span>.
</p>
<p>
    A <em>geodesic polygon</em> on <span class="inline-math">$(Σ, g)$</span>
    is an embedding (i.e. the image under an injective homeomorphism)
    of a closed disc such that the boundary can be decomposed
    into finitely many <a href="/tripos-notes/Lectures/IB/Lent/Geometry-Geo/Notes/Definition-geodesic.html">geodesic</a> segments.
</p>
