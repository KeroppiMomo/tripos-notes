<p>
    Let <span class="inline-math">$V\subseteq \R^2$</span> be open.
</p>
<p>
    An <em>(abstract) Riemannian metric</em> on <span class="inline-math">$V$</span> is a smooth map
    <span class="display-math">$$ \begin{align*}
        V &amp;\to \set{\text{inner product on $\R^2$}} \\
        p &amp;\mapsto \I_p =\pmat{E(p) &amp; F(p) \\ F(p) &amp; G(p)}
    \end{align*} $$</span>
    (where <span class="inline-math">$E,G&gt;0$</span> and <span class="inline-math">$EG-F^2&gt;0$</span>).
</p>
