<p>
    Let <span class="inline-math">$Σ$</span> be a smooth surface in <span class="inline-math">$\R^3$</span>,
    <span class="inline-math">$p\in Σ$</span>
    and <span class="inline-math">$0 \neq v \in$</span> <a href="/tripos-notes/Lectures/IB/Lent/Geometry-Geo/Notes/Definition-tangent-plane-of-smooth-surface-in-R3.html"><span class="inline-math">$T_p Σ$</span></a>.
</p>
<p>
    There exists some <span class="inline-math">$ε&gt;0$</span>
    and a <a href="/tripos-notes/Lectures/IB/Lent/Geometry-Geo/Notes/Definition-geodesic.html">geodesic</a> <span class="inline-math">$γ: (-ε, ε)\to Σ$</span>
    such that <span class="inline-math">$γ(0)=p$</span> and <span class="inline-math">$γ&#x27;(0)=v$</span>.
    Moreover <span class="inline-math">$γ$</span> depends smoothly on the initial condition <span class="inline-math">$(p,v)$</span>.
</p>
