<p>
    Use the symmetry of the first and second fundamental forms:
    <span class="display-math">$$ \begin{align*}
        \I_p(\mathbb{S}_p v, w) ={}&amp; \II_p(v,w) \\
        ={}&amp; \II_p(w, v) \\
        ={}&amp; \I_p(\mathbb{S}_p w, v) \\
        ={}&amp; \I_p(v, \mathbb{S}_p w).
    \end{align*} $$</span>
</p>
