<p>
    For a smooth surface <span class="inline-math">$Σ$</span> in <span class="inline-math">$\R^3$</span>,
    we say <span class="inline-math">$p\in Σ$</span> is
</p>
<ul>
<li>
    <p>
        <em>elliptic</em> if <a href="/tripos-notes/Lectures/IB/Lent/Geometry-Geo/Notes/Definition-Gauss-curvature.html"><span class="inline-math">$κ$</span></a><span class="inline-math">$(p) &gt; 0$</span>;
    </p>
    
</li><li>
    <p>
        <em>parabolic</em> if <span class="inline-math">$κ(p) = 0$</span>; or
    </p>
    
</li><li>
    <p>
        <em>hyperbolic</em> if <span class="inline-math">$κ(p) &lt; 0$</span>.
    </p>
    
</li>
</ul>
