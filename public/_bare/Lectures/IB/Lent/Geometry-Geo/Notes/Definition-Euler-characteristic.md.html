<p>
    The <em>Euler characteristic</em> of <a href="/tripos-notes/Lectures/IB/Lent/Geometry-Geo/Notes/Definition-subdivision.html">subdivision</a>
    of a compact topological surface <span class="inline-math">$Σ$</span> is defined as the integer
    <span class="display-math">$$ \begin{align*}
        χ(Σ) = \# \text{ vertices} - \#\text{ edges} + \# \text{ faces}.
    \end{align*} $$</span>
</p>
