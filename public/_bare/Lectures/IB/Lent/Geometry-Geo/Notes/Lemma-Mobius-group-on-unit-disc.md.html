<p>
    Möbius transformations that preserves the unit disc are precisely
    those of the form
    <span class="display-math">$$ \begin{align*}
        z\mapsto e^{iθ} \frac{z-a}{1 - \bar a z}, \qquad θ\in \R, \; |a|&lt;1.
    \end{align*} $$</span>
    Let <span class="inline-math">$\mathrm{Möb}(D)$</span> denote this group.
