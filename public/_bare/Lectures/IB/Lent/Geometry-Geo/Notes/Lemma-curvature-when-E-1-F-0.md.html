<p>
    Let <span class="inline-math">$Σ$</span> be a smooth surface in <span class="inline-math">$\R^3$</span>
    and <span class="inline-math">$σ$</span> be an allowable parametrisation on <span class="inline-math">$Σ$</span>.
</p>
<p>
    If the first fundamental form is <span class="inline-math">$\d u^2 + G(u,v) \d v^2$</span>, then
    the <a href="/tripos-notes/Lectures/II/Lent/Differential-Geometry-DG/Notes/Definition-curvature-on-surface-in-R3.html">Gauss curvature</a> is
    <span class="display-math">$$ \begin{align*}
        κ = -\frac{\sqrt{G}_{uu}}{\sqrt{G}}.
    \end{align*} $$</span>
</p>
