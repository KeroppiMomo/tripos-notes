<p>
    Let <span class="inline-math">$Σ$</span> be a smooth surface in <span class="inline-math">$\R^3$</span>,
    and suppose there exists a plane <span class="inline-math">$Π\subseteq \R^3$</span> such that
    <span class="inline-math">$C = Π \cap Σ$</span> is a smooth curve
    and reflection in <span class="inline-math">$Π$</span> preserves <span class="inline-math">$Σ$</span>.
    Then <span class="inline-math">$C$</span> is a <a href="/tripos-notes/Lectures/IB/Lent/Geometry-Geo/Notes/Definition-geodesic.html">geodesic</a> on <span class="inline-math">$Σ$</span> when parametrised at constant speed.
