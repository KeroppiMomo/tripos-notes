<ol start="1">
<li>
    <p>
        Every compact topological surface <span class="inline-math">$Σ$</span> admits a <a href="/tripos-notes/Lectures/IB/Lent/Geometry-Geo/Notes/Definition-subdivision.html">subdivision</a>
        (and in fact <a href="/tripos-notes/Lectures/IB/Lent/Geometry-Geo/Notes/Definition-triangulation.html">triangulation</a>).
    </p>
    
</li><li>
    <p>
        The <a href="/tripos-notes/Lectures/IB/Lent/Geometry-Geo/Notes/Definition-Euler-characteristic.html">Euler characteristic</a> <span class="inline-math">$χ(Σ)$</span>
        of <span class="inline-math">$Σ$</span> does not depend on the choice of subdivision, i.e.
        it defines a topological invariant of the surface <span class="inline-math">$Σ$</span>.
    </p>
    
</li>
</ol>
