<p>
    Let <span class="inline-math">$Σ$</span> be a smooth surface in <span class="inline-math">$\R^3$</span>.
</p>
<p>
    A smooth curve <span class="inline-math">$γ: [a,b]\to Σ$</span>
    is a <a href="/tripos-notes/Lectures/IB/Lent/Geometry-Geo/Notes/Definition-geodesic.html">geodesic</a> iff
    <span class="inline-math">$\ddot γ(t)$</span> is normal to the surface for all <span class="inline-math">$t$</span>,
    i.e. <a href="/tripos-notes/Lectures/II/Lent/Differential-Geometry-DG/Notes/Definition-vector-field-along-curve-covariant-derivative-parallel.html"><span class="inline-math">$\mathrm{D}\dot γ/\d t$</span></a><span class="inline-math">${}= 0$</span>.
</p>
<p>
    Consequently, geodesics are always parametrised with constant speed.
</p>
