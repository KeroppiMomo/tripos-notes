<p>
    If <span class="inline-math">$γ$</span> is a geodesic and bounds a disc,
    view it as a geodesic 2-gon <span class="inline-math">$R$</span>
    with internal angles <span class="inline-math">$π$</span>.
    Then local Gauss-Bonnet says
    <span class="display-math">$$ \begin{align*}
        0 = \int_{R} κ \d A = \sum_{i=1}^{2} π - (2-2)π = 2π
    \end{align*} $$</span>
</p>
