<p>
    For a smooth <a href="/tripos-notes/Lectures/IB/Lent/Geometry-Geo/Notes/Definition-two-sided-surface.html">oriented</a> surface <span class="inline-math">$Σ$</span> in <span class="inline-math">$\R^3$</span>,
    the <a href="/tripos-notes/Lectures/IB/Lent/Geometry-Geo/Notes/Definition-shape-operator.html">shape operator</a> <span class="inline-math">$\mathbb{S}_p$</span> at a point <span class="inline-math">$p\in Σ$</span>
    is a <a href="/tripos-notes/Lectures/IB/Michaelmas/Linear-Algebra-LA/Notes/Definition-Hermitian-self-adjoint-operator.html">self-adjoint</a> linear map
    with respect to the inner product <a href="/tripos-notes/Lectures/IB/Lent/Geometry-Geo/Notes/Definition-first-fundamental-form.html"><span class="inline-math">$\I_p$</span></a> <span class="inline-math">$= \langle \cdot ,\cdot \rangle_{\R^3}$</span>.
