<p>
    Let <span class="inline-math">$Σ$</span> be a compact abstract smooth surface
    with an <a href="/tripos-notes/Lectures/IB/Lent/Geometry-Geo/Notes/Definition-Riemannian-metric-on-abstract-smooth-surface.html">abstract Riemannian metric</a> <span class="inline-math">$g$</span>.
    Then
    <span class="display-math">$$ \begin{align*}
        \int_{Σ} κ_Σ \d A = 2π\, χ(Σ)
    \end{align*} $$</span>
    where <span class="inline-math">$κ_Σ$</span> is the <a href="/tripos-notes/Lectures/IB/Lent/Geometry-Geo/Notes/Definition-Gauss-curvature.html">Gauss curvature</a>
    and <span class="inline-math">$χ(Σ)$</span> is the <a href="/tripos-notes/Lectures/IB/Lent/Geometry-Geo/Notes/Definition-Euler-characteristic.html">Euler characteristic</a> of the surface.
</p>
