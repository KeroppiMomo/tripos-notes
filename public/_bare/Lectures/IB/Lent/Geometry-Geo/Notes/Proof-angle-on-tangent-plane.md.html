<p>
    Using <a href="/tripos-notes/Lectures/IB/Lent/Geometry-Geo/Notes/Definition-first-fundamental-form.html">how the first fundamental form is an inner product on the tangent plane</a>,
    we compute
    <span class="display-math">$$ \begin{align*}
        \cos θ = \frac{\langle v, w\rangle}{\sqrt{\langle v,v\rangle} \sqrt{\langle w,w\rangle}} = \frac{I(v_0, w_0)}{\sqrt{I(v_0, v_0)} \sqrt{I(w_0, w_0)}}.
    \end{align*} $$</span>
