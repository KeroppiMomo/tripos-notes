<p>
    A <em>hyperbolic triangle</em>
    is the region bound by three <a href="/tripos-notes/Lectures/IB/Lent/Geometry-Geo/Notes/Lemma-geodesics-on-hyperbolic-disc.html">hyperbolic lines</a>,
    no two of which are <a href="/tripos-notes/Lectures/IB/Lent/Geometry-Geo/Notes/Definition-parallel-ultraparallel-intersecting-hyperbolic-lines.html">ultraparallel</a>.
</p>
<p>
    We say vertices lying at infinity <em>ideal vertices</em>.
</p>
