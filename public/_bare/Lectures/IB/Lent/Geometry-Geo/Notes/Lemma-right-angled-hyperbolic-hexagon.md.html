<p>

    there exists a right-angled <a href="/tripos-notes/Lectures/IB/Lent/Geometry-Geo/Notes/Hyperbolic-geometry.html">hyperbolic</a> hexagon
    with side lengths <span class="inline-math">$l_α, *, l_β, *, l_γ, *$</span> in cyclic order (<span class="inline-math">$*$</span> are unspecified lengths).
    Moreover it is unique up to isometry.
