<p>
    The <a href="/tripos-notes/Lectures/IB/Lent/Geometry-Geo/Notes/Definition-Gauss-curvature.html">Gauss curvature</a> is an isometry invariant,
    i.e. if <span class="inline-math">$Σ_1$</span> and <span class="inline-math">$Σ_2$</span> are two smooth surfaces in <span class="inline-math">$\R^3$</span>
    and <span class="inline-math">$f: Σ_1 \to Σ_2$</span> is an <a href="/tripos-notes/Lectures/IB/Lent/Geometry-Geo/Notes/Definition-isometric-locally-isometric.html">isometry</a>,
    then <span class="inline-math">$κ_{Σ_1}(p) = κ_{Σ_2}(f(p))$</span>.
