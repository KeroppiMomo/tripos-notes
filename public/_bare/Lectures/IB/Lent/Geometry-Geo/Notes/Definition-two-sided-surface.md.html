<p>
    A <a href="/tripos-notes/Lectures/IB/Lent/Geometry-Geo/Notes/Definition-smooth-surface-in-R3.html">smooth surface in <span class="inline-math">$\R^3$</span></a> is <em>two-sided</em>
    if it admits a global continuous choice of <a href="/tripos-notes/Lectures/IB/Lent/Geometry-Geo/Notes/Definition-normal-direction-Gauss-map.html">unit normal vector</a>,
    i.e. a globally well-defined Gauss map.
