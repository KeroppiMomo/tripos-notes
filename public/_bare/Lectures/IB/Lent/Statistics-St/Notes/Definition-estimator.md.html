<p>
    An <em>estimator</em> is a statistic (function on the data) <span class="inline-math">$\hat θ: \mathcal{X} \to Θ$</span>
    which is used to approximate the true parameter <span class="inline-math">$θ$</span>.
</p>
<p>
    The distribution of <span class="inline-math">$\hat θ = \hat θ(X)$</span> is its <em>sampling distribution</em>.
</p>
