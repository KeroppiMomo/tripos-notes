<p>
    A <a href="/tripos-notes/Lectures/IB/Lent/Statistics-St/Notes/Definition-sufficient-statistic.html">sufficient statistic</a> <span class="inline-math">$T(X)$</span>
    is <em>minimal sufficient</em>
    if it is a function of every other statistic,
    i.e. if <span class="inline-math">$S(X)$</span> is a sufficient statistic,
    then <span class="inline-math">$S(x) = S(y) \implies T(x) = T(y)$</span> for all <span class="inline-math">$x,y\in \mathcal{X}$</span>.
</p>
<ul>
<li>
    <p>
        Minimal sufficient statistics are unique up to a bijection.
    </p>
    
</li>
</ul>
