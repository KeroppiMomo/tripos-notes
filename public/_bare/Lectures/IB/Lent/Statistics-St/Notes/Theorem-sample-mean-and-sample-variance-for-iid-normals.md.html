<p>
    Suppose <span class="inline-math">$X_1, \ldots, X_n \sim N(μ,σ^2)$</span> iid, and let
    <span class="display-math">$$ \begin{align*}
        \overline{X} = \frac{1}{n}\sum_{i=1}^{n} X_i, \qquad S_{XX} = \sum_{i=1}^{n} (X_i - \overline{X})^2.
    \end{align*} $$</span>
</p>
<p>
    Then <span class="inline-math">$\overline{X} \sim N(μ, σ^2/n)$</span> and <span class="inline-math">$S_{XX}/σ^2 \sim χ^2_{n-1}$</span> are independent.
</p>
