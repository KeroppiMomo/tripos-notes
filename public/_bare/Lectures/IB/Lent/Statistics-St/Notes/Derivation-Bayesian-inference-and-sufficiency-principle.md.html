<p>
    If <span class="inline-math">$T(X)$</span> is a sufficient statistic,
    by the factorisation theorem we have
    <span class="display-math">$$ \begin{align*}
        π(θ\mid x) \propto π(θ) \, p(x\mid θ) = π(θ)\,g(T(x), θ)\, h(x) \propto π(θ) \, g(T(x), θ).
    \end{align*} $$</span>
</p>
