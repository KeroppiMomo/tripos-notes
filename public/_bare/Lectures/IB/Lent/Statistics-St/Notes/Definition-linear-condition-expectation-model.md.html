<p>
    The <em>(homoscedastic) linear conditional expectation model</em> assumes
    <span class="display-math">$$ \begin{align*}
        \expect(Y\mid X) = X β, \qquad \var(Y\mid X) = σ^2 I_n
    \end{align*} $$</span>
    where <span class="inline-math">$β\in \R^p$</span> and <span class="inline-math">$σ^2&gt;0$</span> are unknown parameters.
</p>
