<p>
    The <em>(homoscedastic) normal linear model</em> assumes
    <span class="display-math">$$ \begin{align*}
        Y\mid X \sim N(X β, σ^2 I_n)
    \end{align*} $$</span>
    where <span class="inline-math">$β\in \R^p$</span> and <span class="inline-math">$σ^2&gt;0$</span> are unknown parameters.
</p>
<p>
    This can alternatively be expressed as
    <span class="display-math">$$ \begin{align*}
        Y = X β + ε
    \end{align*} $$</span>
    where <span class="inline-math">$ε\sim N(0_n, σ^2 I_n)$</span>.
</p>
