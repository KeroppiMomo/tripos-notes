<p>
    The <em>bias</em> of an <a href="/tripos-notes/Lectures/IB/Lent/Statistics-St/Notes/Definition-estimator.html">estimator</a> <span class="inline-math">$\hat θ$</span> for <span class="inline-math">$θ$</span> is
    <span class="display-math">$$ \begin{align*}
        \op{bias}(\hat θ) = \expect_θ(\hat θ) - θ,
    \end{align*} $$</span>
    which is a function of <span class="inline-math">$θ$</span>.
</p>
<p>
    We say <span class="inline-math">$\hat θ$</span> is <em>unbiased</em> if <span class="inline-math">$\op{bias}(\hat θ) = 0$</span> for all <span class="inline-math">$θ\in Θ$</span>.
</p>
