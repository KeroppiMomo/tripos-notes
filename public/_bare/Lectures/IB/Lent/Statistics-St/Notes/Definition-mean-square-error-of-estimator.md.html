<p>
    The <em>mean square error</em> of an <a href="/tripos-notes/Lectures/IB/Lent/Statistics-St/Notes/Definition-estimator.html">estimator</a> <span class="inline-math">$\hat θ$</span> for <span class="inline-math">$θ$</span> is
    <span class="display-math">$$ \begin{align*}
        \op{MSE}(\hat θ) = \expect_θ\bigl((\hat θ-θ)^2\bigr),
    \end{align*} $$</span>
    which is a function of <span class="inline-math">$θ$</span>.
</p>
