<p>
    Suppose <span class="inline-math">$ε\sim N(0, σ^2 I_n)$</span> and <span class="inline-math">$P$</span> is an <span class="inline-math">$n\times n$</span> <a href="/tripos-notes/Lectures/IB/Lent/Statistics-St/Notes/Definition-orthogonal-projection-matrix.html">orthogonal projection matrix</a>.
    Then
</p>
<ol start="1">
<li>
    <p>
        <span class="inline-math">$Pε \sim N(0, σ^2 P)$</span> and <span class="inline-math">$(I_n-P)ε\sim N(0,σ^2(I_n-P))$</span> are independent; and
    </p>
    
</li><li>
    <p>
        <span class="inline-math">$\|Pε\|^2/σ^2 \sim χ^2_{\mathrm{rank}(P)}$</span>.
    </p>
    
</li>
</ol>
