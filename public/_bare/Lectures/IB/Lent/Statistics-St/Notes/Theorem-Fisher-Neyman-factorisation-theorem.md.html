<p>
    Suppose <span class="inline-math">$X$</span> follows a distribution <span class="inline-math">$p(x; θ)$</span> depending on an unknown parameter <span class="inline-math">$θ$</span>.
</p>
<p>
    A statistic <span class="inline-math">$T$</span> is <a href="/tripos-notes/Lectures/IB/Lent/Statistics-St/Notes/Definition-sufficient-statistic.html">sufficient</a> for <span class="inline-math">$θ$</span> iff
    <span class="display-math">$$ \begin{align*}
        p(x; θ) = g(T(x), θ)\, h(x)
    \end{align*} $$</span>
    for some functions <span class="inline-math">$g$</span> and <span class="inline-math">$h$</span>.
</p>
