<p>
    A statistic <span class="inline-math">$T = T(X)$</span> is said to be <em>sufficient</em> for <span class="inline-math">$θ$</span>
    if the conditional distribution of <span class="inline-math">$X$</span> given <span class="inline-math">$T(X)$</span>
    does not depend on <span class="inline-math">$θ$</span>.
</p>
