<p>
    A <span class="inline-math">$(1-α)$</span>-<em>credible interval</em> for <span class="inline-math">$θ$</span> is a random interval <span class="inline-math">$[L(X), U(X)]$</span>
    such that
    <span class="display-math">$$ \begin{align*}
        π(L(X) \leq θ \leq U(X)\mid X) = 1-α.
    \end{align*} $$</span>
</p>
