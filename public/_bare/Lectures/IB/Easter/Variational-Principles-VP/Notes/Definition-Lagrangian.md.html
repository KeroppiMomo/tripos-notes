<p>
    Define the <em>Lagrangian</em>
    <span class="display-math">$$ \begin{align*}
        L(\v x,\dv x, t) = T - V
    \end{align*} $$</span>
    where
</p>
<ul>
<li>
    <p>
        <span class="inline-math">$t$</span> is the independent variable;
    </p>
    
</li><li>
    <p>
        <span class="inline-math">$\v x=(x,y,z)$</span> are the dependent variables;
    </p>
    
</li><li>
    <p>
        <span class="inline-math">$T$</span> is the kinetic energy;
    </p>
    
</li><li>
    <p>
        <span class="inline-math">$V$</span> is the potential energy.
    </p>
    
</li>
</ul>
