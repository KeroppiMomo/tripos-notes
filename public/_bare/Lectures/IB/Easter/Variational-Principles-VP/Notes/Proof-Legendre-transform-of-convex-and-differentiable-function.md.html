<p>
    <span class="inline-math">$\v p\cdot \v x - f(\v x)$</span> is stationary when <span class="inline-math">$\v x$</span> is the maximiser, so
    <span class="display-math">$$ \begin{align*}
        \v 0 = \nabla(\v p\cdot \v x - f(\v x)) = \v p - \nabla f(\v x).
    \end{align*} $$</span>
</p>
