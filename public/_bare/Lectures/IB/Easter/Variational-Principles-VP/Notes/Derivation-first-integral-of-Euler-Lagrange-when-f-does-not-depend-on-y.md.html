<p>
    The <a href="/tripos-notes/Lectures/IB/Easter/Variational-Principles-VP/Notes/Euler-Lagrange-equation.html">Euler-Lagrange equation</a> gives
    <span class="display-math">$$ \begin{align*}
        \dd{x}\left(\pdfd{f}{y&#x27;}\right) - \pdfd{f}{y} = 0
    \end{align*} $$</span>
    but <span class="inline-math">$\partial f/\partial y = 0$</span> since <span class="inline-math">$f$</span> does not depend on <span class="inline-math">$y$</span>, so integrating gives
    <span class="display-math">$$ \begin{align*}
        \pdfd{f}{y&#x27;} = \text{const.}
    \end{align*} $$</span>
</p>
