<p>
    If <span class="inline-math">$f: \R^n \to \R$</span> is strictly convex and differentiable, then the <a href="/tripos-notes/Lectures/IB/Easter/Variational-Principles-VP/Notes/Definition-Legendre-transform.html">Legendre transform</a>
    <span class="display-math">$$ \begin{align*}
        f^\ast(\v p) = \v p\cdot \v x(\v p) - f(\v x(\v p))
    \end{align*} $$</span>
    where <span class="inline-math">$\v x(\v p)$</span> is the solution to <span class="inline-math">$\v p = \nabla f(\v x)$</span>.
</p>
