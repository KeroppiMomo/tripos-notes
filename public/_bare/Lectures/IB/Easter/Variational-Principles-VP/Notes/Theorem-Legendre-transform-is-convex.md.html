<p>
    Let <span class="inline-math">$f(\v x): \R^n\to\R$</span> be a function and <span class="inline-math">$f^\ast$</span> be its <a href="/tripos-notes/Lectures/IB/Easter/Variational-Principles-VP/Notes/Definition-Legendre-transform.html">Legendre transform</a>.
</p>
<p>
    The domain of <span class="inline-math">$f^\ast$</span> is a convex set, and <span class="inline-math">$f^\ast$</span> is a convex function.
