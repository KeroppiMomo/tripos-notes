<p>
    Given a <a href="/tripos-notes/Lectures/IB/Easter/Variational-Principles-VP/Notes/Definition-continuous-symmetry.html">symmetry</a> <span class="inline-math">$\v X(t,s)$</span> of <span class="inline-math">$f(\v x,\dv x, t)$</span>,
    then
    <span class="display-math">$$ \begin{align*}
        \sum_i \pdfd{f}{\dot x_i} \left.\dfd{X_i}{s}\right|_{s=0}
    \end{align*} $$</span>
    is a first integral of the Euler-Lagrange equations, i.e. it is a conserved quantity.
</p>
