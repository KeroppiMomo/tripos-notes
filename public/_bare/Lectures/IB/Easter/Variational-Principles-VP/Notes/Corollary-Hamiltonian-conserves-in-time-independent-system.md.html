<p>
    Suppose the <a href="/tripos-notes/Lectures/IB/Easter/Variational-Principles-VP/Notes/Definition-Hamiltonian.html">Hamiltonian</a> <span class="inline-math">$H$</span> of a system does not depend explicitly on time, i.e. <span class="inline-math">$\partial L/\partial t = -\partial H/\partial t = 0$</span>.
</p>
<p>
    Then <span class="inline-math">$H$</span> is constant, i.e. <span class="inline-math">$dH/dt = 0$</span>.
</p>
