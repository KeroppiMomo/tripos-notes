<p>
    Suppose there is a family of transformations <span class="inline-math">$\v x(t) \to \v X(t,s)$</span> with parameter <span class="inline-math">$s$</span> satisfying <span class="inline-math">$\v x(t) = \v X(t,0)$</span>.
</p>
<p>
    We say this is a <em>(continuous) symmetry</em> of a function <span class="inline-math">$f(\v x, \dv x, t)$</span> if
    <span class="display-math">$$ \begin{align*}
        \dd{s} f(\v X(t,s), \dv X(t,s), t) = 0.
    \end{align*} $$</span>
</p>
