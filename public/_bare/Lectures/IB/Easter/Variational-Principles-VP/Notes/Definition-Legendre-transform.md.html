<p>
    The <em>Legendre transform</em> of <span class="inline-math">$f(\v x): \R^n\to\R$</span> is defined as
    <span class="display-math">$$ \begin{align*}
        f^\ast(\v p) = \sup_{\v x} \left[\v p\cdot \v x - f(\v x)\right]
    \end{align*} $$</span>
    whose domain is all <span class="inline-math">$\v p\in\R^n$</span> for which the right hand side is finite.
</p>
