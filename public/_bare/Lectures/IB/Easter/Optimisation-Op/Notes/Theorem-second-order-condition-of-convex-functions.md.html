<p>
    A twice differentiable function <span class="inline-math">$f: \R^n \to \R$</span> is <a href="/tripos-notes/Lectures/IB/Easter/Optimisation-Op/Notes/Definition-convex-function.html">convex</a> iff <a href="/tripos-notes/Lectures/IB/Easter/Optimisation-Op/Notes/Definition-Hessian.html"><span class="inline-math">$\nabla^2 f(\v x)$</span></a> <a href="/tripos-notes/Lectures/IB/Easter/Optimisation-Op/Notes/Notation-definite-matrix.html"><span class="inline-math">$\succeq 0$</span></a> for all <span class="inline-math">$\v x\in\R^n$</span>.
