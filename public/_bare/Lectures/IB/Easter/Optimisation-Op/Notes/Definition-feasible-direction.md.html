<p>
    In a <a href="/tripos-notes/Lectures/IB/Easter/Optimisation-Op/Notes/Definition-linear-program.html">linear program</a>, call the feasible set <span class="inline-math">$P$</span>.
</p>
<p>
    At some point <span class="inline-math">$\v x\in P$</span>, a vector <span class="inline-math">$\v d\in\R^n$</span> is called a <em>feasible direction</em> if there exists some <span class="inline-math">$\theta&gt;0$</span> such that <span class="inline-math">$\v x+\theta \v d\in P$</span>.
</p>
