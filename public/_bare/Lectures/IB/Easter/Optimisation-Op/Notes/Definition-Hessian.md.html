<p>
    For a twice differentiable function <span class="inline-math">$f:\R^n \to \R$</span>,
    the <em>Hessian</em> <span class="inline-math">$\nabla^2 f(x)$</span> is defined to be an <span class="inline-math">$n\times n$</span> matrix with entrices
    <span class="display-math">$$ \begin{align*}
        \big[\nabla^2 f(x)\big]_{ij} = \frac{\partial^2 f(x)}{\partial x_i x_j}.
    \end{align*} $$</span>
</p>
