<p>
    For an <span class="inline-math">$m\times n$</span> matrix <span class="inline-math">$A$</span>, denote
</p>
<ul>
<li>
    <p>
        <span class="inline-math">$\v a_1^T, a_2^T, \ldots, \v a_m^T$</span> the rows of <span class="inline-math">$A$</span>;
    </p>
    
</li><li>
    <p>
        <span class="inline-math">$\v A_1, \v A_2, \ldots, \v A_n^T$</span> the columns of <span class="inline-math">$A$</span>.
    </p>
    
</li>
</ul>
