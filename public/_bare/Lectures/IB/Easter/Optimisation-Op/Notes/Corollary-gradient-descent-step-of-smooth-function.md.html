<p>
    If <span class="inline-math">$f$</span> is <a href="/tripos-notes/Lectures/IB/Easter/Optimisation-Op/Notes/Definition-smoothness-strongly-convexity.html"><span class="inline-math">$\beta$</span>-smooth</a>, then
    <span class="display-math">$$ \begin{align*}
        f\Big(\v x - \frac{1}{\beta}\nabla f(\v x)\Big) \leq f(\v x) - \frac{1}{2\beta}|\nabla f(\v x)|^2
    \end{align*} $$</span>
</p>
<p>
    Proof: plug in <span class="inline-math">$\v y = \v x - \frac{1}{\beta}\nabla f(\v x)$</span> to the <a href="/tripos-notes/Lectures/IB/Easter/Optimisation-Op/Notes/Theorem-bounds-on-smooth-and-strongly-convex-functions.html">previous theorem</a>.
</p>
