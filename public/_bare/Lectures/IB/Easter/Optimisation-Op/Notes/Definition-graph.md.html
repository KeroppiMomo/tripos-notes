<p>
    A <em>directed graph</em> is a tuple <span class="inline-math">$G=(V,E)$</span>
    where <span class="inline-math">$V$</span> is the set of <em>vertices</em> and
    <span class="inline-math">$E\subseteq V\times V$</span> is a set of ordered <em>edges</em>.
</p>
<p>
    <span class="inline-math">$G$</span> is called an <em>undirected graph</em> if <span class="inline-math">$E$</span> is symmetric, i.e. for all <span class="inline-math">$(v,v&#x27;)\in E$</span>, we have <span class="inline-math">$(v&#x27;,v)\in E$</span> as well.
</p>
