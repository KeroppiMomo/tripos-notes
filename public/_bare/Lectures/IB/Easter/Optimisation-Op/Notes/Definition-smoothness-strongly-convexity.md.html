<p>
    Let <span class="inline-math">$f: \R^n \to \R$</span> be twice differentiable and <span class="inline-math">$\alpha,\beta&gt;0$</span>.
</p>
<ul>
<li>
    <p>
        <span class="inline-math">$f$</span> is said to be <em><span class="inline-math">$\alpha$</span>-strongly convex</em> if <span class="inline-math">$\nabla^2 f(x)$</span> <a href="/tripos-notes/Lectures/IB/Easter/Optimisation-Op/Notes/Notation-definite-matrix.html"><span class="inline-math">$\succeq$</span></a> <span class="inline-math">$\alpha I$</span> for all <span class="inline-math">$x\in\R^n$</span>.
    </p>
    
</li><li>
    <p>
        <span class="inline-math">$f$</span> is said to be <em><span class="inline-math">$\beta$</span>-smooth</em> if <span class="inline-math">$\nabla^2 f(x)$</span> <a href="/tripos-notes/Lectures/IB/Easter/Optimisation-Op/Notes/Notation-definite-matrix.html"><span class="inline-math">$\preceq$</span></a> <span class="inline-math">$\beta I$</span> for all <span class="inline-math">$x\in\R^n$</span>.
    </p>
    
</li>
</ul>
