<p>
    An outcome <span class="inline-math">$(i^\ast, j^\ast)$</span> of a <a href="/tripos-notes/Lectures/IB/Easter/Optimisation-Op/Notes/Two-person-zero-sum-games.html">two-person zero sum game</a> is called a <em>saddle point</em> if
    <span class="display-math">$$ \begin{align*}
        \max_i \min_j a_{ij} = \min_j \max_i a_{ij}
    \end{align*} $$</span>
    and the extrema are attained at <span class="inline-math">$(i^\ast, j^\ast)$</span>.
</p>
