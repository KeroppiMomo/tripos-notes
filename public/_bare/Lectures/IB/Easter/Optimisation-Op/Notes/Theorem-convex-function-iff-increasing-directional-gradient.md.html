<p>
    A differentiable function <span class="inline-math">$f: \R^n \to \R$</span> is <a href="/tripos-notes/Lectures/IB/Easter/Optimisation-Op/Notes/Definition-convex-function.html">convex</a> iff for all <span class="inline-math">$\v x,\v y\in\R^n$</span>,
    <span class="display-math">$$ \begin{align*}
        (\v y-\v x) \cdot (\nabla f(\v y) - \nabla f(\v x)) \geq 0.
    \end{align*} $$</span>
