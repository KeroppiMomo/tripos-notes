<p>
    Let <span class="inline-math">$f$</span> be <a href="/tripos-notes/Lectures/IB/Easter/Optimisation-Op/Notes/Definition-smoothness-strongly-convexity.html"><span class="inline-math">$\alpha$</span>-strongly convex</a>. Let <span class="inline-math">$p^\ast = \inf_\v x f(\v x)$</span> be the optimal value.
</p>
<p>
    For any <span class="inline-math">$\v x\in\R^n$</span>,
    <span class="display-math">$$ \begin{align*}
        p^\ast \geq f(\v x) - \frac{1}{2\alpha} |\nabla f(\v x)|^2.
    \end{align*} $$</span>
</p>
