<p>
    A <a href="/tripos-notes/Lectures/IB/Easter/Optimisation-Op/Notes/Definition-linear-program.html">linear program</a> that is bounded and feasible satisfies <a href="/tripos-notes/Lectures/IB/Easter/Optimisation-Op/Notes/Definition-strong-duality.html">strong duality</a>.
</p>
<p>
    Proof: linear functions are <a href="/tripos-notes/Lectures/IB/Easter/Optimisation-Op/Notes/Definition-convex-function.html">convex</a>, and <a href="/tripos-notes/Lectures/IB/Easter/Optimisation-Op/Notes/Theorem-strong-duality-holds-for-convex-problems.html">convex optimisation problems satsify strong duality</a>.
</p>
