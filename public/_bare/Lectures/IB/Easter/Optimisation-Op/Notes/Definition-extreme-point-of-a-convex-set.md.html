<p>
    Let <span class="inline-math">$C$</span> be a <a href="/tripos-notes/Lectures/IB/Easter/Optimisation-Op/Notes/Definition-convex-set.html">convex set</a>.
</p>
<p>
    A point <span class="inline-math">$\v x\in C$</span> is said to be an <em>extreme point</em> of <span class="inline-math">$C$</span>
    if it cannot be written as a convex combination of two distinct point in <span class="inline-math">$C$</span>,
    i.e. for <span class="inline-math">$\v y,\v z\in C$</span> and <span class="inline-math">$t\in(0,1)$</span>,
    <span class="display-math">$$ \begin{align*}
        \v x = t\v y + (1-t)\v z\implies \v y=\v z=\v x.
    \end{align*} $$</span>
</p>
