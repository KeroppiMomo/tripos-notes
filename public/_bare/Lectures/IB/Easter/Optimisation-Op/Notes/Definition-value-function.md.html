<p>
    Define the <em>value function</em> <span class="inline-math">$\phi: \R^m \to \R$</span> as
    <span class="display-math">$$ \begin{align*}
        \phi(\v c) = \min_{\v x\in \mathcal{X}(\v c)} f(\v x)
    \end{align*} $$</span>
    where <span class="inline-math">$\mathcal{X}(\v c) = \sb{\v x\in\mathcal{X}}{h(\v x) = \v c}$</span>.
