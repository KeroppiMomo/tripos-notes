<p>
    A set <span class="inline-math">$S\subseteq \R^n$</span> is said to be <em>convex</em> if for every <span class="inline-math">$\v x,\v y\in S$</span> and <span class="inline-math">$\lambda\in[0,1]$</span>,
    <span class="display-math">$$ \begin{align*}
        \lambda \v x + (1-\lambda) \v y \in S.
    \end{align*} $$</span>
</p>
<p>
    This means <span class="inline-math">$S$</span> contains all points on the line segment joined by two points in <span class="inline-math">$S$</span>.
</p>
