<p>
    For some <span class="inline-math">$n\times n$</span> real matrix <span class="inline-math">$A$</span>, denote <span class="inline-math">$\|A\|$</span> as the smallest <span class="inline-math">$a\geq 0$</span> such that <span class="inline-math">$|A\v z| \leq a|\v z|$</span> for all <span class="inline-math">$\v z\in\R^n$</span>.
</p>
