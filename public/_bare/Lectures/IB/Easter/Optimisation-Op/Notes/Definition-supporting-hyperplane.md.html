<p>
    A function <span class="inline-math">$\phi: \R^m \to \R$</span> is said to <em>have a supporting hyperplane at</em> <span class="inline-math">$\v b\in\R^m$</span>
    if there exists some <span class="inline-math">$\v \lambda\in\R^m$</span> such that for all <span class="inline-math">$\v c\in\R^m$</span>,
    <span class="display-math">$$ \begin{align*}
        \phi(\v c) \geq \phi(\v b) + \lambda^T(\v c - \v b).
    \end{align*} $$</span>
</p>
