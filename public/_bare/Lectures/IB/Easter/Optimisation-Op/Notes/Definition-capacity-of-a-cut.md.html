<p>
    The capacity of a <a href="/tripos-notes/Lectures/IB/Easter/Optimisation-Op/Notes/Definition-cut-of-a-graph.html">cut</a> <span class="inline-math">$(S,V\setminus S)$</span> of a graph <span class="inline-math">$G=(V,E)$</span> is
    <span class="display-math">$$ \begin{align*}
        c(S) = \sum_{(i,j)\in E: \ i\in S, \ j\in V\setminus S} c_{ij}
    \end{align*} $$</span>
    where <span class="inline-math">$c_{ij}$</span> is the <a href="/tripos-notes/Lectures/IB/Easter/Optimisation-Op/Notes/Maximum-flow-problem.html">capacity</a> of edge <span class="inline-math">$(i,j)$</span>.
</p>
