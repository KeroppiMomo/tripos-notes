<p>
    For every fixed <span class="inline-math">$\v x$</span>, <span class="inline-math">$L(\v x,\v \lambda)$</span> is a linear function in terms of <span class="inline-math">$\v \lambda$</span>.
</p>
<p>
    Then <span class="inline-math">$g$</span> is an infimum over (possibly infinitely-many) linear functions of <span class="inline-math">$\v \lambda$</span>, so <span class="inline-math">$g$</span> is concave.
</p>
