<p>
    A point <span class="inline-math">$\v x\in\R^n$</span> is called a <em>basic solution</em>
    if <span class="inline-math">$A\v x = \v b$</span>
    and <span class="inline-math">$\v x$</span> has at most <span class="inline-math">$m$</span> non-zero entries.
</p>
<p>
    <span class="inline-math">$\v x$</span> is called a <em>basic feasible solution</em> if <span class="inline-math">$\v x$</span> is a basic solution and <span class="inline-math">$\v x\geq 0$</span>.
</p>
