<p>
    An <span class="inline-math">$n\times n$</span> matrix <span class="inline-math">$A$</span> is said to be <em>positive semidefinite</em>, denoted as <span class="inline-math">$A\succeq 0$</span>,
    if <span class="inline-math">$\v x^T A\v x \geq 0$</span> for all <span class="inline-math">$x\in\R^n$</span>.
</p>
<p>
    We write <span class="inline-math">$A\succeq B$</span> to mean <span class="inline-math">$A-B\succeq 0$</span>, and <span class="inline-math">$A\preceq B$</span> to mean <span class="inline-math">$B-A\succeq 0$</span>.
</p>
