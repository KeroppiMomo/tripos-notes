<li>
    <p>
        For <span class="inline-math">$t=0$</span>, start from an initial point <span class="inline-math">$x_0$</span>.
    </p>
    
</li><li>
    <p>
        Repeat until some criterion is satisfied: at some <span class="inline-math">$t$</span>,
    </p>
    <ol start="1">
    <li>
        <p>
            Choose a descent direction <span class="inline-math">$\v v_t$</span> such that <span class="inline-math">$\nabla f(x_t)^T \v v_t &lt; 0$</span>.
        </p>
        
    </li><li>
        <p>
            Choose a step size <span class="inline-math">$\eta_t$</span>.
        </p>
        
    </li><li>
        <p>
            Update <span class="inline-math">$x_{t+1} = x_t + \epsilon_t v_t$</span>.
        </p>
        
    </li>
    </ol>
    
</li>
</ol>
