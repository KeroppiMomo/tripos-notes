<p>
    A <a href="/tripos-notes/Lectures/IB/Michaelmas/Markov-Chain-MC/Notes/Definition-Markov-chain.html">Markov chain</a> <span class="inline-math">$\ouline{X} = (X_n)_{n\geq 0}$</span> with state space <span class="inline-math">$I$</span> is <em>time-homogenous</em> if
    <span class="display-math">$$ \begin{align*}
        \prob(X_{n+1} = y | X_n = x) = p_{xy}
    \end{align*} $$</span>
    for some <span class="inline-math">$P = (p_{xy})_{x,y\in I}$</span> called the <em>transition matrix</em>.
</p>
