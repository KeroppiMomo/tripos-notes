<p>
    Let <span class="inline-math">$C$</span> be a <a href="/tripos-notes/Lectures/IB/Michaelmas/Markov-Chain-MC/Notes/Definition-communicating-classes-closed-class-irreducible-chain-absorbing-state.html">communicating class</a> of a Markov chain.
</p>
<ul>
<li>
    <p>
        If <span class="inline-math">$C$</span> is <a href="/tripos-notes/Lectures/IB/Michaelmas/Markov-Chain-MC/Notes/Definition-transience-and-recurrence.html">recurrent</a>, then <span class="inline-math">$C$</span> is <a href="/tripos-notes/Lectures/IB/Michaelmas/Markov-Chain-MC/Notes/Definition-communicating-classes-closed-class-irreducible-chain-absorbing-state.html">closed</a>.
    </p>
    
</li><li>
    <p>
        If <span class="inline-math">$C$</span> is closed and finite, then <span class="inline-math">$C$</span> is recurrent.
    </p>
    
</li>
</ul>
