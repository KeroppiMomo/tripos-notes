<p>
    Consider a Markov chain <span class="inline-math">$\ouline{X} = (X_n)_{n\geq 0}$</span> on <span class="inline-math">$I$</span>, and let <span class="inline-math">$i\in I$</span> be an <a href="/tripos-notes/Lectures/IB/Michaelmas/Markov-Chain-MC/Notes/Definition-transience-and-recurrence.html">recurrent</a> state.
    We say <span class="inline-math">$i$</span> is
</p>
<ul>
<li>
    <p>
        <em>positive recurrent</em> if <span class="inline-math">$\expect($</span><a href="/tripos-notes/Lectures/IB/Michaelmas/Markov-Chain-MC/Notes/Definition-return-times.html"><span class="inline-math">$T_i$</span></a><span class="inline-math">$|X_0 = i) &lt; \infty$</span>; and
    </p>
    
</li><li>
    <p>
        <em>null recurrent</em> if <span class="inline-math">$\expect(T_i|X_0 = i) = \infty$</span>.
    </p>
    
</li>
</ul>
<p>
    <p>
</p>
<ul>
<li>
    <p>
        <a href="/tripos-notes/Lectures/IB/Michaelmas/Markov-Chain-MC/Notes/Theorem-state-is-either-recurrent-or-transient.html">We have seen that</a> <span class="inline-math">$\prob(T_i &lt; \infty|X_0 = i) = 1$</span>.
    </p>
    
</li>
</ul>
