<p>
    Consider a Markov chain on <span class="inline-math">$I$</span> with transition matrix <span class="inline-math">$P$</span>, and let <span class="inline-math">$k\in I$</span>.
</p>
<p>
    If <span class="inline-math">$P$</span> is <a href="/tripos-notes/Lectures/IB/Michaelmas/Markov-Chain-MC/Notes/Definition-communicating-classes-closed-class-irreducible-chain-absorbing-state.html">irreducible</a> and <a href="/tripos-notes/Lectures/IB/Michaelmas/Markov-Chain-MC/Notes/Definition-transience-and-recurrence.html">recurrent</a>,
    then
</p>
<ol start="1">
<li>
    <p>
        <a href="/tripos-notes/Lectures/IB/Michaelmas/Markov-Chain-MC/Notes/Definition-expected-number-of-visits-during-an-excursion.html"><span class="inline-math">$\nu_k$</span></a> is an <a href="/tripos-notes/Lectures/IB/Michaelmas/Markov-Chain-MC/Notes/Definition-invariant-measure.html">invariant measure</a> for <span class="inline-math">$P$</span>;
    </p>
    
</li><li>
    <p>
        <span class="inline-math">$\nu_k(k) = 1$</span>; and
    </p>
    
</li><li>
    <p>
        <span class="inline-math">$0 &lt; v_k(i) &lt; \infty$</span> for all <span class="inline-math">$i\in I$</span>.
    </p>
    
</li>
</ol>
