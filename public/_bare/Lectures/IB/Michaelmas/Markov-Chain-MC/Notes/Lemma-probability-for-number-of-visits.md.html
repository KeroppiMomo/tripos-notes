<p>
    Define, for <span class="inline-math">$i\in I$</span>, the total number of visits
    <span class="display-math">$$ \begin{align*}
        V_i = \sum_{n=0}^{\infty} \mathbb{1}(X_n = i).
    \end{align*} $$</span>
    For all <span class="inline-math">$r\geq 0$</span>,
    <span class="display-math">$$ \begin{align*}
        \prob(V_i &gt; r | X_0 = i) = \big(\prob(T_i &lt; \infty| X_0 = i)\big)^r.
    \end{align*} $$</span>
</p>
