<p>
    The Markov chain on <span class="inline-math">$\Z$</span> with transition probabilities, for some <span class="inline-math">$p\in (0,1)$</span> and <span class="inline-math">$p\neq 1/2$</span>,
    <span class="display-math">$$ \begin{align*}
        P(x,x+1) = p, \qquad P(x,x-1) = 1-p
    \end{align*} $$</span>
    is <a href="/tripos-notes/Lectures/IB/Michaelmas/Markov-Chain-MC/Notes/Definition-transience-and-recurrence.html">transient</a>.
</p>
