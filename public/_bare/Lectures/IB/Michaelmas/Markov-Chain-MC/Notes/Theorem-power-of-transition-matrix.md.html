<p>
    Suppose <span class="inline-math">$\ouline{X} \sim$</span> <a href="/tripos-notes/Lectures/IB/Michaelmas/Markov-Chain-MC/Notes/Definition-Markov-lambda-P.html"><span class="inline-math">$\mathrm{Markov}(\lambda, P)$</span></a>.
    Then
</p>
<ol start="1">
<li>
    <p>
        <span class="inline-math">$\prob(X_n = x) = (\lambda P^n)_x$</span> for all <span class="inline-math">$x\in I$</span> (here <span class="inline-math">$\lambda$</span> is a row vector);
    </p>
    
</li><li>
    <p>
        <span class="inline-math">$\prob(X_{m+n} = y | X_{m} = x) = (P^n)_{xy} := p_{xy}(n)$</span> for all <span class="inline-math">$m\geq 0$</span> and <span class="inline-math">$x,y\in I$</span>.
    </p>
    
</li>
</ol>
<p>
    <a href="/tripos-notes/Lectures/IB/Michaelmas/Markov-Chain-MC/Notes/Proof-power-of-transition-matrix.html">Proof</a>
