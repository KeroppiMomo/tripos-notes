<p>
    Consider a Markov chain <span class="inline-math">$\ouline{X}$</span> on <span class="inline-math">$I$</span> and let <span class="inline-math">$i\in I$</span> be a state.
</p>
<p>
    <span class="inline-math">$i$</span> is <a href="/tripos-notes/Lectures/IB/Michaelmas/Markov-Chain-MC/Notes/Definition-period-of-a-state-aperiodic.html">aperiodic</a> iff <span class="inline-math">$p_{ii}(n)&gt;0$</span> for all sufficiently large <span class="inline-math">$n$</span>.
</p>
<p>
    Proof. Use the property that <span class="inline-math">$p_{ii}(n) &gt; 0$</span> and <span class="inline-math">$p_{ii}(m) &gt; 0$</span> implies <span class="inline-math">$p_{ii}(n+m)&gt;0$</span>, and apply this <a href="/tripos-notes/Lectures/IB/Michaelmas/Markov-Chain-MC/Notes/Lemma-gcd-of-an-additively-closed-subset.html">fact</a> from number theory.
</p>
