<p>
    Consider a Markov chain on <span class="inline-math">$I$</span>, and let <span class="inline-math">$x, y\in I$</span>.
</p>
<p>
    If <span class="inline-math">$x$</span> <a href="/tripos-notes/Lectures/IB/Michaelmas/Markov-Chain-MC/Notes/Definition-leads-to-communicate.html"><span class="inline-math">$\leftrightarrow$</span></a> <span class="inline-math">$y$</span>,
    then they are either both <a href="/tripos-notes/Lectures/IB/Michaelmas/Markov-Chain-MC/Notes/Definition-transience-and-recurrence.html">recurrent</a> or both <a href="/tripos-notes/Lectures/IB/Michaelmas/Markov-Chain-MC/Notes/Definition-transience-and-recurrence.html">transient</a>.
</p>
<p>
    <a href="/tripos-notes/Lectures/IB/Michaelmas/Markov-Chain-MC/Notes/Proof-both-recurrent-or-transient-if-communicates.html">Proof</a>
</p>
<p>
    As a result, a <a href="/tripos-notes/Lectures/IB/Michaelmas/Markov-Chain-MC/Notes/Definition-communicating-classes-closed-class-irreducible-chain-absorbing-state.html">communicating class</a> consists of either all recurrent states or all transient states.
</p>
