<p>
    Suppose <span class="inline-math">$\ouline{X} = (X_n)_{n\geq 0}$</span> is a <a href="/tripos-notes/Lectures/IB/Michaelmas/Markov-Chain-MC/Notes/Definition-Markov-chain.html">Markov chain</a> on <span class="inline-math">$I$</span>.
</p>
<p>
    The <em>return times</em> <span class="inline-math">$T_i^{(k)}$</span> for <span class="inline-math">$i\in I$</span> are defined inductively as
    <span class="display-math">$$ \begin{align*}
        T_i^{(0)} = 0, \qquad T_i^{(k+1)} = \inf \sb{n&gt;T_i^{(k)}}{X_n = i}.
    \end{align*} $$</span>
    and write <span class="inline-math">$T_i = T_i^{(1)}$</span> as the <em>first return time</em>.
</p>
