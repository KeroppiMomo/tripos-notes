<p>
    A <em>simple symmetric random walk</em> on <span class="inline-math">$\Z^d$</span> is the <a href="/tripos-notes/Lectures/IB/Michaelmas/Markov-Chain-MC/Notes/Definition-Markov-chain.html">Markov chain</a>
    with transition probabilities
    <span class="display-math">$$ \begin{align*}
        P(x, x + e_i) = P(x, x-e_i) = \frac{1}{2d}
    \end{align*} $$</span>
    for all <span class="inline-math">$i=1,2,\ldots,d$</span> where <span class="inline-math">$\set{e_1, \ldots, e_d}$</span> is the standard basis of <span class="inline-math">$\R^d$</span>.
</p>
