<p>
    Let <span class="inline-math">$\ouline{X} = (X_n)_{n\geq 0}$</span> be a <a href="/tripos-notes/Lectures/IA/Lent/Probability-Pr/Notes/Definition-random-process-random-walk.html">random process</a>,
    and let <span class="inline-math">$T$</span> be a random variable taking values in <span class="inline-math">$\set{0,1,2,\ldots} \cup \set{\infty}$</span>.
</p>
<p>
    We say <span class="inline-math">$T$</span> is a <em>stopping time</em> with respect to <span class="inline-math">$\ouline{X}$</span> if
    for each <span class="inline-math">$n$</span>, the event <span class="inline-math">$\set{T=n}$</span> only depends on <span class="inline-math">$X_0, X_1, \ldots, X_n$</span>.
</p>
