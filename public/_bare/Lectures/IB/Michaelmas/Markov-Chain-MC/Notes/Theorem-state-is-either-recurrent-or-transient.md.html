<p>
    Consider a Markov chain  on <span class="inline-math">$I$</span> with transition matrix <span class="inline-math">$P$</span>, and let <span class="inline-math">$i\in I$</span>.
</p>
<ol start="1">
<li>
    <p>
        If <span class="inline-math">$\prob(T_i &lt; \infty | X_0 = i) = 1$</span>, then <span class="inline-math">$i$</span> is <a href="/tripos-notes/Lectures/IB/Michaelmas/Markov-Chain-MC/Notes/Definition-transience-and-recurrence.html">recurrent</a> and <span class="inline-math">$\sum_{n=0}^{\infty}$</span> <a href="/tripos-notes/Lectures/IB/Michaelmas/Markov-Chain-MC/Notes/Theorem-power-of-transition-matrix.html"><span class="inline-math">$p_{ii}(n)$</span></a> <span class="inline-math">$=\infty$</span>.
    </p>
    
</li><li>
    <p>
        Otherwise, <span class="inline-math">$i$</span> is <a href="/tripos-notes/Lectures/IB/Michaelmas/Markov-Chain-MC/Notes/Definition-transience-and-recurrence.html">transient</a> and <span class="inline-math">$\sum_{n=0}^{\infty}$</span> <a href="/tripos-notes/Lectures/IB/Michaelmas/Markov-Chain-MC/Notes/Theorem-power-of-transition-matrix.html"><span class="inline-math">$p_{ii}(n)$</span></a> <span class="inline-math">$&lt;\infty$</span>.
    </p>
    
</li>
</ol>
