<p>
    Let <span class="inline-math">$D\subseteq \N$</span> be a subset satisfying the property that if <span class="inline-math">$x\in D$</span> and <span class="inline-math">$y\in D$</span>, then <span class="inline-math">$x+y\in D$</span>.
</p>
<p>
    Then <span class="inline-math">$\mathrm{gcd}(D) = 1$</span> iff <span class="inline-math">$n\in D$</span> for all sufficiently large <span class="inline-math">$n$</span>.
</p>
