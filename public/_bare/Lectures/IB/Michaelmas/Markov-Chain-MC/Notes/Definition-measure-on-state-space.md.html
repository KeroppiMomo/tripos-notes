<p>
    A <em>measure</em> on a state space <span class="inline-math">$I$</span> is a vector <span class="inline-math">$\lambda = (\lambda_i: i\in I)$</span> where all <span class="inline-math">$\lambda_i\geq 0$</span>.
</p>
<ul>
<li>
    <p>
        A distribution <span class="inline-math">$\pi$</span> is a measure with the additional condition that <span class="inline-math">$\sum_{i\in I} \pi_i = 1$</span>.
    </p>
    
</li>
</ul>
