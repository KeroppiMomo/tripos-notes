<p>
    Let <span class="inline-math">$\ouline{X} = (X_n)_{n=1}^\infty$</span> be a Markov chain with a transition matrix <span class="inline-math">$P$</span>, and <span class="inline-math">$\pi$</span> is an <a href="/tripos-notes/Lectures/IB/Michaelmas/Markov-Chain-MC/Notes/Definition-invariant-measure.html">invariant distribution</a> for <span class="inline-math">$P$</span>.
</p>
<p>
    If <span class="inline-math">$X_0\sim \pi$</span>, then <span class="inline-math">$X_n \sim \pi$</span> for all <span class="inline-math">$n$</span>.
</p>
