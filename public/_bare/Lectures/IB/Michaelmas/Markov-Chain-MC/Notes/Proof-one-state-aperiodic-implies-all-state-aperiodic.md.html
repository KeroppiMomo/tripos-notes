<p>
    Let <span class="inline-math">$j\in I$</span>. By irreducibility, there exists <span class="inline-math">$n,m$</span> such that <span class="inline-math">$p_{ji}(n) &gt; 0$</span> and <span class="inline-math">$p_{ij}(m) &gt; 0$</span>.
</p>
<p>
    Then using the <a href="/tripos-notes/Lectures/IB/Michaelmas/Markov-Chain-MC/Notes/Lemma-aperiodic-iff-returning-probability-all-positive-eventually.html">equivalence condition for aperiodicity</a>, for sufficiently large <span class="inline-math">$l$</span>,
    <span class="display-math">$$ \begin{align*}
        p_{jj}(n+l+m) \geq p_{ji}(n) \cdot p_{ii}(l) \cdot p_{ij}(m) &gt; 0.
    \end{align*} $$</span>
</p>
