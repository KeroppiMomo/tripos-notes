<p>
    If <span class="inline-math">$\chi(x)$</span> is a solution to the Schrodinger's equation with eigenvalue <span class="inline-math">$E$</span>,
    then so is <span class="inline-math">$\chi(-x)$</span>.
    By non-degeneracy,<span class="display-math">$$ \begin{align*}
        \chi(-x) = \alpha\chi(x)
    \end{align*} $$</span>
    for some <span class="inline-math">$\alpha$</span>.
    Then
    <span class="display-math">$$ \begin{align*}
        \chi(x) = \chi(-(-x)) = \alpha^2 \chi(x) \implies \alpha=\pm 1.
    \end{align*} $$</span>
</p>
