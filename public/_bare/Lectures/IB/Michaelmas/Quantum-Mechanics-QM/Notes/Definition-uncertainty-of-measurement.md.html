<p>
    The <em>uncertainty</em> <span class="inline-math">$\Delta_\psi O$</span> in the measurement of an observable <span class="inline-math">$O$</span> in the state <span class="inline-math">$\psi$</span> is defined as
    <span class="display-math">$$ \begin{align*}
        \Delta_\psi O = \sqrt{\big\langle (O - \langle O\rangle_\psi)^2\big\rangle_{\psi}} = \sqrt{\langle O^2\rangle_\psi - \langle O\rangle_\psi^2}.
    \end{align*} $$</span>
</p>
