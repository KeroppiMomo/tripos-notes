<p>
    Following the notation <a href="/tripos-notes/Lectures/IB/Michaelmas/Quantum-Mechanics-QM/Notes/Postulates-of-quantum-mechanics.html">here</a>,
    the <em>expectation value</em> of an observable <span class="inline-math">$O$</span> in a state <span class="inline-math">$\psi$</span> is
    <span class="display-math">$$ \begin{align*}
        \langle O\rangle_\psi := \sum_{n=1}^{\infty} \lambda_n|a_n|^2 = \int_{\R^3} \psi^\ast(\v x) \,\hat O \psi(\v x) \d V.
    \end{align*} $$</span>
</p>
