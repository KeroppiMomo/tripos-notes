<p>
    <span class="display-math">$$ \begin{align*}
        \int_{\R^3} u_n^\ast \psi \d V ={}&amp; \int_{\R^3} u_n^\ast \left(\sum_{m} a_m u_m\right) \d V \\
        ={}&amp; \sum_{n} a_n \int_{\R^3} u_n^\ast u_m \d V \\
        ={}&amp; \sum_{n} a_n \delta_{nm} \\
        ={}&amp; a_n.
    \end{align*} $$</span>
