<p>
    Let <span class="inline-math">$\hat O_1$</span> and <span class="inline-math">$\hat O_2$</span> be <a href="/tripos-notes/Lectures/IB/Michaelmas/Quantum-Mechanics-QM/Notes/Definition-Hermitian-operator.html">Hermitian operators</a>.
</p>
<p>
    If <span class="inline-math">$\hat O_1$</span> and <span class="inline-math">$\hat O_2$</span> have non-degenerate spectra,
    then they commute iff any eigenfunction of <span class="inline-math">$\hat O_1$</span> is also an eigenfunction of <span class="inline-math">$\hat O_2$</span>.
</p>
