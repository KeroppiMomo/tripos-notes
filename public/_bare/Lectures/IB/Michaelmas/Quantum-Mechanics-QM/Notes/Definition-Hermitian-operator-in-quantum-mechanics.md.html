<p>
    A linear operator <span class="inline-math">$\hat O$</span> is said to be <em>Hermitian</em> (or <em>self-adjoint</em>)
    if for any normalisable functions <span class="inline-math">$f, g: \R^3\to\C$</span>,
    <span class="display-math">$$ \begin{align*}
        \int_{\R^3} f^\ast(\v x) \hat Og(\v x) \d V = \int_{\R^3} (\hat O f(\v x))^\ast g(\v x) \d V.
    \end{align*} $$</span>
</p>
