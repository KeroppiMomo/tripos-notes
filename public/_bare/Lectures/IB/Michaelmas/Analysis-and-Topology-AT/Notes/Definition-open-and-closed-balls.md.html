<p>
    Let <span class="inline-math">$(X, d)$</span> be a <a href="/tripos-notes/Lectures/IB/Michaelmas/Analysis-and-Topology-AT/Notes/Definition-metric-space.html">metric space</a>. For <span class="inline-math">$r&gt;0$</span>, say
</p>
<ul>
<li>
    <p>
        the <em>open ball</em> <span class="inline-math">$B_r(x) = \sb{y\in X}{d(x,y)&lt;r}$</span>;
    </p>
    
</li><li>
    <p>
        the <em>closed ball</em> <span class="inline-math">$B_r[x] = \sb{y\in X}{d(x,y)\leq r}$</span>
    </p>
    
</li>
</ul>
<p>
    of radius <span class="inline-math">$r$</span> centred at <span class="inline-math">$x$</span>.
</p>
