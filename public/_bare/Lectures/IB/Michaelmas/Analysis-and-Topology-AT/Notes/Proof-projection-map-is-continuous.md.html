<p>
    Given some open set <span class="inline-math">$U$</span> in <span class="inline-math">$X$</span>,
    <span class="display-math">$$ \begin{align*}
        \pi_X\inv(U) = U\times Y,
    \end{align*} $$</span>
    which is open in the product topology. <a href="/tripos-notes/Lectures/IB/Michaelmas/Analysis-and-Topology-AT/Notes/Lemma-continuous-iff-taking-preimage-preserves-open-or-closed-sets.html">Hence</a> <span class="inline-math">$\pi_X$</span> is open.
    Similar for <span class="inline-math">$\pi_Y$</span>.
</p>
