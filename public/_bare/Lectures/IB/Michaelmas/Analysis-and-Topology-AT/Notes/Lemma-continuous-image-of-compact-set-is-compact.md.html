<p>
    Let <span class="inline-math">$(X,\tau)$</span> and <span class="inline-math">$(Y,\rho)$</span> be topological spaces.
</p>
<p>
    If <span class="inline-math">$f: X\to Y$</span> is a <a href="/tripos-notes/Lectures/IB/Michaelmas/Analysis-and-Topology-AT/Notes/Definition-continuity-on-topological-space.html">continuous</a> function
    and <span class="inline-math">$(X,\tau)$</span> is <a href="/tripos-notes/Lectures/IB/Michaelmas/Analysis-and-Topology-AT/Notes/Definition-compact.html">compact</a>,
    then <span class="inline-math">$f(X) \subseteq Y$</span> is also compact.
</p>
