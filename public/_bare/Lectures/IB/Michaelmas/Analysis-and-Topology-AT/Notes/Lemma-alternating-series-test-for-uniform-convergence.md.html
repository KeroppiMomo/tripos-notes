<p>
    Let <span class="inline-math">$f_n: U\to\R$</span> be (non-negative) functions that are
</p>
<ul>
<li>
    <p>
        decreasing: <span class="inline-math">$f_{n+1} \leq f_n$</span> on <span class="inline-math">$U$</span>; and
    </p>
    
</li><li>
    <p>
        <span class="inline-math">$f_n\tto 0$</span> (i.e. <span class="inline-math">$\sup_{U} \|f_n\| \to 0$</span>) as <span class="inline-math">$n\to \infty$</span>,
    </p>
    
</li>
</ul>
<p>
    then <span class="inline-math">$\sum_{n=1}^{\infty} (-1)^n f_n$</span> converges uniformly.
</p>
