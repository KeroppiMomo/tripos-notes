<p>
    Suppose a <a href="/tripos-notes/Lectures/IB/Michaelmas/Analysis-and-Topology-AT/Notes/Definition-metric-space.html">metric space</a> <span class="inline-math">$(X,d)$</span> generates the topology <span class="inline-math">$\tau$</span>.
    Let <span class="inline-math">$x,y\in X$</span> where <span class="inline-math">$x\neq y$</span>.
</p>
<p>
    Let <span class="inline-math">$r = d(x,y)&gt;0$</span>. Then by taking
    <span class="display-math">$$ \begin{align*}
        U = B_{r/2}(x)\in \tau, \qquad V = B_{r/2}(y) \in \tau,
    \end{align*} $$</span>
    we obtain <span class="inline-math">$x\in U$</span>, <span class="inline-math">$y\in V$</span> and <span class="inline-math">$U\cap V = \emptyset$</span>.
</p>
