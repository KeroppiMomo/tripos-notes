<p>
    Let <span class="inline-math">$Y$</span> be a set and <span class="inline-math">$\set{f_n}_{n\geq 1}^\infty$</span> is a sequence of functions <span class="inline-math">$Y\to\R$</span>
</p>
<p>
    <span class="inline-math">$\set{f_n}$</span> is <a href="/tripos-notes/Lectures/IB/Michaelmas/Analysis-and-Topology-AT/Notes/Definition-uniform-convergence.html">uniformly convergent</a> iff <span class="inline-math">$\set{f_n}$</span> is <a href="/tripos-notes/Lectures/IB/Michaelmas/Analysis-and-Topology-AT/Notes/Definition-uniformly-Cauchy.html">uniformly Cauchy</a>.
</p>
<p>
    Consequently, the metric space <span class="inline-math">$L^\infty(Y) = (\set{\text{bounded functions } X\to \R},$</span> <a href="/tripos-notes/Lectures/IB/Michaelmas/Analysis-and-Topology-AT/Notes/Examples-of-metric-spaces.html"><span class="inline-math">$\text{sup metric}$</span></a><span class="inline-math">$)$</span>
    is <a href="/tripos-notes/Lectures/IB/Michaelmas/Analysis-and-Topology-AT/Notes/Definition-completeness.html">complete</a>.
</p>
