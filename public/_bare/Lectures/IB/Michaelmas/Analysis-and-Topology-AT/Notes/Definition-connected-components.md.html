<p>
    Let <span class="inline-math">$(X,τ)$</span> be a topological space.
</p>
<p>
    Define an equivalence relation on <span class="inline-math">$X$</span> by <span class="inline-math">$x\sim y$</span> if
    there exists <span class="inline-math">$Y\subseteq X$</span> which is <a href="/tripos-notes/Lectures/IB/Michaelmas/Analysis-and-Topology-AT/Notes/Definition-disconnected-connected-separation.html">connected</a>
    such that <span class="inline-math">$x,y\in Y$</span>.
    The equivalence classes are called <em>connected components</em>.
</p>
