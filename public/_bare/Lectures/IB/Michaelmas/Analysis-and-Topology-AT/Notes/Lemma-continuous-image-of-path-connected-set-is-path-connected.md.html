<p>
    Let <span class="inline-math">$(X,τ)$</span> and <span class="inline-math">$(Y,ρ)$</span> be topological spaces.
</p>
<p>
    If <span class="inline-math">$f: X\to Y$</span> is <a href="/tripos-notes/Lectures/IB/Michaelmas/Analysis-and-Topology-AT/Notes/Definition-continuity-on-topological-space.html">continuous</a> and <span class="inline-math">$X$</span> is <a href="/tripos-notes/Lectures/IB/Michaelmas/Analysis-and-Topology-AT/Notes/Definition-path-connected.html">path-connected</a>,
    then <span class="inline-math">$f(X) \subseteq Y$</span> is path-connected.
</p>
<p>
    <a href="/tripos-notes/Lectures/IB/Michaelmas/Analysis-and-Topology-AT/Notes/Proof-continuous-image-of-path-connected-set-is-path-connected.html">Proof</a>
</p>
<ul>
<li>
    <p>
        This shows that path-connectedness is a <a href="/tripos-notes/Lectures/IB/Michaelmas/Analysis-and-Topology-AT/Notes/Definition-topological-invariant.html">topological invariant</a>.
    </p>
    
</li>
</ul>
