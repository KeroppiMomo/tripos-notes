<p>
    Supposed <span class="inline-math">$\overline{Y}$</span> is disconnected
    and let <span class="inline-math">$U\cup V = \overline{Y}$</span> be a separation.
</p>
<p>
    <span class="inline-math">$Y$</span> is connected, <a href="/tripos-notes/Lectures/IB/Michaelmas/Analysis-and-Topology-AT/Notes/Lemma-connected-subset-of-a-disconnected-space.html">so</a> WLOG <span class="inline-math">$Y\subseteq U$</span>.
    But <a href="/tripos-notes/Lectures/IB/Michaelmas/Analysis-and-Topology-AT/Notes/Lemma-separation-in-subspace-topology.html">then</a> <span class="inline-math">$\emptyset = \overline{U} \cap V \supseteq \overline{Y} \cap V = V$</span>,
    which contradicts with <span class="inline-math">$V\neq \emptyset$</span>.
</p>
