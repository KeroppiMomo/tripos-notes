<p>
    Let <span class="inline-math">$(X,\tau)$</span> and <span class="inline-math">$(Y,\rho)$</span> be topological spaces.
</p>
<p>
    A function <span class="inline-math">$f: (X,\tau)\to(Y,\rho)$</span> is said to be a <em>homeomorphism</em> if
    <span class="inline-math">$f$</span> is bijective, and <span class="inline-math">$f$</span> and <span class="inline-math">$f\inv$</span> are <a href="/tripos-notes/Lectures/IB/Michaelmas/Analysis-and-Topology-AT/Notes/Definition-continuity-on-topological-space.html">continuous</a>.
</p>
<p>
    We say <span class="inline-math">$(X,\tau)$</span> and <span class="inline-math">$(Y,\rho)$</span> are <em>homeomorphic</em> if such a function exists.
</p>
