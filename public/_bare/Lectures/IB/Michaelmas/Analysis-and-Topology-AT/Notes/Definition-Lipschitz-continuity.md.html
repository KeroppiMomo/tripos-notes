<p>
    Let <span class="inline-math">$(X,d)$</span> and <span class="inline-math">$(Y,d&#x27;)$</span> be <a href="/tripos-notes/Lectures/IB/Michaelmas/Analysis-and-Topology-AT/Notes/Definition-metric-space.html">metric spaces</a>.
</p>
<p>
    We say <span class="inline-math">$f: (X,d)\to (Y,d&#x27;)$</span> is <em>Lipschitz continuous</em> if
    there exists <span class="inline-math">$L&gt;0$</span> such that for all <span class="inline-math">$x,y\in X$</span>,
    <span class="display-math">$$ \begin{align*}
        d&#x27;(f(x), f(y))\leq Ld(x,y)
    \end{align*} $$</span>
    and we say that <span class="inline-math">$f$</span> is <em><span class="inline-math">$L$</span>-Lipschitz.</em>
</p>
