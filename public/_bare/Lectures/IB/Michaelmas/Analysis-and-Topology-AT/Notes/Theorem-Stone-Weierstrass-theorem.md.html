<p>
    Let <span class="inline-math">$f: [a,b]\to\R$</span> be a function.
</p>
<p>
    If <span class="inline-math">$f$</span> is continuous, then
    there exists a sequence of polynomials <span class="inline-math">$(p_n)_{n=1}^\infty$</span>
    such that <span class="inline-math">$p_n$</span> <a href="/tripos-notes/Lectures/IB/Michaelmas/Analysis-and-Topology-AT/Notes/Definition-uniform-convergence.html"><span class="inline-math">$\tto$</span></a> <span class="inline-math">$f$</span>.
</p>
