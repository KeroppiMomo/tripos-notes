<p>
    Let <span class="inline-math">$(X,d)$</span> be a <a href="/tripos-notes/Lectures/IB/Michaelmas/Analysis-and-Topology-AT/Notes/Definition-metric-space.html">metric space</a> and <span class="inline-math">$Y\subseteq X$</span>.
</p>
<p>
    Define the canonical subspace metric <span class="inline-math">$\tilde d: Y\times Y$</span> given by <span class="inline-math">$\tilde d(y_1,y_2) = d(y_1,y_2)$</span> for all <span class="inline-math">$y_1,y_2\in Y$</span>.
    We call <span class="inline-math">$(Y, \tilde d)$</span> the <em>metric subspace</em> of <span class="inline-math">$(X,d)$</span>.
</p>
