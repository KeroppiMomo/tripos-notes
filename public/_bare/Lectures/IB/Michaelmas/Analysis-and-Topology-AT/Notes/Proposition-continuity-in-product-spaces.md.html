<p>
    A function <span class="inline-math">$f: Z\to X\times Y$</span> is <a href="/tripos-notes/Lectures/IB/Michaelmas/Analysis-and-Topology-AT/Notes/Definition-continuity-on-topological-space.html">continuous</a> iff both <a href="/tripos-notes/Lectures/IB/Michaelmas/Analysis-and-Topology-AT/Notes/Lemma-projection-map-is-continuous.html"><span class="inline-math">$\pi_X$</span></a><span class="inline-math">${}\circ f$</span> and <span class="inline-math">$\pi_Y \circ f$</span> are continuous.
