<p>
    If <span class="inline-math">$f$</span> is <span class="inline-math">$L_f$</span>-<a href="/tripos-notes/Lectures/IB/Michaelmas/Analysis-and-Topology-AT/Notes/Definition-Lipschitz-continuity.html">Lipschitz</a> and <span class="inline-math">$g$</span> is <span class="inline-math">$L_g$</span>-Lipschitz, then
    <span class="display-math">$$ \begin{align*}
        d&#x27;&#x27;(g(f(x)), g(f(x_0))) \leq L_g\, d&#x27;(f(x), f(x_0)) \leq L_g \, L_f \, d(x, x_0)
    \end{align*} $$</span>
    for all <span class="inline-math">$x,x_0\in X$</span>.
    Hence <span class="inline-math">$g\circ f$</span> is <span class="inline-math">$(L_f\cdot L_g)$</span>-Lipschitz.
</p>
