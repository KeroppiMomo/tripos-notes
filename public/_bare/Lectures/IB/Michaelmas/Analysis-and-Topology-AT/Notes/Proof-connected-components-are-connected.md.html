<p>
    Pick some <span class="inline-math">$x\in Y$</span>.
    By the definition of a connected component,
    <span class="display-math">$$ \begin{align*}
        Y = \bigcup \sb{Z\subseteq X}{\text{$Z$ is connected and $x\in Z$}}.
    \end{align*} $$</span>
    <span class="inline-math">$Y$</span> is a union of connected sets with a shared point and is <a href="/tripos-notes/Lectures/IB/Michaelmas/Analysis-and-Topology-AT/Notes/Lemma-union-of-connected-subspaces-sharing-a-point-is-connected.html">thus</a> connected.
</p>
