<p>
    Take <span class="inline-math">$x,y\in X$</span> distinct. For any <span class="inline-math">$U,V\in \tau$</span> any <span class="inline-math">$x\in U$</span> and <span class="inline-math">$y\in V$</span>,
    since <span class="inline-math">$X\setminus U$</span> and <span class="inline-math">$X\setminus V$</span> are finite,
    so is <span class="inline-math">$(X\setminus U) \cup (X\setminus V) = X\setminus (U\cap V)$</span>.
    Therefore <span class="inline-math">$U\cap V$</span> is infinite and therefore not <span class="inline-math">$\emptyset$</span>.
</p>
