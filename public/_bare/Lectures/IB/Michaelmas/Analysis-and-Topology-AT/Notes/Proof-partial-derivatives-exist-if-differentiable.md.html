<p>
    Take <span class="inline-math">$h=λe_i$</span>.
    Then from the definition of the <a href="/tripos-notes/Lectures/IB/Michaelmas/Analysis-and-Topology-AT/Notes/Definition-differentiation-in-Rn.html">derivative</a>,
    <span class="display-math">$$ \begin{align*}
        f(x_0 + λ e_i) = f(x_0) + λ \cdot Df(x_0)(e_i) + \tilde ε(λ)\, |λ|
    \end{align*} $$</span>
    where <span class="inline-math">$\tilde ε(λ) = ε(λ e_i) \to 0$</span> as <span class="inline-math">$λ\to 0$</span>.
    Thus <span class="inline-math">$\partial_if(x_0) = Df(x_0)(e_i)$</span>.
</p>
