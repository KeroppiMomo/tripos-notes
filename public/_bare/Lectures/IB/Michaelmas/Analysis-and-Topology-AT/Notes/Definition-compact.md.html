<p>
    A topological space <span class="inline-math">$(X,\tau)$</span> is said to be <em>compact</em>
    if every <a href="/tripos-notes/Lectures/IB/Michaelmas/Analysis-and-Topology-AT/Notes/Definition-open-cover.html">open cover</a> of <span class="inline-math">$(X,\tau)$</span> has a finite <a href="/tripos-notes/Lectures/IB/Michaelmas/Analysis-and-Topology-AT/Notes/Definition-subcover.html">subcover</a>.
</p>
