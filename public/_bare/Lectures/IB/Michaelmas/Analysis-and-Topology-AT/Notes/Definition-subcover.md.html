<p>
    Let <span class="inline-math">$\mathcal{U}$</span> be an <a href="/tripos-notes/Lectures/IB/Michaelmas/Analysis-and-Topology-AT/Notes/Definition-open-cover.html">open cover</a> of the topological space <span class="inline-math">$(X,\tau)$</span>.
</p>
<p>
    A subset <span class="inline-math">$\mathcal{V}\subseteq U$</span> is called a <em>subcover</em> if <span class="inline-math">$\mathcal{V}$</span> is an open cover itself.
</p>
