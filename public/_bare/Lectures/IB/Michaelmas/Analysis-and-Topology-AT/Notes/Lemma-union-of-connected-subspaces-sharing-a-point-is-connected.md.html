<p>
    Let <span class="inline-math">$(X,τ)$</span> be a topological space,
    and <span class="inline-math">$\set{A_α}$</span> be a collection of <a href="/tripos-notes/Lectures/IB/Michaelmas/Analysis-and-Topology-AT/Notes/Definition-disconnected-connected-separation.html">connected</a> subspaces of <span class="inline-math">$X$</span>.
</p>
<p>
    If <span class="inline-math">$\bigcap_{α} A_α\neq \emptyset$</span> (i.e. there exists a point in common),
    then <span class="inline-math">$\bigcup_{α} A_α$</span> is connected.
</p>
