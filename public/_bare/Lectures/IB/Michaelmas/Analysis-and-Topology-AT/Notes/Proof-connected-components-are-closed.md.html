<p>
    <a href="/tripos-notes/Lectures/IB/Michaelmas/Analysis-and-Topology-AT/Notes/Proof-connected-components-are-connected.html"><span class="inline-math">$Y$</span> is connected</a>, so <a href="/tripos-notes/Lectures/IB/Michaelmas/Analysis-and-Topology-AT/Notes/Lemma-closure-of-connected-set-is-connected.html"><span class="inline-math">$\overline{Y}$</span> is connected</a>.
    Since <span class="inline-math">$\overline{Y}\subseteq Y$</span>, <span class="inline-math">$\overline{Y} = Y$</span> by <a href="/tripos-notes/Lectures/IB/Michaelmas/Analysis-and-Topology-AT/Notes/Lemma-properties-of-connected-components.html">maximality of connected components</a>.
    Thus <span class="inline-math">$Y$</span> is closed.
</p>
