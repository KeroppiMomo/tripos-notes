<p>
    Let <span class="inline-math">$(X,\tau)$</span> be a <a href="/tripos-notes/Lectures/IB/Michaelmas/Analysis-and-Topology-AT/Notes/Definition-topology-topological-space-open-set.html">topological space</a>.
</p>
<p>
    <span class="inline-math">$(X,\tau)$</span> is said to be <em>Hausdorff</em> if for all <span class="inline-math">$x,y\in X$</span> and <span class="inline-math">$x\neq y$</span>,
    there exists <span class="inline-math">$U, V\in \tau$</span> such that <span class="inline-math">$x\in U$</span>, <span class="inline-math">$y\in V$</span> and <span class="inline-math">$U\cap V=\emptyset$</span>.
</p>
<ul>
<li>
    <p>
        This means <span class="inline-math">$\tau$</span> can separate different points in <span class="inline-math">$X$</span>. (<a href="/tripos-notes/media/Lectures/IB/Michaelmas/Analysis-and-Topology-AT/Notes/Pasted-image-20241111164025.png">Illustration</a>)
    </p>
    
</li>
</ul>
