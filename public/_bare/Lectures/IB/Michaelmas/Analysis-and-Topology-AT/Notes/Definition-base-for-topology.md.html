<p>
    Let <span class="inline-math">$(X,\tau)$</span> is a <a href="/tripos-notes/Lectures/IB/Michaelmas/Analysis-and-Topology-AT/Notes/Definition-topology-topological-space-open-set.html">topological space</a>.
</p>
<p>
    We say <span class="inline-math">$\mathcal{B} \subseteq \tau$</span> is a <em>base</em> for <span class="inline-math">$\tau$</span>
    if for all open set <span class="inline-math">$U\in \tau$</span>,
    there exists a subfamily <span class="inline-math">$\mathcal{C}\subseteq \mathcal{B}$</span> such that
    <span class="display-math">$$ \begin{align*}
        U = \bigcup_{B\in \mathcal{C}} B.
    \end{align*} $$</span>
</p>
