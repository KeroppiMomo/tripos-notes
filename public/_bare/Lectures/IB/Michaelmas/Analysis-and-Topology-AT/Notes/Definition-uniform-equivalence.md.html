<p>
    Let <span class="inline-math">$X$</span> be a set, and <span class="inline-math">$d$</span> and <span class="inline-math">$d&#x27;$</span> be metrics on <span class="inline-math">$X$</span>.
</p>
<p>
    We say <span class="inline-math">$(X,d)$</span> and <span class="inline-math">$(X,d&#x27;)$</span> are <em>uniformly equivalent</em>
    if <span class="inline-math">$\mathrm{id}: (X,d)\to(X,d&#x27;)$</span> and <span class="inline-math">$\mathrm{id}&#x27;: (X,d&#x27;) \to (X,d)$</span> are <a href="/tripos-notes/Lectures/IB/Michaelmas/Analysis-and-Topology-AT/Notes/Definition-uniform-continuity.html">uniformly continuous</a>.
</p>
