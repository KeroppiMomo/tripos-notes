<p>
    Let <span class="inline-math">$f: (X,d)\to (Y,d&#x27;)$</span> and <span class="inline-math">$g: (Y,d&#x27;)\to (Z,d&#x27;&#x27;)$</span> be functions between metric spaces.
</p>
<p>
    If <span class="inline-math">$f$</span> is <span class="inline-math">$L_f$</span>-<a href="/tripos-notes/Lectures/IB/Michaelmas/Analysis-and-Topology-AT/Notes/Definition-Lipschitz-continuity.html">Lipschitz</a> and <span class="inline-math">$g$</span> is <span class="inline-math">$L_g$</span>-Lipschitz,
    then <span class="inline-math">$g\circ f$</span> is <span class="inline-math">$(L_f\cdot L_g)$</span>-Lipschitz.
</p>
