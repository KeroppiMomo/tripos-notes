<p>
    We say <span class="inline-math">$N\subseteq X$</span> is a <em>neighbourhood</em> of <span class="inline-math">$x\in X$</span> if
    there exists an <a href="/tripos-notes/Lectures/IB/Michaelmas/Analysis-and-Topology-AT/Notes/Definition-open-set-in-metric-space.html">open set</a> <span class="inline-math">$U$</span> such that <span class="inline-math">$x \in U \subseteq N$</span>.
</p>
<p>
    In a metric space, equivalently if there exists an <span class="inline-math">$\epsilon&gt;0$</span> such that <a href="/tripos-notes/Lectures/IB/Michaelmas/Analysis-and-Topology-AT/Notes/Definition-open-and-closed-balls.html"><span class="inline-math">$B_\epsilon(x)$</span></a> <span class="inline-math">$\subseteq N$</span>.
</p>
