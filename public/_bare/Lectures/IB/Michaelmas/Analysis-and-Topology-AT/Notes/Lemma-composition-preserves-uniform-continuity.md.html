<p>
    Let <span class="inline-math">$f: (X,d)\to (Y,d&#x27;)$</span> and <span class="inline-math">$g: (Y,d&#x27;)\to (Z,d&#x27;&#x27;)$</span> be functions between metric spaces.
</p>
<p>
    If <span class="inline-math">$f$</span> and <span class="inline-math">$g$</span> are <a href="/tripos-notes/Lectures/IB/Michaelmas/Analysis-and-Topology-AT/Notes/Definition-uniform-continuity.html">uniformly continuous</a>,
    then <span class="inline-math">$g\circ f$</span> is also uniformly continuous.
