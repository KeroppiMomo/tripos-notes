<p>
    Let <span class="inline-math">$f_n: U\to\R^m$</span>.
</p>
<p>
    We say the series <span class="inline-math">$\sum_{i=1}^{\infty} f_n$</span> <em>converges pointwise</em> (resp. <em>uniformly</em>)
    if <span class="inline-math">$g_N = \sum_{n=1}^{N} f_n$</span> <a href="/tripos-notes/Lectures/IB/Michaelmas/Analysis-and-Topology-AT/Notes/Definition-pointwise-convergence.html">converges pointwise</a> (resp. <a href="/tripos-notes/Lectures/IB/Michaelmas/Analysis-and-Topology-AT/Notes/Definition-uniform-convergence.html">uniformly</a>).
</p>
<p>
    Add the word <em>absolutely</em> if convergence holds for <span class="inline-math">$\sum_{n=1}^{N} \|f_n\|$</span>.
</p>
