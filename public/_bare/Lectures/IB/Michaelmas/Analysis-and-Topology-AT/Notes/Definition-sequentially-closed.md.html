<p>
    Let <span class="inline-math">$(X,\tau)$</span> be a topological space.
</p>
<p>
    We say <span class="inline-math">$A\subseteq X$</span> is <em>sequentially closed</em>
    if for every <a href="/tripos-notes/Lectures/IB/Michaelmas/Analysis-and-Topology-AT/Notes/Definition-sequence-convergence.html">convergent sequence</a> <span class="inline-math">$\set{a_n}_{n=1}^\infty$</span> in <span class="inline-math">$A$</span>,
    its limit is also in <span class="inline-math">$A$</span>.
</p>
