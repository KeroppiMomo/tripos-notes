<p>
    Let <span class="inline-math">$(X,d)$</span> be a metric space.
</p>
<p>
    Suppose <span class="inline-math">$X$</span> is <a href="/tripos-notes/Lectures/IB/Michaelmas/Analysis-and-Topology-AT/Notes/Definition-sequential-compactness.html">sequentially compact</a>
    and <span class="inline-math">$\mathcal{U}$</span> is an open cover of <span class="inline-math">$X$</span>.
    Then there exists some <span class="inline-math">$ε&gt;0$</span> such that
    for all <span class="inline-math">$x\in X$</span>, there exists
    some <span class="inline-math">$U\in \mathcal{U}$</span> such that <span class="inline-math">$B_ε(x) \subseteq U$</span>.
</p>
