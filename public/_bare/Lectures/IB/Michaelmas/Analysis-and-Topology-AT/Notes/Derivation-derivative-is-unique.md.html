<p>
    Suppose
    <span class="display-math">$$ \begin{align*}
        f(x_0+h) ={}&amp; f(x_0) + A(h) + ε_1(h) \, \|h\|, \\
        f(x_0+h) ={}&amp; f(x_0) + B(h) + ε_2(h) \, \|h\|.
    \end{align*} $$</span>
    Subtracting,
    <span class="display-math">$$ \begin{align*}
        \|A-B\| \leq \frac{\|(A-B)(h)\|}{\|h\|} = \|ε_1(h) - ε_2(h)\| \to 0
    \end{align*} $$</span>
    as <span class="inline-math">$h\to 0$</span>, so <span class="inline-math">$A = B$</span>.
</p>
