<p>
    Let <span class="inline-math">$V$</span> be a neighbourhood of <span class="inline-math">$g\circ f(x_0)$</span>.
    Note that
    <span class="display-math">$$ \begin{align*}
        (g\circ f)\inv(V) = f\inv(g\inv(V)).
    \end{align*} $$</span>
</p>
<p>
    Since <span class="inline-math">$g$</span> is continuous, <span class="inline-math">$g\inv(V)$</span> is a neighbourhood of <span class="inline-math">$f(x_0)$</span>.
</p>
<p>
    Then since <span class="inline-math">$f$</span> is continuous, <span class="inline-math">$f\inv(g\inv(V))$</span> is a neighbourhood of <span class="inline-math">$x_0$</span>.
</p>
