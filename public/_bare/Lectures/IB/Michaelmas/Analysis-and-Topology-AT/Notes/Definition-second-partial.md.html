<p>
    Let <span class="inline-math">$f: U\to\R^m$</span> with <span class="inline-math">$U\subseteq \R^n$</span>
    have <span class="inline-math">$j$</span>-th <a href="/tripos-notes/Lectures/IB/Michaelmas/Analysis-and-Topology-AT/Notes/Definition-partial-derivative.html">partial derivative</a> functions <span class="inline-math">$\partial_j f:U \to \R^m$</span>.
</p>
<p>
    We say <span class="inline-math">$f$</span> has <em><span class="inline-math">$(i,j)$</span>-th partial</em> at <span class="inline-math">$x_0$</span> if <span class="inline-math">$\partial_{ij}^2 f(x_0) = \partial_i (\partial_j f)(x_0)$</span> exists.
</p>
