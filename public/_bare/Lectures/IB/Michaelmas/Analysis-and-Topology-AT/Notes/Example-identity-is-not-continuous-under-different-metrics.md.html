<p>
    Consider <span class="inline-math">$\mathrm{id}_X: (\R,|\cdot|) \to (\R, d = \text{discrete metric})$</span>.
    This is not continuous at every <span class="inline-math">$x\in \R$</span>:
    for <span class="inline-math">$\epsilon=1/2$</span>, for all <span class="inline-math">$\delta&gt;0$</span>,
    <span class="display-math">$$ \begin{align*}
        B_{\delta}(x) = (x-\delta, x+\delta) \not\subseteq \set{x} = B_\epsilon(x).
    \end{align*} $$</span>
</p>
