<p>
    Let <span class="inline-math">$f: (X,\tau)\to (Y,\rho)$</span> and <span class="inline-math">$g: (Y,\rho)\to (Z,\sigma)$</span> be functions between topological spaces.
</p>
<p>
    If <span class="inline-math">$f$</span> is <a href="/tripos-notes/Lectures/IB/Michaelmas/Analysis-and-Topology-AT/Notes/Definition-continuity-on-topological-space.html">continuous</a> at <span class="inline-math">$x_0\in X$</span> and <span class="inline-math">$g$</span> is continuous at <span class="inline-math">$f(x_0)\in Y$</span>,
    then <span class="inline-math">$g\circ f$</span> is continuous at <span class="inline-math">$x_0$</span>.
</p>
