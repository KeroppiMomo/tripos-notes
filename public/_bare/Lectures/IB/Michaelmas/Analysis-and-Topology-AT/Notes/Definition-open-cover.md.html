<p>
    An <em>open cover</em> of a <a href="/tripos-notes/Lectures/IB/Michaelmas/Analysis-and-Topology-AT/Notes/Definition-topology-topological-space-open-set.html">topological space</a> <span class="inline-math">$(X,d)$</span>
    is a family of open sets <span class="inline-math">$\mathcal{U} = \set{U_i}_{i\in I}$</span> such that
    <span class="display-math">$$ \begin{align*}
        X = \bigcup_{i\in I} U_i.
    \end{align*} $$</span>
</p>
