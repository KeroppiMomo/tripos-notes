<p>
    Let <span class="inline-math">$(X,d)$</span> and <span class="inline-math">$(Y,d&#x27;)$</span> be metric spaces.
</p>
<p>
    We say <span class="inline-math">$f$</span> is <em>sequentially continuous</em> at <span class="inline-math">$x\in (X,d)$</span>
    if for all sequences <span class="inline-math">$\set{x_n}_{n=1}^\infty$</span> on <span class="inline-math">$X$</span> where <span class="inline-math">$x_n\to x$</span>,
    we have <span class="inline-math">$f(x_n) \to f(x_0)$</span>.
</p>
