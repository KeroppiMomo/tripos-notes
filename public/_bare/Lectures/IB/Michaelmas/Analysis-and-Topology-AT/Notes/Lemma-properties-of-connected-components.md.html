<p>
    Let <span class="inline-math">$(X,τ)$</span> be a topological space and <span class="inline-math">$Y\subseteq X$</span> be a <a href="/tripos-notes/Lectures/IB/Michaelmas/Analysis-and-Topology-AT/Notes/Definition-connected-components.html">connected component</a>.
</p>
<ol start="1">
<li>
    <p>
        <span class="inline-math">$Y$</span> is connected. (<a href="/tripos-notes/Lectures/IB/Michaelmas/Analysis-and-Topology-AT/Notes/Proof-connected-components-are-connected.html">Proof</a>)
    </p>
    
</li><li>
    <p>
        If <span class="inline-math">$Z$</span> is a connected set where <span class="inline-math">$Y\subseteq Z\subseteq X$</span>, then <span class="inline-math">$Z = Y$</span>.
    </p>
    
</li><li>
    <p>
        <span class="inline-math">$Y$</span> is closed. (<a href="/tripos-notes/Lectures/IB/Michaelmas/Analysis-and-Topology-AT/Notes/Proof-connected-components-are-closed.html">Proof</a>)
    </p>
    
</li>
</ol>
