<p>
    If a sequence <span class="inline-math">$\set{x_n}_{n=1}^\infty$</span> in a <a href="/tripos-notes/Lectures/IB/Michaelmas/Analysis-and-Topology-AT/Notes/Definition-Hausdorff-topological-space.html">Hausdorff</a> topological space <a href="/tripos-notes/Lectures/IB/Michaelmas/Analysis-and-Topology-AT/Notes/Definition-sequence-convergence.html">converges</a>,
    then it has a unique limit.
</p>
<p>
    This applies to metric spaces.
</p>
