<p>
    Let <span class="inline-math">$(X,d)$</span> be a <a href="/tripos-notes/Lectures/IB/Michaelmas/Analysis-and-Topology-AT/Notes/Definition-metric-space.html">metric space</a>.
</p>
<p>
    A sequence <span class="inline-math">$\set{x_n}_{n=1}^\infty$</span> in <span class="inline-math">$X$</span> is said to be a <em>Cauchy sequence</em>
    if for all <span class="inline-math">$\epsilon&gt;0$</span>, there exists <span class="inline-math">$N=N(\epsilon)\in\N$</span> such that
    <span class="inline-math">$d(x_n, x_m) &lt; \epsilon$</span> for all <span class="inline-math">$n,m\geq N$</span>.
</p>
