<p>
    Let <span class="inline-math">$(X,τ)$</span> be a topological space.
</p>
<p>
    Define an equivalence relation on <span class="inline-math">$X$</span> by <span class="inline-math">$x\sim y$</span>
    if there exists a <a href="/tripos-notes/Lectures/IB/Michaelmas/Analysis-and-Topology-AT/Notes/Definition-path-connected.html">path</a> connecting <span class="inline-math">$x$</span> to <span class="inline-math">$y$</span>.
    The equivalence classes are called the <em>path-connected components</em>.
</p>
