<p>
    Let <span class="inline-math">$(X,d)$</span> and <span class="inline-math">$(Y,d&#x27;)$</span> be metric spaces.
</p>
<p>
    <span class="inline-math">$f: X\to Y$</span> is said to be a <em>contraction</em> if it is <span class="inline-math">$L$</span>-<a href="/tripos-notes/Lectures/IB/Michaelmas/Analysis-and-Topology-AT/Notes/Definition-Lipschitz-continuity.html">Lipschitz</a> where <span class="inline-math">$L&lt;1$</span>.
</p>
