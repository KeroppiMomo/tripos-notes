<p>
    Let <span class="inline-math">$g_n = \sum_{i=1}^{n} f_i$</span>.
    Fix <span class="inline-math">$ε&gt;0$</span>.
    <a href="/tripos-notes/Lectures/IB/Michaelmas/Analysis-and-Topology-AT/Notes/Proposition-uniformly-convergent-iff-uniformly-Cauchy.html">Since</a> <span class="inline-math">$g_n$</span> uniformly converges,
    it is uniformly Cauchy,
    so there exists <span class="inline-math">$N\in \N$</span> such that <span class="inline-math">$\sup_U \|g_m - g_n\| &lt; ε$</span> for all <span class="inline-math">$n,m\geq N$</span>.
</p>
<p>
    Pick <span class="inline-math">$m=n+1$</span> to see that <span class="inline-math">$\sup_U \|f_n\| = \sup_U\|g_{n+1} - g_n\| &lt; ε$</span> for all <span class="inline-math">$n\geq N$</span>.
</p>
