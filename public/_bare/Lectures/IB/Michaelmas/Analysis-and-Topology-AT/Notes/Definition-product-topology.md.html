<p>
    Let <span class="inline-math">$(X,\tau)$</span> and <span class="inline-math">$(Y,\rho)$</span> be topological spaces.
</p>
<p>
    The <em>product topology</em> is the topology on <span class="inline-math">$X\times Y$</span> <a href="/tripos-notes/Lectures/IB/Michaelmas/Analysis-and-Topology-AT/Notes/Lemma-defining-properties-of-bases-for-topology.html">which admits</a> <span class="inline-math">$\mathcal{B} = \sb{U\times V}{U\in \tau, V\in \rho}$</span> as a <a href="/tripos-notes/Lectures/IB/Michaelmas/Analysis-and-Topology-AT/Notes/Definition-base-for-topology.html">base</a>.
</p>
<p>
    This can be extended to finite products.
</p>
