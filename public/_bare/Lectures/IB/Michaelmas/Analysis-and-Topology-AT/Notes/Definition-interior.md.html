<p>
    Let <span class="inline-math">$(X, d)$</span> be a <a href="/tripos-notes/Lectures/IB/Michaelmas/Analysis-and-Topology-AT/Notes/Definition-metric-space.html">metric space</a> and take <span class="inline-math">$A\subseteq X$</span>.
    Define the <em>interior</em> of <span class="inline-math">$A$</span> as the largest <a href="/tripos-notes/Lectures/IB/Michaelmas/Analysis-and-Topology-AT/Notes/Definition-open-set-in-metric-space.html">open set</a> contained inside <span class="inline-math">$A$</span>.
    <span class="display-math">$$ \begin{align*}
        \op{int}(A) = A^\circ = \bigcup_{\substack{U\subseteq A \\ \text{$U$ open}}} U.
    \end{align*} $$</span>
</p>
