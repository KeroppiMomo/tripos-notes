<p>
    Let <span class="inline-math">$X$</span> be a topological space.
</p>
<p>
    If <span class="inline-math">$X$</span> is <a href="/tripos-notes/Lectures/IB/Michaelmas/Analysis-and-Topology-AT/Notes/Definition-Hausdorff-topological-space.html">Hausdorff</a> and a subset <span class="inline-math">$Y\subseteq X$</span> is <a href="/tripos-notes/Lectures/IB/Michaelmas/Analysis-and-Topology-AT/Notes/Definition-compact.html">compact</a>, then <span class="inline-math">$Y$</span> is <a href="/tripos-notes/Lectures/IB/Michaelmas/Analysis-and-Topology-AT/Notes/Definition-closed-set.html">closed</a>.
</p>
<p>
    <a href="/tripos-notes/Lectures/IB/Michaelmas/Analysis-and-Topology-AT/Notes/Proof-compact-subset-in-Hausdorff-space-is-closed.html">Proof</a>
</p>
<ul>
<li>
    <p>
        The Hausdorff condition is necessary: <a href="https://proofwiki.org/wiki/Compact_Subset_of_Compact_Space_is_not_necessarily_Closed">counterexample</a>.
    </p>
    
</li>
</ul>
