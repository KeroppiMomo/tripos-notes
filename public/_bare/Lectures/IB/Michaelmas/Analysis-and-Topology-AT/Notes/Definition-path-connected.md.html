<p>
    A topological space <span class="inline-math">$(X,τ)$</span>
    is said to be <em>path-connected</em> if for all <span class="inline-math">$x,y\in X$</span>,
    there exists a path <span class="inline-math">$γ$</span> connecting <span class="inline-math">$x$</span> to <span class="inline-math">$y$</span>,
    i.e. a <a href="/tripos-notes/Lectures/IB/Michaelmas/Analysis-and-Topology-AT/Notes/Definition-continuity-on-topological-space.html">continuous</a> function <span class="inline-math">$γ: [0,1]\to X$</span>
    with <span class="inline-math">$γ(0) = x$</span> and <span class="inline-math">$γ(1) = y$</span>.
</p>
