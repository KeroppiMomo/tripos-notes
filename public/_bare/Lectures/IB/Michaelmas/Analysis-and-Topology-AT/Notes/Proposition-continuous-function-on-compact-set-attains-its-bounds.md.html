<p>
    Let <span class="inline-math">$(X,\tau)$</span> be a topological space
    and <span class="inline-math">$X\neq\emptyset$</span>.
</p>
<p>
    If <span class="inline-math">$f: X\to\R$</span> is <a href="/tripos-notes/Lectures/IB/Michaelmas/Analysis-and-Topology-AT/Notes/Definition-continuity-on-topological-space.html">continuous</a> and <span class="inline-math">$(X,\tau)$</span> is <a href="/tripos-notes/Lectures/IB/Michaelmas/Analysis-and-Topology-AT/Notes/Definition-compact.html">compact</a>,
    then <span class="inline-math">$f$</span> is bounded and there exists <span class="inline-math">$p,q\in X$</span> such that
    <span class="display-math">$$ \begin{align*}
        f(p) &amp;= \sup_{x\in X} f(x) &amp;\text{and}&amp;&amp; f(q) = \inf_{x\in X} f(x).
    \end{align*} $$</span>
</p>
