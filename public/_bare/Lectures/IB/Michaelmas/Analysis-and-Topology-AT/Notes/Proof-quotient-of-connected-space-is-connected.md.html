<p>
    The <a href="/tripos-notes/Lectures/IB/Michaelmas/Analysis-and-Topology-AT/Notes/Definition-quotient-space-quotient-map-quotient-topology.html">quotient map</a> <span class="inline-math">$q: X\to X/{\sim}$</span> is continuous and surjective,
    so <span class="inline-math">$X/{\sim} = q(X)$</span> is the image of a connected space and <a href="/tripos-notes/Lectures/IB/Michaelmas/Analysis-and-Topology-AT/Notes/Proposition-continuous-image-of-connected-set-is-connected.html">therefore</a> connected.
</p>
