<p>
    Suppose <span class="inline-math">$f$</span> is <a href="/tripos-notes/Lectures/IB/Michaelmas/Analysis-and-Topology-AT/Notes/Definition-Lipschitz-continuity.html"><span class="inline-math">$L$</span>-Lipschitz</a>.
    Fix <span class="inline-math">$\epsilon&gt;0$</span>. Let <span class="inline-math">$\delta = \epsilon/L$</span>.
    Then for every <span class="inline-math">$x,y\in X$</span>, if <span class="inline-math">$d(x,y) &lt; \delta = \epsilon/L$</span>, then
    <span class="display-math">$$ \begin{align*}
        d&#x27;(f(x), f(y)) \leq Ld(x,y) &lt; L\delta = \epsilon
    \end{align*} $$</span>
    so <span class="inline-math">$f$</span> is <a href="/tripos-notes/Lectures/IB/Michaelmas/Analysis-and-Topology-AT/Notes/Definition-uniform-continuity.html">uniformly continuous</a>.
</p>
