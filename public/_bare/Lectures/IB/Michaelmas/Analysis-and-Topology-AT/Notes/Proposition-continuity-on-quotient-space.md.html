<p>
    Let <span class="inline-math">$(X,\tau)$</span> and <span class="inline-math">$(Y,\rho)$</span> be topological spaces, <span class="inline-math">$\sim$</span> be an equivalence relation on <span class="inline-math">$X$</span>, <span class="inline-math">$Q = X/{\sim}$</span> be the <a href="/tripos-notes/Lectures/IB/Michaelmas/Analysis-and-Topology-AT/Notes/Definition-quotient-space-quotient-map-quotient-topology.html">quotient space</a> and <span class="inline-math">$q: X\to Q$</span> be the <a href="/tripos-notes/Lectures/IB/Michaelmas/Analysis-and-Topology-AT/Notes/Definition-quotient-space-quotient-map-quotient-topology.html">quotient map</a>.
</p>
<p>
    A function <span class="inline-math">$f: Q\to Y$</span> is <a href="/tripos-notes/Lectures/IB/Michaelmas/Analysis-and-Topology-AT/Notes/Definition-continuity-on-topological-space.html">continuous</a> iff <span class="inline-math">$f\circ q$</span> is continuous.
</p>
