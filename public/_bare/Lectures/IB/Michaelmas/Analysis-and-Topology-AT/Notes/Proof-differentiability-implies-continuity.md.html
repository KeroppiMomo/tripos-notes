<p>
    We have
    <span class="display-math">$$ \begin{align*}
        f(x_0 + h) = f(x_0) + A(h) + ε(h)\,\|h\|
    \end{align*} $$</span>
    for some <span class="inline-math">$ε(h)\to 0$</span> as <span class="inline-math">$h\to 0$</span>.
    Taking the limit as <span class="inline-math">$h\to 0$</span> on both sides,
    <span class="display-math">$$ \begin{align*}
        \lim_{h\to 0} f(x_0+h) = f(x_0).
    \end{align*} $$</span>
</p>
