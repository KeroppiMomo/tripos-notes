<p>
    <span class="inline-math">$U$</span> and <span class="inline-math">$V$</span> are disjoint and open in <span class="inline-math">$X$</span>.
    Note that
    <span class="display-math">$$ \begin{align*}
        Y = X\cap Y = (U\cup V) \cap Y = (U \cap Y) \cup (V \cap Y)
    \end{align*} $$</span>
    where <span class="inline-math">$U\cap Y$</span> and <span class="inline-math">$V\cap Y$</span> are disjoint and is open in <span class="inline-math">$Y$</span>.
    Since <span class="inline-math">$Y$</span> is connected,
    one of them has to be empty.
</p>
