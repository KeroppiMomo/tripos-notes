<p>
    With the Euclidean metric,
    a subset <span class="inline-math">$Y \subseteq \R$</span> is <a href="/tripos-notes/Lectures/IB/Michaelmas/Analysis-and-Topology-AT/Notes/Definition-disconnected-connected-separation.html">connected</a>
    iff <span class="inline-math">$Y$</span> is an interval, i.e.
    if <span class="inline-math">$x,y\in Y$</span> and <span class="inline-math">$x&lt;z&lt;y$</span>, then <span class="inline-math">$z\in Y$</span>.
