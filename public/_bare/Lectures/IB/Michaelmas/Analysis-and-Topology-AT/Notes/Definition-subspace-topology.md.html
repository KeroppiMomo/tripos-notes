<p>
    Let <span class="inline-math">$(X,\tau)$</span> be a <a href="/tripos-notes/Lectures/IB/Michaelmas/Analysis-and-Topology-AT/Notes/Definition-topology-topological-space-open-set.html">topological space</a> and <span class="inline-math">$Y\subseteq X$</span>.
</p>
<p>
    The <em>subspace topology</em> on <span class="inline-math">$Y$</span> is defined as
    <span class="display-math">$$ \begin{align*}
        \sb{U\cap Y}{U\in \tau}.
    \end{align*} $$</span>
</p>
