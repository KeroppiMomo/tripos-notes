<p>
    A metric space is <a href="/tripos-notes/Lectures/IB/Michaelmas/Analysis-and-Topology-AT/Notes/Definition-sequential-compactness.html">sequentially compact</a> iff it is <a href="/tripos-notes/Lectures/IB/Michaelmas/Analysis-and-Topology-AT/Notes/Definition-compact.html">compact</a>.
</p>
<p>
    <a href="/tripos-notes/Lectures/IB/Michaelmas/Analysis-and-Topology-AT/Notes/Proof-sequentially-compact-iff-compact.html">Proof</a>
</p>
<ul>
<li>
    <p>
        For a general topological space, both implications are not true: counterexamples exist.
    </p>
    
</li><li>
    <p>
        In <a href="/tripos-notes/Lectures/IB/Michaelmas/Analysis-and-Topology-AT/Notes/Definition-second-countable-topological-space.html">second countable</a> topological spaces, they are equivalent.
    </p>
    
</li>
</ul>
