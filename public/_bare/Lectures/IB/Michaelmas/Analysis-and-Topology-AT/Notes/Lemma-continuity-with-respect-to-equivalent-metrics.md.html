<p>
    Suppose <span class="inline-math">$(X,d)$</span>, <span class="inline-math">$(X,d&#x27;)$</span> and <span class="inline-math">$(Y,d&#x27;&#x27;)$</span> are metric spaces, and <span class="inline-math">$(X,d)$</span> and <span class="inline-math">$(X,d&#x27;)$</span> are (\*)-equivalent.
</p>
<p>
    If <span class="inline-math">$f: (X,d)\to (Y,d&#x27;&#x27;)$</span> is (\*)-continuous,
    then <span class="inline-math">$f: (X,d&#x27;)\to(Y,d&#x27;&#x27;)$</span> is also (\*)-continuous.
</p>
<p>
    (\*) can be <a href="/tripos-notes/Lectures/IB/Michaelmas/Analysis-and-Topology-AT/Notes/Definition-continuity-on-topological-space.html">not</a><a href="/tripos-notes/Lectures/IB/Michaelmas/Analysis-and-Topology-AT/Notes/Definition-metric-equivalence.html">hing</a>, <a href="/tripos-notes/Lectures/IB/Michaelmas/Analysis-and-Topology-AT/Notes/Definition-uniform-continuity.html">"unif</a><a href="/tripos-notes/Lectures/IB/Michaelmas/Analysis-and-Topology-AT/Notes/Definition-uniform-equivalence.html">ormly"</a>, or <a href="/tripos-notes/Lectures/IB/Michaelmas/Analysis-and-Topology-AT/Notes/Definition-Lipschitz-continuity.html">"Lips</a><a href="/tripos-notes/Lectures/IB/Michaelmas/Analysis-and-Topology-AT/Notes/Definition-Lipschitz-equivalence.html">chitz"</a>.
</p>
