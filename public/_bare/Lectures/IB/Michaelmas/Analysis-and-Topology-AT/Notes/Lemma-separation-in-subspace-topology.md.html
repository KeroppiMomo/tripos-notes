<p>
    Let <span class="inline-math">$(X,τ)$</span> be a topological space, and <span class="inline-math">$Y,U,V\subseteq X$</span> be subsets.
</p>
<p>
    <span class="inline-math">$U,V$</span> are a <a href="/tripos-notes/Lectures/IB/Michaelmas/Analysis-and-Topology-AT/Notes/Definition-disconnected-connected-separation.html">separation</a> of <span class="inline-math">$Y$</span> with respect to the <a href="/tripos-notes/Lectures/IB/Michaelmas/Analysis-and-Topology-AT/Notes/Definition-subspace-topology.html">subspace topology</a>
    iff <span class="inline-math">$U,V$</span> are non-empty, <span class="inline-math">$U\cap{}$</span><a href="/tripos-notes/Lectures/IB/Michaelmas/Analysis-and-Topology-AT/Notes/Definition-closure.html"><span class="inline-math">$\overline{V}$</span></a> <span class="inline-math">$= \emptyset = \overline{U} \cap V$</span>, and <span class="inline-math">$Y = U\cup V$</span>.
</p>
