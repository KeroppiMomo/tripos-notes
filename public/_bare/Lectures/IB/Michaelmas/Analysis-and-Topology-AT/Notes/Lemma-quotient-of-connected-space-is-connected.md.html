<p>
    Let <span class="inline-math">$(X,τ)$</span> be a topological space
    and <span class="inline-math">$\sim$</span> be an equivalence relation on <span class="inline-math">$X$</span>.
</p>
<p>
    If <span class="inline-math">$X$</span> is <a href="/tripos-notes/Lectures/IB/Michaelmas/Analysis-and-Topology-AT/Notes/Definition-disconnected-connected-separation.html">connected</a>,
    then the <a href="/tripos-notes/Lectures/IB/Michaelmas/Analysis-and-Topology-AT/Notes/Definition-quotient-space-quotient-map-quotient-topology.html">quotient space</a> <span class="inline-math">$X/{\sim}$</span> is also connected with respect to the quotient topology.
</p>
