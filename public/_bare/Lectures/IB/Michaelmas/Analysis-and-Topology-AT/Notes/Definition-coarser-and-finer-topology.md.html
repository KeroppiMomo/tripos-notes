<p>
    Let <span class="inline-math">$X$</span> be any set, and <span class="inline-math">$\tau_1$</span> and <span class="inline-math">$\tau_2$</span> be <a href="/tripos-notes/Lectures/IB/Michaelmas/Analysis-and-Topology-AT/Notes/Definition-topology-topological-space-open-set.html">topologies</a> on <span class="inline-math">$X$</span>.
</p>
<p>
    If <span class="inline-math">$\tau_1\subseteq \tau_2$</span>, then we say <span class="inline-math">$\tau_1$</span> is <em>coarser</em> and <span class="inline-math">$\tau_2$</span> is <em>finer</em>.
</p>
