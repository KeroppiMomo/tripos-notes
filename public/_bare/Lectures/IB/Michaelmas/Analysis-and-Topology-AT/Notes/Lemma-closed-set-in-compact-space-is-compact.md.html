<p>
    Let <span class="inline-math">$(X,\tau)$</span> be a <a href="/tripos-notes/Lectures/IB/Michaelmas/Analysis-and-Topology-AT/Notes/Definition-compact.html">compact</a> topological space.
</p>
<p>
    If <span class="inline-math">$Y\subseteq X$</span> is <a href="/tripos-notes/Lectures/IB/Michaelmas/Analysis-and-Topology-AT/Notes/Definition-closed-set.html">closed</a>, then <span class="inline-math">$Y$</span> is also compact.
</p>
<p>
    <a href="/tripos-notes/Lectures/IB/Michaelmas/Analysis-and-Topology-AT/Notes/Proof-closed-set-in-compact-space-is-compact.html">Proof</a>
</p>
<ul>
<li>
    <p>
        The <a href="/tripos-notes/Lectures/IB/Michaelmas/Analysis-and-Topology-AT/Notes/Lemma-compact-subset-in-Hausdorff-space-is-closed.html">converse</a> is true if <span class="inline-math">$X$</span> is Hausdorff.
    </p>
    
</li>
</ul>
