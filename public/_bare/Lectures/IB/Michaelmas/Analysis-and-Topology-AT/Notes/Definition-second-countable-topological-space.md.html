<p>
    Let <span class="inline-math">$(X,\tau)$</span> be a <a href="/tripos-notes/Lectures/IB/Michaelmas/Analysis-and-Topology-AT/Notes/Definition-topology-topological-space-open-set.html">topological space</a>.
</p>
<p>
    <span class="inline-math">$(X,\tau)$</span> is said to be <em>second countable</em>
    if it has a countable <a href="/tripos-notes/Lectures/IB/Michaelmas/Analysis-and-Topology-AT/Notes/Definition-base-for-topology.html">base</a>.
</p>
