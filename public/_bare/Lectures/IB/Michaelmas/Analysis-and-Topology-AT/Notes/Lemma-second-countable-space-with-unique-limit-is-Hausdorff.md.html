<p>
    If a topological space is <a href="/tripos-notes/Lectures/IB/Michaelmas/Analysis-and-Topology-AT/Notes/Definition-second-countable-topological-space.html">second countable</a> and every <a href="/tripos-notes/Lectures/IB/Michaelmas/Analysis-and-Topology-AT/Notes/Definition-sequence-convergence.html">convergent sequence</a> in it has a unique limit,
    then it is <a href="/tripos-notes/Lectures/IB/Michaelmas/Analysis-and-Topology-AT/Notes/Definition-Hausdorff-topological-space.html">Hausdorff</a>.
