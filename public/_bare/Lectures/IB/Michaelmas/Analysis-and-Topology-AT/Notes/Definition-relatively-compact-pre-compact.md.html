<p>
    For a topological space <span class="inline-math">$(X,\tau)$</span>,
    we say <span class="inline-math">$A\subseteq X$</span> is <em>relatively compact</em> or <em>pre-compact</em> if the <a href="/tripos-notes/Lectures/IB/Michaelmas/Analysis-and-Topology-AT/Notes/Definition-closure.html">closure <span class="inline-math">$\bar A$</span></a> is <a href="/tripos-notes/Lectures/IB/Michaelmas/Analysis-and-Topology-AT/Notes/Definition-compact.html">compact</a>.
</p>
