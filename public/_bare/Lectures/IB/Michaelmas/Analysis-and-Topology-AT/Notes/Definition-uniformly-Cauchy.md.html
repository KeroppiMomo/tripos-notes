<p>
    Let <span class="inline-math">$Y$</span> be a set and <span class="inline-math">$\set{f_n}_{n\geq 1}^\infty$</span> is a sequence of functions <span class="inline-math">$Y\to\R$</span>.
</p>
<p>
    <span class="inline-math">$\set{f_n}$</span> is said to be <em>uniformly Cauchy</em>
    if for all <span class="inline-math">$\epsilon&gt;0$</span>, there exists <span class="inline-math">$N\in\N$</span> such that for all <span class="inline-math">$n,m\geq N$</span>, we have
    <span class="display-math">$$ \begin{align*}
        \sup_{x\in Y}|f_n(x) - f_m(x)| &lt;\epsilon.
    \end{align*} $$</span>
</p>
