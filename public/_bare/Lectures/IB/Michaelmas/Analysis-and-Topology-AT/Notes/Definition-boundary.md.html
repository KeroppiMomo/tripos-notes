<p>
    Let <span class="inline-math">$A\subseteq X$</span>.
    Define the <em>topological boundary</em> of <span class="inline-math">$A$</span> as set difference of the <a href="/tripos-notes/Lectures/IB/Michaelmas/Analysis-and-Topology-AT/Notes/Definition-closure.html">closure</a> and <a href="/tripos-notes/Lectures/IB/Michaelmas/Analysis-and-Topology-AT/Notes/Definition-interior.html">interior</a> of <span class="inline-math">$A$</span>:
    <span class="display-math">$$ \begin{align*}
        \partial A = \overline{A} \setminus A^\circ = \op{cl}(A) \setminus \op{int}(A).
    \end{align*} $$</span>
</p>
