<p>
    Let <span class="inline-math">$(X,\tau)$</span> be a topological space and <span class="inline-math">$A\subseteq X$</span>.
</p>
<p>
    The sequential closure of <span class="inline-math">$A$</span> is defined as <span class="inline-math">$\scl(A) = \sb{x\in X}{\text{there exists } \set{x_n}_{n=1}^\infty \text{ in } A \text{ such that } x_n\to x}$</span>.
</p>
<ul>
<li>
    <p>
        By definition, <span class="inline-math">$A$</span> is <a href="/tripos-notes/Lectures/IB/Michaelmas/Analysis-and-Topology-AT/Notes/Definition-sequentially-closed.html">sequentially closed</a> iff <span class="inline-math">$A = \scl(A)$</span>.
    </p>
    
</li>
</ul>
