<p>
    We say a topological space <span class="inline-math">$(X,\tau)$</span> is <em>sequentially compact</em>
    if every sequence in <span class="inline-math">$X$</span> has a <a href="/tripos-notes/Lectures/IB/Michaelmas/Analysis-and-Topology-AT/Notes/Definition-sequence-convergence.html">convergent</a> subsequence.
</p>
