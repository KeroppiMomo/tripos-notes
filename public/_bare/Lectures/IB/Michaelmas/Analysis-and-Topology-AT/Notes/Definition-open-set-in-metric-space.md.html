<p>
    Let <span class="inline-math">$(X,d)$</span> be a <a href="/tripos-notes/Lectures/IB/Michaelmas/Analysis-and-Topology-AT/Notes/Definition-metric-space.html">metric space</a>.
</p>
<p>
    A set <span class="inline-math">$Y\subseteq X$</span> is <em>open</em> in <span class="inline-math">$X$</span>
    if for all <span class="inline-math">$y\in Y$</span>, there exists <span class="inline-math">$\epsilon = \epsilon(y)$</span> such that <a href="/tripos-notes/Lectures/IB/Michaelmas/Analysis-and-Topology-AT/Notes/Definition-open-and-closed-balls.html"><span class="inline-math">$B_\epsilon(y)$</span></a> <span class="inline-math">$\subseteq Y$</span>.
</p>
