<p>
    A metric space <span class="inline-math">$(X,d)$</span> is said to be <em>complete</em>
    if every <a href="/tripos-notes/Lectures/IA/Lent/Analysis-I-An/Notes/Definition-Cauchy-sequence.html">Cauchy sequence</a> on <span class="inline-math">$(X,d)$</span> <a href="/tripos-notes/Lectures/IB/Michaelmas/Analysis-and-Topology-AT/Notes/Definition-sequence-convergence.html">converges</a>.
</p>
