<p>
    Let <span class="inline-math">$(X,d)$</span> and <span class="inline-math">$(Y,d&#x27;)$</span> be <a href="/tripos-notes/Lectures/IB/Michaelmas/Analysis-and-Topology-AT/Notes/Definition-metric-space.html">metric spaces</a>.
</p>
<p>
    A function <span class="inline-math">$f: (X,d) \to (Y,d&#x27;)$</span> is said to be an <em>isometry</em> if it is bijective and
    <span class="display-math">$$ \begin{align*}
        d&#x27;(f(x), f(y)) = d(x,y) \qquad \text{for all }x,y\in X.
    \end{align*} $$</span>
    We say <span class="inline-math">$(X,d)$</span> and <span class="inline-math">$(Y,d&#x27;)$</span> are isometric if such a function exists.
</p>
