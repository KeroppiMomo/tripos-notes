<p>
    Let <span class="inline-math">$(X,\tau)$</span> and <span class="inline-math">$(Y,\rho)$</span> be topological spaces, and <span class="inline-math">$\mathcal{B}$</span> be a <a href="/tripos-notes/Lectures/IB/Michaelmas/Analysis-and-Topology-AT/Notes/Definition-base-for-topology.html">base</a> for <span class="inline-math">$\rho$</span>.
</p>
<p>
    A function <span class="inline-math">$f:X\to Y$</span> is <a href="/tripos-notes/Lectures/IB/Michaelmas/Analysis-and-Topology-AT/Notes/Definition-continuity-on-topological-space.html">continuous</a> iff <span class="inline-math">$f\inv(B)$</span> is open for all <span class="inline-math">$B\in \mathcal{B}$</span>.
