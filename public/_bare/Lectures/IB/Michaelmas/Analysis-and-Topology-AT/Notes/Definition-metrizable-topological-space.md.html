<p>
    Let <span class="inline-math">$(X,\tau)$</span> be a <a href="/tripos-notes/Lectures/IB/Michaelmas/Analysis-and-Topology-AT/Notes/Definition-topology-topological-space-open-set.html">topological space</a>.
</p>
<p>
    <span class="inline-math">$(X,\tau)$</span> is said to be <em>metrizable</em> if <span class="inline-math">$\tau$</span> can be induced by some <a href="/tripos-notes/Lectures/IB/Michaelmas/Analysis-and-Topology-AT/Notes/Definition-metric-space.html">metric</a>,
    i.e. if we can define a metric on <span class="inline-math">$X$</span> such that the metric topology equals <span class="inline-math">$\tau$</span>.
</p>
