<p>
    For <span class="inline-math">$f(x) = H(x) \, e^{-\sigma x}$</span>,
    <span class="display-math">$$ \begin{align*}
        \hat f(\lambda) ={}&amp; \int_{-\infty}^{\infty} H(x) e^{-\sigma x} e^{-i\lambda x} \d x \\
        ={}&amp; \int_{0}^{\infty} e^{-(\sigma + i\lambda)x} \d x \\
        ={}&amp; \frac{1}{\sigma + i\lambda}.
    \end{align*} $$</span>
</p>
