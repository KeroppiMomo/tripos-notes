<p>
    Let <span class="inline-math">$L$</span> be a <a href="/tripos-notes/Lectures/IB/Michaelmas/Methods-Me/Notes/Definition-Sturm-Liouville-operator.html">Sturm-Liouville</a> operator on <span class="inline-math">$(a,b)$</span> defined by functions <span class="inline-math">$p,q,w$</span>.
</p>
<p>
    An endpoint <span class="inline-math">$c\in\set{a,b}$</span> is said to be <em>singular</em> if <span class="inline-math">$p(c) = 0$</span>, or <em>non-singular</em> if otherwise.
</p>
