<p>
    For the wave equation <span class="inline-math">$u_{tt} - c^2 \Delta u = F(\v x,t)$</span> in <span class="inline-math">$\R^n$</span>,
    define <span class="inline-math">$\Phi_t(\v x)$</span> to have the <a href="/tripos-notes/Lectures/IB/Michaelmas/Methods-Me/Notes/Definition-higher-dimensional-Fourier-transform.html">Fourier transform</a>
    <span class="display-math">$$ \begin{align*}
        \hat \Phi_t(\v \lambda) = \frac{\sin(ct|\v \lambda|)}{c|\v \lambda|}.
    \end{align*} $$</span>
</p>
