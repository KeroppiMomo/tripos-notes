<p>
    The Green's function <span class="inline-math">$G(\v x, t; \v y, s)$</span> for heat equation with zero initial conditions
    satisfies
    <span class="display-math">$$ \begin{align*}
        \pdfd{G}{t} - \kappa \Delta G = \delta(\v x- \v y)\, \delta(t-s).
    \end{align*} $$</span>
