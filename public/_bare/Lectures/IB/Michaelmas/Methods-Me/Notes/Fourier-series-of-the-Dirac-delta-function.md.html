<p>
    The <a href="/tripos-notes/Lectures/IB/Michaelmas/Methods-Me/Notes/Definition-complex-Fourier-series.html">Fourier series</a> of the <span class="inline-math">$L$</span>-periodic extension of <span class="inline-math">$\delta(x)$</span> (<span class="inline-math">$\delta^L(x) = \delta(x)$</span> on <span class="inline-math">$[-\frac{L}{2}, \frac{L}{2}]$</span>) is
    <span class="display-math">$$ \begin{align*}
        \delta^L(x) \sim \frac{1}{L} \sum_{n} e^{2\pi inx/L}.
    \end{align*} $$</span>
</p>
