<p>
    Let <span class="inline-math">$f: \R\to\C$</span> be an integrable function.
</p>
<p>
    Define its <em>Fourier transform</em> <span class="inline-math">$\hat f: \R\to\C$</span> by
    <span class="display-math">$$ \begin{align*}
        \hat f(\lambda) = \int_{\infty}^{\infty} e^{-i\lambda x} f(x) \d x.
    \end{align*} $$</span>
    We write <span class="inline-math">$\mathcal{F}[f] = \hat f$</span>, or <span class="inline-math">$\mathcal{F}_{x\mapsto \lambda}[f(x)] = \hat f(\lambda)$</span>.
</p>
