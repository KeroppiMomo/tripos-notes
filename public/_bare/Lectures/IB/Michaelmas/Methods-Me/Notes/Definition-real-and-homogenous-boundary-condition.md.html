<p>
    A boundary condition at an endpoint <span class="inline-math">$c\in\set{a,b}$</span> is said to be <em>real and homogenous</em>
    if it is of the form
    <span class="display-math">$$ \begin{align*}
        \alpha_c y(c) + \beta_cy&#x27;(c) = 0
    \end{align*} $$</span>
    where <span class="inline-math">$\alpha_c, \beta_c \in \R$</span> and <span class="inline-math">$\alpha_c^2 + \beta_c^2 \neq 0$</span>.
</p>
