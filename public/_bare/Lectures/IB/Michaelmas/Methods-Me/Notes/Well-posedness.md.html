<p>
    Hadamard famously declared that for a problem to be <em>well-posed</em>, we require
</p>
<ol start="1">
<li>
    <p>
        solution to exist;
    </p>
    
</li><li>
    <p>
        solution to be unique;
    </p>
    
</li><li>
    <p>
        solution to depend continuously on given data.
    </p>
    
</li>
</ol>
<p>
    An example that fails 3. is the backwards heat equation <span class="inline-math">$\phi_t + \kappa\phi_{x x} = 0$</span> on <span class="inline-math">$\Omega = (0,\pi)$</span>.
</p>
