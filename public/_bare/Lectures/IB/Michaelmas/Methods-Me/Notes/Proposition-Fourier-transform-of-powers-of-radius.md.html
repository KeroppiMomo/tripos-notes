<p>
    In <span class="inline-math">$\R^n$</span>, for <span class="inline-math">$\alpha&gt;0$</span>, we have
    <span class="display-math">$$ \begin{align*}
        \mathcal{F}_{\v x\mapsto \v \lambda}\big[|\v x|^{-\alpha}\big] = C_{n,\alpha} |\v \lambda|^{\alpha-n}
    \end{align*} $$</span>
    where <span class="inline-math">$C_{n,\alpha}$</span> is a constant.
