<p>
    For <span class="inline-math">$f: \R\to\C$</span>,
    <span class="display-math">$$ \begin{align*}
        \sum_{n\in \Z} f(x+n) = \sum_{n\in \Z} \hat f(2\pi n) e^{2\pi i n x}.
    \end{align*} $$</span>
    <a href="/tripos-notes/Lectures/IB/Michaelmas/Methods-Me/Notes/Proof-Poisson-summation-formula.html">Proof</a>
</p>
<ul>
<li>
    <p>
        In particular, we get the identity
        <span class="display-math">$$ \begin{align*}
        \sum_{n} f(n) = \sum_{n} \hat f(2\pi n).
        \end{align*} $$</span>
    </p>
    
</li>
</ul>
