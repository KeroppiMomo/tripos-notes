<p>
    A differential operator <span class="inline-math">$L$</span> is said to be <em>self-adjoint</em> on <a href="/tripos-notes/Lectures/IB/Michaelmas/Methods-Me/Notes/Definition-weighted-inner-product.html"><span class="inline-math">$(V, \langle \cdot,\cdot\rangle_w)$</span></a>
    if
    <span class="display-math">$$ \begin{align*}
        \langle Ly_1, y_2\rangle_w &amp;= \langle y_1, Ly_2\rangle_w &amp;&amp;\text{for all }y_1,y_2\in V.
    \end{align*} $$</span>
</p>
