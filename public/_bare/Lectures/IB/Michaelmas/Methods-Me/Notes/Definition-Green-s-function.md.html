<p>
    The <em>Green's function</em> <span class="inline-math">$G(x;\xi)$</span> for a linear operator <span class="inline-math">$L$</span> on <span class="inline-math">$a&lt;x&lt;b$</span> is the solution, for each fixed <span class="inline-math">$\xi\in (a,b)$</span>, to
    <span class="display-math">$$ \begin{align*}
        L[G(x;\xi)] = \delta(x-\xi), \quad a&lt;x&lt;b
    \end{align*} $$</span>
    under some appropriate boundary conditions.
</p>
