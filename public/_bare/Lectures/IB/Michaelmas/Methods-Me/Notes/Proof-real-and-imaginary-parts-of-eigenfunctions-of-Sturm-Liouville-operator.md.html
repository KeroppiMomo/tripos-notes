<p>
    Let <span class="inline-math">$L$</span> be defined by <span class="inline-math">$p, q, w$</span>.
    Since <span class="inline-math">$L$</span> is <a href="/tripos-notes/Lectures/IB/Michaelmas/Methods-Me/Notes/Proof-condition-where-Sturm-Liouville-operator-is-self-adjoint.html">self-adjoint</a>, <a href="/tripos-notes/Lectures/IB/Michaelmas/Methods-Me/Notes/Proof-properties-of-self-adjoint-differential-operator.html"><span class="inline-math">$\lambda$</span> is real</a>.
