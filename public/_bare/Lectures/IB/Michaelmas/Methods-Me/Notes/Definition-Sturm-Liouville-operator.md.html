<p>
    A <em>Sturm-Liouville operator</em> on <span class="inline-math">$(a,b)$</span> has the form
    <span class="display-math">$$ \begin{align*}
        L = \frac{1}{w} \left(-\dd{x}\left(p \dd{x}\right) + q\right)
    \end{align*} $$</span>
    where <span class="inline-math">$p,q,w$</span> are real-valued functions and <span class="inline-math">$p,w &gt; 0$</span> on <span class="inline-math">$(a,b)$</span>.
    <span class="inline-math">$w$</span> is called the <em>weight function</em>.
</p>
