<p>
    Consider <a href="/tripos-notes/Lectures/IB/Michaelmas/Methods-Me/Notes/Definition-kernel-for-wave-equation.html"><span class="inline-math">$\Phi_t(\v x)$</span></a> in <span class="inline-math">$\R^n$</span>.
</p>
<ul>
<li>
    <p>
        If <span class="inline-math">$n=1$</span>, then
        <span class="display-math">$$ \begin{align*}
        \Phi_t(x) = \frac{1}{2c}\big(H(x + ct) - h(x - ct)\big).
        \end{align*} $$</span>
    </p>
    
</li><li>
    <p>
        If <span class="inline-math">$n=3$</span>, then
        <span class="display-math">$$ \begin{align*}
        \Phi_t(x) = \frac{1}{4\pi c|\v x|}\big(\delta(|\v x|-ct) - \delta(|\v x| + ct)\big).
        \end{align*} $$</span>
    </p>
    
</li>
</ul>
