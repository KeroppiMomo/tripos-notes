<p>
    For a function <span class="inline-math">$f: \R^n \to \C$</span>, define its <em>Fourier transform</em> <span class="inline-math">$\hat f: \R^n \to \C$</span> by
    <span class="display-math">$$ \begin{align*}
        \hat f(\v \lambda) = \int e^{-i\v \lambda \cdot \v x} f(\v x) \d ^n \v x.
    \end{align*} $$</span>
</p>
