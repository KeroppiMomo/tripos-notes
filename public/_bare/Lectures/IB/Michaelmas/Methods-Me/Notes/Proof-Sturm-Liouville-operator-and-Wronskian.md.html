    <span class="display-math">$$ \begin{align*}
        y_2 L y_1 - y_1 L y_2 ={}&amp; \frac{1}{w}\Big(y_2\big(-(py_1&#x27;)&#x27; + qy_1\big) - y_1\big(-(py_2&#x27;)&#x27; + qy_2\big)\Big) \\

        ={}&amp; \frac{1}{w} \dd{x}\Big(p(y_1 y_2&#x27; - y_1&#x27;y_2)\Big)
    \end{align*} $$</span>
