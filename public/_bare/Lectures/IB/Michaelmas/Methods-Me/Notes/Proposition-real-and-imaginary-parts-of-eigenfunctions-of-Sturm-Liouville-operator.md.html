<p>
    Let <span class="inline-math">$y\in V$</span> be an eigenfunction of a <a href="/tripos-notes/Lectures/IB/Michaelmas/Methods-Me/Notes/Definition-Sturm-Liouville-operator.html">Sturm-Liouville operator</a> <span class="inline-math">$L$</span> with eigenvalue <span class="inline-math">$\lambda$</span>,
    where <span class="inline-math">$V$</span> is defined <a href="/tripos-notes/Lectures/IB/Michaelmas/Methods-Me/Notes/Proposition-condition-where-Sturm-Liouville-operator-is-self-adjoint.html">here</a>.
    Then <span class="inline-math">$\Re(y)$</span> and <span class="inline-math">$\Im(y)$</span> are also eigenfunctions of <span class="inline-math">$L$</span> with eigenvalue <span class="inline-math">$\lambda$</span>.
