<p>
    Let <span class="inline-math">$f,g:\R\to\C$</span>. The <em>convolution</em> of <span class="inline-math">$f$</span> and <span class="inline-math">$g$</span> is defined as
    <span class="display-math">$$ \begin{align*}
        (f*g)(x) = \int f(x-y)\,g(y) \d y.
    \end{align*} $$</span>
</p>
