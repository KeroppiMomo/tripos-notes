<p>
    Suppose <span class="inline-math">$\phi_1$</span> and <span class="inline-math">$\phi_2$</span> are solutions.
    Then <span class="inline-math">$\psi = \phi_1-\phi_2$</span> solves the initial value problem with <span class="inline-math">$f=0$</span>.
</p>
<p>
    By the <a href="/tripos-notes/Lectures/IB/Michaelmas/Methods-Me/Notes/Proposition-energy-dissipation-in-heat-equation.html">dissipation of energy</a>,
    <span class="display-math">$$ \begin{align*}
        \frac{1}{2}\int_{\Omega} \psi^2 \d V \leq Q(0) = 0
    \end{align*} $$</span>
    so <span class="inline-math">$\psi=0$</span> everywhere. Hence <span class="inline-math">$\phi_1 = \phi_2$</span>.
</p>
