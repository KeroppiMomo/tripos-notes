<p>
    Let <span class="inline-math">$f:\R\to\C$</span> be <span class="inline-math">$L$</span>-periodic.
</p>
<ul>
<li>
    <p>
        If <span class="inline-math">$f$</span> is <a href="/tripos-notes/Lectures/IA/Lent/Analysis-I-An/Notes/Definition-Riemann-integrable.html">integrable</a> on <span class="inline-math">$[0,L]$</span>, then <a href="/tripos-notes/Lectures/IB/Michaelmas/Methods-Me/Notes/Definition-complex-Fourier-series.html"><span class="inline-math">$\hat f_n$</span></a> <span class="inline-math">$\to 0$</span> as <span class="inline-math">$|n|\to\infty$</span>.
    </p>
    
</li><li>
    <p>
        If <span class="inline-math">$f$</span> is <span class="inline-math">$C^k$</span> (i.e. the <span class="inline-math">$l$</span>-derivative <span class="inline-math">$f^{(l)}: \R\to\C$</span> are continuous for <span class="inline-math">$l=0,1,\ldots,k$</span>),
        then <span class="inline-math">$|\hat f_n| =$</span> <a href="/tripos-notes/Lectures/IA/Michaelmas/Differential-Equations-DE/Definition-little-o.html"><span class="inline-math">$o$</span></a><span class="inline-math">$(1/n^k)$</span>.
    </p>
    
</li>
</ul>
<p>
    <a href="/tripos-notes/Lectures/IB/Michaelmas/Methods-Me/Notes/Proof-decay-of-Fourier-coefficients.html">Proof</a>
