<p>
    Since <span class="inline-math">$G(a;\xi) = 0 = G(b;\xi)$</span> for all <span class="inline-math">$\xi\in (a,b)$</span>,
    we also have <span class="inline-math">$y(a) = 0 = y(b)$</span>.
</p>
<p>
    Also
    <span class="display-math">$$ \begin{align*}
        Ly(x) ={}&amp; \int_{a}^{b} L[G(x;\xi)] \,f(\xi) \d \xi \\
        ={}&amp; \int_{a}^{b} \delta(x-\xi) \,f(\xi) \d \xi \\
        ={}&amp; f(x).
    \end{align*} $$</span>
</p>
