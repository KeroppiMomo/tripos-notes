<p>
    Let <span class="inline-math">$L$</span> be a <a href="/tripos-notes/Lectures/IB/Michaelmas/Methods-Me/Notes/Definition-Sturm-Liouville-operator.html">Sturm-Liouville operator</a> on <span class="inline-math">$(a,b)$</span> defined by functions <span class="inline-math">$p,q,w$</span>, and <span class="inline-math">$y_1,y_2\in C^2[a,b]$</span>.
    We have the identity
    <span class="display-math">$$ \begin{align*}
        y_2 Ly_1 - y_1 L y_2 = \frac{1}{w}\dd{x}\big(p W(y_1,y_2)\big)
    \end{align*} $$</span>
    where <span class="inline-math">$W(y_1,y_2) = y_1 y_2&#x27; - y_1&#x27; y_2$</span> is the <a href="/tripos-notes/Lectures/IA/Michaelmas/Differential-Equations-DE/Definition-Wronskian.html">Wronskian</a>.
</p>
