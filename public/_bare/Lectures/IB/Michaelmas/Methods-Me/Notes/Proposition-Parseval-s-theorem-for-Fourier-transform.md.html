<p>
    Let <span class="inline-math">$f,g:\R\to\C$</span>.
    <span class="display-math">$$ \begin{align*}
        \int f(x) \,\overline{g(x)} \d x = \frac{1}{2\pi} \int \hat f(\lambda)\, \overline{\hat g(\lambda)} \d \lambda.
    \end{align*} $$</span>
</p>
<p>
    In particular,
    <span class="display-math">$$ \begin{align*}
        \int |f(x)|^2 \d x = \frac{1}{2\pi} \int |\hat f(\lambda)|^2 \d \lambda
    \end{align*} $$</span>
</p>
