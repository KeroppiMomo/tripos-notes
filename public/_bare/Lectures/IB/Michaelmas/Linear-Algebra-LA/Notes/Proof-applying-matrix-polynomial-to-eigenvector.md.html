<p>
    Write
    <span class="display-math">$$ \begin{align*}
        p(t) = \sum_{i=0}^{m} a_i t^i.
    \end{align*} $$</span>
</p>
<p>
    Then
    <span class="display-math">$$ \begin{align*}
        p(\alpha)(v) = \sum_{i=0}^{m} a_i\alpha^i(v) = \sum_{i=0}^{m} a_i \lambda_i v = p(\lambda) v.
    \end{align*} $$</span>
</p>
