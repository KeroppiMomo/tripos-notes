<p>
    Let <span class="inline-math">$V$</span> and <span class="inline-math">$W$</span> be <span class="inline-math">$\mathbb{F}$</span>-vector spaces
    and <span class="inline-math">$\alpha: V\to W$</span> be a <a href="/tripos-notes/Lectures/IA/Michaelmas/Vectors-and-Matrices-VM/Definition-linear-map.html">linear map</a>.
    Suppose <span class="inline-math">$V$</span> is <a href="/tripos-notes/Lectures/IB/Michaelmas/Linear-Algebra-LA/Notes/Definition-finite-dimensional-vector-space.html">finite-dimensional</a>.
</p>
<p>
    Then <span class="inline-math">$\ker(\alpha)$</span> and <span class="inline-math">$\im(\alpha)$</span> are also finite-dimensional and
    <span class="display-math">$$ \begin{align*}
        \dim(V) = \dim(\ker(\alpha)) + \dim(\im(\alpha)).
    \end{align*} $$</span>
</p>
