<p>
    Let <span class="inline-math">$(V,\langle \cdot,\cdot\rangle)$</span> be an <a href="/tripos-notes/Lectures/IB/Michaelmas/Linear-Algebra-LA/Notes/Definition-inner-product-space.html">inner product space</a>.
</p>
<p>
    Define the <em>norm</em> of a vector <span class="inline-math">$v\in V$</span> as <span class="inline-math">$\|v\| = \sqrt{\langle v,v\rangle} \geq 0$</span>.
</p>
<ul>
<li>
    <p>
        <span class="inline-math">$\|v\| = 0$</span> iff <span class="inline-math">$v=\v 0$</span>.
    </p>
    
</li><li>
    <p>
        <span class="inline-math">$\|\cdot\|: V\to\R$</span> uniquely determines <span class="inline-math">$\langle \cdot,\cdot\rangle$</span> by the <a href="/tripos-notes/Lectures/IB/Michaelmas/Linear-Algebra-LA/Notes/Proposition-polarisation-identity.html">polarisation identity</a>.
    </p>
    
</li>
</ul>
