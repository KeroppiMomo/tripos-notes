<p>
    Let <span class="inline-math">$V$</span> and <span class="inline-math">$W$</span> be <span class="inline-math">$\mathbb{F}$</span>-vector spaces and <span class="inline-math">$\alpha: V\to W$</span> is a <a href="/tripos-notes/Lectures/IA/Michaelmas/Vectors-and-Matrices-VM/Definition-linear-map.html">linear map</a>.
</p>
<ul>
<li>
    <p>
        <span class="inline-math">$\op{rk}(\alpha) := \dim($</span><a href="/tripos-notes/Lectures/IB/Michaelmas/Linear-Algebra-LA/Notes/Definition-kernel-and-image-of-a-linear-map.html"><span class="inline-math">$\im(\alpha)$</span></a><span class="inline-math">$)$</span> is the <em>rank</em> of <span class="inline-math">$\alpha$</span>.
    </p>
    
</li><li>
    <p>
        <span class="inline-math">$\op{n}(\alpha) := \dim($</span><a href="/tripos-notes/Lectures/IB/Michaelmas/Linear-Algebra-LA/Notes/Definition-kernel-and-image-of-a-linear-map.html"><span class="inline-math">$\ker(\alpha)$</span></a><span class="inline-math">$)$</span> is the <em>kernel</em> of <span class="inline-math">$\alpha$</span>.
    </p>
    
</li>
</ul>
