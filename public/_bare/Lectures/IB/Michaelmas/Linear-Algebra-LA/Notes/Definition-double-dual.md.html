<p>
    For a vector space <span class="inline-math">$V$</span>, the <em>double dual</em> of <span class="inline-math">$V$</span> is the <a href="/tripos-notes/Lectures/IB/Michaelmas/Linear-Algebra-LA/Notes/Definition-dual-vector-space.html">dual space</a> of the dual space of <span class="inline-math">$V$</span>:
    <span class="display-math">$$ \begin{align*}
        V^{\star\star} = (V^\star)^\star.
    \end{align*} $$</span>
</p>
<p>
    For <span class="inline-math">$V$</span> finite-dimensional, it is common to identify <span class="inline-math">$V^{\star\star}=V$</span>: see <a href="/tripos-notes/Lectures/IB/Michaelmas/Linear-Algebra-LA/Notes/Theorem-double-dual-and-evaluation.html">here</a>.
</p>
