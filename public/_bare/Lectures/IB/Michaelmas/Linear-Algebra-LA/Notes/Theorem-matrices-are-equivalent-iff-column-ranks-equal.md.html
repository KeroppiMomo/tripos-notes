<p>

<p>

</p>
<p>
    As a consequence, <span class="inline-math">$A$</span> and <span class="inline-math">$A&#x27;$</span> are <a href="/tripos-notes/Lectures/IB/Michaelmas/Linear-Algebra-LA/Notes/Definition-equivalent-matrices.html">equivalent</a> iff <a href="/tripos-notes/Lectures/IB/Michaelmas/Linear-Algebra-LA/Notes/Definition-column-space-column-rank-row-space-row-rank.html"><span class="inline-math">$\op{c-rk}$</span></a><span class="inline-math">$(A) = \op{c-rk}(A&#x27;)$</span>.
</p>
