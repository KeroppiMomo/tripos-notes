<p>
    Let <span class="inline-math">$V$</span> be a vector space and <span class="inline-math">$U\leq V$</span>.
</p>
<p>
    There exists a surjective linear map
    <span class="display-math">$$ \begin{align*}
        \pi_U : V &amp;\to V/U \\
        v &amp;\mapsto v + U
    \end{align*} $$</span>
    with a kernel <span class="inline-math">$\ker(\pi_U) = U$</span>.
</p>
