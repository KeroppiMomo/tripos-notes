<p>
    Suppose <span class="inline-math">$1+1\neq 0$</span> in <span class="inline-math">$\mathbb{F}$</span>.
</p>
<p>
    A square matrix over <span class="inline-math">$\mathbb{F}$</span> is symmetric iff it is <a href="/tripos-notes/Lectures/IB/Michaelmas/Linear-Algebra-LA/Notes/Definition-congruent-matrix.html">congruent</a> to a diagonal matrix.
</p>
<p>
    Proof: apply <a href="/tripos-notes/Lectures/IB/Michaelmas/Linear-Algebra-LA/Notes/Theorem-matrix-of-symmetric-bilinear-map-can-be-diagonal.html">this</a> and the fact that <span class="inline-math">$[\phi]_{B&#x27;} = ([\id_V]^{B&#x27;}_{B})^T \, [\phi]_B \, [\id_V]^{B&#x27;}_{B}$</span> gives a congruence relation.
</p>
