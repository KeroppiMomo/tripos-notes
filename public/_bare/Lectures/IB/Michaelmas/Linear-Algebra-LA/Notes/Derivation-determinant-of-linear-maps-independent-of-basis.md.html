<p>
    For two bases <span class="inline-math">$B,B&#x27;$</span> for <span class="inline-math">$V$</span>,
    <span class="display-math">$$ \begin{align*}
        [\alpha]_{B&#x27;}^{B&#x27;} = [\mathrm{id}]^{B&#x27;}_B [\alpha]^B_B [\mathrm{id}]^{B}_{B&#x27;}
    \end{align*} $$</span>
    so <span class="inline-math">$[\alpha]_{B&#x27;}^{B&#x27;}$</span> and <span class="inline-math">$[\alpha]_B^B$</span> are similar.
    <a href="/tripos-notes/Lectures/IA/Michaelmas/Vectors-and-Matrices-VM/Proposition-determinant-of-products.html">Similar matrices have equal determinants.</a>
</p>
