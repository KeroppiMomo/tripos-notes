<p>
    Let <span class="inline-math">$(V,\langle \cdot,\cdot\rangle)$</span> be an <a href="/tripos-notes/Lectures/IB/Michaelmas/Linear-Algebra-LA/Notes/Definition-inner-product-space.html">inner product space</a>,
    and <span class="inline-math">$E\subseteq V$</span> be an <a href="/tripos-notes/Lectures/IB/Michaelmas/Linear-Algebra-LA/Notes/Definition-orthogonal-orthonormal-set.html">orthonormal</a> <a href="/tripos-notes/Lectures/IA/Michaelmas/Vectors-and-Matrices-VM/Definition-basis.html">basis</a>.
</p>
<p>
    For any <span class="inline-math">$u,v\in V$</span>,
    <span class="display-math">$$ \begin{align*}
        \langle u,v\rangle ={}&amp; \sum_{e\in E} &#x27; \langle u,e\rangle \overline{\langle v,e\rangle}.
    \end{align*} $$</span>
</p>
