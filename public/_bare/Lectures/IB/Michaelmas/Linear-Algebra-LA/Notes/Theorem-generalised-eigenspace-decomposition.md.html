<p>
    Let <span class="inline-math">$V$</span> be a finite-dimensional vector space over <span class="inline-math">$\C$</span>.
</p>
<p>
    For any <span class="inline-math">$\alpha\in \mathcal{L}(V,V)$</span>,
    <span class="display-math">$$ \begin{align*}
        V = V_1 \oplus V_2 \oplus \ldots \oplus V_k
    \end{align*} $$</span>
    where <span class="inline-math">$V_1, \ldots, V_k$</span> is the <a href="/tripos-notes/Lectures/IB/Michaelmas/Linear-Algebra-LA/Notes/Definition-generalised-eigenspace.html">generalised eigenspaces</a> of <span class="inline-math">$\alpha$</span>.
</p>
