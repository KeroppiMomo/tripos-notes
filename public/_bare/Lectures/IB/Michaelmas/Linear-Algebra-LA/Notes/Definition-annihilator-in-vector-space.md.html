<p>
    Let <span class="inline-math">$V$</span> be a vector space, and <span class="inline-math">$S\subseteq V$</span>.
</p>
<p>
    The <em>annihilator</em> of <span class="inline-math">$S$</span> in <a href="/tripos-notes/Lectures/IB/Michaelmas/Linear-Algebra-LA/Notes/Definition-dual-vector-space.html"><span class="inline-math">$V^\star$</span></a> is defined as
    <span class="display-math">$$ \begin{align*}
        S^0 = \sb{\theta\in V^\star}{\theta(s) = 0 \text{ for all } s\in S}.
    \end{align*} $$</span>
</p>
