<p>
    Let <span class="inline-math">$V$</span> be a vector space.
</p>
<p>
    The <em>dual space</em> of <span class="inline-math">$V$</span> is defined as <span class="inline-math">$V^\star =$</span> <a href="/tripos-notes/Lectures/IB/Michaelmas/Linear-Algebra-LA/Notes/Definition-vector-space-of-linear-maps.html"><span class="inline-math">$\mathcal{L}$</span></a><span class="inline-math">$(V,\mathbb{F})$</span>.
</p>
<p>
    An element of <span class="inline-math">$V^\star$</span> is called a <em>linear functional</em> of <span class="inline-math">$V$</span>.
</p>
