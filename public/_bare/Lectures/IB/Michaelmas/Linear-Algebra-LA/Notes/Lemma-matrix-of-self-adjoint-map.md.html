<p>
    Let <span class="inline-math">$V$</span> be a finite-dimensional inner product space over <span class="inline-math">$\R$</span> (resp. <span class="inline-math">$\C$</span>),
    and <span class="inline-math">$\alpha\in \mathcal{L}(V,V)$</span>.
</p>
<p>
    <span class="inline-math">$\alpha$</span> is <a href="/tripos-notes/Lectures/IB/Michaelmas/Linear-Algebra-LA/Notes/Definition-Hermitian-self-adjoint-operator.html">self-adjoint</a> iff
    <a href="/tripos-notes/Lectures/IB/Michaelmas/Linear-Algebra-LA/Notes/Definition-matrix-of-a-linear-map.html"><span class="inline-math">$[\alpha]_B$</span></a> is symmetric (resp. Hermitian)
    for some (or equivalently any) <a href="/tripos-notes/Lectures/IB/Michaelmas/Linear-Algebra-LA/Notes/Definition-orthogonal-orthonormal-set.html">orthonormal</a> basis <span class="inline-math">$B$</span> for <span class="inline-math">$V$</span>.
</p>
