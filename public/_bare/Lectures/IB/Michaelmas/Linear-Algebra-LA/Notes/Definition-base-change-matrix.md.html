<p>
    Let <span class="inline-math">$B$</span> and <span class="inline-math">$B&#x27;$</span> be <a href="/tripos-notes/Lectures/IB/Michaelmas/Linear-Algebra-LA/Notes/Definition-basis.html">bases</a> for a vector space <span class="inline-math">$V$</span> where <a href="/tripos-notes/Lectures/IB/Michaelmas/Linear-Algebra-LA/Notes/Definition-dimension-of-a-finite-dimensional-vector-space.html"><span class="inline-math">$\dim$</span></a><span class="inline-math">$(V) = n$</span>.
</p>
<p>
    The <em>base change matrix</em> from <span class="inline-math">$B$</span> to <span class="inline-math">$B&#x27;$</span> is <span class="inline-math">$[\mathrm{id}_V]^B_{B&#x27;} \in M_{n\times n}(\mathbb{F})$</span>.
</p>
