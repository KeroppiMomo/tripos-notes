<p>
    Let <span class="inline-math">$A\in M_{n\times n}(\mathbb{F})$</span>.
</p>
<ol start="1">
<li>
    <p>
        For any fixed column <span class="inline-math">$j$</span>,
        <span class="display-math">$$ \begin{align*}
        \det(A) = \sum_{i=1}^{n} a_{ij} (-1)^{i+j} \det(A_{\hat{ij}}).
        \end{align*} $$</span>
    </p>
    
</li><li>
    <p>
        For any fixed row <span class="inline-math">$i$</span>,
        <span class="display-math">$$ \begin{align*}
        \det(A) = \sum_{j=1}^{n} a_{ij} (-1)^{i+j} \det(A_{\hat{ij}}).
        \end{align*} $$</span>
    </p>
    
</li>
</ol>
