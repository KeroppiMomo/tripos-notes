<p>
    A bijective <a href="/tripos-notes/Lectures/IB/Michaelmas/Linear-Algebra-LA/Notes/Definition-linear-map.html">linear map</a> <span class="inline-math">$\alpha: V\to W$</span> is called an <em>isomorphism</em>.
</p>
<p>
    We say <span class="inline-math">$V$</span> are <span class="inline-math">$W$</span> are isomorphic (denoted as <span class="inline-math">$V\cong W$</span>) if there exists an isomorphism from <span class="inline-math">$V$</span> to <span class="inline-math">$W$</span>.
</p>
