<p>
    Let <span class="inline-math">$V$</span> and <span class="inline-math">$W$</span> be <a href="/tripos-notes/Lectures/IB/Michaelmas/Linear-Algebra-LA/Notes/Definition-finite-dimensional-vector-space.html">finite-dimensional</a> inner product spaces.
</p>
<p>
    For any linear map <span class="inline-math">$\alpha: V\to W$</span>,
    its <a href="/tripos-notes/Lectures/IB/Michaelmas/Linear-Algebra-LA/Notes/Definition-adjoint-map.html">adjoint map</a> <span class="inline-math">$\alpha^\star$</span> exists and is unique.
</p>
<p>
    Moreover, for any <a href="/tripos-notes/Lectures/IB/Michaelmas/Linear-Algebra-LA/Notes/Definition-orthogonal-orthonormal-set.html">orthonormal</a> bases <span class="inline-math">$B,C$</span> for <span class="inline-math">$V,W$</span>,
    <span class="display-math">$$ \begin{align*}
        [\alpha^\star]^{C}_B = \overline{[\alpha]^B_C}^T.
    \end{align*} $$</span>
</p>
<p>
