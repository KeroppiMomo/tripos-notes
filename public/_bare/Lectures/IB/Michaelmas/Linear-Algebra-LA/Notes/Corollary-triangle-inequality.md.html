<p>
    Let <span class="inline-math">$(V,\langle \cdot,\cdot\rangle)$</span> be an <a href="/tripos-notes/Lectures/IB/Michaelmas/Linear-Algebra-LA/Notes/Definition-inner-product-space.html">inner product space</a>.
    For all <span class="inline-math">$u,v\in V$</span>,
    <span class="display-math">$$ \begin{align*}
        \|u+v\| \leq \|u\| + \|v\|.
    \end{align*} $$</span>
</p>
<p>
    <a href="/tripos-notes/Lectures/IB/Michaelmas/Linear-Algebra-LA/Notes/Proof-triangle-inequality.html">Proof</a>
</p>
<ul>
<li>
    <p>
        Therefore any inner product space <span class="inline-math">$V$</span> is a <a href="/tripos-notes/Lectures/II/Michaelmas/Linear-Analysis-LAN/Notes/Definition-norm-normed-space.html">normed space</a>.
    </p>
    
</li>
</ul>
