<p>
    Let <span class="inline-math">$V$</span> be a <a href="/tripos-notes/Lectures/IB/Michaelmas/Linear-Algebra-LA/Notes/Definition-finite-dimensional-vector-space.html">finite-dimensional</a> vector space, and let <span class="inline-math">$\alpha,\beta\in$</span> <a href="/tripos-notes/Lectures/IB/Michaelmas/Linear-Algebra-LA/Notes/Definition-vector-space-of-linear-maps.html"><span class="inline-math">$\mathcal{L}(V,V)$</span></a>.
</p>
<p>
    We say <span class="inline-math">$\alpha$</span> and <span class="inline-math">$\beta$</span> are <em>simultaneously diagonalisable</em>
    if there exists a basis <span class="inline-math">$B$</span> for <span class="inline-math">$V$</span> such that <a href="/tripos-notes/Lectures/IB/Michaelmas/Linear-Algebra-LA/Notes/Definition-matrix-of-a-linear-map.html"><span class="inline-math">$[\alpha]^B_B$</span></a> and <span class="inline-math">$[\beta]^B_B$</span> are diagonal.
</p>
