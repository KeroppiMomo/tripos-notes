<p>
    For all <span class="inline-math">$w\in W$</span> and <span class="inline-math">$u\in W^\perp$</span>,
    <span class="display-math">$$ \begin{align*}
        \langle w, \alpha^\star(u)\rangle = \langle \underbrace{\alpha(w)}_{\in W}, u\rangle = 0.
    \end{align*} $$</span>
    Since this holds for all <span class="inline-math">$w\in W$</span>, <span class="inline-math">$\alpha^\star(u) \in W^\perp$</span>.
</p>
