<p>
    Let <span class="inline-math">$S, T \subseteq V$</span> be finite subsets in a vector space <span class="inline-math">$V$</span>.
    Suppose <span class="inline-math">$S$</span> is <a href="/tripos-notes/Lectures/IA/Michaelmas/Vectors-and-Matrices-VM/Definition-linear-independence.html">linearly independent</a> and <span class="inline-math">$T$</span> <a href="/tripos-notes/Lectures/IB/Michaelmas/Linear-Algebra-LA/Notes/Definition-linear-combination-span.html">spans</a> <span class="inline-math">$V$</span>.
    Then
    <span class="display-math">$$ \begin{align*}
        |S| \leq \dim(V) \leq |T|
    \end{align*} $$</span>
    with <span class="inline-math">$|S| = \dim(V)$</span> iff <span class="inline-math">$S$</span> is a <a href="/tripos-notes/Lectures/IB/Michaelmas/Linear-Algebra-LA/Notes/Definition-basis.html">basis</a>, and <span class="inline-math">$|T| = \dim(V)$</span> iff <span class="inline-math">$T$</span> is a basis.
</p>
