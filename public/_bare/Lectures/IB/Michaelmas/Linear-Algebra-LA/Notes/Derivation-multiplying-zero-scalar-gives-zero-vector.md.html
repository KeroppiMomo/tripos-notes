<p>
    Using the <a href="/tripos-notes/Lectures/IB/Michaelmas/Linear-Algebra-LA/Notes/Definition-vector-space.html">distributive law</a>,
    <span class="display-math">$$ \begin{align*}
        0v = (0 + 0) v = 0v + 0v
    \end{align*} $$</span>
    and adding <span class="inline-math">$-(0v)$</span> on both sides gives
    <span class="display-math">$$ \begin{align*}
        0v = 0.
    \end{align*} $$</span>
</p>
