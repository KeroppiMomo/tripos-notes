<p>
    Let <span class="inline-math">$V$</span> be a vector space and <span class="inline-math">$S\subseteq V$</span>.
</p>
<p>
    <span class="inline-math">$S$</span> is said to be a <em>basis</em> for <span class="inline-math">$V$</span> if
</p>
<ol start="1">
<li>
    <p>
        <span class="inline-math">$S$</span> is <a href="/tripos-notes/Lectures/IA/Michaelmas/Vectors-and-Matrices-VM/Definition-linear-independence.html">linearly independent</a>; and
    </p>
    
</li><li>
    <p>
        <span class="inline-math">$S$</span> <a href="/tripos-notes/Lectures/IB/Michaelmas/Linear-Algebra-LA/Notes/Definition-linear-combination-span.html">spans</a> <span class="inline-math">$V$</span>.
    </p>
    
</li>
</ol>
