<p>
    Let <span class="inline-math">$V$</span> be an inner product space,
    and <span class="inline-math">$\alpha\in \mathcal{L}(V,V)$</span> be <a href="/tripos-notes/Lectures/IB/Michaelmas/Linear-Algebra-LA/Notes/Definition-Hermitian-self-adjoint-operator.html">self-adjoint</a>.
</p>
<ol start="1">
<li>
    <p>
        All <a href="/tripos-notes/Lectures/IB/Michaelmas/Linear-Algebra-LA/Notes/Definition-eigenvector-eigenvalue-eigenspace.html">eigenvalues</a> of <span class="inline-math">$\alpha$</span> are real.
    </p>
    
</li><li>
    <p>
        <a href="/tripos-notes/Lectures/IB/Michaelmas/Linear-Algebra-LA/Notes/Definition-eigenvector-eigenvalue-eigenspace.html">Eigenvectors</a> of distinct eigenvalues are <a href="/tripos-notes/Lectures/IB/Michaelmas/Linear-Algebra-LA/Notes/Definition-orthogonal-orthonormal-set.html">orthogonal</a>.
    </p>
    
</li><li>
    <p>
        If <span class="inline-math">$V$</span> is <a href="/tripos-notes/Lectures/IB/Michaelmas/Linear-Algebra-LA/Notes/Definition-finite-dimensional-vector-space.html">finite-dimensional</a>, then <span class="inline-math">$\alpha$</span> has an eigenvector.
    </p>
    
</li>
</ol>
