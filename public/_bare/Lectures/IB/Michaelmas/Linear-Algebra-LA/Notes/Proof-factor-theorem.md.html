<p>
    Apply <a href="/tripos-notes/Lectures/IB/Michaelmas/Linear-Algebra-LA/Notes/Lemma-Euclidean-algorithm-for-polynomials.html">Euclidean algorithm</a> to divide <span class="inline-math">$f(t)$</span> by <span class="inline-math">$t-\lambda$</span>:
    <span class="display-math">$$ \begin{align*}
        f(t) = (t-\lambda)q(t) + r.
    \end{align*} $$</span>
</p>
<p>
    If <span class="inline-math">$\lambda$</span> is a root, then letting <span class="inline-math">$t=\lambda$</span> shows <span class="inline-math">$r=0$</span>.
</p>
<p>
    If <span class="inline-math">$(t-\lambda) \mid f(t)$</span>, then <span class="inline-math">$r=0$</span>, so <span class="inline-math">$f(\lambda) = 0$</span>.
</p>
