<p>
    Let <span class="inline-math">$V$</span> be an <a href="/tripos-notes/Lectures/IB/Michaelmas/Linear-Algebra-LA/Notes/Definition-inner-product-space.html">inner product space</a>.
</p>
<p>
    <span class="inline-math">$V$</span> is the <em>(internal) orthogonal direct sum</em> of two subspaces <span class="inline-math">$U,W\leq V$</span>
    (denoted as <span class="inline-math">$V = U\operp W$</span>) if
</p>
<ol start="1">
<li>
    <p>
        <span class="inline-math">$V = U+W$</span>; and
    </p>
    
</li><li>
    <p>
        <span class="inline-math">$\langle u,w\rangle = 0$</span> for all <span class="inline-math">$u\in U$</span> and <span class="inline-math">$w\in W$</span>.
    </p>
    
</li>
</ol>
