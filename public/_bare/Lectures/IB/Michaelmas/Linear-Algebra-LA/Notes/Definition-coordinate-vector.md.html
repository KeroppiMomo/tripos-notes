<p>
    Following the notation <a href="/tripos-notes/Lectures/IB/Michaelmas/Linear-Algebra-LA/Notes/Corollary-isomorphism-between-Fn-and-n-dimensional-vector-space.html">here</a>,
    for <span class="inline-math">$v\in V$</span>, if <span class="inline-math">$v = \sum_{i=1}^{n} \lambda_i v_i$</span>, then we write
    <span class="display-math">$$ \begin{align*}
        [v]_B \equiv \mathcal{E}_B(v) \equiv  F_B\inv(v) = \pmat{\lambda_1 \\ \lambda_2 \\ \vdots \\ \lambda_n}
    \end{align*} $$</span>
    called the <em>coordinate vector</em> of <span class="inline-math">$v$</span> with respect to <span class="inline-math">$B$</span>.
</p>
