<p>
    For <span class="inline-math">$A\in M_{n\times n}(\mathbb{F})$</span>,
    the following are equivalent:
</p>
<ol start="1">
<li>
    <p>
        <a href="/tripos-notes/Lectures/IB/Michaelmas/Linear-Algebra-LA/Notes/Definition-column-space-column-rank-row-space-row-rank.html"><span class="inline-math">$\op{rk}$</span></a><span class="inline-math">$(A) = n$</span>;
    </p>
    
</li><li>
    <p>
        <span class="inline-math">$A$</span> is a product of <a href="/tripos-notes/Lectures/IB/Michaelmas/Linear-Algebra-LA/Notes/Definition-elementary-matrices.html">elementary matrices</a>;
    </p>
    
</li><li>
    <p>
        <span class="inline-math">$A$</span> is invertible.
    </p>
    
</li><li>
    <p>
        <span class="inline-math">$A$</span> is non-singular, i.e. <span class="inline-math">$\det(A)\neq 0$</span>.
    </p>
    
</li>
</ol>
<p>
    <a href="/tripos-notes/Lectures/IB/Michaelmas/Linear-Algebra-LA/Notes/Proof-equivalent-conditions-for-invertible-matrices.html">Proof</a>
