<p>
    Hypothesis implies that <span class="inline-math">$f_1 - f_2$</span> has at least <span class="inline-math">$n$</span> roots but <span class="inline-math">$f_1-f_2$</span> has degree less than <span class="inline-math">$n$</span>.
    <a href="/tripos-notes/Lectures/IB/Michaelmas/Linear-Algebra-LA/Notes/Corollary-most-number-of-roots-of-polynomials.html">Therefore</a> <span class="inline-math">$f_1 - f_2 = 0$</span>.
</p>
