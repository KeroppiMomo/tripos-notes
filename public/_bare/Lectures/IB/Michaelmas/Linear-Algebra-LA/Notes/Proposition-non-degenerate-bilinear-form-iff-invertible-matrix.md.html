<p>
    Let <span class="inline-math">$U$</span> and <span class="inline-math">$V$</span> be finite-dimensional <span class="inline-math">$\mathbb{F}$</span>-vector spaces and <span class="inline-math">$\phi: U\times V\to \mathbb{F}$</span> be a <a href="/tripos-notes/Lectures/IB/Michaelmas/Linear-Algebra-LA/Notes/Definition-bilinear-form.html">bilinear form</a>.
</p>
<p>
    <span class="inline-math">$\phi$</span> is non-<a href="/tripos-notes/Lectures/IB/Michaelmas/Linear-Algebra-LA/Notes/Definition-degenerate-bilinear-form.html">degenerate</a> iff <span class="inline-math">$\dim U = \dim V$</span> and
    <a href="/tripos-notes/Lectures/IB/Michaelmas/Linear-Algebra-LA/Notes/Proposition-matrix-of-bilinear-and-sesquilinear-forms.html"><span class="inline-math">$[\phi]_{B,C}$</span></a> is invertible for some (<a href="/tripos-notes/Lectures/IB/Michaelmas/Linear-Algebra-LA/Notes/Corollary-ranks-of-bilinear-form-and-its-functionals.html">equivalently</a> any) bases <span class="inline-math">$B,C$</span> for <span class="inline-math">$U,V$</span>.
</p>
