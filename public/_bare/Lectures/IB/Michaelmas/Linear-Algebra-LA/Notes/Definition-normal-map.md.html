<p>
    Let <span class="inline-math">$V$</span> be a finite-dimensional inner product space.
</p>
<p>
    A map <span class="inline-math">$\alpha\in \mathcal{L}(V,V)$</span> is said to be <em>normal</em>
    if it commutes with its <a href="/tripos-notes/Lectures/IB/Michaelmas/Linear-Algebra-LA/Notes/Definition-adjoint-map.html">adjoint</a>, i.e. <span class="inline-math">$\alpha\alpha^\star = \alpha^\star \alpha$</span>.
</p>
