<p>
    Let <span class="inline-math">$V$</span> be a real (resp. complex) vector space.
</p>
<p>
    An <em>inner product</em> on <span class="inline-math">$V$</span> is a <a href="/tripos-notes/Lectures/IB/Michaelmas/Linear-Algebra-LA/Notes/Definition-bilinear-form.html">bilinear form</a> (resp. <a href="/tripos-notes/Lectures/IB/Michaelmas/Linear-Algebra-LA/Notes/Definition-sesquilinear-form.html">sesquilinear form</a>) <span class="inline-math">$\langle \cdot,\cdot\rangle$</span> on <span class="inline-math">$V$</span> that is
</p>
<ul>
<li>
    <p>
        <a href="/tripos-notes/Lectures/IB/Michaelmas/Linear-Algebra-LA/Notes/Definition-symmetric-bilinear-form.html">symmetric</a> (resp. <a href="/tripos-notes/Lectures/IB/Michaelmas/Linear-Algebra-LA/Notes/Definition-Hermitian-sesquilinear-form.html">Hermitian</a>); and
    </p>
    
</li><li>
    <p>
        <a href="/tripos-notes/Lectures/IB/Michaelmas/Linear-Algebra-LA/Notes/Definition-definite-bilinear-sesquilinear-and-quadratic-form.html">positive definite</a>.
    </p>
    
</li>
</ul>
<p>
    <span class="inline-math">$(V,\langle \cdot,\cdot\rangle)$</span> is called an <em>inner product space</em>.
</p>
