<p>
    <a href="/tripos-notes/Lectures/IB/Michaelmas/Linear-Algebra-LA/Notes/Proof-finite-dimensional-vector-space-has-a-finite-basis.html">Let</a> <span class="inline-math">$B$</span> be a finite basis of <span class="inline-math">$V$</span>.
</p>
<p>
    Suppose for a contradiction that <span class="inline-math">$B&#x27;$</span> is an infinite basis of <span class="inline-math">$V$</span>.
    Pick any subset <span class="inline-math">$B&#x27;&#x27;\subset B&#x27;$</span> with size <span class="inline-math">$|B&#x27;&#x27;| = |B|+1$</span>.
    This contradicts the <a href="/tripos-notes/Lectures/IB/Michaelmas/Linear-Algebra-LA/Notes/Proof-Steinitz-exchange-lemma.html">Steinitz exchange lemma</a>
    since a linearly independent set <span class="inline-math">$B&#x27;&#x27;$</span> is larger than a spanning set <span class="inline-math">$B$</span>.
</p>
