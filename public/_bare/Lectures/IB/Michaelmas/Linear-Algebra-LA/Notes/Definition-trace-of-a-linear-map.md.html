<p>
    Let <span class="inline-math">$V$</span> be a <a href="/tripos-notes/Lectures/IB/Michaelmas/Linear-Algebra-LA/Notes/Definition-finite-dimensional-vector-space.html">finite-dimensional</a> vector space and <span class="inline-math">$\alpha: V\to V$</span> be a <a href="/tripos-notes/Lectures/IA/Michaelmas/Vectors-and-Matrices-VM/Definition-linear-map.html">linear map</a>.
</p>
<p>
    Define the trace of <span class="inline-math">$\alpha$</span> as <span class="inline-math">$\op{tr}(\alpha) =$</span> <a href="/tripos-notes/Lectures/IB/Michaelmas/Linear-Algebra-LA/Notes/Definition-trace-of-a-matrix.html"><span class="inline-math">$\op{tr}$</span></a><span class="inline-math">$($</span><a href="/tripos-notes/Lectures/IB/Michaelmas/Linear-Algebra-LA/Notes/Definition-matrix-of-a-linear-map.html"><span class="inline-math">$[\alpha]^B_B$</span></a><span class="inline-math">$)$</span>.
</p>
<p>
    This is independent of the choice of basis, since <span class="inline-math">$[\alpha]^B_B$</span> and <span class="inline-math">$[\alpha]^{B&#x27;}_{B&#x27;}$</span> are similar.
</p>
