<p>
    Let <span class="inline-math">$V$</span> be a vector space, <span class="inline-math">$S\subseteq V$</span> is finite and <span class="inline-math">$S$</span> <a href="/tripos-notes/Lectures/IB/Michaelmas/Linear-Algebra-LA/Notes/Definition-linear-combination-span.html">spans</a> <span class="inline-math">$V$</span>.
</p>
<p>
    Then there exists a subset <span class="inline-math">$S&#x27; \subseteq S$</span> such that <span class="inline-math">$S&#x27;$</span> is a <a href="/tripos-notes/Lectures/IB/Michaelmas/Linear-Algebra-LA/Notes/Definition-basis.html">basis</a> of <span class="inline-math">$V$</span>.
</p>
