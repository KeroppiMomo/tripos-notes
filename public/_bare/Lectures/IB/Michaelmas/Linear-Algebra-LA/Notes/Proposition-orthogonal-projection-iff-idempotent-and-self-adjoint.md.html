<p>
    Let <span class="inline-math">$V$</span> be a <a href="/tripos-notes/Lectures/IB/Michaelmas/Linear-Algebra-LA/Notes/Definition-finite-dimensional-vector-space.html">finite-dimensional</a> inner product space, and <span class="inline-math">$\alpha\in \mathcal{L}(V,V)$</span>.
</p>
<p>
    <span class="inline-math">$\alpha$</span> is an <a href="/tripos-notes/Lectures/IB/Michaelmas/Linear-Algebra-LA/Notes/Definition-orthogonal-projection.html">orthogonal projection</a> iff <span class="inline-math">$\alpha$</span> is <a href="/tripos-notes/Lectures/IB/Michaelmas/Linear-Algebra-LA/Notes/Definition-Hermitian-self-adjoint-operator.html">self-adjoint</a> and <span class="inline-math">$\alpha^2 = \alpha$</span>.
</p>
