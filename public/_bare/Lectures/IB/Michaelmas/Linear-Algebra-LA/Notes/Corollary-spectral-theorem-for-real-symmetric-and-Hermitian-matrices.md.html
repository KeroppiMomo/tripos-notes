<p>
    Let <span class="inline-math">$A\in M_{n\times n}(\R)$</span> be symmetric (resp. <span class="inline-math">$A\in M_{n\times n}(\C)$</span> be Hermitian).
    Then there exists
    <span class="inline-math">$P\in O(n)$</span> (resp. <span class="inline-math">$P\in U(n)$</span>) such that
    <span class="inline-math">$PAP\inv\in M_{n\times n}(\R)$</span> is diagonal.
