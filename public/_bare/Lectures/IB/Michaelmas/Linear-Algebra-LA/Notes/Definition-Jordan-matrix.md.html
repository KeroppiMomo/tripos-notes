<p>
    Let <span class="inline-math">$\lambda\in \C$</span> and <span class="inline-math">$n\in \N$</span>. The <em><span class="inline-math">$n\times n$</span> <span class="inline-math">$\lambda$</span>-Jordan matrix</em> is defined as
    <span class="display-math">$$ \begin{align*}
        \pmat{\lambda &amp; 1 \\
        &amp; \lambda &amp; 1 \\
        &amp; &amp; \ddots &amp; \ddots \\
        &amp; &amp; &amp; \lambda &amp; 1 \\
        &amp;&amp;&amp;&amp;\lambda} \in M_{n\times n}(\mathbb{C}).
    \end{align*} $$</span>
</p>
