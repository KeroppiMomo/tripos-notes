<p>
    For all <span class="inline-math">$A,B\in M_{n\times n}(\mathbb{F})$</span>, <span class="inline-math">$\det(AB) = \det(A) \det(B)$</span>.
</p>
<p>
    <a href="/tripos-notes/Lectures/IB/Michaelmas/Linear-Algebra-LA/Notes/Proof-determinant-of-products.html">Proof</a>
</p>
<p>
    This shows that <span class="inline-math">$\det(A\inv) = \det(A)\inv$</span> and similar matrices have equal determinants.
</p>
