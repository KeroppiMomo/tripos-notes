<p>
    Let <span class="inline-math">$V$</span> be a vector space, and <span class="inline-math">$U, W \leq V$</span>.
</p>
<p>
    If <span class="inline-math">$V = U$</span> <a href="/tripos-notes/Lectures/IB/Michaelmas/Linear-Algebra-LA/Notes/Definition-internal-direct-sum.html"><span class="inline-math">$\oplus$</span></a> <span class="inline-math">$W$</span>, then <a href="/tripos-notes/Lectures/IB/Michaelmas/Linear-Algebra-LA/Notes/Definition-annihilator-in-vector-space.html"><span class="inline-math">$U^0$</span></a> <span class="inline-math">$\isom$</span> <a href="/tripos-notes/Lectures/IB/Michaelmas/Linear-Algebra-LA/Notes/Definition-dual-vector-space.html"><span class="inline-math">$W^\star$</span></a>.
</p>
<p>
    In particular, if <span class="inline-math">$V$</span> is finite-dimensional, then
    <span class="display-math">$$ \begin{align*}
        \dim(V) = \dim(U) + \dim(U^0).
    \end{align*} $$</span>
</p>
