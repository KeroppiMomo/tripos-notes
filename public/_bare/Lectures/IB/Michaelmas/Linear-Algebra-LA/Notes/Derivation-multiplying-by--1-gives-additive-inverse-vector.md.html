<p>
    Using the <a href="/tripos-notes/Lectures/IB/Michaelmas/Linear-Algebra-LA/Notes/Definition-vector-space.html">the axioms of vector spaces</a>,
    <span class="display-math">$$ \begin{align*}
        v + (-1)v = 1v + (-1)v = (1+(-1))v = 0v = \v 0
    \end{align*} $$</span>
    so <span class="inline-math">$(-1)v = -v$</span>.
</p>
