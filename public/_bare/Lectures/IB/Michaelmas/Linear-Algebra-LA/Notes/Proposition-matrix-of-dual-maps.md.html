    Let <span class="inline-math">$V$</span> and <span class="inline-math">$W$</span> be <a href="/tripos-notes/Lectures/IB/Michaelmas/Linear-Algebra-LA/Notes/Definition-finite-dimensional-vector-space.html">finite-dimensional</a> vector spaces, and <span class="inline-math">$\alpha\in \mathcal{L}(V,W)$</span>.
    Further let <span class="inline-math">$B$</span> be a basis for <span class="inline-math">$V$</span> and <span class="inline-math">$C$</span> be a basis for <span class="inline-math">$W$</span>.
    Then
    <span class="display-math">$$ \begin{align*}
        [\alpha^\star]^{C^\star}_{B^\star} = \big([\alpha]^B_C\big)^T.
    \end{align*} $$</span>
