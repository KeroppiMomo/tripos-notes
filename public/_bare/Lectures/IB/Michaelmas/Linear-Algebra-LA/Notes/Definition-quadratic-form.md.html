<p>
    Let <span class="inline-math">$V$</span> be an <span class="inline-math">$\mathbb{F}$</span>-vector space.
</p>
<p>
    A function <span class="inline-math">$Q: V\to \mathbb{F}$</span> is said to be a <em>quadratic form</em>
    if there exists a <a href="/tripos-notes/Lectures/IB/Michaelmas/Linear-Algebra-LA/Notes/Definition-bilinear-form.html">bilinear form</a> <span class="inline-math">$\phi: V\times V\to \mathbb{F}$</span>
    such that <span class="inline-math">$Q(v) = \phi(v,v)$</span> for all <span class="inline-math">$v\in V$</span>.
</p>
