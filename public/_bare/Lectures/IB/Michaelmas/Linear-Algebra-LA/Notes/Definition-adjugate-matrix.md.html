<p>
    Let <span class="inline-math">$A\in M_{n\times n}(\mathbb{F})$</span>.
</p>
<p>
    The <em>adjugate matrix</em> <span class="inline-math">$\op{adj}(A) \in M_{n\times n}(\mathbb{F})$</span> is defined by
    <span class="display-math">$$ \begin{align*}
        \op{adj}(A)_{i,j} = (-1)^{i+j} \det(A_{\hat{ji}}).
    \end{align*} $$</span>
</p>
