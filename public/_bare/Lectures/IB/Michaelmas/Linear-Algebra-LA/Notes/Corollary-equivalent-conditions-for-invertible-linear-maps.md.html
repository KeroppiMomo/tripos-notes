<p>
    Let <span class="inline-math">$V$</span> be a finite-dimensional vector space and <span class="inline-math">$\alpha: V\to V$</span> be a linear map.
    The following are equivalent:
</p>
<ol start="1">
<li>
    <p>
        <a href="/tripos-notes/Lectures/IA/Michaelmas/Vectors-and-Matrices-VM/Definition-rank-nullity.html"><span class="inline-math">$\op{rk}$</span></a><span class="inline-math">$(\alpha) = \dim(V)$</span>;
    </p>
    
</li><li>
    <p>
        <span class="inline-math">$\alpha$</span> is invertible;
    </p>
    
</li><li>
    <p>
        <span class="inline-math">$\alpha$</span> is non-singular, i.e. <a href="/tripos-notes/Lectures/IB/Michaelmas/Linear-Algebra-LA/Notes/Definition-determinant-of-linear-maps.html"><span class="inline-math">$\det$</span></a><span class="inline-math">$(\alpha) \neq 0$</span>.
    </p>
    
</li>
</ol>
<p>
    <a href="/tripos-notes/Lectures/IB/Michaelmas/Linear-Algebra-LA/Notes/Proof-equivalent-conditions-for-invertible-linear-maps.html">Proof</a>
</p>
