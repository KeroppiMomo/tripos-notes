<p>
    Every <a href="/tripos-notes/Lectures/IB/Michaelmas/Linear-Algebra-LA/Notes/Definition-finite-dimensional-vector-space.html">finite-dimensional vector space</a>
    has a finite <a href="/tripos-notes/Lectures/IB/Michaelmas/Linear-Algebra-LA/Notes/Definition-basis.html">basis</a>.
</p>
<p>
    Proof: a finite-dimensional vector space has a finite spanning set, which <a href="/tripos-notes/Lectures/IB/Michaelmas/Linear-Algebra-LA/Notes/Proposition-finite-spanning-set-contains-basis.html">contains a basis</a>.
</p>
