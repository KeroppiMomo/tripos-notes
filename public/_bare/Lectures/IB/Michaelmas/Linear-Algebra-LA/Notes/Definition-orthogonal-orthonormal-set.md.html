<p>
    Let <span class="inline-math">$(V,\langle \cdot,\cdot\rangle)$</span> be an <a href="/tripos-notes/Lectures/IB/Michaelmas/Linear-Algebra-LA/Notes/Definition-inner-product-space.html">inner product space</a>.
    A subset <span class="inline-math">$E\subseteq V$</span> is said to be
</p>
<ul>
<li>
    <p>
        <em>orthogonal</em> if <span class="inline-math">$\langle d,e\rangle = 0$</span> for all <span class="inline-math">$d,e\in E$</span> with <span class="inline-math">$d\neq e$</span>; and
    </p>
    
</li><li>
    <p>
        <em>orthonormal</em> if <span class="inline-math">$\langle d,e\rangle = \delta_{d,e}$</span> for all <span class="inline-math">$d,e\in E$</span>.
    </p>
    
</li>
</ul>
