<p>
    A <a href="/tripos-notes/Lectures/IB/Michaelmas/Linear-Algebra-LA/Notes/Definition-sesquilinear-form.html">sesquilinear form</a> <span class="inline-math">$\phi: V\times V\to \mathbb{F}$</span> is said to be <em>Hermitian</em>
    if for all <span class="inline-math">$u,v\in V$</span>,
    <span class="inline-math">$\phi(u,v) = \overline{\phi(v,u)}$</span>.
</p>
