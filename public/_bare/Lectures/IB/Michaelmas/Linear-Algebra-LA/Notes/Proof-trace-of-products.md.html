<p>
    <span class="display-math">$$ \begin{align*}
        \op{tr}(AB) ={}&amp; \sum_{i=1}^{n}(AB)_{i,i} \\
        ={}&amp; \sum_{i=1}^{n} \sum_{j=1}^{n} A_{i,j} B_{j,i} \\
        ={}&amp; \sum_{j=1}^{n} \sum_{i=1}^{n} B_{j,i} A_{i,j} \\
        ={}&amp; \sum_{j=1}^{n} (BA)_{j,j} \\
        ={}&amp; \op{tr}(BA).
    \end{align*} $$</span>
</p>
