<p>
    A <a href="/tripos-notes/Lectures/IB/Michaelmas/Linear-Algebra-LA/Notes/Definition-bilinear-form.html">bilinear form</a> <span class="inline-math">$\phi:V\times V\to \mathbb{F}$</span> is said to be <em>symmetric</em> if
    for all <span class="inline-math">$u,v\in V$</span>, <span class="inline-math">$\phi(u,v) = \phi(v,u)$</span>.
</p>
