<p>
    Let <span class="inline-math">$V$</span> be an <span class="inline-math">$\mathbb{F}$</span>-vector space and <span class="inline-math">$\alpha\in$</span> <a href="/tripos-notes/Lectures/IB/Michaelmas/Linear-Algebra-LA/Notes/Definition-vector-space-of-linear-maps.html"><span class="inline-math">$\mathcal{L}(V,V)$</span></a>.
</p>
<p>
    Let <span class="inline-math">$I_\alpha = \sb{f\in \mathbb{F}[t]}{f(\alpha) = 0}$</span>.
</p>
<p>
    Define the <em>minimal polynomial</em> of <span class="inline-math">$\alpha$</span>
    as the <a href="/tripos-notes/Lectures/IB/Michaelmas/Linear-Algebra-LA/Notes/Definition-polynomial-degree-monic-polynomial-function-root.html">monic</a> non-zero polynomial <span class="inline-math">$m_a\in I_\alpha\setminus \set{0}$</span>
    of minimal degree.
