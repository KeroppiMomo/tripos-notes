<p>
    Let <span class="inline-math">$V$</span> and <span class="inline-math">$W$</span> be <span class="inline-math">$\mathbb{F}$</span>-vector spaces and <span class="inline-math">$\alpha\in \mathcal{L}(V,W)$</span>.
    Then
</p>
<ol start="1">
<li>
    <p>
        <span class="inline-math">$\ker(\alpha^\star) = \im(\alpha)^0$</span>;
    </p>
    
</li><li>
    <p>
        <span class="inline-math">$\im(\alpha^\star) \leq \ker(\alpha)^0$</span>;
    </p>
    
</li><li>
    <p>
        If <span class="inline-math">$V$</span> and <span class="inline-math">$W$</span> are finite-dimensional, then we have equality in 2., i.e. <span class="inline-math">$\im(\alpha^\star) = \ker(\alpha)^0$</span>.
    </p>
    
</li>
</ol>
