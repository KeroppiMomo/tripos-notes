<p>
    Let <span class="inline-math">$A, A&#x27; \in M_{n\times n}(\mathbb{F})$</span>.
</p>
<p>
    <span class="inline-math">$A$</span> and <span class="inline-math">$A&#x27;$</span> are said to be <em>similar</em> if
    there exists <span class="inline-math">$P\in \mathrm{GL}_n(\mathbb{F})$</span> such that <span class="inline-math">$A&#x27; = PAP\inv$</span>.
</p>
