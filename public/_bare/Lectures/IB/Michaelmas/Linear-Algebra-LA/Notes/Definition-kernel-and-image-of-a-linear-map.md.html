<p>
    Let <span class="inline-math">$\alpha: V\to W$</span> be a <a href="/tripos-notes/Lectures/IB/Michaelmas/Linear-Algebra-LA/Notes/Definition-linear-map.html">linear map</a>. Define
</p>
<ul>
<li>
    <p>
        <span class="inline-math">$\ker(\alpha) = \sb{v\in V}{\alpha(v) = \v 0_W}$</span> as the <em>kernel</em> of <span class="inline-math">$\alpha$</span>;
    </p>
    
</li><li>
    <p>
        <span class="inline-math">$\im(\alpha) = \sb{\alpha(v)}{v\in V}$</span> as the <em>image</em> of <span class="inline-math">$\alpha$</span>.
    </p>
    
</li>
</ul>
