<p>
    Let <span class="inline-math">$A\in M_{m\times n}(\mathbb{F})$</span>, <span class="inline-math">$1\leq i\leq m$</span> and <span class="inline-math">$1\leq j\leq n$</span>.
</p>
<p>
    The <span class="inline-math">$(i,j)$</span>-<em>minor matrix</em> <span class="inline-math">$A_{\hat{ij}}\in M_{(m-1)\times(n-1)}(\mathbb{F})$</span>
    of <span class="inline-math">$A$</span> is obtained from <span class="inline-math">$A$</span> by deleting <span class="inline-math">$i$</span> and column <span class="inline-math">$j$</span>.
</p>
