<p>
    Let <span class="inline-math">$V$</span> and <span class="inline-math">$W$</span> be vector spaces, and <span class="inline-math">$\alpha\in \mathcal{L}(V,W)$</span>.
    The <em>dual map</em> of <span class="inline-math">$\alpha$</span> is defined as
    <span class="display-math">$$ \begin{align*}
        \alpha^\star: W^\star &amp;\to V^\star \\
        \theta &amp;\mapsto \theta\circ\alpha.
    \end{align*} $$</span>
</p>
