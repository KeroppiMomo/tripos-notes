<p>
    Let <span class="inline-math">$V$</span> and <span class="inline-math">$W$</span> be <a href="/tripos-notes/Lectures/IB/Michaelmas/Linear-Algebra-LA/Notes/Definition-inner-product-space.html">inner product spaces</a> and
    <span class="inline-math">$\alpha: V\to W$</span> be a <a href="/tripos-notes/Lectures/IA/Michaelmas/Vectors-and-Matrices-VM/Definition-linear-map.html">linear map</a>.
</p>
<p>
    A linear map <span class="inline-math">$\alpha^\star: W\to V$</span> is called an <em>adjoint map</em> to <span class="inline-math">$\alpha$</span> if
    <span class="display-math">$$ \begin{align*}
        \langle \alpha(v), w\rangle_W = \langle v, \alpha^\star(w)\rangle_V \qquad \text{for all }v\in V, w\in W.
    \end{align*} $$</span>
</p>
