<p>
    Let <span class="inline-math">$V$</span> be an inner product space.
</p>
<p>
    <span class="inline-math">$\alpha\in \mathcal{L}(V,V)$</span> is said to be <em>Hermitian</em>
    or <em>self-adjoint</em> if <span class="inline-math">$\alpha$</span> is an <a href="/tripos-notes/Lectures/IB/Michaelmas/Linear-Algebra-LA/Notes/Definition-adjoint-map.html">adjoint map</a> to itself.
</p>
