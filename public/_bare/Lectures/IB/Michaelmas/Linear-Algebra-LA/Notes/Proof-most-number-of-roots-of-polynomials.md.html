<p>
    The sum of multiplicities is the degree of the left hand side of
    <span class="display-math">$$ \begin{align*}
        (t-\lambda_1)^{e_1} (t-\lambda_2)^{e_2} \ldots (t-\lambda_n)^{e_n} \mid f(t)
    \end{align*} $$</span>
    so it cannot be larger than the degree of <span class="inline-math">$f$</span>.
</p>
