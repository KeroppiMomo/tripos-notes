    <span class="inline-math">$\phi$</span> is non-degenerate <span class="inline-math">$\iff$</span> <span class="inline-math">$\ker(\phi_L)$</span> and <span class="inline-math">$\ker(\phi_R)$</span> are trivial <span class="inline-math">$\iff$</span> <span class="inline-math">$\dim(U)$</span> <a href="/tripos-notes/Lectures/IA/Michaelmas/Vectors-and-Matrices-VM/Theorem-rank-nullity.html"><span class="inline-math">$=$</span></a> <span class="inline-math">$\rk(\phi_L)$</span> <a href="/tripos-notes/Lectures/IB/Michaelmas/Linear-Algebra-LA/Notes/Corollary-ranks-of-bilinear-form-and-its-functionals.html"><span class="inline-math">$=$</span></a> <span class="inline-math">$\rk(\phi) = \rk(\phi_R) = \dim(V) \iff [\phi]_{B,C}$</span> is a square matrix of full rank.
