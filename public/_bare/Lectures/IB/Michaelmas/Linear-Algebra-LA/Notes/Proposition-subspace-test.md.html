<p>
    A subset <span class="inline-math">$U\subseteq V$</span> is a <a href="/tripos-notes/Lectures/IB/Michaelmas/Linear-Algebra-LA/Notes/Definition-vector-subspace.html">subspace</a> of a vector space <span class="inline-math">$V$</span> iff
</p>
<ol start="1">
<li>
    <p>
        <span class="inline-math">$U$</span> is non-empty;
    </p>
    
</li><li>
    <p>
        for all <span class="inline-math">$\lambda\in\mathbb{F}$</span> and <span class="inline-math">$u,w\in U$</span>, we have <span class="inline-math">$u+\lambda w \in U$</span>.
    </p>
    
</li>
</ol>
