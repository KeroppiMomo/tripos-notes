<p>
    Apply the <a href="/tripos-notes/Lectures/IB/Michaelmas/Linear-Algebra-LA/Notes/Proposition-subspace-test.html">subspace test</a>:
</p>
<ol start="1">
<li>
    <p>
        <span class="inline-math">$\v 0\in U$</span> (as <span class="inline-math">$U\leq V$</span>) and <span class="inline-math">$\v 0\in W$</span> (as <span class="inline-math">$W\leq V$</span>), so <span class="inline-math">$\v 0\in U\cap W$</span>.
    </p>
    
</li><li>
    <p>
        For all <span class="inline-math">$x,y\in U\cap W$</span> and <span class="inline-math">$\lambda\in\mathbb{F}$</span>,
        we have <span class="inline-math">$x+\lambda y\in U$</span> (as <span class="inline-math">$x,y\in U$</span>) and <span class="inline-math">$x+\lambda y\in W$</span> (as <span class="inline-math">$x,y\in W$</span>),
        so <span class="inline-math">$x+\lambda y\in U\cap W$</span>.
    </p>
    
</li>
</ol>
