<p>
    Let <span class="inline-math">$V$</span> be a <a href="/tripos-notes/Lectures/IB/Michaelmas/Linear-Algebra-LA/Notes/Definition-finite-dimensional-vector-space.html">finite-dimensional vector space</a>
    and <span class="inline-math">$U$</span> <a href="/tripos-notes/Lectures/IB/Michaelmas/Linear-Algebra-LA/Notes/Definition-vector-subspace.html"><span class="inline-math">$\leq$</span></a> <span class="inline-math">$V$</span>.
</p>
<p>
    For any basis <span class="inline-math">$B_U$</span> of <span class="inline-math">$U$</span>, there exists a basis <span class="inline-math">$B_V$</span> for <span class="inline-math">$V$</span> with <span class="inline-math">$B_U \subseteq B_V$</span>.
</p>
