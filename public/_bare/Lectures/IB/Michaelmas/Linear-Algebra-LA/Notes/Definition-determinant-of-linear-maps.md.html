<p>
    Let <span class="inline-math">$V$</span> be finite-dimensional vector space and <span class="inline-math">$\alpha: V\to V$</span> be a linear map.
</p>
<p>
    Define the <em>determinant</em> of <span class="inline-math">$\alpha$</span> as <span class="inline-math">$\det(\alpha) =$</span> <a href="/tripos-notes/Lectures/IB/Michaelmas/Linear-Algebra-LA/Notes/Theorem-determinant-as-unique-volume-form.html"><span class="inline-math">$\det$</span></a><span class="inline-math">$($</span><a href="/tripos-notes/Lectures/IB/Michaelmas/Linear-Algebra-LA/Notes/Definition-matrix-of-a-linear-map.html"><span class="inline-math">$[A]^B_B$</span></a><span class="inline-math">$)$</span>,
    where <span class="inline-math">$B$</span> is a basis for <span class="inline-math">$V$</span>.
</p>
<p>
    <span class="inline-math">$\det(\alpha)$</span> does not depend on the basis chosen. (<a href="/tripos-notes/Lectures/IB/Michaelmas/Linear-Algebra-LA/Notes/Derivation-determinant-of-linear-maps-independent-of-basis.html">Derivation</a>)
</p>
