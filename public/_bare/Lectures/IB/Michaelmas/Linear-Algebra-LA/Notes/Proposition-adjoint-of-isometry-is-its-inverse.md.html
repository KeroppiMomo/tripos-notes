<p>
    Let <span class="inline-math">$V$</span> be an inner product space and <span class="inline-math">$\alpha\in \mathcal{L}(V,V)$</span> .
    Suppose <span class="inline-math">$\alpha$</span> has an <a href="/tripos-notes/Lectures/IB/Michaelmas/Linear-Algebra-LA/Notes/Definition-adjoint-map.html">adjoint map</a> <span class="inline-math">$\alpha^\star$</span>.
</p>
<p>
    <span class="inline-math">$\alpha$</span> is an <a href="/tripos-notes/Lectures/IB/Michaelmas/Linear-Algebra-LA/Notes/Definition-isometry-in-inner-product-spaces.html">isometry</a> iff <span class="inline-math">$\alpha$</span> is invertible and <span class="inline-math">$\alpha\inv = \alpha^\star$</span>.
</p>
