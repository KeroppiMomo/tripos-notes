<p>
    <span class="inline-math">$\ker(\alpha)\leq V$</span> <a href="/tripos-notes/Lectures/IB/Michaelmas/Linear-Algebra-LA/Notes/Proposition-dimension-of-subspace.html">so</a> <span class="inline-math">$\ker(\alpha)$</span> is finite-dimensional.
    The <a href="/tripos-notes/Lectures/IB/Michaelmas/Linear-Algebra-LA/Notes/Theorem-first-isomorphism-theorem-for-vector-spaces.html">first isomorphism theorem</a> states that
    <span class="inline-math">$V/\ker(\alpha) \cong \im(\alpha)$</span>, so
    <span class="display-math">$$ \begin{align*}
        \dim(\im(\alpha)) = \dim(V/\ker(\alpha)) = \dim(V) - \dim(\ker(\alpha)),
    \end{align*} $$</span>
    which follows from <a href="/tripos-notes/Lectures/IB/Michaelmas/Linear-Algebra-LA/Notes/Lemma-dimension-of-quotient-spaces.html">here</a>.
</p>
