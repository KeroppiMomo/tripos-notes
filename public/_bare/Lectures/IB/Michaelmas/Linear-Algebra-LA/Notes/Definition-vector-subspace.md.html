<p>
    Let <span class="inline-math">$V$</span> be a <span class="inline-math">$\mathbb{F}$</span>-<a href="/tripos-notes/Lectures/IB/Michaelmas/Linear-Algebra-LA/Notes/Definition-vector-space.html">vector space</a>.
</p>
<p>
    A subset <span class="inline-math">$U\subseteq V$</span> is said to be a <em>subspace</em> of <span class="inline-math">$V$</span> (denoted as <span class="inline-math">$U\leq V$</span>)
    if it is a <span class="inline-math">$\mathbb{F}$</span>-vector space under the same operations as <span class="inline-math">$V$</span>,
    i.e. <span class="inline-math">$(U, +)$</span> is a subgroup of <span class="inline-math">$(V, +)$</span>, and <span class="inline-math">$\lambda u\in U$</span> for all <span class="inline-math">$\lambda\in\mathbb{F}$</span> and <span class="inline-math">$u\in U$</span>.
</p>
