<p>
    <span class="inline-math">$\alpha$</span> is injective <a href="/tripos-notes/Lectures/IB/Michaelmas/Linear-Algebra-LA/Notes/Derivation-injective-linear-map-iff-trivial-kernel.html"><span class="inline-math">$\iff$</span></a> <span class="inline-math">$\ker(\alpha) = \set{\v 0}\iff \dim(\ker(\alpha)) = 0$</span>.
    Also <span class="inline-math">$\alpha$</span> is surjective <span class="inline-math">$\iff \im(\alpha) = W \iff \dim(\im(\alpha)) = \dim(V)$</span>.
    So by the <a href="/tripos-notes/Lectures/IB/Michaelmas/Linear-Algebra-LA/Notes/Theorem-rank-nullity.html">rank-nullity theorem</a>,
    these are equivalent.
</p>
