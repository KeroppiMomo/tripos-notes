<p>
    Two <span class="inline-math">$m\times n$</span> matrices <span class="inline-math">$A, A&#x27;$</span> are said to be <em>equivalent</em>
    if there exists invertible <span class="inline-math">$m\times m$</span> matrix <span class="inline-math">$P$</span> and <span class="inline-math">$n\times n$</span> matrix <span class="inline-math">$Q$</span>
    such that
    <span class="display-math">$$ \begin{align*}
        A&#x27; = PAQ.
    \end{align*} $$</span>
</p>
<p>
    Equivalently, if <span class="inline-math">$A&#x27;$</span> can be obtained from <span class="inline-math">$B$</span> by a sequence
    of <a href="/tripos-notes/Lectures/IB/Michaelmas/Linear-Algebra-LA/Notes/Definition-elementary-operations.html">row and column operations</a>.
</p>
