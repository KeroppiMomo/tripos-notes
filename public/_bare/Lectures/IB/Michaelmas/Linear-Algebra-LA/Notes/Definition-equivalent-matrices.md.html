<p>
    <span class="inline-math">$A, A&#x27;\in M_{m\times n}(\mathbb{F})$</span> are said to be <em>equivalent</em>
    if there exists <span class="inline-math">$P\in$</span> <a href="/tripos-notes/Lectures/IA/Michaelmas/Groups-Gp/Definition-general-linear-group.html"><span class="inline-math">$\mathrm{GL}_m(\mathbb{F})$</span></a>
    and <span class="inline-math">$Q\in \mathrm{GL}_n(\mathbb{F})$</span> such that
    <span class="display-math">$$ \begin{align*}
        A&#x27; = PAQ.
    \end{align*} $$</span>
</p>
