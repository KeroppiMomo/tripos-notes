<p>
    Let <span class="inline-math">$V$</span> be a finite-dimensional vector space over <span class="inline-math">$\R$</span> (resp. <span class="inline-math">$\C$</span>).
</p>
<p>
    If <span class="inline-math">$\phi,\psi$</span> be <a href="/tripos-notes/Lectures/IB/Michaelmas/Linear-Algebra-LA/Notes/Definition-symmetric-bilinear-form.html">symmetric</a> <a href="/tripos-notes/Lectures/IB/Michaelmas/Linear-Algebra-LA/Notes/Definition-bilinear-form.html">bilinear forms</a> (resp. <a href="/tripos-notes/Lectures/IB/Michaelmas/Linear-Algebra-LA/Notes/Definition-Hermitian-sesquilinear-form.html">Hermitian</a> <a href="/tripos-notes/Lectures/IB/Michaelmas/Linear-Algebra-LA/Notes/Definition-sesquilinear-form.html">sesquilinear forms</a>)
    and <span class="inline-math">$\phi$</span> is <a href="/tripos-notes/Lectures/IB/Michaelmas/Linear-Algebra-LA/Notes/Definition-definite-bilinear-sesquilinear-and-quadratic-form.html">positive definite</a>,
    then there exists a basis <span class="inline-math">$B$</span> for <span class="inline-math">$V$</span> such that <span class="inline-math">$[\phi]_B = I_n$</span> and <span class="inline-math">$[\psi]_B$</span> is real and diagonal.
</p>
