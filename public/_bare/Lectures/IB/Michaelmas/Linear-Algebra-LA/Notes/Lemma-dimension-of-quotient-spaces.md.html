<p>
    Let <span class="inline-math">$V$</span> be a <a href="/tripos-notes/Lectures/IB/Michaelmas/Linear-Algebra-LA/Notes/Definition-finite-dimensional-vector-space.html">finite-dimensional vector space</a> and <span class="inline-math">$U$</span> <a href="/tripos-notes/Lectures/IB/Michaelmas/Linear-Algebra-LA/Notes/Definition-vector-subspace.html"><span class="inline-math">$\leq$</span></a> <span class="inline-math">$V$</span>.
</p>
<p>
    Then <span class="inline-math">$V/U$</span> is finite-dimensional and
    <span class="display-math">$$ \begin{align*}
        \dim(V/U) = \dim(V) - \dim(U).
    \end{align*} $$</span>
</p>
