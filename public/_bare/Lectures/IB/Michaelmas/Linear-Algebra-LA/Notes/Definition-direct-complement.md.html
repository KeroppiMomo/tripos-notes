<p>
    Let <span class="inline-math">$V$</span> be a vector space and let <span class="inline-math">$U,W\leq V$</span>.
</p>
<p>
    We say <span class="inline-math">$W$</span> is a <em>direct complement</em> to <span class="inline-math">$U$</span> in <span class="inline-math">$V$</span> if <span class="inline-math">$V = U$</span> <a href="/tripos-notes/Lectures/IB/Michaelmas/Linear-Algebra-LA/Notes/Definition-internal-direct-sum.html"><span class="inline-math">$\oplus$</span></a> <span class="inline-math">$W$</span>.
</p>
