<p>
    Let <span class="inline-math">$V$</span> be a <a href="/tripos-notes/Lectures/IB/Michaelmas/Linear-Algebra-LA/Notes/Definition-finite-dimensional-vector-space.html">finite-dimensional</a> vector space, and let <span class="inline-math">$U,W$</span> <a href="/tripos-notes/Lectures/IB/Michaelmas/Linear-Algebra-LA/Notes/Definition-vector-subspace.html"><span class="inline-math">$\leq$</span></a> <span class="inline-math">$V$</span>.
</p>
<p>
    Then <span class="inline-math">$U+W$</span> is finite-dimensional, and
    <span class="display-math">$$ \begin{align*}
        \dim(U+W) = \dim(U) + \dim(W) - \dim(U\cap W).
    \end{align*} $$</span>
    <a href="/tripos-notes/Lectures/IB/Michaelmas/Linear-Algebra-LA/Notes/Proof-sum-intersection-formula.html">Proof</a>
</p>
