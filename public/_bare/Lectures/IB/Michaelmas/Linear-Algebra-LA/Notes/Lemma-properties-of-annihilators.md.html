<p>
    Let <span class="inline-math">$V$</span> be a vector space, and <span class="inline-math">$S, T\subseteq V$</span>.
</p>
<ol start="1">
<li>
    <p>
        <a href="/tripos-notes/Lectures/IB/Michaelmas/Linear-Algebra-LA/Notes/Definition-annihilator-in-vector-space.html"><span class="inline-math">$S^0$</span></a> <span class="inline-math">$\leq$</span> <a href="/tripos-notes/Lectures/IB/Michaelmas/Linear-Algebra-LA/Notes/Definition-dual-vector-space.html"><span class="inline-math">$V^\star$</span></a>.
    </p>
    
</li><li>
    <p>
        If <span class="inline-math">$S\subseteq T$</span>, then <span class="inline-math">$T^0 \leq S^0$</span>.
    </p>
    
</li><li>
    <p>
        <span class="inline-math">$S^0 =$</span> <a href="/tripos-notes/Lectures/IB/Michaelmas/Linear-Algebra-LA/Notes/Definition-linear-combination-span.html"><span class="inline-math">$\langle S\rangle$</span></a><span class="inline-math">$^0$</span>.
    </p>
    
</li><li>
    <p>
        <span class="inline-math">$\set{\v 0_V}^0 = V^\star$</span> and <span class="inline-math">$V^0 = \set{\v 0_{V^\star}}$</span>.
    </p>
    
</li>
</ol>
<p>
    <a href="/tripos-notes/Lectures/IB/Michaelmas/Linear-Algebra-LA/Notes/Proof-properties-of-annihilators.html">Proof</a>
</p>
