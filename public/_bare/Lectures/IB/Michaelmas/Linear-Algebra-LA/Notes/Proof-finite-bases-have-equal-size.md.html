<p>
    <a href="/tripos-notes/Lectures/IB/Michaelmas/Linear-Algebra-LA/Notes/Proof-basis-of-finite-dimensional-vector-space-is-finite.html"><span class="inline-math">$B_1$</span> and <span class="inline-math">$B_2$</span> are finite.</a>
    Then we will apply the <a href="/tripos-notes/Lectures/IB/Michaelmas/Linear-Algebra-LA/Notes/Proof-Steinitz-exchange-lemma.html">Steinitz exchange lemma</a> twice:
    <span class="inline-math">$B_1$</span> is linearly independent and <span class="inline-math">$B_2$</span> is a spanning set, so <span class="inline-math">$|B_1|\leq |B_2|$</span>,
    but also <span class="inline-math">$B_2$</span> is linearly independent and <span class="inline-math">$B_1$</span> is a spanning set, so <span class="inline-math">$|B_2| \leq |B_1|$</span>.
    Therefore <span class="inline-math">$|B_1| = |B_2|$</span>.
</p>
