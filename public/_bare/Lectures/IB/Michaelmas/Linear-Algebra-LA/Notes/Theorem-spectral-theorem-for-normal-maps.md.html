<p>
    Let <span class="inline-math">$V$</span> be a finite-dimensional inner product space over <span class="inline-math">$\C$</span>, and <span class="inline-math">$\alpha\in \mathcal{L}(V,V)$</span>.
</p>
<p>
    <span class="inline-math">$\alpha$</span> is normal iff <span class="inline-math">$V$</span> has an orthonormal basis of eigenvectors of <span class="inline-math">$\alpha$</span>.
</p>
