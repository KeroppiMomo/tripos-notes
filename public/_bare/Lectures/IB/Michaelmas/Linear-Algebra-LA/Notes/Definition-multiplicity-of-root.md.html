<p>
    For a root <span class="inline-math">$\lambda$</span> of <span class="inline-math">$f\in$</span> <a href="/tripos-notes/Lectures/IB/Michaelmas/Linear-Algebra-LA/Notes/Definition-polynomial-degree-monic-polynomial-function-root.html"><span class="inline-math">$\mathbb{F}[t]$</span></a>,
    the <em>multiplicity</em> of <span class="inline-math">$\lambda$</span> is the largest integer <span class="inline-math">$e$</span> such that <span class="inline-math">$(t-\lambda)^e\mid f(t)$</span>.
</p>
