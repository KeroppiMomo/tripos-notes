<p>
    Let <span class="inline-math">$U,W$</span> <a href="/tripos-notes/Lectures/IB/Michaelmas/Linear-Algebra-LA/Notes/Definition-vector-subspace.html"><span class="inline-math">$\leq$</span></a> <span class="inline-math">$V$</span> where <span class="inline-math">$V$</span> is a vector space.
</p>
<p>
    Define the <em>sum</em> of <span class="inline-math">$U$</span> and <span class="inline-math">$W$</span> in <span class="inline-math">$V$</span> as
    <span class="display-math">$$ \begin{align*}
        U + W = \sb{u+w}{u\in U, w\in W}
    \end{align*} $$</span>
</p>
