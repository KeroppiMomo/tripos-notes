<p>
    Let <span class="inline-math">$V$</span> be a curve and <span class="inline-math">$D$</span> be a divisor.
</p>
<p>
    <span class="inline-math">$D$</span> is <a href="/tripos-notes/Lectures/II/Lent/Algebraic-Geometry-AG/Notes/Definition-morphism-associated-to-divisor-very-ample.html">very ample</a> iff
    <span class="display-math">$$ \begin{align*}
        l(D - P - Q) = l(D) - 2 \qquad \text{for all $P,Q\in V$}.
    \end{align*} $$</span>
</p>
<blockquote>
    <p>
        <a href="/tripos-notes/Lectures/II/Lent/Algebraic-Geometry-AG/Notes/Theorem-Riemann-Roch.html#^large-deg">Therefore</a> if <span class="inline-math">$D\geq 2g+1$</span>, then <span class="inline-math">$D$</span> is very ample.
    </p>
    
</blockquote>
