<p>
    If <span class="inline-math">$f\in k(X)^\ast$</span> has a unique simple pole, then
    <span class="inline-math">$\deg f = \sum_{P\in f\inv(\infty)} e_P = 1$</span>.
    <a href="/tripos-notes/Lectures/II/Lent/Algebraic-Geometry-AG/Notes/Proposition-degree-of-morphism.html">So</a> <span class="inline-math">$f$</span> is a birational map <span class="inline-math">$X \dashrightarrow \mathbb{P}^1$</span>.
</p>
<p>
    Conversely, <span class="inline-math">$x_0/x_1$</span> is a rational function with a unique simple pole on <span class="inline-math">$\mathbb{P}^1$</span>.
</p>
