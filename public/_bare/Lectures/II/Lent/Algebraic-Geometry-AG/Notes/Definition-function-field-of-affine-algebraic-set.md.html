<p>
    Let <span class="inline-math">$X \subseteq \mathbb{A}^n$</span> be an irreducible affine algebraic set.
    (<a href="/tripos-notes/Lectures/II/Lent/Algebraic-Geometry-AG/Notes/Definition-regular-function-coordinate-ring.html#^irred">So</a> <span class="inline-math">$A(X)$</span> is an integral domain.)
</p>
<p>
    The <em>function field</em> of <span class="inline-math">$X$</span>, denoted <span class="inline-math">$k(X)$</span>,
    is the <a href="/tripos-notes/Lectures/IB/Lent/Groups-Rings-and-Modules-GRM/Notes/Definition-field-of-fractions.html">field of fractions</a> of <span class="inline-math">$A(X)$</span>.
    The elements are called <em>rational functions</em> or <em>meromorphic functions</em>.
</p>
