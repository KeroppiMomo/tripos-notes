<p>
    Any irreducible projective variety <span class="inline-math">$X$</span> is <em>complete</em>,
    i.e. for any algebraic variety <span class="inline-math">$Y$</span>,
    the projection map <span class="inline-math">$π_2: X \times Y\to Y$</span> is a <a href="/tripos-notes/Lectures/II/Lent/Algebraic-Geometry-AG/Notes/Proposition-Segre-embedding.html">closed</a> map.
</p>
