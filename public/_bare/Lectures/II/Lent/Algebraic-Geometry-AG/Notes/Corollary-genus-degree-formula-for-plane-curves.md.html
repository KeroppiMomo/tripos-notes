<p>
    Let <span class="inline-math">$V\subseteq \mathbb{P}^2$</span> be a plane curve.
</p>
<p>
    If <span class="inline-math">$V$</span> has <a href="/tripos-notes/Lectures/II/Lent/Algebraic-Geometry-AG/Notes/Definition-hyperplane-section-degree-of-curve.html">degree</a> <span class="inline-math">$d\geq 3$</span>,
    then its <a href="/tripos-notes/Lectures/II/Lent/Algebraic-Geometry-AG/Notes/Definition-canonical-divisor-genus-of-curve.html">genus</a> <span class="inline-math">$g$</span> is given by
    <span class="display-math">$$ \begin{align*}
        g = \frac{1}{2}(d-1)(d-2).
    \end{align*} $$</span>
</p>
<p>
    <a href="/tripos-notes/Lectures/II/Lent/Algebraic-Geometry-AG/Notes/Proof-genus-degree-formula-for-plane-curves.html">Proof</a>
