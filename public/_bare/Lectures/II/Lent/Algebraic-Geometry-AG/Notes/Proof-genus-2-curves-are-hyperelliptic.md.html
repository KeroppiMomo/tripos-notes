<p>
    If <span class="inline-math">$V$</span> has genus 2,
    then <span class="inline-math">$l(K_V) = 2$</span> and by Riemann-Roch <span class="inline-math">$\deg(K_V) = 2g - 2 = 2$</span>.
    Picking any <span class="inline-math">$f\in L(K_V)\setminus \set{0}$</span>,
    we have <span class="inline-math">$\op{div}(f) + K_V$</span> is an effective divisor linearly equivalent to <span class="inline-math">$K_V$</span>,
    so WLOG we can assume <span class="inline-math">$K_V$</span> is effective.
    <a href="/tripos-notes/Lectures/II/Lent/Algebraic-Geometry-AG/Notes/Definition-hyperelliptic-curve.html#^equiv">Thus</a> <span class="inline-math">$V$</span> is hyperelliptic.
</p>
