<p>
    Let <span class="inline-math">$C$</span> be a (smooth) <a href="/tripos-notes/Lectures/II/Lent/Algebraic-Geometry-AG/Notes/Definition-algebraic-curve.html">curve</a>.
</p>
<p>
    Any rational map <span class="inline-math">$C \dashrightarrow \mathbb{P}^n$</span> is a <a href="/tripos-notes/Lectures/II/Lent/Algebraic-Geometry-AG/Notes/Definition-morphism-between-quasiprojective-varieties.html">morphism</a>.
</p>
<p>
    Moreover, any <a href="/tripos-notes/Lectures/II/Lent/Algebraic-Geometry-AG/Notes/Definition-dominant-birational-rational-map.html">birational map</a> between curves is an isomorphism.
</p>
