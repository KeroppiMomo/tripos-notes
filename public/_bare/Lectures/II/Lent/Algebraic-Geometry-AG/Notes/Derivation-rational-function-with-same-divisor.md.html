<p>
    If <span class="inline-math">$f, g\in k(V)^\ast$</span>
    and <span class="inline-math">$\op{div}(f) = \op{div}(g)$</span>,
    then <span class="inline-math">$ν_P(f) = ν_P(g)$</span> for all <span class="inline-math">$P\in V$</span>,
    so <span class="inline-math">$ν_P(f/g) = 0$</span> for all <span class="inline-math">$P\in V$</span>.
    So <span class="inline-math">$f/g$</span> is a rational function regular everywhere on <span class="inline-math">$V$</span>,
    <a href="/tripos-notes/Lectures/II/Lent/Algebraic-Geometry-AG/Notes/Corollary-regular-rational-function-on-irreducible-projective-variety-is-constant.html">so</a> constant.
</p>
<p>
    Converse is clear.
</p>
