<h1>Proof 2</h1>

<p>
    Apply <a href="/tripos-notes/Lectures/II/Lent/Algebraic-Geometry-AG/Notes/Theorem-Riemann-Roch.html">Riemann-Roch</a> with <span class="inline-math">$D = K_V$</span>.
    Because <a href="/tripos-notes/Lectures/II/Lent/Algebraic-Geometry-AG/Notes/Theorem-canonical-divisor-of-plane-curves.html"><span class="inline-math">$\deg(D) = d(d-3)$</span></a>,
    <span class="display-math">$$ \begin{align*}
        \underbrace{l(D)}_{g} - 1 = 1 - g + d(d-3)
    \end{align*} $$</span>
    and rearranging gives the formula.
</p>
