<p>
    A <em>quasiprojective projective variety</em> is an open subset of an <a href="/tripos-notes/Lectures/II/Lent/Algebraic-Geometry-AG/Notes/Definition-affine-zero-locus-affine-algebraic-set.html">affine</a>/<a href="/tripos-notes/Lectures/II/Lent/Algebraic-Geometry-AG/Notes/Definition-function-field-of-projective-algebraic-set.html">projective</a> variety.
</p>
<blockquote>
    <p>
        If <span class="inline-math">$X$</span> is an irreducible affine/projective variety,
        then any non-empty open subset of <span class="inline-math">$X$</span> is <a href="/tripos-notes/Lectures/II/Michaelmas/Linear-Analysis-LAN/Notes/Definition-dense-set-separable-space.html">dense</a> in <span class="inline-math">$X$</span>.
    </p>
    
</blockquote>
