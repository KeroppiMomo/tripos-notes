<p>
    The <a href="/tripos-notes/Lectures/IB/Lent/Groups-Rings-and-Modules-GRM/Notes/Definition-maximum-ideal.html">maximal ideals</a> of <span class="inline-math">$k[x_1, \ldots, x_n]$</span> are of the form
    <span class="display-math">$$ \begin{align*}
        \mathfrak{m}_a := (x_1-a_1, x_2-a_2, \ldots, x_n-a_n)
    \end{align*} $$</span>
    for any <span class="inline-math">$a\in (a_1, a_2, \ldots, a_n)\in k^n$</span>.
</p>
<blockquote>
    <p>
        Notice <span class="inline-math">$\mathfrak{m}_a = I(\set{a})$</span>.
    </p>
    
</blockquote>
