<p>
    <span class="inline-math">$X \subseteq Z(I(X))$</span> is by definition.
</p>
<p>
    Conversely, let <span class="inline-math">$X = Z(S)$</span>.
    Since <a href="/tripos-notes/Lectures/II/Lent/Algebraic-Geometry-AG/Notes/Affine-algebraic-sets-and-ideals.html#^IZ"><span class="inline-math">$S \subseteq I(Z(S))$</span></a>,
    applying <span class="inline-math">$Z$</span> <a href="/tripos-notes/Lectures/II/Lent/Algebraic-Geometry-AG/Notes/Definition-affine-zero-locus-affine-algebraic-set.html#^inclusion">gives</a>
    <span class="inline-math">$Z(I(Z(S))) \subseteq Z(S)$</span>, so <span class="inline-math">$Z(I(X)) \subseteq X$</span>.
</p>
