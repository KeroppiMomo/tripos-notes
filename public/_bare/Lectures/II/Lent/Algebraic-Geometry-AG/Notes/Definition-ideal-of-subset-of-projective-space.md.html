<p>
    Let <span class="inline-math">$X \subseteq{}$</span><a href="/tripos-notes/Lectures/II/Lent/Algebraic-Geometry-AG/Notes/Definition-projective-space.html"><span class="inline-math">$\mathbb{P}^n$</span></a>.
</p>
<p>
    The <em>ideal</em> of <span class="inline-math">$X$</span> is
    <span class="display-math">$$ \begin{align*}
        I(X) &amp;= \sb{F\in k[x_0, \ldots, x_n]}{F(p) = 0 \quad \forall p\in X} \\
        &amp;= (F\in k[x_0, \ldots, x_n] \text{ homogeneous} \mid F(p) = 0 \quad \forall p\in X),
    \end{align*} $$</span>
    which is <a href="/tripos-notes/Lectures/II/Lent/Algebraic-Geometry-AG/Notes/Definition-homogeneous-ideal.html">homogeneous</a>.
</p>
