<p>
    Let <span class="inline-math">$f: X\to Y$</span> be a <a href="/tripos-notes/Lectures/II/Lent/Algebraic-Geometry-AG/Notes/Definition-morphism-between-affine-algebraic-sets.html">morphism</a> between affine algebraic sets.
</p>
<p>
    The <em>pullback</em> associated to <span class="inline-math">$f$</span> is the <span class="inline-math">$k$</span>-algebra homomorphism
    <span class="display-math">$$ \begin{align*}
        f^\ast: A(Y) &amp;\to A(X) \\
        g &amp;\mapsto g \circ f.
    \end{align*} $$</span>
</p>
<blockquote>
    <p>
        <span class="inline-math">$(g \circ f)^\ast = f^\ast \circ g^\ast$</span> if <span class="inline-math">$f: X\to Y$</span> and <span class="inline-math">$g: Y\to Z$</span> are morphisms.
    </p>
    
</blockquote>
