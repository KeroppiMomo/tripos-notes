<p>
    A <a href="/tripos-notes/Lectures/IB/Michaelmas/Analysis-and-Topology-AT/Notes/Definition-topology-topological-space-open-set.html">topological space</a> <span class="inline-math">$X$</span> is <em>reducible</em>
    if there exists proper <a href="/tripos-notes/Lectures/IB/Michaelmas/Analysis-and-Topology-AT/Notes/Definition-closed-set.html">closed</a> sets <span class="inline-math">$X_1$</span>, <span class="inline-math">$X_2$</span> of <span class="inline-math">$X$</span>
    such that <span class="inline-math">$X = X_1 \cup X_2$</span>.
    Otherwise it is <em>irreducible</em>.
</p>
