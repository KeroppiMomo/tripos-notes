<p>
    For any <span class="inline-math">$f\in L^1(\R^d)$</span>,
    its <a href="/tripos-notes/Lectures/II/Lent/Analysis-of-Functions-AF/Notes/Definition-Hardy-Littlewood-maximal-function.html">Hardy-Littlewood maximal function</a> satisfies
    <span class="display-math">$$ \begin{align*}
        |\sb{x\in \R^d}{Mf(x) &gt; t}| &lt; \frac{C_d}{t} \|f\|_1
    \end{align*} $$</span>
    where <span class="inline-math">$C_d = 5^d$</span> is some constant.
</p>
<p>
    <a href="/tripos-notes/Lectures/II/Lent/Analysis-of-Functions-AF/Notes/Proof-maximal-inequality.html">Proof</a>
</p>
<blockquote>
    <p>
        Therefore <span class="inline-math">$Mf$</span> is <a href="/tripos-notes/Lectures/II/Lent/Analysis-of-Functions-AF/Notes/Definition-weak-Lp.html">weak <span class="inline-math">$L^1$</span></a>.
    </p>
    
</blockquote>
