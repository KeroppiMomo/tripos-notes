<p>
    Let <span class="inline-math">$(E, \mathcal{B}, μ)$</span> be a <a href="/tripos-notes/Lectures/II/Lent/Analysis-of-Functions-AF/Notes/Definition-complex-measure-signed-measure.html">signed measure space</a>.
</p>
<p>
    There exists <span class="inline-math">$P,N\in \mathcal{B}$</span>
    such that <span class="inline-math">$E = P \sqcup N$</span>,
    <span class="inline-math">$P$</span> is a <a href="/tripos-notes/Lectures/II/Lent/Analysis-of-Functions-AF/Notes/Definition-positive-negative-set.html">positive set</a>
    and <span class="inline-math">$N$</span> is a <a href="/tripos-notes/Lectures/II/Lent/Analysis-of-Functions-AF/Notes/Definition-positive-negative-set.html">negative set</a>.
</p>
<p>
    <a href="/tripos-notes/Lectures/II/Lent/Analysis-of-Functions-AF/Notes/Proof-Hahn-decomposition.html">Proof</a>
</p>
<blockquote>
    <p>
        The decomposition is not unique, as you can move a measure-zero set between <span class="inline-math">$P$</span> and <span class="inline-math">$N$</span>.
    </p>
    
</blockquote>
