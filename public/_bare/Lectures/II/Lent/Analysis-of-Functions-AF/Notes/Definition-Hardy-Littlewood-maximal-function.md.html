<p>
    For <span class="inline-math">$f\in L^1(\R^d)$</span>,
    the <em>Hardy-Littlewood maximal function</em> of <span class="inline-math">$f$</span> is
    <span class="display-math">$$ \begin{align*}
        Mf(x) = \sup_{r&gt;0} \frac{1}{|B_r(x)|} \int_{B_r(x)} |f(y)| \d y.
    \end{align*} $$</span>
</p>
