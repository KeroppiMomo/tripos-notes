<p>
    Let <span class="inline-math">$Λ = \Zω_1 + \Z ω_2\subseteq \C$</span> be a lattice (<span class="inline-math">$ω_1, ω_2\neq 0$</span>, <span class="inline-math">$ω_1/ω_2\not\in \R$</span>).
    Then for <span class="inline-math">$α\in \R$</span>,
    the series
    <span class="display-math">$$ \begin{align*}
        \sum_{ω\in Λ\setminus \set{0}} \frac{1}{|ω|^α}
    \end{align*} $$</span>
    <a href="/tripos-notes/Lectures/IA/Lent/Analysis-I-An/Notes/Definition-convergence-of-series.html">converges</a> iff <span class="inline-math">$α &gt; 2$</span>.
</p>
