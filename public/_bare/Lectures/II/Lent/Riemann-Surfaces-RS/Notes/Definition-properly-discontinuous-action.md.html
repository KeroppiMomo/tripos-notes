<p>
    Let <span class="inline-math">$X$</span> be a topological space and <span class="inline-math">$G$</span> be a group <a href="/tripos-notes/Lectures/IA/Michaelmas/Groups-Gp/Definition-group-action.html">acting</a> on <span class="inline-math">$X$</span> by <a href="/tripos-notes/Lectures/IB/Michaelmas/Analysis-and-Topology-AT/Notes/Definition-homeomorphism.html">homeomorphisms</a>.
</p>
<p>
    We say the action is <em>properly discontinuous</em>
    if for all <a href="/tripos-notes/Lectures/IB/Michaelmas/Analysis-and-Topology-AT/Notes/Definition-compact.html">compact</a> <span class="inline-math">$K\subseteq X$</span>,
    the set <span class="inline-math">$\sb{g\in G}{gK\cap K \neq \emptyset}$</span> is finite.
</p>
<blockquote>
    <p>
        Note "properly discontinuous" can mean <a href="https://mathoverflow.net/q/55726">many different things</a>.
    </p>
    
</blockquote>
