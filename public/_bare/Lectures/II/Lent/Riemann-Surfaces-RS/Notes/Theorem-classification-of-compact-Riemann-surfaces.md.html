<p>
    Every compact <a href="/tripos-notes/Lectures/II/Lent/Riemann-Surfaces-RS/Notes/Definition-Riemann-surface.html">Riemann surface</a>
    is homeomorphic to
    an <a href="/tripos-notes/Lectures/IB/Lent/Geometry-Geo/Notes/Definition-orientable-surface-orientation.html">orientable surface</a> of <a href="/tripos-notes/Lectures/IB/Lent/Geometry-Geo/Notes/Subdivisions.html#^genus">genus</a> <span class="inline-math">$g\geq 0$</span>.
</p>
<p>
    Moreover there is a conformal structure on the compact orientable surface of every genus <span class="inline-math">$g\geq 0$</span>.
    [[FILE NOT FOUND: Example (compact branched cover of the Riemann sphere)]]
</p>
