<p>
    If <span class="inline-math">$X$</span> is a <a href="/tripos-notes/Lectures/IB/Michaelmas/Analysis-and-Topology-AT/Notes/Definition-compact.html">compact</a> 1-dimensional <a href="/tripos-notes/Lectures/II/Lent/Differential-Geometry-DG/Notes/Definition-manifold-with-boundary.html">manifold with boundary</a>,
    then <span class="inline-math">$X$</span> is a disjoint union of
    finitely many copies of <span class="inline-math">$S^1$</span> and <span class="inline-math">$[0,1]$</span>.
</p>
<blockquote>
    <p>
        In particular <span class="inline-math">$\# \partial X$</span> is even.
    </p>
    
</blockquote>
