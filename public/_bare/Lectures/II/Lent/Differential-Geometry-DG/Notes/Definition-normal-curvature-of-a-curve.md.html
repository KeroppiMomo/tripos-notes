<p>
    Let <span class="inline-math">$S$</span> be a surface in <span class="inline-math">$\R^3$</span>
    and let <span class="inline-math">$α: I\to S$</span> be a curve parametrised by arc length.
    Let <span class="inline-math">$N$</span> be a normal vector of <span class="inline-math">$S$</span> along <span class="inline-math">$α$</span>.
</p>
<p>
    The <em>normal curvature</em> of <span class="inline-math">$α$</span> is
    <span class="display-math">$$ \begin{align*}
        k_n(t) := \langle \ddot α(t), N(α(t))\rangle
    \end{align*} $$</span>
</p>
<blockquote>
    <p>
        <span class="inline-math">$k_n(t) = \II_{α(t)}(\dot α(t), \dot α(t))$</span>.
        (<a href="/tripos-notes/Lectures/II/Lent/Differential-Geometry-DG/Notes/Proof-normal-curvature-in-terms-of-second-fundamental-form.html">Proof</a>)
    </p>
    
</blockquote>
