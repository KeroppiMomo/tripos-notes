<p>
    Let <span class="inline-math">$X$</span> be a manifold without boundary,
    and let <span class="inline-math">$x,x&#x27;\in X$</span>.
</p>
<p>
    If <span class="inline-math">$X$</span> is connected,
    then there exists a diffeomorphism <span class="inline-math">$h: X\to X$</span>
    sending <span class="inline-math">$x\mapsto x&#x27;$</span>
    which is <a href="/tripos-notes/Lectures/II/Lent/Differential-Geometry-DG/Notes/Definition-smooth-homotopy-smooth-isotopy.html">smoothly isotopic</a> to identity.
</p>
