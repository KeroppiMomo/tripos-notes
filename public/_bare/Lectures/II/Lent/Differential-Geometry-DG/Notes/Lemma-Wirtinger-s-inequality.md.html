<p>
    Let <span class="inline-math">$f: \R\to \C$</span> be differentiable
    and periodic with period <span class="inline-math">$L$</span>.
</p>
<p>
    If <span class="inline-math">$\int_{0}^{L} f(x) \d x = 0$</span>, then
    <span class="display-math">$$ \begin{align*}
        \int_{0}^{L} |f|^2 \d x \leq \frac{L^2}{4π^2} \int_{0}^{L} |f&#x27;|^2 \d x.
    \end{align*} $$</span>
</p>
