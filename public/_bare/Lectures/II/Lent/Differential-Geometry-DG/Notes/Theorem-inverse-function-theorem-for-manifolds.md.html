<p>
    Let <span class="inline-math">$f: X\to Y$</span> be a smooth map of manifolds and <span class="inline-math">$x\in X$</span>.
</p>
<p>
    If <a href="/tripos-notes/Lectures/II/Lent/Differential-Geometry-DG/Notes/Definition-differential-map-immersion-submersion.html"><span class="inline-math">$\d f_x$</span></a><span class="inline-math">${}: T_x X \to T_y Y$</span> is an <a href="/tripos-notes/Lectures/IB/Michaelmas/Linear-Algebra-LA/Notes/Definition-isomorphism-of-vector-spaces.html">isomorphism</a>,
    then there exists
    an open neighbourhood <span class="inline-math">$U \subseteq X$</span> of <span class="inline-math">$x$</span>
    such that <span class="inline-math">$f|_U: U\to f(U)$</span> is a diffeomorphism.
</p>
<p>
    Proof: pass to charts and apply the <a href="/tripos-notes/Lectures/IB/Michaelmas/Analysis-and-Topology-AT/Notes/Theorem-inverse-function-theorem.html">inverse function theorem in <span class="inline-math">$\R^n$</span></a>.
</p>
