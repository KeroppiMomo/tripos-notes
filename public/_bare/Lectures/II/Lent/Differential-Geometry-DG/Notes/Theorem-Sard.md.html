<p>
    Let <span class="inline-math">$f: X\to Y$</span> be a smooth map between manifolds.
</p>
<p>
    The set of <a href="/tripos-notes/Lectures/II/Lent/Differential-Geometry-DG/Notes/Definition-critical-point-critical-value-regular-value.html">critical values</a> of <span class="inline-math">$f$</span> is of <a href="/tripos-notes/Lectures/II/Lent/Differential-Geometry-DG/Notes/Definition-measure-zero-on-manifold.html">measure zero</a> as a subset of <span class="inline-math">$Y$</span>.
</p>
<blockquote>
    <p>
        Therefore the set of regular values is dense in <span class="inline-math">$Y$</span>.
    </p>
    
</blockquote>
