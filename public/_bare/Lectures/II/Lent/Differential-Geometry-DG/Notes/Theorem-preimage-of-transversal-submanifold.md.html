<p>
    Let <span class="inline-math">$f: X\to Y$</span> be a smooth map between manifolds
    and <span class="inline-math">$Z\subseteq Y$</span> be a submanifold.
</p>
<p>
    If <span class="inline-math">$f$</span> is <a href="/tripos-notes/Lectures/II/Lent/Differential-Geometry-DG/Notes/Definition-transversality.html">transversal</a> to <span class="inline-math">$Z$</span>,
    then <span class="inline-math">$f\inv(Z)$</span> (if non-empty) is a submanifold of <span class="inline-math">$X$</span> with
    <span class="display-math">$$ \begin{align*}
        \op{codim}_X f\inv(Z) = \op{codim}_Y Z.
    \end{align*} $$</span>
</p>
