<p>
    Let <span class="inline-math">$α:I\to \R^2$</span> be a simple closed curve in <span class="inline-math">$\R^2$</span>
    and <span class="inline-math">$A$</span> be the region it <a href="/tripos-notes/Lectures/II/Lent/Differential-Geometry-DG/Notes/Theorem-Jordan-curve-theorem.html">bounds</a>.
    Then
    <span class="display-math">$$ \begin{align*}
        \op{length}(α)^2 \leq 4\pi \op{area}(A)
    \end{align*} $$</span>
    with equality iff <span class="inline-math">$α$</span> is a circle.
</p>
