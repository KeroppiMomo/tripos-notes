<p>
    If <span class="inline-math">$α: I\to \R^2$</span> is a <a href="/tripos-notes/Lectures/II/Lent/Differential-Geometry-DG/Notes/Definition-curve-on-manifold-regular-closed-simple.html">simple closed curve</a> in <span class="inline-math">$\R^2$</span>,
    then there exists <span class="inline-math">$U \subset \R^2$</span>
    such that <span class="inline-math">$U \cup α(I)$</span>
    is a compact manifold with boundary,
    homeomorphic to the unit disc <span class="inline-math">$D^2$</span>.
</p>
