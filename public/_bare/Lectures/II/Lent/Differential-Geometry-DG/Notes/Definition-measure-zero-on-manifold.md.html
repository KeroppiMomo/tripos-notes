<p>
    Let <span class="inline-math">$X$</span> be a <span class="inline-math">$k$</span>-dimensional manifold
    and <span class="inline-math">$S \subseteq X$</span> be a subset.
</p>
<p>
    <span class="inline-math">$S$</span> is said to be of <em>measure zero</em>
    if for all local parametrisation <span class="inline-math">$ψ: V \to U$</span>,
    the set <span class="inline-math">$ψ\inv(S \cap U) \subseteq V\subseteq \R^k$</span>
    is of <a href="/tripos-notes/Lectures/IA/Lent/Analysis-I-An/Notes/Definition-measure-zero-in-Rn.html">measure zero</a>.
</p>
