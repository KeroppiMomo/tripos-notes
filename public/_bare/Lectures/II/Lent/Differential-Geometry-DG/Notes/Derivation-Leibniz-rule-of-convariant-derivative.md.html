<p>
    The usual product rule gives
    <span class="display-math">$$ \begin{align*}
        \dd{t}\langle V, W\rangle = \left\langle \dfd{V}{t}, W\right\rangle + \left\langle V, \dfd{W}{t}\right\rangle.
    \end{align*} $$</span>
    But <span class="inline-math">$V,W\in T_{α(t)}S$</span>, so the component of <span class="inline-math">$\dfd{V}{t}$</span> and <span class="inline-math">$\dfd{W}{t}$</span> along <span class="inline-math">$N$</span>
    does not contribute to the inner product.
</p>
