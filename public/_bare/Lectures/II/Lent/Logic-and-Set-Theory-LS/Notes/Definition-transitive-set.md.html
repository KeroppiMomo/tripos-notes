<p>
    A set <span class="inline-math">$x$</span> is <em>transitive</em>
    if for all sets <span class="inline-math">$y,z$</span>, if <span class="inline-math">$z\in y\in x$</span>, then <span class="inline-math">$z\in x$</span>.
</p>
<p>
    Equivalently, all elements of <span class="inline-math">$x$</span> are subsets of <span class="inline-math">$x$</span>.
</p>
