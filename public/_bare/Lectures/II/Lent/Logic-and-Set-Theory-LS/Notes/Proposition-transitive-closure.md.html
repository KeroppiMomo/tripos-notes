<p>
    For all sets <span class="inline-math">$x$</span>,
    there exists a smallest <a href="/tripos-notes/Lectures/II/Lent/Logic-and-Set-Theory-LS/Notes/Definition-transitive-set.html">transitive</a> superset <span class="inline-math">$t \supseteq x$</span>,
    i.e. if <span class="inline-math">$t&#x27;\supseteq x$</span> is a transitive set, then <span class="inline-math">$t&#x27; \supseteq t$</span>.
    We call <span class="inline-math">$\op{tcl}(x) := t$</span> the <em>transitive closure</em> of <span class="inline-math">$x$</span>.
</p>
