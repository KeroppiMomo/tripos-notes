<p>
    If <span class="inline-math">$A$</span> is a proper initial segment,
    by well-foundedness find <span class="inline-math">$x$</span> <span class="inline-math">$&lt;$</span>-minimal in <span class="inline-math">$X \setminus A$</span>.
    Then <span class="inline-math">$\op{pred}(x) \subseteq  A$</span> by definition of <span class="inline-math">$&lt;$</span>-minimality,
    and <span class="inline-math">$A \subseteq \op{pred}(x)$</span> since <span class="inline-math">$A$</span> is an initial segment
    and <span class="inline-math">$&lt;$</span> is linear.
</p>
<p>
    The converse is obvious.
</p>
