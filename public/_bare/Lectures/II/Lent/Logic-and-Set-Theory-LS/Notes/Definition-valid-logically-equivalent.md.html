<p>
    Let <span class="inline-math">$ϕ, ψ\in{}$</span><a href="/tripos-notes/Lectures/II/Lent/Logic-and-Set-Theory-LS/Notes/Definition-formula-in-propositional-logic.html"> <span class="inline-math">$\mathrm{Fml}$</span></a>.
</p>
<p>
    Say <span class="inline-math">$ϕ$</span> is <em>valid</em> if <span class="inline-math">$v(ϕ) = 1$</span> for all <a href="/tripos-notes/Lectures/II/Lent/Logic-and-Set-Theory-LS/Notes/Definition-valuation.html">valuations</a> <span class="inline-math">$v$</span>.
</p>
<p>
    Say <span class="inline-math">$ϕ$</span> and <span class="inline-math">$ψ$</span> are <em>logically equivalent</em> if <span class="inline-math">$v(ϕ) = v(ψ)$</span> for all valuations <span class="inline-math">$v$</span>.
</p>
<blockquote>
    <p>
        By the <a href="/tripos-notes/Lectures/II/Lent/Logic-and-Set-Theory-LS/Notes/Definition-valuation.html#^coincidence">coincidence lemma</a>,
        to check validity or logical equivalence,
        we can compute truth tables.
    </p>
    
</blockquote>
