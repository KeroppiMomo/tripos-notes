<p>
    Finite set theory <span class="inline-math">$\mathsf{FST}$</span>
    is the <a href="/tripos-notes/Lectures/II/Lent/Logic-and-Set-Theory-LS/Notes/Definition-axiomatisation.html">axiom system</a>
    consisting of <a href="/tripos-notes/Lectures/II/Lent/Logic-and-Set-Theory-LS/Notes/Definition-axiom-of-extensionality.html"><span class="inline-math">$\mathsf{Ext}$</span></a>,
    <a href="/tripos-notes/Lectures/II/Lent/Logic-and-Set-Theory-LS/Notes/Definition-axiom-of-empty-set.html"><span class="inline-math">$\mathsf{Emp}$</span></a>,
    <a href="/tripos-notes/Lectures/II/Lent/Logic-and-Set-Theory-LS/Notes/Definition-axiom-of-pairing.html"><span class="inline-math">$\mathsf{Pair}$</span></a>,
    <a href="/tripos-notes/Lectures/II/Lent/Logic-and-Set-Theory-LS/Notes/Definition-axiom-of-union.html"><span class="inline-math">$\mathsf{Union}$</span></a>,
    <a href="/tripos-notes/Lectures/II/Lent/Logic-and-Set-Theory-LS/Notes/Definition-axiom-of-power-set.html"><span class="inline-math">$\mathsf{Powerset}$</span></a>,
    and <a href="/tripos-notes/Lectures/II/Lent/Logic-and-Set-Theory-LS/Notes/Definition-axiom-of-separation.html"><span class="inline-math">$\mathsf{Sep}$</span></a>.
</p>
