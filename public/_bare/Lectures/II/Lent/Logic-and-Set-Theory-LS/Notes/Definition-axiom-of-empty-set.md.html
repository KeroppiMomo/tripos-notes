<p>
    The <em>axiom of empty set</em> is the <span class="inline-math">$\in$</span>-formula
    <span class="display-math">$$ \begin{align*}
        \mathsf{Emp} := \exists c \ \forall z (z\in c \Leftrightarrow \bot).
    \end{align*} $$</span>
</p>
<blockquote>
    <p>
        By <a href="/tripos-notes/Lectures/II/Lent/Logic-and-Set-Theory-LS/Notes/Definition-axiom-of-extensionality.html"><span class="inline-math">$\mathsf{Ext}$</span></a>, this defines a unique object in the model, denoted <span class="inline-math">$\emptyset$</span>.
    </p>
    
</blockquote>
