<p>
    Suppose all power sets have a choice function.
    For any set <span class="inline-math">$x$</span>,
    note <span class="inline-math">$x \subseteq \mathcal{P}(y)$</span> where <span class="inline-math">$y = \bigcup x$</span>.
    <span class="inline-math">$y$</span> has a choice function <span class="inline-math">$f$</span>,
    and the restriction <span class="inline-math">$f|_x$</span> is a choice function for <span class="inline-math">$x$</span>.
</p>
