<p>
    Construct <span class="inline-math">$\N$</span> as <a href="/tripos-notes/Lectures/II/Lent/Logic-and-Set-Theory-LS/Notes/Definition-construction-of-natural-numbers-from-Inf.html">here</a>.
</p>
<p>
    If <span class="inline-math">$A \subseteq \N$</span> is such that <span class="inline-math">$\emptyset\in A$</span>
    and whenever <span class="inline-math">$n\in A$</span>, we have <span class="inline-math">$s(n) \in A$</span>,
    then <span class="inline-math">$A = \N$</span>.
</p>
