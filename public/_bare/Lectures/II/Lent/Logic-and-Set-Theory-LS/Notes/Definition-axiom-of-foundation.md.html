<p>
    The <em>axiom of foundation</em> is the <a href="/tripos-notes/Lectures/II/Lent/Logic-and-Set-Theory-LS/Notes/Definition-language-of-set-theory.html"><span class="inline-math">$\in$</span>-formula</a>
    <span class="display-math">$$ \begin{align*}
        \mathsf{Found} := \forall x (x \neq \emptyset \Rightarrow \exists m (m\in x \wedge m \cap x = \emptyset)).
    \end{align*} $$</span>
</p>
<blockquote>
    <p>
        <span class="inline-math">$m \cap x = \emptyset$</span> iff <span class="inline-math">$m$</span> is <span class="inline-math">$\in$</span>-minimal in <span class="inline-math">$x$</span>.
    </p>
    
</blockquote>
