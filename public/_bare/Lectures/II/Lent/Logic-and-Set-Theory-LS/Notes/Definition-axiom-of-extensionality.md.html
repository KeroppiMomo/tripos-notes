<p>
    The <em>axiom of extensionality</em> is the <a href="/tripos-notes/Lectures/II/Lent/Logic-and-Set-Theory-LS/Notes/Definition-language-of-set-theory.html"><span class="inline-math">$\in$</span>-formula</a>
    <span class="display-math">$$ \begin{align*}
        \mathsf{Ext} := \forall x\forall y (x = y \Leftrightarrow \forall z(z\in x\Leftrightarrow z\in y)).
    \end{align*} $$</span>
</p>
<blockquote>
    <p>
        "Two sets are equal iff they have the same elements."
    </p>
    
</blockquote>
