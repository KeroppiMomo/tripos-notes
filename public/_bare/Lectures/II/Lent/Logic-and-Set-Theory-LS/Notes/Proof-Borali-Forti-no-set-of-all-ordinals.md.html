<p>
    Suppose <span class="inline-math">$Ω$</span> is a set of ordinals.
    <a href="/tripos-notes/Lectures/II/Lent/Logic-and-Set-Theory-LS/Notes/Definition-ordinal.html#^elements">Elements of ordinals are ordinals</a>,
    so <span class="inline-math">$Ω$</span> is transitive.
    <a href="/tripos-notes/Lectures/II/Lent/Logic-and-Set-Theory-LS/Notes/Definition-ordinal.html#^trans">Then</a> <span class="inline-math">$Ω$</span> is an ordinal,
    so <span class="inline-math">$Ω \in Ω$</span>.
    This violates the irreflectivity of <span class="inline-math">$(Ω, \in)$</span>.
</p>
