<p>
    Let <span class="inline-math">$X,Y$</span> be sets.
</p>
<p>
    <span class="inline-math">$X,Y$</span> are said to be <em>of the same size</em>, <em>equinumerous</em> or <em>equivpollent</em>
    if there is a bijection <span class="inline-math">$X\to Y$</span>.
    We write <span class="inline-math">$|X| = |Y|$</span>.
</p>
<p>
    We write <span class="inline-math">$|X| \leq |Y|$</span> if there is an injection <span class="inline-math">$X\to Y$</span>.
</p>
<blockquote>
    <p>
        Assuming <span class="inline-math">$\mathsf{AC}$</span>, <span class="inline-math">$|X|\leq |Y|$</span> <a href="/tripos-notes/Lectures/II/Lent/Logic-and-Set-Theory-LS/Notes/Lemma-existence-of-injection-and-surjection.html">iff</a> there is a surjection <span class="inline-math">$Y \to X$</span>.
    </p>
    
</blockquote>
