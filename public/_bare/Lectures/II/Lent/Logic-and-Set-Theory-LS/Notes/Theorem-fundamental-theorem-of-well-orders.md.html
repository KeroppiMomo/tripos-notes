<p>
    Let <span class="inline-math">$A$</span> be a set of <a href="/tripos-notes/Lectures/II/Lent/Logic-and-Set-Theory-LS/Notes/Definition-well-order-initial-segment.html">well-orders</a>
    such that no two distinct elements are <a href="/tripos-notes/Lectures/II/Lent/Logic-and-Set-Theory-LS/Notes/Definition-homomorphism-of-structures.html">isomorphic</a>.
</p>
<p>
    Then <span class="inline-math">$(A, \prec)$</span> is a well-order,
    where <span class="inline-math">$\mathbf{X}\prec \mathbf{Y}$</span> iff
    there is an isomorphism from <span class="inline-math">$\mathbf{X}$</span> to a proper initial segment of <span class="inline-math">$\mathbf{Y}$</span>.
</p>
