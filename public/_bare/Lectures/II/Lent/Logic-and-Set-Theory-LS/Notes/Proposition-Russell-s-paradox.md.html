<p>
    For any <a href="/tripos-notes/Lectures/II/Lent/Logic-and-Set-Theory-LS/Notes/Definition-language-of-set-theory.html"><span class="inline-math">$\in$</span>-structure</a> <span class="inline-math">$\mathbf{X}$</span>,
    <a href="/tripos-notes/Lectures/II/Lent/Logic-and-Set-Theory-LS/Notes/Definition-axiom-schema-of-comprehension.html"><span class="inline-math">$\mathsf{Compr}_ϕ$</span></a>
    is <a href="/tripos-notes/Lectures/II/Lent/Logic-and-Set-Theory-LS/Notes/Definition-interpretation-model-theory-in-predicate-logic.html">false</a>
    in <span class="inline-math">$\mathbf{X}$</span> where
    <span class="display-math">$$ϕ = \neg z \in z.$$</span>
    In particular <span class="inline-math">$\mathsf{Compr}$</span> does not hold in <span class="inline-math">$\mathbf{X}$</span>.
</p>
