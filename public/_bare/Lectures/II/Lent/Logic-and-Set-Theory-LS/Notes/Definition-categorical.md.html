<p>
    Work in <a href="/tripos-notes/Lectures/II/Lent/Logic-and-Set-Theory-LS/Notes/Definition-Zermelo-Fraenkel-set-theory.html"><span class="inline-math">$\mathsf{ZFC}$</span></a>.
    Let <span class="inline-math">$T$</span> be a set of <span class="inline-math">$a$</span>-sentences and <span class="inline-math">$κ$</span> be an cardinal.
</p>
<ul>
<li>
    <p>
        <span class="inline-math">$T$</span> is <em>categorical</em> if all models of <span class="inline-math">$T$</span> are isomorphic.
    </p>
    
</li><li>
    <p>
        <span class="inline-math">$T$</span> is <em><span class="inline-math">$κ$</span>-categorical</em> if all models of <span class="inline-math">$T$</span> of <a href="/tripos-notes/Lectures/II/Lent/Logic-and-Set-Theory-LS/Notes/Definition-initial-ordinal-cardinal.html">cardinality</a> <span class="inline-math">$κ$</span> are isomorphic.
    </p>
    
</li>
</ul>
