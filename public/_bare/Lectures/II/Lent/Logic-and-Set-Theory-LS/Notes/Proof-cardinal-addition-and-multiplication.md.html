<p>
    Clearly <span class="inline-math">$+$</span> and <span class="inline-math">$\cdot$</span> are commutative,
    so WLOG let <span class="inline-math">$1\leq κ \leq λ$</span>.
</p>
<p>
    <span class="display-math">$$ \begin{align*}
        λ &amp;\leq κ + λ \\
        &amp;\leq κ \cdot λ \\
        &amp;\leq λ\cdot λ \\
        &amp;= λ
    \end{align*} $$</span>
    by <a href="/tripos-notes/Lectures/II/Lent/Logic-and-Set-Theory-LS/Notes/Theorem-Hessenberg.html">Hessenberg</a>.
</p>
