<p>
    Let <span class="inline-math">$X,Y$</span> be sets and assume <span class="inline-math">$X \neq \emptyset$</span>.
</p>
<p>
    If there is an injection <span class="inline-math">$X\to Y$</span>,
    then there is a surjection <span class="inline-math">$Y \to X$</span>.
</p>
<p>
    If <span class="inline-math">$Y$</span> can be <a href="/tripos-notes/Lectures/II/Lent/Logic-and-Set-Theory-LS/Notes/Definition-well-order-initial-segment.html">well-ordered</a>, then the converse holds.
</p>
