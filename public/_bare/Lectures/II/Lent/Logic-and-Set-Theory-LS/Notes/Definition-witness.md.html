<p>
    Fix a signature <span class="inline-math">$a$</span>.
</p>
<p>
    A subset <span class="inline-math">$T \subseteq \mathrm{Fml}^a$</span>
    <em>has a witness for <span class="inline-math">$a$</span></em> if
    for all <span class="inline-math">$ϕ\in \mathrm{Fml}^a$</span> and <span class="inline-math">$x\in V$</span>,
    there exists a term <span class="inline-math">$t$</span>
    such that
    <span class="display-math">$$ \begin{align*}
        T \vdash (\exists x ϕ) \Rightarrow ϕ\tfrac{t}{x}.
    \end{align*} $$</span>
</p>
