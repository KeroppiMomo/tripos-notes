<p>
    The <em>axiom of union</em> is the <a href="/tripos-notes/Lectures/II/Lent/Logic-and-Set-Theory-LS/Notes/Definition-language-of-set-theory.html"><span class="inline-math">$\in$</span>-formula</a>
    <span class="display-math">$$ \begin{align*}
        \mathsf{Union} := \forall x\ \exists u\ \forall z(z\in u \Leftrightarrow \exists y(y\in x \wedge z\in y)).
    \end{align*} $$</span>
</p>
<blockquote>
    <p>
        By <a href="/tripos-notes/Lectures/II/Lent/Logic-and-Set-Theory-LS/Notes/Definition-axiom-of-extensionality.html"><span class="inline-math">$\mathsf{Ext}$</span></a>,
        for each <span class="inline-math">$x\in X$</span> this defines a unique object in a model <span class="inline-math">$X$</span>, denoted <span class="inline-math">$\bigcup x$</span>.
    </p>
    
</blockquote>
