<p>
    Suppose otherwise, i.e. <span class="inline-math">$\mathbf{X} \vDash \exists c \forall z(z\in c\Leftrightarrow \neg z\in z)$</span>.
    This means there exists <span class="inline-math">$r\in X$</span>
    such that for all <span class="inline-math">$x\in X$</span>, we have <span class="inline-math">$x\in r$</span> if and only if <span class="inline-math">$x\not\in x$</span>.
    But taking <span class="inline-math">$x = r$</span> gives <span class="inline-math">$r\in r$</span> iff <span class="inline-math">$r\not\in r$</span>,
    which is absurd.
</p>
