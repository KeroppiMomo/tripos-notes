<p>
    Let <span class="inline-math">$R$</span> be a <a href="/tripos-notes/Lectures/II/Lent/Logic-and-Set-Theory-LS/Notes/Definition-relation.html">binary relation</a> of a set <span class="inline-math">$X$</span>.
</p>
<p>
    For a subset <span class="inline-math">$S\subseteq X$</span>,
    an <em><span class="inline-math">$R$</span>-minimal element</em> of <span class="inline-math">$S$</span>
    is an element <span class="inline-math">$m\in S$</span>
    such that for all <span class="inline-math">$s\in S$</span>,
    it is not the case that <span class="inline-math">$sRm$</span>.
</p>
<p>
    <span class="inline-math">$R$</span> is <em>well-founded</em> if all subsets of <span class="inline-math">$X$</span> have an <span class="inline-math">$R$</span>-minimal element.
</p>
