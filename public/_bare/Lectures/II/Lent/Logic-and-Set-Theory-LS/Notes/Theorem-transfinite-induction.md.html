<p>
    Let <span class="inline-math">$ϕ$</span> is a formula with one free variable.
    Suppose
</p>
<ul>
<li>
    <p>
        <span class="inline-math">$ϕ(0)$</span> holds;
    </p>
    
</li><li>
    <p>
        for all <a href="/tripos-notes/Lectures/II/Lent/Logic-and-Set-Theory-LS/Notes/Definition-ordinal.html">ordinal</a> <span class="inline-math">$α$</span>, if <span class="inline-math">$ϕ(α)$</span> holds, then <span class="inline-math">$ϕ(s(α))$</span> holds; and
    </p>
    
</li><li>
    <p>
        for all limit ordinal <span class="inline-math">$λ$</span>, if <span class="inline-math">$ϕ(α)$</span> holds for all ordinals <span class="inline-math">$α&lt;λ$</span>, then <span class="inline-math">$ϕ(λ)$</span> holds.
    </p>
    
</li>
</ul>
<p>
    Then <span class="inline-math">$ϕ(α)$</span> holds for all ordinals <span class="inline-math">$α$</span>.
</p>
