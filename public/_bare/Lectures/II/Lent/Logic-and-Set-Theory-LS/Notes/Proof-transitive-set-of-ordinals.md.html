<p>
    Let <span class="inline-math">$A$</span> be a transitive set of ordinals.
    Since <a href="/tripos-notes/Lectures/II/Lent/Logic-and-Set-Theory-LS/Notes/Definition-ordinal.html#^prec"><span class="inline-math">$\prec$</span> is the same as <span class="inline-math">$\in$</span></a>
    and <a href="/tripos-notes/Lectures/II/Lent/Logic-and-Set-Theory-LS/Notes/Definition-ordinal.html#^isom"><span class="inline-math">$α \isom β$</span> iff <span class="inline-math">$α = β$</span></a>,
    the <a href="/tripos-notes/Lectures/II/Lent/Logic-and-Set-Theory-LS/Notes/Theorem-fundamental-theorem-of-well-orders.html">fundamental theorem of well-orders</a>
    states that <span class="inline-math">$(A, \prec)$</span> is a well-order.
</p>
