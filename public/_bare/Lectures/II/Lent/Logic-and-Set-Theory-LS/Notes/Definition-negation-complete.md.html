<p>
    Let <span class="inline-math">$T \subseteq \mathrm{Fml}$</span>.
</p>
<p>
    <span class="inline-math">$T$</span> is <em>negation complete</em>
    if for all <span class="inline-math">$ϕ\in \mathrm{Fml}$</span>,
    either <span class="inline-math">$T$</span><a href="/tripos-notes/Lectures/II/Lent/Logic-and-Set-Theory-LS/Notes/Definition-proof-in-propositional-logic.html"><span class="inline-math">${}\vdash{}$</span></a><span class="inline-math">$ϕ$</span> or <span class="inline-math">$T \vdash \neg ϕ$</span>.
</p>
