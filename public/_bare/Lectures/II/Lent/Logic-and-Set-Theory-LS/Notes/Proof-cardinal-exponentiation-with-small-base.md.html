<p>
    By <a href="/tripos-notes/Lectures/II/Lent/Logic-and-Set-Theory-LS/Notes/Theorem-Cantor.html">Cantor</a>, <span class="inline-math">$λ &lt; 2^λ$</span>,
    so <span class="inline-math">$λ^+ \leq 2^λ$</span>.
    <span class="display-math">$$ \begin{align*}
        2^λ \leq κ^λ \leq (λ^+)^λ \leq (2^{λ})^{λ} = 2^{λ\cdot λ} = 2^{λ}
    \end{align*} $$</span>
    by <a href="/tripos-notes/Lectures/II/Lent/Logic-and-Set-Theory-LS/Notes/Theorem-Hessenberg.html">Hessenberg</a>.
</p>
