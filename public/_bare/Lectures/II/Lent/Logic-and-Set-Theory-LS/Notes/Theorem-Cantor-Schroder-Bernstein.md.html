<p>
    Work in a model of <a href="/tripos-notes/Lectures/II/Lent/Logic-and-Set-Theory-LS/Notes/Definition-Zermelo-Fraenkel-set-theory.html"><span class="inline-math">$\mathsf{ZF}$</span></a>.
    Let <span class="inline-math">$X, Y$</span> be sets.
</p>
<p>
    If <a href="/tripos-notes/Lectures/II/Lent/Logic-and-Set-Theory-LS/Notes/Definition-cardinality.html"><span class="inline-math">$|X|\leq |Y|$</span></a> and <span class="inline-math">$|Y| \leq |X|$</span>, then <a href="/tripos-notes/Lectures/II/Lent/Logic-and-Set-Theory-LS/Notes/Definition-cardinality.html"><span class="inline-math">$|X| = |Y|$</span></a>.
</p>
