<p>
    If <span class="inline-math">$x\in y\in z\in α$</span>,
    since <span class="inline-math">$α$</span> is a transitive set, <span class="inline-math">$y\in α$</span> and <span class="inline-math">$x\in α$</span>.
    Because <span class="inline-math">$\in$</span> is a transitive relation on <span class="inline-math">$α$</span>,
    <span class="inline-math">$x\in y$</span> and <span class="inline-math">$y\in z$</span> implies <span class="inline-math">$x\in z$</span>,
    so <span class="inline-math">$z$</span> is a transitive set.
</p>
<p>
    For <span class="inline-math">$z\in α$</span>, since <span class="inline-math">$α$</span> is a transitive set,
    <span class="inline-math">$z\subseteq α$</span>,
    <a href="/tripos-notes/Lectures/II/Lent/Logic-and-Set-Theory-LS/Notes/Definition-well-order-initial-segment.html#^subset">so</a> <span class="inline-math">$(z, \in)$</span> is a well-order.
</p>
