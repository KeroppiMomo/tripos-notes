<p>
    Let <span class="inline-math">$G$</span> be a finite group.
    If <span class="inline-math">$G$</span> has a <a href="/tripos-notes/Lectures/IA/Michaelmas/Groups-Gp/Definition-conjugacy-class-centraliser.html">conjugacy class</a>
    which is not <span class="inline-math">$\set{1}$</span>
    and whose size is a prime power,
    then <span class="inline-math">$G$</span> cannot be a non-abelian <a href="/tripos-notes/Lectures/IA/Michaelmas/Groups-Gp/Definition-simple-group.html">simple</a> group.
