<p>
    Let <span class="inline-math">$ρ: G\to \GL(V)$</span> be a complex representation,
    and let <span class="inline-math">$G$</span> act on <a href="/tripos-notes/Lectures/II/Michaelmas/Representation-Theory-RT/Notes/Definition-tensor-powers-symmetric-power-exterior-power.html"><span class="inline-math">$S^2 V$</span></a> and <a href="/tripos-notes/Lectures/II/Michaelmas/Representation-Theory-RT/Notes/Definition-tensor-powers-symmetric-power-exterior-power.html"><span class="inline-math">$Λ^2 V$</span></a>.
</p>
<p>
    Their characters are
    <span class="display-math">$$ \begin{align*}
        χ_{S^2 V}(g) ={}&amp; \frac{1}{2}(χ_ρ(g)^2 + χ_ρ(g^2)), \\
        χ_{Λ^2 V}(g) ={}&amp; \frac{1}{2}(χ_ρ(g)^2 - χ_ρ(g^2)).
    \end{align*} $$</span>
</p>
