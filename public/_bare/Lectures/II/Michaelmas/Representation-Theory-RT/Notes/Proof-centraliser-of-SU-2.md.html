<p>
    <span class="inline-math">$\pmat{a &amp; b \\ -\bar b &amp; \bar a}\in Z_{\op{SU}(2)}(\pmat{λ \\ &amp;-λ})$</span> iff
    <span class="display-math">$$ \begin{align*}
        \pmat{a &amp; b \\ -\bar b &amp;\bar a}\pmat{λ \\ &amp;-λ} = \pmat{λ \\ &amp;-λ}\pmat{a &amp; b \\ -\bar b &amp; \bar a} \iff bλ = bλ\inv.
    \end{align*} $$</span>
    Since <span class="inline-math">$λ\neq λ\inv$</span>, we need <span class="inline-math">$b = 0$</span>.
</p>
