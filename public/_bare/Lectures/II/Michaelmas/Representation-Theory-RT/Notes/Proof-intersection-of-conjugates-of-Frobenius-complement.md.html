<p>
    <span class="inline-math">$H \cap gHg\inv = H$</span> if <span class="inline-math">$g \in H$</span> (by group theory)
    and <span class="inline-math">$\set{1}$</span> if otherwise (by definition of a Frobenius group).
</p>
<p>
    Therefore
    if <span class="inline-math">$g&#x27;\in gH$</span>, then <span class="inline-math">$H = H \cap g\inv g&#x27;H g&#x27;\inv g$</span> so <span class="inline-math">$gHg\inv = g&#x27;Hg&#x27;\inv$</span>.
    Otherwise, <span class="inline-math">$\set{1} = H \cap g\inv g&#x27;Hg&#x27;\inv g$</span> so <span class="inline-math">$gHg\inv \cap g&#x27;Hg&#x27;\inv = \set{1}$</span>.
</p>
