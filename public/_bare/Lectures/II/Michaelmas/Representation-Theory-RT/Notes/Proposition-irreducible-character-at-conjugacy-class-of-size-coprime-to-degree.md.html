<p>
    Let <span class="inline-math">$χ$</span> be a <a href="/tripos-notes/Lectures/II/Michaelmas/Representation-Theory-RT/Notes/Definition-character-of-representation.html">character</a> of <span class="inline-math">$G$</span>
    and <span class="inline-math">$\mathcal{C} = \prescript{G}{}g$</span> is the conjugacy class of <span class="inline-math">$g\in G$</span>.
</p>
<p>
    If <span class="inline-math">$χ$</span> is <a href="/tripos-notes/Lectures/II/Michaelmas/Representation-Theory-RT/Notes/Definition-subrepresentation-irreducible.html">irreducible</a> and <span class="inline-math">$\# \mathcal{C}$</span> and <span class="inline-math">$\deg χ$</span> are coprime,
    then <span class="inline-math">$χ(g) = 0$</span> or <span class="inline-math">$|χ(g)| = \deg χ$</span>.
</p>
