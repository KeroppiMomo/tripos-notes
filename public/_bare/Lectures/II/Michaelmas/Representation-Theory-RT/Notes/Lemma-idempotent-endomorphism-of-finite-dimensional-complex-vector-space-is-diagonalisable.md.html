<p>
    Let <span class="inline-math">$V$</span> be a finite-dimensional complex vector space.
</p>
<p>
    If <span class="inline-math">$α:V\to V$</span> is idempotent, i.e. <span class="inline-math">$α^m = \id$</span> for some <span class="inline-math">$m\geq 1$</span>,
    then <span class="inline-math">$α$</span> is <a href="/tripos-notes/Lectures/IB/Michaelmas/Linear-Algebra-LA/Notes/Definition-diagonalisable-and-triangularisable.html">diagonalisable</a>.
</p>
