<p>
    Let <span class="inline-math">$G$</span> be a <a href="/tripos-notes/Lectures/IB/Michaelmas/Analysis-and-Topology-AT/Notes/Definition-compact.html">compact</a> <a href="/tripos-notes/Lectures/II/Michaelmas/Representation-Theory-RT/Notes/Definition-topological-group.html">topological group</a>.
</p>
<p>
    There exists a unique <a href="/tripos-notes/Lectures/II/Michaelmas/Probability-and-Measure-PM/Notes/Definition-Borel-sigma-algebra.html">Borel</a> <a href="/tripos-notes/Lectures/II/Michaelmas/Probability-and-Measure-PM/Notes/Definition-measure-space.html">measure</a> <span class="inline-math">$μ$</span> on <span class="inline-math">$G$</span>
    satisfying
</p>
<ol start="1">
<li>
    <p>
        translation invariance: <span class="inline-math">$μ(S) = μ(gS)$</span> for all <span class="inline-math">$S\subseteq G$</span> Borel, <span class="inline-math">$g\in G$</span>;
    </p>
    
</li><li>
    <p>
        <span class="inline-math">$\int_G μ(\d g) = 1$</span>.
    </p>
    
</li>
</ol>
