<p>
    A <em>topological group</em> is a <a href="/tripos-notes/Lectures/IB/Michaelmas/Analysis-and-Topology-AT/Notes/Definition-topology-topological-space-open-set.html">topological space</a>
    which is also a <a href="/tripos-notes/Lectures/IA/Michaelmas/Groups-Gp/Definition-group.html">group</a>,
    such that the group operation <span class="inline-math">$\cdot: G\times G\to G$</span>
    and the inverse <span class="inline-math">$\inv: G\to G$</span> are continuous.
</p>
