<p>
    Let <span class="inline-math">$V$</span> be a <a href="/tripos-notes/Lectures/IB/Michaelmas/Linear-Algebra-LA/Notes/Definition-finite-dimensional-vector-space.html">finite-dimensional</a> <a href="/tripos-notes/Lectures/IA/Michaelmas/Vectors-and-Matrices-VM/Definition-vector-space.html">vector space</a> over <span class="inline-math">$\C$</span>.
</p>
<p>
    A <em>representation</em> of a <a href="/tripos-notes/Lectures/II/Michaelmas/Representation-Theory-RT/Notes/Definition-topological-group.html">topological group</a> <span class="inline-math">$G$</span> on <span class="inline-math">$V$</span>
    is a <a href="/tripos-notes/Lectures/IB/Michaelmas/Analysis-and-Topology-AT/Notes/Definition-continuity-on-topological-space.html">continuous</a> <a href="/tripos-notes/Lectures/IA/Michaelmas/Groups-Gp/Definition-homomorphism.html">group homomorphism</a> <span class="inline-math">$ρ: G \to{}$</span><a href="/tripos-notes/Lectures/IA/Michaelmas/Groups-Gp/Definition-general-linear-group.html"><span class="inline-math">$\GL$</span></a><span class="inline-math">$(V)$</span>
    (where <span class="inline-math">$\GL(V)$</span> has topology inherited from <span class="inline-math">$\op{End}(V) \isom \C^{n\times n}$</span>).
</p>
