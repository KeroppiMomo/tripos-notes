<p>
    Let <span class="inline-math">$G$</span> be a finite group <a href="/tripos-notes/Lectures/IA/Michaelmas/Groups-Gp/Definition-group-action.html">acting</a> on a finite set <span class="inline-math">$X$</span>.
    Then
    <span class="display-math">$$ \begin{align*}
        \frac{1}{\# G}\sum_{g\in G} \# X^g = \#G\backslash X.
    \end{align*} $$</span>
    where <span class="inline-math">$X^g = \sb{x\in X}{gx = x}$</span> is the set of fixed points of <span class="inline-math">$g$</span>
    and <span class="inline-math">$G\backslash X = \sb{Gx}{x\in X}$</span> is the set of the <a href="/tripos-notes/Lectures/IA/Michaelmas/Groups-Gp/Definition-orbits-and-stabilisers.html">orbits</a>.
</p>
