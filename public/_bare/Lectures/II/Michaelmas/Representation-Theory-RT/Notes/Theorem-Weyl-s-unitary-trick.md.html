<p>
    Let <span class="inline-math">$ρ: G\to \GL(V)$</span> be a complex <a href="/tripos-notes/Lectures/II/Michaelmas/Representation-Theory-RT/Notes/Definition-representation.html">representation</a>.
</p>
<p>
    There exists an <a href="/tripos-notes/Lectures/IB/Michaelmas/Linear-Algebra-LA/Notes/Definition-inner-product-space.html">inner product</a> <span class="inline-math">$\langle,\rangle$</span> on <span class="inline-math">$V$</span>
    which is <span class="inline-math">$G$</span>-invariant, i.e.
    <span class="inline-math">$\langle gv, gw\rangle = \langle v,w\rangle$</span> for all <span class="inline-math">$v,w\in V$</span>.
</p>
<p>
    Therefore <span class="inline-math">$ρ(G)$</span> is conjugate to a subgroup of the <a href="/tripos-notes/Lectures/IB/Michaelmas/Linear-Algebra-LA/Notes/Definition-orthogonal-and-unitary-groups-of-inner-product-spaces.html">unitary group</a> <span class="inline-math">$U(V)$</span>.
</p>
