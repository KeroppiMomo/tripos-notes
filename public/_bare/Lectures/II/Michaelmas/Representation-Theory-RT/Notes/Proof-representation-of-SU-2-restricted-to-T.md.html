<p>
    If two representations on <span class="inline-math">$\op{SU}(2)$</span> have equal character on <span class="inline-math">$T$</span>
    then since every conjugacy class of <span class="inline-math">$\op{SU}(2)$</span> intersects <span class="inline-math">$T$</span>,
    the characters agree on the whole <span class="inline-math">$\op{SU}(2)$</span>.
    Therefore the representations are isomorphic.
</p>
