<p>
    <a href="/tripos-notes/Lectures/II/Michaelmas/Representation-Theory-RT/Notes/Theorem-Schur-s-lemma.html#^centre">Since</a> <span class="inline-math">$Z(G) = G$</span>, if <span class="inline-math">$ρ: G\to \GL(V)$</span> is a representation,
    any <span class="inline-math">$g\in G$</span> acts by <span class="inline-math">$ρ(g) = λ \id_V$</span> for some <span class="inline-math">$λ\in k^\times$</span>.
    Therefore any one-dimensional subspace of <span class="inline-math">$V$</span> is a subrepresentation.
</p>
