<p>
    Let <span class="inline-math">$G$</span> be a group and <span class="inline-math">$H\leq G$</span> be a subgroup.
</p>
<p>
    The <em>restriction</em> of a <a href="/tripos-notes/Lectures/II/Michaelmas/Representation-Theory-RT/Notes/Definition-representation.html">representation</a> <span class="inline-math">$ρ: G\to \GL(V)$</span> to <span class="inline-math">$H$</span>
    is <span class="inline-math">$\op{Res}^G_H = ρ|_H: H \to \GL(V)$</span>.
</p>
