<p>
    <a href="/tripos-notes/Lectures/II/Michaelmas/Representation-Theory-RT/Notes/Lemma-idempotent-endomorphism-of-finite-dimensional-complex-vector-space-is-diagonalisable.html">Diagonalising</a> <span class="inline-math">$ρ(g_i)$</span>,
    the eigenvalues of <span class="inline-math">$ρ(g_i)$</span> are roots of unity.
    Thus <span class="inline-math">$χ(g_i)$</span> is a sum of roots of unity,
    <a href="/tripos-notes/Lectures/II/Michaelmas/Representation-Theory-RT/Notes/Theorem-algebraic-integers-form-a-ring.html">so</a> is an algebraic integer.
