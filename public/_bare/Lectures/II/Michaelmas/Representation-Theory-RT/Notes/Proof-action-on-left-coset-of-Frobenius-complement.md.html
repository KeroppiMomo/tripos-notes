<p>
    If <span class="inline-math">$g\in G$</span> is such that <span class="inline-math">$gg_1 H = g_1 H$</span>
    and <span class="inline-math">$gg_2 H = g_2H$</span>,
    then <span class="inline-math">$g_1\inv Hg_1 \cap g_2\inv H g_2 = \set{g}$</span>,
    so either <span class="inline-math">$g = 1$</span> or <span class="inline-math">$g_2\in g_1H$</span>
    considering <a href="/tripos-notes/Lectures/II/Michaelmas/Representation-Theory-RT/Notes/Definition-Frobenius-group.html#^conjugate">how conjugates of <span class="inline-math">$H$</span> intersects</a>.
</p>
