<p>
    The <a href="/tripos-notes/Lectures/IB/Lent/Groups-Rings-and-Modules-GRM/Notes/Definition-algebraic-integer.html">algebraic integers</a>
    form a <a href="/tripos-notes/Lectures/IB/Lent/Groups-Rings-and-Modules-GRM/Notes/Definition-subring.html">subring</a> of <span class="inline-math">$\C$</span>.
    That is, if <span class="inline-math">$λ,μ$</span> are algebraic integers,
    so are <span class="inline-math">$λ+μ$</span> and <span class="inline-math">$λμ$</span>.
