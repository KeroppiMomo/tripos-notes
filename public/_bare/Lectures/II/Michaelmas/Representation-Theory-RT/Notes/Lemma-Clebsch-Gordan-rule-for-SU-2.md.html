<p>
    Let <span class="inline-math">$V_n$</span> be the unique <a href="/tripos-notes/Lectures/II/Michaelmas/Representation-Theory-RT/Notes/Theorem-representation-of-SU-2.html">irreducible representation of <span class="inline-math">$\op{SU}(2)$</span></a> of dimension <span class="inline-math">$(n+1)$</span>.
    Then
    <span class="display-math">$$ \begin{align*}
        V_n \otimes V_m \isom V_{n+m} \oplus V_{n+m-2} \oplus \ldots \oplus V_{|n-m|}
    \end{align*} $$</span>
    where <span class="inline-math">$\otimes$</span> is the <a href="/tripos-notes/Lectures/II/Michaelmas/Representation-Theory-RT/Notes/Definition-tensor-product-of-vector-spaces.html">tensor product</a>.
    This is known as the <em>Clebsch-Gordan rule</em>.
</p>
