<p>
    <span class="display-math">$$ \begin{align*}
        χ_ρ(hgh\inv) = \tr ρ(hgh\inv) = \tr (ρ(h) ρ(g) ρ(h)\inv) = \tr ρ(g) = χ_ρ(g)
    \end{align*} $$</span>
    where we have used the fact that
    <span class="inline-math">$ρ$</span> is a group homomorphism
    and trace is conjugate-invariant.
</p>
