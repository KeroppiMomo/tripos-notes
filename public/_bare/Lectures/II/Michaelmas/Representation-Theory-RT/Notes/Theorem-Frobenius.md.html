<p>
    Let <span class="inline-math">$G$</span> be a <a href="/tripos-notes/Lectures/II/Michaelmas/Representation-Theory-RT/Notes/Definition-Frobenius-group.html">Frobenius group</a>.
    The <em>Frobenius kernel</em>
    <span class="display-math">$$ \begin{align*}
        K := \set{1} \cup \sb{g\in G}{\prescript{G}{}g \cap H = \emptyset} = \set{1} \cup \sb{g\in G}{gg&#x27;H \neq g&#x27;H\; \forall g&#x27;\in G}
    \end{align*} $$</span>
    is a <a href="/tripos-notes/Lectures/IA/Michaelmas/Groups-Gp/Definition-normal-subgroup.html">normal subgroup</a> of <span class="inline-math">$G$</span>.
</p>
