<p>
    A topological space <span class="inline-math">$X$</span> is <em>simply connected</em> if
</p>
<ul>
<li>
    <p>
        <span class="inline-math">$X$</span> is <a href="/tripos-notes/Lectures/IB/Michaelmas/Analysis-and-Topology-AT/Notes/Definition-path-connected.html">path-connected</a>; and
    </p>
    
</li><li>
    <p>
        its <a href="/tripos-notes/Lectures/II/Michaelmas/Algebraic-Topology-ALT/Notes/Theorem-fundamental-group.html">fundamental group</a> <span class="inline-math">$π_1(X, x_0)$</span>
        is trivial for some (and <a href="/tripos-notes/Lectures/II/Michaelmas/Algebraic-Topology-ALT/Notes/Proposition-change-of-basepoint.html">thus</a> every) basepoint <span class="inline-math">$x_0$</span>.
    </p>
    
</li>
</ul>
<blockquote>
    <p>
        If <span class="inline-math">$X$</span> is <a href="/tripos-notes/Lectures/II/Michaelmas/Algebraic-Topology-ALT/Notes/Definition-contractible-space.html">contractible</a>, <a href="/tripos-notes/Lectures/II/Michaelmas/Algebraic-Topology-ALT/Notes/Theorem-homotopy-equivalence-descends-to-isomorphism-between-fundamental-groups.html">then</a>
        <span class="inline-math">$X$</span> is simply connected.
    </p>
    
</blockquote>
