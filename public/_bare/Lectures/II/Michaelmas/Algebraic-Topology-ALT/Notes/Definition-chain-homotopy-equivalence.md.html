<p>
    A <a href="/tripos-notes/Lectures/II/Michaelmas/Algebraic-Topology-ALT/Notes/Definition-chain-complex-differential-homology-chain-map.html">chain map</a> <span class="inline-math">$f_\bullet: C_\bullet\to D_\bullet$</span> is
    a <em>chain homotopy equivalence</em>
    if there exists a chain map <span class="inline-math">$g_\bullet: D_\bullet\to C_\bullet$</span>
    such that <span class="inline-math">$f_\bullet\circ g_\bullet$</span><a href="/tripos-notes/Lectures/II/Michaelmas/Algebraic-Topology-ALT/Notes/Definition-chain-homotopy.html"><span class="inline-math">${}\simeq{}$</span></a><span class="inline-math">$\id_{D_\bullet}$</span>
    and <span class="inline-math">$g_\bullet \circ f_\bullet\simeq \id_{C_\bullet}$</span>.
</p>
