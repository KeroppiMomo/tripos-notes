<p>
    For a <a href="/tripos-notes/Lectures/II/Michaelmas/Algebraic-Topology-ALT/Notes/Definition-simplicial-complex.html">simplicial complex</a> <span class="inline-math">$K$</span>,
    there is a <em>boundary homomorphism</em> between <a href="/tripos-notes/Lectures/II/Michaelmas/Algebraic-Topology-ALT/Notes/Definition-chain-group.html">chain groups</a>
    <span class="display-math">$$ \begin{align*}
        d_n : C_n(K) &amp;\to C_{n-1}(K) \\
        [[v_0, v_1, \ldots, v_n]] &amp;\mapsto \sum_{i=0}^{n} (-1)^i \cdot [[v_0, \ldots, v_{i-1}, v_{i+1}, \ldots, v_n]].
    \end{align*} $$</span>
</p>
