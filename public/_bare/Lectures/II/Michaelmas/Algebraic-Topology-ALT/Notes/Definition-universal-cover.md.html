<p>
    We say a covering map <span class="inline-math">$p: \tilde X\to X$</span>
    is a <em>universal cover</em>
    if <span class="inline-math">$\tilde X$</span> is <a href="/tripos-notes/Lectures/II/Michaelmas/Algebraic-Topology-ALT/Notes/Definition-simply-connected.html">simply connected</a>.
</p>
<ul>
<li>
    <p>
        Letting <span class="inline-math">$π_1(X, x_0)$</span> act on <span class="inline-math">$p\inv(x_0)$</span> <a href="/tripos-notes/Lectures/II/Michaelmas/Algebraic-Topology-ALT/Notes/Lemma-action-of-fundamental-group-on-preimage-under-covering-map.html">determines a bijection</a>
        <span class="display-math">$$ \begin{align*}
            l: π_1(X, x_0) &amp;\to p\inv(x_0) \\
            [γ] &amp;\mapsto \tilde x_0 \bullet [γ].
        \end{align*} $$</span>
    </p>
    
</li>
</ul>
