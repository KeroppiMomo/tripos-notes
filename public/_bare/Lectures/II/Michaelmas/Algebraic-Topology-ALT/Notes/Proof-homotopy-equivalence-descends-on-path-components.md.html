<p>
    If <span class="inline-math">$f: X\to Y$</span> has a homotopy inverse <span class="inline-math">$g: Y\to X$</span>, then
    <span class="inline-math">$π_0(g) \circ π_0(f)$</span><a href="/tripos-notes/Lectures/II/Michaelmas/Algebraic-Topology-ALT/Notes/Proposition-map-descends-on-path-components.html#^comp"><span class="inline-math">${}={}$</span></a><span class="inline-math">$π_0(g\circ f)$</span><a href="/tripos-notes/Lectures/II/Michaelmas/Algebraic-Topology-ALT/Notes/Proposition-map-descends-on-path-components.html#^hom"><span class="inline-math">${}={}$</span></a><span class="inline-math">$π_0(\id_X)$</span><a href="/tripos-notes/Lectures/II/Michaelmas/Algebraic-Topology-ALT/Notes/Proposition-map-descends-on-path-components.html#^id"><span class="inline-math">${}={}$</span></a><span class="inline-math">$\id_{π_0(X)}$</span>.
    Similarly <span class="inline-math">$π_0(f)\circ π_0(g) = \id_{π_0(Y)}$</span>.
    Thus <span class="inline-math">$π_0(g) = π_0(f)\inv$</span>.
</p>
