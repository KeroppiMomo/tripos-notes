<p>
    Let <span class="inline-math">$f: X\to Y$</span> be a function between topological spaces,
    and <span class="inline-math">$A,B\subseteq X$</span> are subsets.
</p>
<p>
    Suppose <span class="inline-math">$A\cup B = X$</span> and <span class="inline-math">$A,B$</span> are closed.
    Then <span class="inline-math">$f$</span> is <a href="/tripos-notes/Lectures/IB/Michaelmas/Analysis-and-Topology-AT/Notes/Definition-continuity-on-topological-space.html">continuous</a> iff both <span class="inline-math">$f|_A$</span> and <span class="inline-math">$f|_B$</span> are continuous.
</p>
