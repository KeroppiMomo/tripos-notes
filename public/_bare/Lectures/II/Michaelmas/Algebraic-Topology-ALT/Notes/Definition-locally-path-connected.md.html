<p>
    A topological space <span class="inline-math">$X$</span>
    is called <em>locally path-connected</em>
    if for every point <span class="inline-math">$x\in X$</span>
    and neighbourhood <span class="inline-math">$U$</span> of <span class="inline-math">$x$</span>,
    there exists a <a href="/tripos-notes/Lectures/IB/Michaelmas/Analysis-and-Topology-AT/Notes/Definition-path-connected.html">path-connected</a>
    neighbourhood <span class="inline-math">$V\subseteq U$</span> of <span class="inline-math">$x$</span>.
</p>
