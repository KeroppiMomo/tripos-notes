<p>
    A <em>based space</em> is a pair <span class="inline-math">$(X, x_0)$</span> of a <a href="/tripos-notes/Lectures/IB/Michaelmas/Analysis-and-Topology-AT/Notes/Definition-topology-topological-space-open-set.html">topological space</a> <span class="inline-math">$X$</span> and a <em>basepoint</em> <span class="inline-math">$x_0\in X$</span>.
</p>
<p>
    A <em>based map</em> <span class="inline-math">$f: (X, x_0) \to (Y, y_0)$</span>
    is a <a href="/tripos-notes/Lectures/IB/Michaelmas/Analysis-and-Topology-AT/Notes/Definition-continuity-on-topological-space.html">continuous function</a> <span class="inline-math">$f: X\to Y$</span> such that <span class="inline-math">$f(x_0) = y_0$</span>.
</p>
<p>
    A <em>based homotopy</em> a <a href="/tripos-notes/Lectures/II/Michaelmas/Algebraic-Topology-ALT/Notes/Definition-homotopy.html">homotopy relative</a> to <span class="inline-math">$\set{x_0}$</span>.
</p>
