<p>
    The <em>mesh</em> of a <a href="/tripos-notes/Lectures/II/Michaelmas/Algebraic-Topology-ALT/Notes/Definition-simplicial-complex.html">simplicial complex</a> <span class="inline-math">$K$</span> is
    <span class="display-math">$$ \begin{align*}
        μ(K) = \max \sb{\|v_0 - v_1\|}{\langle v_0, v_1\rangle\in K}.
    \end{align*} $$</span>
