<p>
    Let <span class="inline-math">$K$</span> be a <a href="/tripos-notes/Lectures/II/Michaelmas/Algebraic-Topology-ALT/Notes/Definition-simplicial-complex.html">simplicial complex</a> of dimension <span class="inline-math">$n$</span>.
    Then
    <span class="display-math">$$ \begin{align*}
        μ(K&#x27;) \leq \Bigl(\frac{n}{n+1}\Bigr) \cdot μ(K).
    \end{align*} $$</span>
    In particular, <a href="/tripos-notes/Lectures/II/Michaelmas/Algebraic-Topology-ALT/Notes/Definition-mesh-of-simplicial-complex.html"><span class="inline-math">$μ$</span></a><span class="inline-math">$(K^{(r)}) \to 0$</span> as <span class="inline-math">$r\to \infty$</span>.
</p>
