<p>
    Let <span class="inline-math">$f: X\to X$</span> be a continuous map from a <a href="/tripos-notes/Lectures/II/Michaelmas/Algebraic-Topology-ALT/Notes/Definition-triangulation-using-simplicial-complexes.html">triangulable space</a> to itself.
</p>
<p>
    If the <a href="/tripos-notes/Lectures/II/Michaelmas/Algebraic-Topology-ALT/Notes/Definition-Lefschetz-number-Euler-characteristic-of-simplicial-complex.html">Lefschetz number</a> <span class="inline-math">$L(f) \neq 0$</span>,
    then <span class="inline-math">$f$</span> has a fixed point.
</p>
<p>
    <a href="/tripos-notes/Lectures/II/Michaelmas/Algebraic-Topology-ALT/Notes/Proof-Lefschetz-fixed-point.html">Proof</a>
</p>
<blockquote>
    <p>
        If <span class="inline-math">$X$</span> is triangulable and <a href="/tripos-notes/Lectures/II/Michaelmas/Algebraic-Topology-ALT/Notes/Definition-contractible-space.html">contractible</a>,
        then <span class="inline-math">$L(f) = 1$</span> so <span class="inline-math">$f$</span> must have a fixed point.
    </p>
    
</blockquote>
