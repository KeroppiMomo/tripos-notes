<p>
    Every <a href="/tripos-notes/Lectures/IB/Michaelmas/Analysis-and-Topology-AT/Notes/Definition-continuity-on-topological-space.html">continuous map</a>
    <span class="inline-math">$D^n\to D^n$</span> has a fixed point,
    where <span class="inline-math">$D^n = \sb{x\in \R^n}{|x|\leq 1}$</span>.
</p>
<p>
    <a href="/tripos-notes/Lectures/II/Michaelmas/Algebraic-Topology-ALT/Notes/Proof-Brouwer-s-fixed-point-theorem.html">Proof</a>
</p>
