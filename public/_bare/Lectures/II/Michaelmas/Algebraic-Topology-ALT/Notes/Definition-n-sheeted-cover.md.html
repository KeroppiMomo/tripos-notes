<p>
    Say a <a href="/tripos-notes/Lectures/II/Michaelmas/Algebraic-Topology-ALT/Notes/Definition-covering-space.html">covering map</a> <span class="inline-math">$p: \tilde X \to X$</span>
    is an <span class="inline-math">$n$</span>-sheeted cover (for <span class="inline-math">$n\in \N \cup \set{\infty}$</span>)
    if each <span class="inline-math">$p\inv(x)$</span> has cardinality <span class="inline-math">$n$</span>.
</p>
<ul>
<li>
    <p>
        If <span class="inline-math">$X$</span> is path-connected, <a href="/tripos-notes/Lectures/II/Michaelmas/Algebraic-Topology-ALT/Notes/Corollary-path-induces-bijection-between-point-preimages-under-covering-map.html">then</a>
        all <span class="inline-math">$p\inv(x)$</span> has the same cardinality.
    </p>
    
</li>
</ul>
