<p>
    The <span class="inline-math">$n$</span>-th <em>simplicial homology group</em> of a <a href="/tripos-notes/Lectures/II/Michaelmas/Algebraic-Topology-ALT/Notes/Definition-simplicial-complex.html">simplicial complex</a> <span class="inline-math">$K$</span> is
    <span class="display-math">$$ \begin{align*}
        H_n(K) = (\ker d_n) / (\im d_{n+1}).
    \end{align*} $$</span>
</p>
<ul>
<li>
    <p>
        This is well-defined as <a href="/tripos-notes/Lectures/II/Michaelmas/Algebraic-Topology-ALT/Notes/Lemma-boundary-of-boundary.html"><span class="inline-math">$d_{n-1}\circ d_n$</span> is trivial</a>.
    </p>
    
</li>
</ul>
