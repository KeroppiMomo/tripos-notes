<p>
    Let <span class="inline-math">$X$</span> be a space and <span class="inline-math">$x_0\in X$</span> be a point.
</p>
<p>
    Let <span class="inline-math">$π_1(X, x_0)$</span> denote the set of
    <a href="/tripos-notes/Lectures/II/Michaelmas/Algebraic-Topology-ALT/Notes/Definition-homotopic-as-paths.html">homotopy classes</a> of <a href="/tripos-notes/Lectures/II/Michaelmas/Algebraic-Topology-ALT/Notes/Definition-path-loop-concatenation-inverse-constant-path.html">loops</a>
    in <span class="inline-math">$X$</span> based at <span class="inline-math">$x_0$</span>.
    Then <span class="inline-math">$π_1(X, x_0)$</span> is a <a href="/tripos-notes/Lectures/IA/Michaelmas/Groups-Gp/Definition-group.html">group</a> with operation
    <span class="inline-math">$[γ] \cdot [γ&#x27;] = [γ\cdot γ&#x27;]$</span> and identity element <span class="inline-math">$[c_{x_0}]$</span>.
</p>
<p>
    Proof: immediate from properties <a href="/tripos-notes/Lectures/II/Michaelmas/Algebraic-Topology-ALT/Notes/Definition-homotopic-as-paths.html">here</a>.
</p>
