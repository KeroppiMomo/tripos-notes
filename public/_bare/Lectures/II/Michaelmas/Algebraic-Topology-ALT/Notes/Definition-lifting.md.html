<p>
    Let <span class="inline-math">$p: \tilde X\to X$</span> be a <a href="/tripos-notes/Lectures/II/Michaelmas/Algebraic-Topology-ALT/Notes/Definition-covering-space.html">covering space</a>
    and <span class="inline-math">$f: Y\to X$</span> be a <a href="/tripos-notes/Lectures/IB/Michaelmas/Analysis-and-Topology-AT/Notes/Definition-continuity-on-topological-space.html">map</a>.
</p>
<p>
    A <em>lift of <span class="inline-math">$f$</span> along <span class="inline-math">$p$</span></em>
    is a map <span class="inline-math">$\tilde f: Y\to \tilde X$</span> such that <span class="inline-math">$p\circ \tilde f = f$</span>.
</p>
