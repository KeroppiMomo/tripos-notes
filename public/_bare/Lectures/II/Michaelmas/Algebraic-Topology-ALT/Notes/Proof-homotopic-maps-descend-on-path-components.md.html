<p>
    Let <span class="inline-math">$H: X\times [0,1] \to Y$</span> be a homotopy from <span class="inline-math">$f$</span> to <span class="inline-math">$g$</span>.
    For every <span class="inline-math">$x\in X$</span>,
    we obtain a path <span class="inline-math">$H(x, \cdot):[0,1] \to Y$</span> from <span class="inline-math">$f(x)$</span> to <span class="inline-math">$g(x)$</span>.
    This shows that <span class="inline-math">$[f(x)] = [g(x)]\in π_0(Y)$</span>.
</p>
