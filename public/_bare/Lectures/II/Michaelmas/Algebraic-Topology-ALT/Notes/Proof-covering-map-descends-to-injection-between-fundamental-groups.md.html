<p>
    Suppose <span class="inline-math">$p_\ast([γ]) = [c_{x_0}]$</span>,
    which means <span class="inline-math">$p\circ γ \simeq c_{x_0}$</span>.
    <a href="/tripos-notes/Lectures/II/Michaelmas/Algebraic-Topology-ALT/Notes/Lemma-homotopy-lifting-lemma-monodromy-theorem.html#^homotopic-path">Lift both sides</a> starting from <span class="inline-math">$\tilde x_0$</span>,
    we obtain <span class="inline-math">$γ \simeq c_{\tilde x_0}$</span>.
    Thus <span class="inline-math">$[γ]$</span> is the identity.
