<p>
    Let <span class="inline-math">$K$</span> be a simplicial complex.
</p>
<p>
    If the <a href="/tripos-notes/Lectures/II/Michaelmas/Algebraic-Topology-ALT/Notes/Definition-simplicial-homology-group.html">ordinary homology</a> is <span class="inline-math">$H_n(K) \isom \Z^d \oplus F$</span> where <span class="inline-math">$F$</span> is a finite abelian group,
    then the <a href="/tripos-notes/Lectures/II/Michaelmas/Algebraic-Topology-ALT/Notes/Definition-rational-homology.html">rational homology</a> is <span class="inline-math">$H_n(K; \Q)\isom \Q^d$</span>.
</p>
