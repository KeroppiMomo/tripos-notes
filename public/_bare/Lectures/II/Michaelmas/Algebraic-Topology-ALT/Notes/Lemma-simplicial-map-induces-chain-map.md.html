<p>
    A <a href="/tripos-notes/Lectures/II/Michaelmas/Algebraic-Topology-ALT/Notes/Definition-simplicial-map.html">simplicial map</a> <span class="inline-math">$f: K\to L$</span>
    induces a <a href="/tripos-notes/Lectures/II/Michaelmas/Algebraic-Topology-ALT/Notes/Definition-chain-complex-differential-homology-chain-map.html">chain map</a>
    <span class="inline-math">$f_\bullet:{}$</span><a href="/tripos-notes/Lectures/II/Michaelmas/Algebraic-Topology-ALT/Notes/Definition-chain-group.html"><span class="inline-math">$C_\bullet(K)$</span></a><span class="inline-math">${}\to C_\bullet(L)$</span> defined by
    <span class="display-math">$$ \begin{align*}
        f_n: C_n(K) &amp;\to C_n(L)\\
        [a_0, a_1, \ldots, a_n] &amp;\mapsto [f(a_0), f(a_1), \ldots, f(a_n)]
    \end{align*} $$</span>
    and <a href="/tripos-notes/Lectures/II/Michaelmas/Algebraic-Topology-ALT/Notes/Lemma-chain-map-induces-homomorphism-of-homology-groups.html">thus</a> a homomorphism <span class="inline-math">$f_\ast: H_n(K) \to H_n(L)$</span>.
</p>
