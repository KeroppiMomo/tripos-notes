<p>
    The required homotopy is
    <span class="display-math">$$ \begin{align*}
        H(s,t) = \begin{cases}
            γ_0(\frac{4s}{t+1}), &amp;0\leq s\leq \frac{t+1}{4}, \\
            γ_1(4s - t- 1), &amp;\frac{t+1}{4} \leq s \leq \frac{t+2}{4}, \\
            γ_2(\frac{4s - t - 2}{2 - t}), &amp;\frac{t+2}{4} \leq s \leq 1.
        \end{cases}
    \end{align*} $$</span>
