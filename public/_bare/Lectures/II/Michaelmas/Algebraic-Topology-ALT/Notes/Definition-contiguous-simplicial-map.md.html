<p>
    <a href="/tripos-notes/Lectures/II/Michaelmas/Algebraic-Topology-ALT/Notes/Definition-simplicial-map.html">Simplicial maps</a> <span class="inline-math">$f,g: K \to L$</span>
    are <em>contiguous</em>
    if for each <span class="inline-math">$σ\in K$</span>,
    the simplices <span class="inline-math">$f(σ), g(σ)$</span>
    are faces of a simplex <span class="inline-math">$τ\in L$</span>.
</p>
