<p>
    Suppose <span class="inline-math">$[x] = [x&#x27;]\in π_0(X)$</span>.
    This means there exists a path <span class="inline-math">$γ: [0,1]\to X$</span> from <span class="inline-math">$x$</span> to <span class="inline-math">$x&#x27;$</span>.
    Then <span class="inline-math">$f\circ γ: [0,1] \to Y$</span> is a path from <span class="inline-math">$f(x)$</span> to <span class="inline-math">$f(x&#x27;)$</span>,
    showing <span class="inline-math">$[f(x)] = [f(x&#x27;)]\in π_0(Y)$</span>.
</p>
