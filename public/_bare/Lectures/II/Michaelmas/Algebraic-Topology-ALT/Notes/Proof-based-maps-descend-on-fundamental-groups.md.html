<p>
    If <span class="inline-math">$γ\simeq γ&#x27;$</span> as paths, i.e. they are homotopic relative to <span class="inline-math">$\set{0,1}$</span>,
    <a href="/tripos-notes/Lectures/II/Michaelmas/Algebraic-Topology-ALT/Notes/Definition-homotopy.html#^comp">then</a> <span class="inline-math">$f\circ γ\simeq f\circ γ&#x27;$</span> as paths.
    This shows well-definedness.
</p>
<p>
    It is a group homomorphism as <span class="inline-math">$[f\circ (γ\cdot γ&#x27;)] = [(f\circ γ) \cdot (f\circ γ&#x27;)]$</span>.
</p>
