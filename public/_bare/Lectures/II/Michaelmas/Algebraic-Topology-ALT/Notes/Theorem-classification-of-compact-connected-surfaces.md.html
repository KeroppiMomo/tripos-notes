<p>
    Any <a href="/tripos-notes/Lectures/IB/Michaelmas/Analysis-and-Topology-AT/Notes/Definition-compact.html">compact</a> <a href="/tripos-notes/Lectures/IB/Michaelmas/Analysis-and-Topology-AT/Notes/Definition-disconnected-connected-separation.html">connected</a> <a href="/tripos-notes/Lectures/IB/Lent/Geometry-Geo/Notes/Definition-abstract-smooth-surface.html">surface</a>
