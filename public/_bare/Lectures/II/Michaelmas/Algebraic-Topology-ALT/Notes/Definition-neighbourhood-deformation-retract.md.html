<p>
    Let <span class="inline-math">$X$</span> be a space.
</p>
<p>
    A subset <span class="inline-math">$A\subseteq X$</span> is called a <em>neighbourhood deformation retract</em>
    if there is an open neighbourhood <span class="inline-math">$A\subseteq U\subseteq X$</span>
    and a <a href="/tripos-notes/Lectures/II/Michaelmas/Algebraic-Topology-ALT/Notes/Definition-retraction-deformation-retraction.html">deformation retraction</a> of <span class="inline-math">$U$</span> onto <span class="inline-math">$A$</span>.
</p>
