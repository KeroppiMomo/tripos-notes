<p>
    <span class="display-math">$$ \begin{align*}
        f_\ast \circ u_\#([γ]) ={}&amp; f_\ast([u\cdot γ\cdot u\inv]) \\
        ={}&amp; [f\circ (u\cdot γ\cdot u\inv)] \\
        ={}&amp; [(f\circ u) \cdot (f\circ γ)\cdot (f\circ u\inv)] \\
        ={}&amp; (f\circ u)_\# (f\circ γ) \\
        ={}&amp; (f\circ u)_\# \circ f_\ast(γ).
    \end{align*} $$</span>
