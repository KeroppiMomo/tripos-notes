<p>
    A space <span class="inline-math">$X$</span> is <em>contractible</em>
    if it is <a href="/tripos-notes/Lectures/II/Michaelmas/Algebraic-Topology-ALT/Notes/Definition-homotopy-equivalence.html">homotopy equivalent</a>
    to the one-point space:
    <span class="inline-math">$X \simeq \set{*}$</span>.
</p>
