<p>
    A set <span class="inline-math">$I\subseteq \mathbb{W}$</span>
    is called an <em>index set</em>
    if it is closed under <a href="/tripos-notes/Lectures/II/Michaelmas/Automata-and-Formal-Languages-AFL/Notes/Definition-computable-function-weakly-equivalent.html">weak equivalence</a>,
    i.e. if <span class="inline-math">$w\in I, v\in \mathbb{W}$</span> and <span class="inline-math">$\mathrm{W}_w = \mathrm{W}_v$</span>, then <span class="inline-math">$v\in I$</span>.
</p>
<ul>
<li>
    <p>
        Any non-empty index set is infinite by the <a href="/tripos-notes/Lectures/II/Michaelmas/Automata-and-Formal-Languages-AFL/Notes/Proposition-padding-lemma.html">padding lemma</a>.
    </p>
    
</li>
</ul>
