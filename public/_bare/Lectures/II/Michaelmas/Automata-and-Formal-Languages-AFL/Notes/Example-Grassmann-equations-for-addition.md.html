<p>
    Apply recursion to the functions <span class="inline-math">$π_{1,0}$</span> and <span class="inline-math">$s\circ π_{3,2}$</span>
    to obtain the <em>Grassmann equations for addition</em>
    <span class="display-math">$$ \begin{align*}
        h(w,ε) ={}&amp; π_{1,0}(w) = w, \\
        h(w,s(v)) ={}&amp; s\circ π_{3,2}(w,v,h(w,v)) = s(h(w,v)).
    \end{align*} $$</span>
    In natural number notation: <span class="inline-math">$h(n,0) = n, h(n,m+1) = h(n,m)+1$</span>.
</p>
