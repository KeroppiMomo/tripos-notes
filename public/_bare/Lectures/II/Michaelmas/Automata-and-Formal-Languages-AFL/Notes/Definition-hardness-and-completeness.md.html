<p>
    Let <span class="inline-math">$\mathcal{C}\subseteq \mathcal{P}(\mathbb{W})$</span> be a class of languages
    and <span class="inline-math">$L\subseteq \mathbb{W}$</span> be a language.
</p>
<p>
    Say <span class="inline-math">$L$</span> is <span class="inline-math">$\mathcal{C}$</span>-hard if <span class="inline-math">$X$</span><a href="/tripos-notes/Lectures/II/Michaelmas/Automata-and-Formal-Languages-AFL/Notes/Definition-many-one-reducible-equivalent.html"><span class="inline-math">${}\leq_m{}$</span></a><span class="inline-math">$L$</span> for all <span class="inline-math">$X\in \mathcal{C}$</span>.
</p>
<p>
    Say <span class="inline-math">$L$</span> is <span class="inline-math">$\mathcal{C}$</span>-complete if <span class="inline-math">$L$</span> is <span class="inline-math">$\mathcal{C}$</span>-hard and <span class="inline-math">$L\in \mathcal{C}$</span>.
</p>
