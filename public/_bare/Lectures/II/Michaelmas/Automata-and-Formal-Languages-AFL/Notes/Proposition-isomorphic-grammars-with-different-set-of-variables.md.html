<p>
    Let <span class="inline-math">$G = (Σ, V, P, S)$</span> be a <a href="/tripos-notes/Lectures/II/Michaelmas/Automata-and-Formal-Languages-AFL/Notes/Definition-grammar-language.html">grammar</a>.
</p>
<p>
    If <span class="inline-math">$|V&#x27;| = |V|$</span>, then
    there is a grammar <span class="inline-math">$G&#x27; = (Σ, V&#x27;, P&#x27;, S&#x27;)$</span> <a href="/tripos-notes/Lectures/II/Michaelmas/Automata-and-Formal-Languages-AFL/Notes/Definition-isomorphic-grammars.html">isomorphic</a> to <span class="inline-math">$G$</span>.
</p>
<p>
    <a href="/tripos-notes/Lectures/II/Michaelmas/Automata-and-Formal-Languages-AFL/Notes/Proof-isomorphic-grammars-with-different-set-of-variables.html">Proof</a>
</p>
<ul>
<li>
    <p>
        Since <a href="/tripos-notes/Lectures/II/Michaelmas/Automata-and-Formal-Languages-AFL/Notes/Proposition-isomorphic-grammars-are-equivalent.html">isomorphic grammars produce the same language</a>,
        we can replace <span class="inline-math">$V$</span> with any set of the same size and obtain the same language.
    </p>
    
</li>
</ul>
