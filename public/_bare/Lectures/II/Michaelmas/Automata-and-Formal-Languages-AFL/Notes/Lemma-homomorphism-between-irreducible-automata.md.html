<p>
    Let <span class="inline-math">$f$</span> be a <a href="/tripos-notes/Lectures/II/Michaelmas/Automata-and-Formal-Languages-AFL/Notes/Definition-homomorphic-automata.html">homomorphism</a> between deterministic automata <span class="inline-math">$D$</span> and <span class="inline-math">$D&#x27;$</span>.
</p>
<ul>
<li>
    <p>
        If <span class="inline-math">$D$</span> is <a href="/tripos-notes/Lectures/II/Michaelmas/Automata-and-Formal-Languages-AFL/Notes/Definition-irreducible-automaton.html">irreducible</a>, then <span class="inline-math">$f$</span> is injective.
    </p>
    
</li><li>
    <p>
        If <span class="inline-math">$D&#x27;$</span> is irreducible, then <span class="inline-math">$f$</span> is surjective.
    </p>
    
</li>
</ul>
