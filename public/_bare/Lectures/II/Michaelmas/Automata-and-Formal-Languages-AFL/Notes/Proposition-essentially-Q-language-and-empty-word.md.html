<p>
    A language <span class="inline-math">$L$</span> is <a href="/tripos-notes/Lectures/II/Michaelmas/Automata-and-Formal-Languages-AFL/Notes/Definition-S-safe-epsilon-adequate-essentially-Q.html">essentially <span class="inline-math">$\mathsf{Q}$</span></a>
    iff there is a <span class="inline-math">$\mathsf{Q}$</span> language <span class="inline-math">$L&#x27;$</span>
    and either <span class="inline-math">$L = L&#x27;$</span> or <span class="inline-math">$L = L&#x27;\cup \set{ε}$</span>.
</p>
<p>
    Here <span class="inline-math">$\mathsf{Q}$</span> can be <a href="/tripos-notes/Lectures/II/Michaelmas/Automata-and-Formal-Languages-AFL/Notes/Definition-Chomsky-hierarchy.html">"noncontracting", "context-sensitive", "context-free" or "regular"</a>.
