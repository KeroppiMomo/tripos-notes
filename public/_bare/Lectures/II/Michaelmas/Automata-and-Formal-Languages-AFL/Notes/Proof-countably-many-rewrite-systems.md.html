<p>
    <a href="/tripos-notes/Lectures/II/Michaelmas/Automata-and-Formal-Languages-AFL/Notes/Proposition-strings-of-a-countable-set.html">Since</a> <span class="inline-math">$Ω$</span> is countable, <span class="inline-math">$Ω^\ast$</span> is countable,
    and thus so is <span class="inline-math">$Ω^+ \times Ω^\ast \subseteq (Ω^\ast)^\ast$</span>.
</p>
<p>
    Therefore <span class="inline-math">$P \in \mathrm{Fin}(Ω^+ \times Ω^\ast)$</span> has <a href="/tripos-notes/Lectures/II/Michaelmas/Automata-and-Formal-Languages-AFL/Notes/Proposition-set-of-finite-subsets-of-countable-set.html">countably</a> many choices.
</p>
