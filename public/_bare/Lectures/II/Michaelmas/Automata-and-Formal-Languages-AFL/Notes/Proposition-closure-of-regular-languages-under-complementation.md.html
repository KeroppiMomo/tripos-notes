<p>
    The class of <a href="/tripos-notes/Lectures/II/Michaelmas/Automata-and-Formal-Languages-AFL/Notes/Definition-noncontracting-context-sensitive-context-free-regular-Chomsky-hierarchy.html">regular languages</a>
    is closed under complementation,
    i.e. if <span class="inline-math">$L$</span> is a regular language,
    then so is <span class="inline-math">$\mathbb{W}^+ \setminus L$</span>.
</p>
