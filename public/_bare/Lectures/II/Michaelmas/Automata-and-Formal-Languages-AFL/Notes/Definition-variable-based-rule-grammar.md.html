<p>
    Let <span class="inline-math">$G = (Σ, V, P, S)$</span> be a <a href="/tripos-notes/Lectures/II/Michaelmas/Automata-and-Formal-Languages-AFL/Notes/Definition-grammar-language.html">grammar</a>.
</p>
<p>
    A rewrite rule <span class="inline-math">$α\to β$</span>
    is called <em>variable-based</em> if <span class="inline-math">$α\in V^\ast$</span>, i.e. LHS does not contain any letters.
</p>
<p>
    <span class="inline-math">$G$</span> is called <em>variable-based</em> if all its rewrite rules are variable-based.
</p>
