<p>
    For every <a href="/tripos-notes/Lectures/II/Michaelmas/Automata-and-Formal-Languages-AFL/Notes/Definition-Chomsky-hierarchy.html">context-free</a> grammar
    without <span class="inline-math">$ε$</span>-production (i.e. rules of the form <span class="inline-math">$A\to ε$</span>),
    there exists an <a href="/tripos-notes/Lectures/II/Michaelmas/Automata-and-Formal-Languages-AFL/Notes/Definition-equivalent-grammar.html">equivalent</a> context-free <em>variable-targeted</em> grammar,
    i.e. where all rewrite rules are either <span class="inline-math">$A\to a$</span> or <span class="inline-math">$A \to B_1 B_2 \ldots B_k$</span>
    (where <span class="inline-math">$A,B_1, \ldots, B_k\in N$</span> and <span class="inline-math">$a\in Σ$</span>).
