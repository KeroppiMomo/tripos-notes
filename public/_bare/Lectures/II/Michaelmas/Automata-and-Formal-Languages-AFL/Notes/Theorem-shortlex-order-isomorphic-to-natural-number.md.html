<p>
    The <a href="/tripos-notes/Lectures/II/Michaelmas/Automata-and-Formal-Languages-AFL/Notes/Definition-shortlex-order-on-word.html">shortlex order</a> <span class="inline-math">$(\mathbb{W}, &lt;)$</span> is isomorphic to <span class="inline-math">$(\N, &lt;)$</span>.
</p>
<p>
    <a href="/tripos-notes/Lectures/II/Michaelmas/Automata-and-Formal-Languages-AFL/Notes/Proof-shortlex-order-isomorphic-to-natural-number.html">Proof</a>
</p>
<p>
    We use <span class="inline-math">$\#(w)$</span> to denote the natural number assigned to <span class="inline-math">$w\in \mathbb{W}$</span> by the canonical isomorphism.
