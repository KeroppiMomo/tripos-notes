<p>
    The <em>halting problem</em> and its two-variable variant are
    the sets
    <span class="display-math">$$ \begin{align*}
        \mathbf{K} &amp;= \sb{w\in \mathbb{W}}{f_{w,1}(w)\downarrow}, \\
        \mathbf{K}_0 &amp;= \sb{(w,v)\in \mathbb{W}^2}{f_{w,1}(v)\downarrow},
    \end{align*} $$</span>
    where <span class="inline-math">$f_{w,1}$</span> is defined <a href="/tripos-notes/Lectures/II/Michaelmas/Automata-and-Formal-Languages-AFL/Notes/Software.html#^f-notation">here</a>.
