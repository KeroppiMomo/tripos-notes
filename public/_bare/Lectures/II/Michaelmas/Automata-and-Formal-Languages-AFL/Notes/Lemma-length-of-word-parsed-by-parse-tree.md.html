<p>
    If <span class="inline-math">$G$</span> is a grammar in <a href="/tripos-notes/Lectures/II/Michaelmas/Automata-and-Formal-Languages-AFL/Notes/Definition-Chomsky-normal-form.html">Chomsky normal form</a>,
    <span class="inline-math">$\mathbf{T}$</span> is a <span class="inline-math">$G$</span>-<a href="/tripos-notes/Lectures/II/Michaelmas/Automata-and-Formal-Languages-AFL/Notes/Definition-parse-tree.html">parse tree</a> of height <span class="inline-math">$h+1$</span>,
    and <span class="inline-math">$σ_\mathbf{T} = w\in Σ^\ast$</span>,
    then <span class="inline-math">$|w|\leq 2^h$</span>.
