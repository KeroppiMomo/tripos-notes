<p>
    For any <span class="inline-math">$w\in \mathbb{W}$</span>,
    <span class="display-math">$$ \begin{align*}
        w\in \mathcal{L}(D) &amp;\iff \hat δ(q_0, w) \in F \\
        &amp;\iff f(\hat δ(q_0, w)) \in F&#x27; \\
        &amp;\iff \hat δ&#x27;(f(q_0), w) \in F&#x27; \\
        &amp;\iff \hat δ&#x27;(q_0&#x27;, w) \in F&#x27; &amp;\iff w\in \mathcal{L}(D&#x27;)
    \end{align*} $$</span>
    using the definition of an <a href="/tripos-notes/Lectures/II/Michaelmas/Automata-and-Formal-Languages-AFL/Notes/Definition-homomorphic-automata.html">homomorphism</a>.
</p>
