<p>
    Let <span class="inline-math">$f$</span> be a reduction of <span class="inline-math">$L$</span> to <span class="inline-math">$L&#x27;$</span>.
    Suppose the characteristic function <span class="inline-math">$χ_{L&#x27;}$</span> is computable.
    Then <span class="inline-math">$χ_{L} = χ_{L&#x27;} \circ f$</span> is computable.
</p>
<p>
    Similarly if the pseudo-characteristic function <span class="inline-math">$ψ_{L&#x27;}$</span> is computable,
    then <span class="inline-math">$ψ_{L} = ψ_{L&#x27;} \circ f$</span> is computable.
</p>
