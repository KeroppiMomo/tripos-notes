<p>
    Let <span class="inline-math">$L$</span> and <span class="inline-math">$M$</span> be <a href="/tripos-notes/Lectures/II/Michaelmas/Automata-and-Formal-Languages-AFL/Notes/Definition-deterministic-finite-automaton-regular-language.html">regular languages</a> over an alphabet <span class="inline-math">$Σ$</span>.
    The following are also regular:
</p>
<ol start="1">
<li>
    <p>
        <span class="inline-math">$L \cup M$</span> (<a href="/tripos-notes/Lectures/II/Michaelmas/Automata-and-Formal-Languages-AFL/Notes/Theorem-equivalence-of-regular-expression-and-DFA.html">Proof</a>)
    </p>
    
</li><li>
    <p>
        <span class="inline-math">$LM$</span> (<a href="/tripos-notes/Lectures/II/Michaelmas/Automata-and-Formal-Languages-AFL/Notes/Theorem-equivalence-of-regular-expression-and-DFA.html">Proof</a>)
    </p>
    
</li><li>
    <p>
        <span class="inline-math">$L^\ast$</span> (<a href="/tripos-notes/Lectures/II/Michaelmas/Automata-and-Formal-Languages-AFL/Notes/Theorem-equivalence-of-regular-expression-and-DFA.html">Proof</a>)
    </p>
    
</li><li>
    <p>
        <span class="inline-math">$Σ^\ast \setminus L$</span> (<a href="/tripos-notes/Lectures/II/Michaelmas/Automata-and-Formal-Languages-AFL/Notes/Proof-closure-of-regular-languages-under-complementation.html">Proof</a>)
    </p>
    
</li><li>
    <p>
        <span class="inline-math">$L \cap M$</span> (Proof: <span class="inline-math">$L\cap M = Σ^\ast \setminus ((Σ^\ast \setminus L) \cup (Σ^\ast \setminus M))$</span>)
    </p>
    
</li>
</ol>
