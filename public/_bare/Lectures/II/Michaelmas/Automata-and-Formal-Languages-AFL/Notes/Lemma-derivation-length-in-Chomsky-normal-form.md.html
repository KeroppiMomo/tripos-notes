<p>
    If <span class="inline-math">$G = (Σ, N, P, S)$</span> is a grammar in <a href="/tripos-notes/Lectures/II/Michaelmas/Automata-and-Formal-Languages-AFL/Notes/Definition-Chomsky-normal-form.html">Chomsky normal form</a>
    and <span class="inline-math">$w\in \mathcal{L}(G)$</span> with <span class="inline-math">$|w| = n$</span>,
    then any <span class="inline-math">$G$</span>-derivation of <span class="inline-math">$w$</span> has length <span class="inline-math">$2n-1$</span>.
