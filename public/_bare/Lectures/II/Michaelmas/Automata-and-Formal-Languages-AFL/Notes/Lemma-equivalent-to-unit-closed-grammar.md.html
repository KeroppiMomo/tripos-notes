    For every <a href="/tripos-notes/Lectures/II/Michaelmas/Automata-and-Formal-Languages-AFL/Notes/Definition-Chomsky-hierarchy.html">context-free</a> grammar,
    there exists an equivalent <em>unit closed</em> grammar, i.e.
    if <span class="inline-math">$A\to B$</span> and <span class="inline-math">$B\to a$</span> are rewrite rules, then so is <span class="inline-math">$A\to a$</span> for <span class="inline-math">$A,B$</span> variables and <span class="inline-math">$a$</span> letter.
