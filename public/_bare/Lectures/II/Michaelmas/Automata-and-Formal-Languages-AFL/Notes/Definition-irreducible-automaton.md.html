<p>
    A deterministic automaton is said to be <em>irreducible</em>
    if it has neither <a href="/tripos-notes/Lectures/II/Michaelmas/Automata-and-Formal-Languages-AFL/Notes/Definition-inaccessible-state.html">inaccessible states</a>
    nor <a href="/tripos-notes/Lectures/II/Michaelmas/Automata-and-Formal-Languages-AFL/Notes/Definition-indistinguishable-states-quotient-automaton.html">indistinguishable</a> distinct states.
</p>
