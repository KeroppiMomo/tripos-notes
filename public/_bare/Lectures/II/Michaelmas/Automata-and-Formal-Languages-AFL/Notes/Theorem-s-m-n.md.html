<p>
    Let <span class="inline-math">$g: \mathbb{W}^{k+1} \dashrightarrow \mathbb{W}$</span> be a partial <a href="/tripos-notes/Lectures/II/Michaelmas/Automata-and-Formal-Languages-AFL/Notes/Definition-computable-function-weakly-equivalent.html">computable</a> function.
</p>
<p>
    There exists a total computable function <span class="inline-math">$h: \mathbb{W}\to \mathbb{W}$</span>
    such that for all <span class="inline-math">$v\in \mathbb{W}$</span> and <span class="inline-math">$\v w\in \mathbb{W}^k$</span>,
    we have <a href="/tripos-notes/Lectures/II/Michaelmas/Automata-and-Formal-Languages-AFL/Notes/Software.html#^f-notation"><span class="inline-math">$f_{h(v), k}$</span></a><span class="inline-math">$(\v w) = g(\v w, v)$</span>.
</p>
