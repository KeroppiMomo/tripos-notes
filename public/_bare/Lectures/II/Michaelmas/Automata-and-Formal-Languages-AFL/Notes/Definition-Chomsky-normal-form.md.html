<p>
    A <a href="/tripos-notes/Lectures/II/Michaelmas/Automata-and-Formal-Languages-AFL/Notes/Definition-grammar-language.html">grammar</a> <span class="inline-math">$G = (Σ, V, P, S)$</span> is said to be in <em>Chomsky normal form</em>
    if all of its rewrite rules are either of the form <span class="inline-math">$A \to AB$</span>
    for <span class="inline-math">$A,B,C \in V$</span> or of the form <span class="inline-math">$A \to a$</span> for <span class="inline-math">$A\in V$</span> and <span class="inline-math">$a\in Σ$</span>.
</p>
<ul>
<li>
    <p>
        <span class="inline-math">$G$</span> is <a href="/tripos-notes/Lectures/II/Michaelmas/Automata-and-Formal-Languages-AFL/Notes/Definition-noncontracting-context-sensitive-context-free-regular-Chomsky-hierarchy.html">context-free</a>.
    </p>
    
</li>
</ul>
