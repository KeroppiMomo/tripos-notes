<p>
    Note that by induction,
    <span class="inline-math">$\widehat{[δ]}([q], w) = [\hat δ(q, w)]$</span>.
    So <span class="inline-math">$\widehat{[δ]}([q],w) \in [F]$</span>
    <span class="inline-math">$\iff$</span> <span class="inline-math">$\hat δ(q,w)$</span> and some state in <span class="inline-math">$F$</span> are indistinguishable
    <span class="inline-math">$\iff$</span> <span class="inline-math">$\hat δ(q,w)\in F$</span>.
    Hence <span class="inline-math">$[q]$</span> and <span class="inline-math">$[q&#x27;]$</span> are indistinguishable
    <span class="inline-math">$\iff$</span> <span class="inline-math">$q$</span> and <span class="inline-math">$q&#x27;$</span> are indistinguishable
    <span class="inline-math">$\iff$</span> <span class="inline-math">$[q] = [q&#x27;]$</span>.
</p>
