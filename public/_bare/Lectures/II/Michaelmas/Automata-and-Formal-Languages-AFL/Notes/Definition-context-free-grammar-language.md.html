<p>
    A <a href="/tripos-notes/Lectures/II/Michaelmas/Automata-and-Formal-Languages-AFL/Notes/Definition-grammar-language.html">grammar</a> <span class="inline-math">$G = (Σ, N, P, S)$</span>
    is <em>context-free</em>
    if every production rule <span class="inline-math">$α\to β\in P$</span>
    has <span class="inline-math">$α\in N$</span>.
    That is, every production rule is either of <a href="/tripos-notes/Lectures/II/Michaelmas/Automata-and-Formal-Languages-AFL/Notes/Definition-Chomsky-hierarchy.html">type 2</a>
    or <span class="inline-math">$A\to ε$</span> for <span class="inline-math">$A\in N$</span>.
</p>
<p>
    A language <span class="inline-math">$L \subseteq Σ^\ast$</span> is <em>context-free</em> if it is produced by some context-free grammar.
</p>
