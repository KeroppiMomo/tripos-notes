<p>
    Coefficients of <span class="inline-math">$g$</span> are symmetric polynomials in <span class="inline-math">$\Z[β_1, β_2, β_3]$</span>,
    so symmetric polynomials in <span class="inline-math">$\Z[α_1, α_2, α_3, α_4]$</span>.
    By the <a href="/tripos-notes/Lectures/II/Michaelmas/Galois-Theory-GT/Notes/Theorem-fundamental-theorem-of-symmetric-polynomials.html">fundamental theorem of symmetric polynomials</a>,
    coefficients of <span class="inline-math">$g$</span> are <span class="inline-math">$\Z$</span>-coefficient polynomials in coefficients of <span class="inline-math">$f$</span>.
</p>
