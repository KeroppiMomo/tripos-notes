<p>
    Let <span class="inline-math">$K\subseteq \R$</span> be a subfield.
</p>
<p>
    Say <span class="inline-math">$K$</span> is <em>constructible</em> if there exist fields
    <span class="display-math">$$ \begin{align*}
        \Q = L_0 \subseteq L_1 \subseteq \ldots \subseteq L_m
    \end{align*} $$</span>
    such that <span class="inline-math">$[L_i:L_{i-1}] = 2$</span>
    and <span class="inline-math">$K \subseteq L_m$</span>.
</p>
<blockquote>
    <p>
        <span class="inline-math">$[K:\Q]$</span> is a power of 2 by the <a href="/tripos-notes/Lectures/II/Michaelmas/Galois-Theory-GT/Notes/Theorem-tower-law.html">tower law</a>.
    </p>
    
</blockquote>
