<p>
    Let <span class="inline-math">$L$</span> be a <a href="/tripos-notes/Lectures/IB/Lent/Groups-Rings-and-Modules-GRM/Notes/Definition-field.html">field</a>
    and <span class="inline-math">$K\subseteq L$</span> a <a href="/tripos-notes/Lectures/IB/Lent/Groups-Rings-and-Modules-GRM/Notes/Definition-subring.html">subfield</a>,
    i.e. <span class="inline-math">$K$</span> is a field under the same operations <span class="inline-math">$+, \times$</span>.
</p>
<p>
    We say <span class="inline-math">$L$</span> is an extension of <span class="inline-math">$K$</span>, written <span class="inline-math">$L/K$</span>.
</p>
