<p>
    A field extension <span class="inline-math">$L/K$</span> is <em>normal</em>
    if it is <a href="/tripos-notes/Lectures/II/Michaelmas/Galois-Theory-GT/Notes/Definition-algebraic-element-minimal-polynomial-transcendental-element-algebraic-extension.html">algebraic</a>,
    and for all <span class="inline-math">$x\in L$</span>,
    the minimal polynomial of <span class="inline-math">$x$</span> over <span class="inline-math">$K$</span>
    splits into linear factors over <span class="inline-math">$L$</span>.
</p>
