    Let <span class="inline-math">$L/K$</span> be a field extension.

<p>
    For <span class="inline-math">$f,g\in K[X]^\times$</span>, their <a href="/tripos-notes/Lectures/IB/Lent/Groups-Rings-and-Modules-GRM/Notes/Definition-greatest-common-divisor-least-common-multiple.html">greatest common divisor</a>
