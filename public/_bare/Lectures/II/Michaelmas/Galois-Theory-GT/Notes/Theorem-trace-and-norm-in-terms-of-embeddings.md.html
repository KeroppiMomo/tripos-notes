<p>
    Let <span class="inline-math">$M/L/K$</span> be field extensions,
    with <span class="inline-math">$L/K$</span> <a href="/tripos-notes/Lectures/II/Michaelmas/Galois-Theory-GT/Notes/Definition-finite-extension-degree.html">finite</a> <a href="/tripos-notes/Lectures/II/Michaelmas/Galois-Theory-GT/Notes/Definition-separable-polynomial-extension.html">separable</a> and <span class="inline-math">$M/K$</span> <a href="/tripos-notes/Lectures/II/Michaelmas/Galois-Theory-GT/Notes/Definition-normal-extension.html">normal</a>.
    Let <span class="inline-math">$\{σ_1, \ldots, σ_d\}=\Hom_K(L,M)$</span> (<a href="/tripos-notes/Lectures/II/Michaelmas/Galois-Theory-GT/Notes/Theorem-embedding-of-adjoined-extension-and-degree.html">so</a> <span class="inline-math">$[L:K] = d$</span>).
    Then for all <span class="inline-math">$α\in L$</span>,
    <span class="display-math">$$ \begin{align*}
        \tr_{L/K}(α) &amp;= \sum_{i=1}^{d} σ_i(α), &amp;
        N_{L/K}(α) &amp;= \prod_{i=1}^{d} σ_i(α).
    \end{align*} $$</span>
    (<a href="/tripos-notes/Lectures/II/Michaelmas/Galois-Theory-GT/Notes/Definition-trace-norm.html"><span class="inline-math">$\tr$</span></a>, <a href="/tripos-notes/Lectures/II/Michaelmas/Galois-Theory-GT/Notes/Definition-trace-norm.html"><span class="inline-math">$N$</span></a>)
</p>
