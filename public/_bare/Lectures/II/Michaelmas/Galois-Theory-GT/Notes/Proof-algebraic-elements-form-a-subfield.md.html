<p>
    It suffices to show for <span class="inline-math">$α,β\in L$</span> algebraic that <span class="inline-math">$α \pm β$</span> and <span class="inline-math">$αβ^{\pm 1}$</span> are algebraic.
</p>
<p>
    Using that <a href="/tripos-notes/Lectures/II/Michaelmas/Galois-Theory-GT/Notes/Lemma-algebraic-iff-finite-adjoined-extension.html"><span class="inline-math">$[K(α,β):K] &lt; \infty$</span></a>
    and noting <span class="inline-math">$K(α, β) / K(α + β) / K$</span>,
    we obtain <span class="inline-math">$[K(α+β) : K] &lt; \infty$</span> by the <a href="/tripos-notes/Lectures/II/Michaelmas/Galois-Theory-GT/Notes/Theorem-tower-law.html">tower law</a>,
    so <span class="inline-math">$α + β$</span> is algebraic.
    Similar for <span class="inline-math">$α - β$</span> and <span class="inline-math">$αβ^{\pm 1}$</span>.
</p>
