<p>
    Let <span class="inline-math">$K, L$</span> be fields
    and <span class="inline-math">$σ_1, \ldots, σ_n: K\hookrightarrow L$</span> be distinct <a href="/tripos-notes/Lectures/IB/Lent/Groups-Rings-and-Modules-GRM/Notes/Definition-ring-homomorphism-isomorphism.html">field embeddings</a>.
</p>
<p>
    If <span class="inline-math">$λ_1, \ldots, λ_n\in L$</span> are such that
    <span class="display-math">$$ \begin{align*}
        \sum_{i=1}^{n} λ_i σ_i = 0,
    \end{align*} $$</span>
    then <span class="inline-math">$λ_1 = \ldots = λ_n = 0$</span>.
</p>
