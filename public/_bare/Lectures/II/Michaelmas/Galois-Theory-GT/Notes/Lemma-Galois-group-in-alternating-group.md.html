<p>
    Let <span class="inline-math">$K$</span> be a field and <span class="inline-math">$f\in K[X]$</span> be a separable polynomial.
</p>
<p>
    If <span class="inline-math">$\op{char}(K)\neq 2$</span>, then
    the fixed field of <a href="/tripos-notes/Lectures/II/Michaelmas/Galois-Theory-GT/Notes/Definition-Galois-group-of-polynomial.html"><span class="inline-math">$\Gal$</span></a><span class="inline-math">$(f/K) \cap A_n$</span> is <span class="inline-math">$K($</span><a href="/tripos-notes/Lectures/II/Michaelmas/Galois-Theory-GT/Notes/Definition-discriminant.html"><span class="inline-math">$Δ$</span></a><span class="inline-math">$)$</span>.
</p>
<p>
    Moreover, <span class="inline-math">$\Gal(f/K)\subseteq A_n$</span> iff <a href="/tripos-notes/Lectures/II/Michaelmas/Galois-Theory-GT/Notes/Definition-discriminant.html"><span class="inline-math">$\op{Disc}(f)$</span></a> is a square in <span class="inline-math">$K$</span>.
</p>
