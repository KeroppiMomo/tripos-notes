<p>
    A field extension <span class="inline-math">$L/K$</span> is <em>Galois</em> if
</p>
<ol start="1">
<li>
    <p>
        <span class="inline-math">$L/K$</span> is <a href="/tripos-notes/Lectures/II/Michaelmas/Galois-Theory-GT/Notes/Definition-algebraic-element-minimal-polynomial-transcendental-element-algebraic-extension.html">algebraic</a>;
    </p>
    
</li><li>
    <p>
        <span class="inline-math">$K ={}$</span><a href="/tripos-notes/Lectures/II/Michaelmas/Galois-Theory-GT/Notes/Definition-fixed-field.html"><span class="inline-math">$L^{\Aut(L/K)}$</span></a>.
    </p>
    
</li>
</ol>
<p>
    In this case, we write <span class="inline-math">$\Gal(L/K) = \Aut(L/K)$</span>.
</p>
