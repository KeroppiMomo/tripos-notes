<p>
    Let <span class="inline-math">$R$</span> be a ring of <a href="/tripos-notes/Lectures/IB/Lent/Groups-Rings-and-Modules-GRM/Notes/Definition-characteristic-of-a-ring.html">characteristic</a> <span class="inline-math">$p$</span>.
    If <span class="inline-math">$p$</span> is a prime, then
    <span class="display-math">$$ \begin{align*}
        ϕ: R &amp;\to R \\
        x &amp;\mapsto x^p
    \end{align*} $$</span>
    is a <a href="/tripos-notes/Lectures/IB/Lent/Groups-Rings-and-Modules-GRM/Notes/Definition-ring-homomorphism-isomorphism.html">ring homomorphism</a>.
</p>
<p>
    Moreover <span class="inline-math">$ϕ$</span> is identity on <span class="inline-math">$\mathbb{F}_p \subseteq R$</span>.
</p>
