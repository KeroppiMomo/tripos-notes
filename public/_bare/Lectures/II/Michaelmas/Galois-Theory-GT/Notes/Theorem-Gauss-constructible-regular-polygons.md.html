<p>
    Let <span class="inline-math">$n\geq 3$</span>. The following are equivalent:
</p>
<ol start="1">
<li>
    <p>
        A regular <span class="inline-math">$n$</span>-gon is <a href="/tripos-notes/Lectures/II/Michaelmas/Galois-Theory-GT/Notes/Definition-constructible-number.html">constructible</a>.
    </p>
    
</li><li>
    <p>
        <a href="/tripos-notes/Lectures/IA/Michaelmas/Groups-Gp/Definition-Euler-totient-function.html"><span class="inline-math">$ϕ$</span></a><span class="inline-math">$(n)$</span> is a power of two.
    </p>
    
</li><li>
    <p>
        <span class="inline-math">$n$</span> is a product of a power of two and distinct <em>Fermat primes</em> (i.e. primes of the form <span class="inline-math">$2^{2^k} + 1$</span>).
    </p>
    
</li>
</ol>
<p>
    <a href="/tripos-notes/Lectures/II/Michaelmas/Galois-Theory-GT/Notes/Proof-Gauss-constructible-regular-polygons.html">Proof</a>
</p>
<blockquote>
    <p>
        The known Fermat primes are 3, 5, 17, 257, 65537.
    </p>
    
</blockquote>
