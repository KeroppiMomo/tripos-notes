<p>
    Since <span class="inline-math">$K$</span> is a field, the ideal <span class="inline-math">$\ker ϕ\lhd K$</span> <a href="/tripos-notes/Lectures/IB/Lent/Groups-Rings-and-Modules-GRM/Notes/Definition-ideal.html#^field-ideal">is</a> either <span class="inline-math">$K$</span> or <span class="inline-math">$(0)$</span>.
    But <span class="inline-math">$ϕ(1) = 1 \neq 0$</span>, so <span class="inline-math">$\ker ϕ \neq (0)$</span>.
</p>
