<p>
    Let <span class="inline-math">$K$</span> be a field of characteristic <span class="inline-math">$p$</span> and <span class="inline-math">$n\in \Z_{\geq 1}$</span>.
</p>
<p>
    Suppose <span class="inline-math">$p=0$</span> or <span class="inline-math">$p\not\mid n$</span>,
    and <span class="inline-math">$K$</span> contains all <span class="inline-math">$n$</span>-th roots of unity.
</p>
<p>
    Then every degree <span class="inline-math">$n$</span> <a href="/tripos-notes/Lectures/II/Michaelmas/Galois-Theory-GT/Notes/Definition-Galois-extension.html">Galois extension</a>
    with cyclic Galois group
    is a <a href="/tripos-notes/Lectures/II/Michaelmas/Galois-Theory-GT/Notes/Definition-Kummer-extension.html">Kummer extension</a>.
</p>
