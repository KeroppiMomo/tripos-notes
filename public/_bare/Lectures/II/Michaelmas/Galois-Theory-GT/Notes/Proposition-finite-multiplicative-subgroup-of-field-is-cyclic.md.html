<p>
    Let <span class="inline-math">$K$</span> be a <a href="/tripos-notes/Lectures/IB/Lent/Groups-Rings-and-Modules-GRM/Notes/Definition-field.html">field</a>.
</p>
<p>
    If <span class="inline-math">$G$</span> is a subgroup of the multiplicative subgroup <span class="inline-math">$K^\times = K \setminus \set{0}$</span>
    of <span class="inline-math">$K$</span> and <span class="inline-math">$G$</span> is finite,
    then <span class="inline-math">$G$</span> is <a href="/tripos-notes/Lectures/IA/Michaelmas/Groups-Gp/Definition-cyclic-group.html">cyclic</a>.
</p>
<p>
    In particular if <span class="inline-math">$K$</span> is finite, then <span class="inline-math">$K^\times$</span> is cyclic.
</p>
