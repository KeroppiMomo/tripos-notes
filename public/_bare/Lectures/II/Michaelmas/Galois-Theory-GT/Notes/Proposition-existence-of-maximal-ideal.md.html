<p>
    Assume the <a href="/tripos-notes/Lectures/II/Lent/Logic-and-Set-Theory-LS/Notes/Equivalents-of-the-axiom-of-choice.html">axiom of choice</a>.
</p>
<ol start="1">
<li>
    <p>
        Any non-zero ring has a <a href="/tripos-notes/Lectures/IB/Lent/Groups-Rings-and-Modules-GRM/Notes/Definition-maximum-ideal.html">maximal ideal</a>.
    </p>
    
</li><li>
    <p>
        If <span class="inline-math">$I$</span> is an ideal of a ring <span class="inline-math">$R$</span> and <span class="inline-math">$I \subsetneq R$</span>, then there is a maximal ideal of <span class="inline-math">$R$</span> containing <span class="inline-math">$I$</span>.
    </p>
    
</li>
</ol>
