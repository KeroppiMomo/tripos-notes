<p>
    Suppose <span class="inline-math">$α\in L$</span>.
    Then we have the tower of extensions
    <span class="display-math">$$ \begin{align*}
        L / K(α) / K.
    \end{align*} $$</span>
    Since <span class="inline-math">$L/K$</span> is finite,
    <a href="/tripos-notes/Lectures/II/Michaelmas/Galois-Theory-GT/Notes/Theorem-tower-law.html">tower law</a> says <span class="inline-math">$K(α)/K$</span> is finite.
    <a href="/tripos-notes/Lectures/II/Michaelmas/Galois-Theory-GT/Notes/Definition-algebraic-element-minimal-polynomial-transcendental-element-algebraic-extension.html">Thus</a> <span class="inline-math">$α$</span> is algebraic.
</p>
