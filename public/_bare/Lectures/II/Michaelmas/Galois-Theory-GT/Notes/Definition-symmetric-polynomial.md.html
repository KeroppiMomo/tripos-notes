<p>
    Let <span class="inline-math">$R$</span> be a ring.
</p>
<p>
    A <a href="/tripos-notes/Lectures/IB/Lent/Groups-Rings-and-Modules-GRM/Notes/Definition-polynomial-ring.html">polynomial</a> <span class="inline-math">$f\in R[X_1, \ldots, X_n]$</span>
    is <em>symmetric</em>
    if for all permutation <span class="inline-math">$σ\in S_n$</span>,
    <span class="display-math">$$ \begin{align*}
        f(X_{σ(1)}, \ldots, X_{σ(n)}) = f(X_1, \ldots, X_n).
    \end{align*} $$</span>
</p>
<p>
    Write <span class="inline-math">$R[X_1, \ldots, X_n]^{S_n}$</span> to denote all symmetric polynomials.
</p>
