<p>
    Let <span class="inline-math">$L/K$</span> be a <a href="/tripos-notes/Lectures/II/Michaelmas/Galois-Theory-GT/Notes/Definition-finite-extension-degree.html">finite</a> and <a href="/tripos-notes/Lectures/II/Michaelmas/Galois-Theory-GT/Notes/Definition-separable-polynomial-extension.html">separable</a> extension.
</p>
<p>
    Then there exists a finite extension
    <span class="inline-math">$M/L$</span> such that
</p>
<ol start="1">
<li>
    <p>
        <span class="inline-math">$M/K$</span> is <a href="/tripos-notes/Lectures/II/Michaelmas/Galois-Theory-GT/Notes/Definition-Galois-extension.html">Galois</a>;
    </p>
    
</li><li>
    <p>
        if <span class="inline-math">$L\subseteq M&#x27; \subseteq M$</span> and <span class="inline-math">$M&#x27;/K$</span> is Galois,
        then <span class="inline-math">$M&#x27; = M$</span>.
    </p>
    
</li>
</ol>
<p>
    We say <span class="inline-math">$M/K$</span> is the <em>Galois closure</em> of <span class="inline-math">$L/K$</span>.
</p>
