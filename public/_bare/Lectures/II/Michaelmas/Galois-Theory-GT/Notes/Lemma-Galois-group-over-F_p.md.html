<p>
    Let <span class="inline-math">$f\in \mathbb{F}_p[X]$</span> be a separable polynomial.
</p>
<p>
    If <span class="inline-math">$f$</span> has irreducible factors of degree
    <span class="inline-math">$n_1, \ldots, n_r$</span> (so <span class="inline-math">$\deg f = \sum_{i=1}^{r} n_i$</span>),
    then <a href="/tripos-notes/Lectures/II/Michaelmas/Galois-Theory-GT/Notes/Definition-Galois-group-of-polynomial.html"><span class="inline-math">$\Gal$</span></a><span class="inline-math">$(f/\mathbb{F}_p)$</span>
    is cyclic,
    generated by an element of <a href="/tripos-notes/Lectures/IA/Michaelmas/Groups-Gp/Definition-cycle-type.html">cycle type</a> <span class="inline-math">$(n_1, \ldots, n_r)$</span>.
</p>
