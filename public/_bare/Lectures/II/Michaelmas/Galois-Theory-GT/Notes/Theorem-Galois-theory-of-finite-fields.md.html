<p>
    Let <span class="inline-math">$L/K$</span> be <a href="/tripos-notes/Lectures/II/Michaelmas/Galois-Theory-GT/Notes/Theorem-all-finite-fields.html">finite fields</a>.
</p>
<p>
    <span class="inline-math">$L/K$</span> is <a href="/tripos-notes/Lectures/II/Michaelmas/Galois-Theory-GT/Notes/Definition-Galois-extension.html">Galois</a>, and <span class="inline-math">$\Gal(L/K)$</span>
    is a cyclic group generated by the <span class="inline-math">$\#K$</span>-power Frobenius map
    <span class="inline-math">$x \mapsto x^{\#K}$</span>.
</p>
<p>
    <a href="/tripos-notes/Lectures/II/Michaelmas/Galois-Theory-GT/Notes/Proof-Galois-theory-of-finite-fields.html">Proof</a>
</p>
<blockquote>
    <!-- BEGIN BLOCK ID subfield -->
    <p id="^subfield">
        By <a href="/tripos-notes/Lectures/II/Michaelmas/Galois-Theory-GT/Notes/Theorem-fundamental-theorem-of-Galois-theory.html">correspondence</a>,
        <span class="inline-math">$\mathbb{F}_{p^n}$</span> has a unique subfield of order <span class="inline-math">$p^m$</span> for all <span class="inline-math">$m\mid n$</span>
        and no others.
        (<a href="/tripos-notes/Lectures/II/Michaelmas/Galois-Theory-GT/Notes/Proof-subfields-of-F_q.html">Proof</a>)
    </p>
