<p>
    Consider <span class="inline-math">$K = \Q$</span> and <span class="inline-math">$L = \bigcup_{i=1}^{\infty} \Q(2^{1/2^n}) \subseteq \R$</span>.
</p>
<p>
    <span class="inline-math">$L$</span> is a nested union of fields so a field.
    Every <span class="inline-math">$α\in L$</span> belongs to some <span class="inline-math">$\Q(2^{1/2^n})$</span> so is algebraic.
</p>
<p>
    But <span class="inline-math">$[L:K] \geq [\Q(2^{1/2^n}): \Q] = 2^n$</span> for all <span class="inline-math">$n$</span> so <span class="inline-math">$[L:K] = \infty$</span>.
</p>
