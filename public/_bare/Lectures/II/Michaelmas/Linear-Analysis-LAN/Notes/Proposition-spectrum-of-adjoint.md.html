<p>
    Let <span class="inline-math">$H\neq \set{0}$</span> be a complex <a href="/tripos-notes/Lectures/II/Michaelmas/Linear-Analysis-LAN/Notes/Definition-Hilbert-space.html">Hilbert space</a>.
</p>
<p>
    For any <span class="inline-math">$T\in \mathcal{B}(X)$</span>, the <a href="/tripos-notes/Lectures/II/Michaelmas/Linear-Analysis-LAN/Notes/Definition-spectrum-resolvent-set-resolvent-function.html">spectrum</a> of its <a href="/tripos-notes/Lectures/IB/Michaelmas/Linear-Algebra-LA/Notes/Definition-adjoint-map.html">adjoint</a> is
    <span class="display-math">$$ \begin{align*}
        σ(T^\ast) = \sb{\overline{λ}}{λ\in σ(T)}.
    \end{align*} $$</span>
</p>
<p>
    <a href="/tripos-notes/Lectures/II/Michaelmas/Linear-Analysis-LAN/Notes/Proof-spectrum-of-adjoint.html">Proof</a>
</p>
<ul>
<li>
    <p>
        If <span class="inline-math">$T$</span> is <a href="/tripos-notes/Lectures/IB/Michaelmas/Linear-Algebra-LA/Notes/Definition-Hermitian-self-adjoint-operator.html">Hermitian</a>,
        then <span class="inline-math">$σ(T)\subseteq \R$</span>.
        <a href="/tripos-notes/Lectures/II/Michaelmas/Linear-Analysis-LAN/Notes/Definition-point-spectrum-approximate-point-spectrum.html#^boundary">Therefore</a> <span class="inline-math">$σ_\text{ap}(T) = σ(T)$</span>.
    </p>
    
</li>
</ul>
