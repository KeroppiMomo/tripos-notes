<p>
    By the <a href="/tripos-notes/Lectures/II/Michaelmas/Linear-Analysis-LAN/Notes/Theorem-open-mapping-theorem-for-bounded-linear-maps.html">open mapping theorem</a>,
    <span class="inline-math">$TB_X \supseteq δ B_Y$</span> for some <span class="inline-math">$δ&gt;0$</span>.
    But <a href="/tripos-notes/Lectures/II/Michaelmas/Linear-Analysis-LAN/Notes/Theorem-finite-dimensional-normed-space-iff-unit-ball-is-compact.html"><span class="inline-math">$B_Y$</span> is not compact</a>,
    <a href="/tripos-notes/Lectures/IB/Michaelmas/Analysis-and-Topology-AT/Notes/Lemma-closed-set-in-compact-space-is-compact.html">so</a> <span class="inline-math">$\overline{TB_X}$</span> cannot be compact.
</p>
