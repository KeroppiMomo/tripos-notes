<p>
    Let <span class="inline-math">$X$</span> be a normed space.
</p>
<p>
    For any <span class="inline-math">$x_0\in X \setminus \set{0}$</span>,
    there exists <span class="inline-math">$f\in{}$</span><a href="/tripos-notes/Lectures/II/Michaelmas/Linear-Analysis-LAN/Notes/Definition-dual-normed-space.html"><span class="inline-math">$X^\ast$</span></a> such that <span class="inline-math">$\|f\| = 1$</span>
    and <span class="inline-math">$f(x_0) = \|x_0\|$</span>.
</p>
<p>
    <span class="inline-math">$f$</span> is called the <em>norming functional</em> at <span class="inline-math">$x_0$</span>.
</p>
<p>
    <a href="/tripos-notes/Lectures/II/Michaelmas/Linear-Analysis-LAN/Notes/Proof-norming-functional.html">Proof</a>
</p>
<ul>
<li>
    <p>
        Therefore <span class="inline-math">$\sup_{f\in B_{X^\ast}} f(x_0) = \|x_0\|$</span> and is attained by the norming functional.
    </p>
    
</li>
</ul>
