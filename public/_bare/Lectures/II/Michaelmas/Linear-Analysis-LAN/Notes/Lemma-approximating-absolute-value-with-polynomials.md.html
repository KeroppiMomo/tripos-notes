<p>
    For any <span class="inline-math">$ε&gt;0$</span>,
    there exists a real polynomial <span class="inline-math">$p$</span>
    such that
    <span class="display-math">$$ \begin{align*}
        \bigl||t| - p(t)\bigr| &lt; ε \qquad \forall t\in [-1,1].
    \end{align*} $$</span>
