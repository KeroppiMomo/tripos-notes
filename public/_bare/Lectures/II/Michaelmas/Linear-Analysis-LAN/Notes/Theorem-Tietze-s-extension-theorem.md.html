<p>
    Let <span class="inline-math">$K$</span> be a <a href="/tripos-notes/Lectures/II/Michaelmas/Linear-Analysis-LAN/Notes/Definition-normal-topological-space.html">normal</a> topological space.
</p>
<p>
    If <span class="inline-math">$L$</span> is a closed subspace of <span class="inline-math">$K$</span>,
    then for any <span class="inline-math">$g\in C_b(L)$</span>,
    there is <span class="inline-math">$f\in C_b(K)$</span> such that <span class="inline-math">$f|_L = g$</span>
    and <span class="inline-math">$\|f\|_\infty = \|g\|_\infty$</span>.
</p>
