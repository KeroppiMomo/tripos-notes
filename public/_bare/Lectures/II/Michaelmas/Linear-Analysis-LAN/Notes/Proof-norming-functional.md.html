<p>
    Take <span class="inline-math">$Y = \op{span}(x_0)$</span>
    and define <span class="inline-math">$g(λx_0) = λ\|x_0\|$</span>.
    Then <span class="inline-math">$g\in Y^\ast$</span> and <span class="inline-math">$\|g\| = 1$</span>,
    so <a href="/tripos-notes/Lectures/II/Michaelmas/Linear-Analysis-LAN/Notes/Theorem-Hahn-Banach.html">Hahn-Banach</a> gives the required <span class="inline-math">$f\in X^\ast$</span>.
