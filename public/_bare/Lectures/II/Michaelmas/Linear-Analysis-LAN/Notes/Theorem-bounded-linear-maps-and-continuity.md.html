<p>
    Let <span class="inline-math">$X, Y$</span> be <a href="/tripos-notes/Lectures/II/Michaelmas/Linear-Analysis-LAN/Notes/Definition-norm-normed-space.html">normed spaces</a>,
    and <span class="inline-math">$T: X\to Y$</span> be a linear map.
    The following are equivalent:
</p>
<ol start="1">
<li>
    <p>
        <span class="inline-math">$T$</span> is <a href="/tripos-notes/Lectures/II/Michaelmas/Linear-Analysis-LAN/Notes/Definition-bounded-linear-maps.html">bounded</a>;
    </p>
    
</li><li>
    <p>
        <span class="inline-math">$T$</span> is <a href="/tripos-notes/Lectures/IB/Michaelmas/Analysis-and-Topology-AT/Notes/Definition-Lipschitz-continuity.html">Lipschitz</a>;
    </p>
    
</li><li>
    <p>
        <span class="inline-math">$T$</span> is <a href="/tripos-notes/Lectures/IB/Michaelmas/Analysis-and-Topology-AT/Notes/Definition-continuity-on-topological-space.html">continuous</a>;
    </p>
    
</li><li>
    <p>
        <span class="inline-math">$T$</span> is continuous at 0.
    </p>
    
</li>
</ol>
<p>
    <a href="/tripos-notes/Lectures/II/Michaelmas/Linear-Analysis-LAN/Notes/Proof-bounded-linear-maps-and-continuity.html">Proof</a>
</p>
