<p>
    Every metric space <span class="inline-math">$(M,d)$</span> has a <a href="/tripos-notes/Lectures/II/Michaelmas/Linear-Analysis-LAN/Notes/Definition-completion-of-metric-space.html">completion</a>.
</p>
<p>
    Moreover if <span class="inline-math">$(\tilde M_1, \tilde d_1)$</span> and <span class="inline-math">$(\tilde M_2, \tilde d_2)$</span> are two completions of <span class="inline-math">$(M,d)$</span>,
    then there exists an isometric bijection <span class="inline-math">$(\tilde M_1, \tilde d_1) \to (\tilde M_2, \tilde d_2)$</span>.
</p>
