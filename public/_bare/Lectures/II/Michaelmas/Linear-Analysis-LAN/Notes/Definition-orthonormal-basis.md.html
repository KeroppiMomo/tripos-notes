<p>
    Let <span class="inline-math">$X$</span> be an <a href="/tripos-notes/Lectures/IB/Michaelmas/Linear-Algebra-LA/Notes/Definition-inner-product-space.html">inner product space</a>.
</p>
<p>
    A sequence <span class="inline-math">$(x_n)_{n\in \N}$</span> is an <em>orthonormal sequence</em>
    if <span class="inline-math">$\langle x_n, x_m\rangle = δ_{nm}$</span> for all <span class="inline-math">$n,m\in \N$</span>.
</p>
<p>
    A sequence <span class="inline-math">$(x_n)_{n\in \N}$</span> is an <em>orthonormal basis</em>
    if <span class="inline-math">$(x_n)_{n\in \N}$</span> is orthonormal
    and <span class="inline-math">$\overline{\op{span}}\sb{x_n}{n\in \N} = X$</span>.
</p>
