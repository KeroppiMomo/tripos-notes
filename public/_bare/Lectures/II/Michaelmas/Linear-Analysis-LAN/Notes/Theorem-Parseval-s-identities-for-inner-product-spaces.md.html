<p>
    Let <span class="inline-math">$X$</span> be an inner product space
    with an <a href="/tripos-notes/Lectures/II/Michaelmas/Linear-Analysis-LAN/Notes/Definition-orthonormal-basis.html">orthonormal basis</a> <span class="inline-math">$(e_n)_{n\in \N}$</span>.
    For <span class="inline-math">$x,y\in X$</span>,
    <span class="display-math">$$ \begin{align*}
        \|x\|^2 ={}&amp; \sum_{n=1}^{\infty} |\langle x, e_n\rangle|^2, \\
        \langle x,y\rangle ={}&amp; \sum_{n=1}^{\infty} \langle x,e_n\rangle \, \overline{\langle y,e_n\rangle}.
    \end{align*} $$</span>
</p>
