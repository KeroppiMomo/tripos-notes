<p>
    Let <span class="inline-math">$S$</span> be a set of functions <span class="inline-math">$K \to \C$</span>.
</p>
<p>
    <span class="inline-math">$S$</span> is said to <em>separate points of <span class="inline-math">$K$</span></em>
    if for all <span class="inline-math">$x,y\in K$</span> distinct,
    there exists <span class="inline-math">$f\in S$</span> such that <span class="inline-math">$f(x) \neq f(y)$</span>.
</p>
<p>
    <span class="inline-math">$S$</span> is said to <em>strongly separate points of <span class="inline-math">$K$</span></em>
    if in addition, for all <span class="inline-math">$x\in K$</span>,
    there exists <span class="inline-math">$f\in S$</span> such that <span class="inline-math">$f(x) \neq 0$</span>.
</p>
