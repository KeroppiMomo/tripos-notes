<p>
    From the <a href="/tripos-notes/Lectures/II/Michaelmas/Linear-Analysis-LAN/Notes/Proof-adjoint-map-in-Hilbert-spaces.html">proof</a>,
    we saw <span class="inline-math">$\|T^\ast\|\leq \|T\|$</span>.
</p>
<p>
    But <span class="inline-math">$T^{\ast\ast} = T$</span>,
    so <span class="inline-math">$\|T\| = \|T^{\ast\ast}\| \leq \|T^\ast\|$</span>.
</p>
