<p>
    Let <span class="inline-math">$1\leq p&lt;q\leq \infty$</span> be such that <span class="inline-math">$1/p + 1/q = 1$</span>.
    Then for all <span class="inline-math">$a,b\geq 0$</span>,
    <span class="display-math">$$ \begin{align*}
        ab \leq \frac{a^p}{p} + \frac{b^q}{q}.
    \end{align*} $$</span>
</p>
