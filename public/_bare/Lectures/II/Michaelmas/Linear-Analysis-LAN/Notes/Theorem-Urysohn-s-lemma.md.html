<p>
    Let <span class="inline-math">$X$</span> be a <a href="/tripos-notes/Lectures/II/Michaelmas/Linear-Analysis-LAN/Notes/Definition-normal-topological-space.html">normal</a> topological space.
</p>
<p>
    For any disjoint closed sets <span class="inline-math">$A,B\subseteq X$</span>,
    there exists a continuous function
    <span class="inline-math">$f: X \to [0,1]$</span>
    such that <span class="inline-math">$A \subseteq f\inv(0)$</span> and <span class="inline-math">$B \subseteq f\inv(1)$</span>.
</p>
