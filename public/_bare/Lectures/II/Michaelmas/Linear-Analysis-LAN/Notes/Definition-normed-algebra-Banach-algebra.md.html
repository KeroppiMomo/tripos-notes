<p>
    A <em>normed algebra</em> <span class="inline-math">$A$</span> is a <a href="/tripos-notes/Lectures/II/Michaelmas/Linear-Analysis-LAN/Notes/Definition-norm-normed-space.html">normed vector space</a>
    that is also an <a href="/tripos-notes/Lectures/II/Michaelmas/Linear-Analysis-LAN/Notes/Definition-algebra.html">algebra</a>
    and satisfies
    <span class="display-math">$$\begin{align*}
        \|xy\| \leq \|x\| \|y\| \qquad \text{for all }x,y\in A.
    \end{align*} $$</span>
</p>
<p>
    <span class="inline-math">$A$</span> is <em>unital</em> if moreover <span class="inline-math">$A$</span> is a unital algebra with <span class="inline-math">$\|1\| = 1$</span>.
</p>
<p>
    <span class="inline-math">$A$</span> is said to be a <em>Banach algebra</em>
    if <span class="inline-math">$A$</span> is complete.
</p>
