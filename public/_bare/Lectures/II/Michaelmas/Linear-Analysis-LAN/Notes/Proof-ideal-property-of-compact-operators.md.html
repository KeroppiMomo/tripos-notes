<p>
    Let <span class="inline-math">$(w_n)_{n\in \N}$</span> be a bounded sequence in <span class="inline-math">$W$</span>.
    <span class="inline-math">$(Bw_n)$</span> is a bounded sequence in <span class="inline-math">$X$</span>,
    so by compactness of <span class="inline-math">$T$</span>,
    <span class="inline-math">$(TBw_n)$</span> has a convergent subsequence <span class="inline-math">$(TBw_{n_k})_{k\in \N}$</span>.
    Then <span class="inline-math">$(ATBw_{n_k})_k$</span> is a convergent subsequence of <span class="inline-math">$(ATBw_n)_{n}$</span>.
</p>
