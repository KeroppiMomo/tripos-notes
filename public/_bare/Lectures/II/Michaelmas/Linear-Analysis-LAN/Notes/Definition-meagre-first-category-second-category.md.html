<p>
    Let <span class="inline-math">$X$</span> be a topological space.
</p>
<p>
    A subset <span class="inline-math">$A\subseteq X$</span> is said to be <em>meagre in <span class="inline-math">$X$</span></em>
    or is <em>of first category in <span class="inline-math">$X$</span></em>
    if <span class="inline-math">$A = \bigcup_{n\in \N} A_n$</span>
    where <span class="inline-math">$A_n$</span> is <a href="/tripos-notes/Lectures/II/Michaelmas/Linear-Analysis-LAN/Notes/Definition-nowhere-dense-set.html">nowhere dense</a> for all <span class="inline-math">$n\in \N$</span>.
</p>
<p>
    Say <span class="inline-math">$A$</span> is <em>of second category in <span class="inline-math">$X$</span></em> if <span class="inline-math">$A$</span> is not of first category of <span class="inline-math">$X$</span>.
</p>
