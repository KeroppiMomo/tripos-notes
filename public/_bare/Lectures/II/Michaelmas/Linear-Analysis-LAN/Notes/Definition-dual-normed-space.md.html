<p>
    Let <span class="inline-math">$X$</span> be a normed space.
</p>
<p>
    The <em>dual space</em> <span class="inline-math">$X^\ast$</span> of <span class="inline-math">$X$</span>
    is <a href="/tripos-notes/Lectures/II/Michaelmas/Linear-Analysis-LAN/Notes/Definition-bounded-linear-maps.html"><span class="inline-math">$\mathcal{B}(X, \mathbb{F})$</span></a>, the space of all bounded linear functionals on <span class="inline-math">$X$</span>.
</p>
<p>
    We write <span class="inline-math">$\langle x,f\rangle = f(x)$</span> for <span class="inline-math">$f\in X^\ast$</span>, <span class="inline-math">$x\in X$</span>.
</p>
<blockquote>
    <p>
        <a href="/tripos-notes/Lectures/II/Michaelmas/Linear-Analysis-LAN/Notes/Theorem-completeness-of-bounded-linear-maps.html">Since</a> <span class="inline-math">$\mathbb{F}$</span> is complete, <span class="inline-math">$X^\ast$</span> is always complete.
    </p>
    
</blockquote>
