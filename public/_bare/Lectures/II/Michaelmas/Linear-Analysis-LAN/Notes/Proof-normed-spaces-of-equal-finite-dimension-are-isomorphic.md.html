<p>
    <a href="/tripos-notes/Lectures/IB/Michaelmas/Linear-Algebra-LA/Notes/Corollary-vector-spaces-of-equal-dimension-are-isomorphic.html">Linear algebra says</a>
    there is a vector space isomorphism <span class="inline-math">$T: X\to Y$</span>.
    <a href="/tripos-notes/Lectures/II/Michaelmas/Linear-Analysis-LAN/Notes/Corollary-linear-map-on-finite-dimensional-normed-space-is-continuous.html">But</a> <span class="inline-math">$T$</span> and <span class="inline-math">$T\inv$</span> are continuous,
