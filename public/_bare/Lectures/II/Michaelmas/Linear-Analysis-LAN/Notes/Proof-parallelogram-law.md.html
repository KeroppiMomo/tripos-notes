<p>
    <span class="display-math">$$ \begin{align*}
        \|x+y\|^2 + \|x-y\|^2 ={}&amp; \langle x+y, x+y\rangle + \langle x-y, x-y\rangle \\
        ={}&amp; \|x\|^2 + \langle x,y\rangle + \langle y,x\rangle + \|y\|^2 + \|x\|^2 - \langle x,y\rangle - \langle y,x\rangle + \|y\|^2 \\
        ={}&amp; 2\|x\|^2 + 2\|y\|^2.
    \end{align*} $$</span>
