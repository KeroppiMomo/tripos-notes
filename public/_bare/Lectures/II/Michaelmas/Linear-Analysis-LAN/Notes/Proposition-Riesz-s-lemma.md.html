<p>
    Let <span class="inline-math">$Y$</span> be a closed, proper subspace of a <a href="/tripos-notes/Lectures/II/Michaelmas/Linear-Analysis-LAN/Notes/Definition-norm-normed-space.html">normed space</a> <span class="inline-math">$X$</span>.
</p>
<p>
    For any <span class="inline-math">$ε&gt;0$</span>,
    there exists <span class="inline-math">$x\in B_X$</span>
    such that <span class="inline-math">$d(x,Y) := \inf \sb{\|x-y\|}{y\in Y} \geq 1-ε$</span>.
</p>
