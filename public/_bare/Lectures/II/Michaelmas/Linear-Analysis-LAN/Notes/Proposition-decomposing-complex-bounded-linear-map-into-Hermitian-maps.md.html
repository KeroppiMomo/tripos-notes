<p>
    Let <span class="inline-math">$H$</span> be a <a href="/tripos-notes/Lectures/II/Michaelmas/Linear-Analysis-LAN/Notes/Definition-Hilbert-space.html">Hilbert space</a>.
</p>
<p>
    For any <span class="inline-math">$T\in \mathcal{B}(H)$</span>,
    there exists unique <a href="/tripos-notes/Lectures/IB/Michaelmas/Linear-Algebra-LA/Notes/Definition-Hermitian-self-adjoint-operator.html">Hermitian operators</a> <span class="inline-math">$T_1, T_2$</span>
    such that <span class="inline-math">$T = T_1 + iT_2$</span>,
    which are given by
    <span class="display-math">$$ \begin{align*}
        T_1 = \frac{1}{2}(T + T^\ast), \qquad T_2 = \frac{1}{2i}(T - T^\ast).
    \end{align*} $$</span>
</p>
