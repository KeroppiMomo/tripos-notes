<p>
    Let <span class="inline-math">$X,Y$</span> be normed spaces.
</p>
<p>
    If <span class="inline-math">$Y$</span> is <a href="/tripos-notes/Lectures/IB/Michaelmas/Analysis-and-Topology-AT/Notes/Definition-completeness.html">complete</a>, then <a href="/tripos-notes/Lectures/II/Michaelmas/Linear-Analysis-LAN/Notes/Definition-bounded-linear-maps.html"><span class="inline-math">$\mathcal{B}(X,Y)$</span></a> is complete.
</p>
<p>
    <a href="/tripos-notes/Lectures/II/Michaelmas/Linear-Analysis-LAN/Notes/Proof-completeness-of-bounded-linear-maps.html">Proof</a>
</p>
<ul>
<li>
    <p>
        Therefore if <span class="inline-math">$X$</span> is a Banach space, then <span class="inline-math">$\mathcal{B}(X)$</span> is a <a href="/tripos-notes/Lectures/II/Michaelmas/Linear-Analysis-LAN/Notes/Definition-normed-algebra-Banach-algebra.html">Banach algebra</a>.
    </p>
    
</li>
</ul>
