<p>
    Let <span class="inline-math">$(M,d)$</span> be a <a href="/tripos-notes/Lectures/IB/Michaelmas/Analysis-and-Topology-AT/Notes/Definition-metric-space.html">metric space</a>.
</p>
<p>
    A <em>completion</em> of <span class="inline-math">$M$</span> is a <a href="/tripos-notes/Lectures/IB/Michaelmas/Analysis-and-Topology-AT/Notes/Definition-completeness.html">complete</a> metric space <span class="inline-math">$(\tilde M, \tilde d)$</span>
    with an isometric map <span class="inline-math">$j: (M, d)\to (\tilde M, \tilde d)$</span>
    such that <span class="inline-math">$j(M)$</span> is <a href="/tripos-notes/Lectures/II/Michaelmas/Linear-Analysis-LAN/Notes/Definition-dense-set-separable-space.html">dense</a> in <span class="inline-math">$\tilde M$</span>.
</p>
