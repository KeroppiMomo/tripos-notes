<p>
    Let <span class="inline-math">$X\neq \set{0}$</span> be a complex <a href="/tripos-notes/Lectures/II/Michaelmas/Linear-Analysis-LAN/Notes/Definition-Banach-space.html">Banach space</a>
    and <span class="inline-math">$T\in{}$</span><a href="/tripos-notes/Lectures/II/Michaelmas/Linear-Analysis-LAN/Notes/Definition-bounded-linear-maps.html"><span class="inline-math">$\mathcal{B}(X)$</span></a>.
</p>
<p>
    Define the <em>spectral radius</em> of <span class="inline-math">$T$</span> as <span class="inline-math">$r(T) = \sup{} \{|λ|\ |\ λ\in{}$</span><a href="/tripos-notes/Lectures/II/Michaelmas/Linear-Analysis-LAN/Notes/Definition-spectrum-resolvent-set-resolvent-function.html"><span class="inline-math">$σ(T)$</span></a><span class="inline-math">$\}$</span>.
    Then
    <span class="display-math">$$ \begin{align*}
        r(T) = \lim_{n\to \infty} \|T^n\|^{1/n}.
    \end{align*} $$</span>
</p>
