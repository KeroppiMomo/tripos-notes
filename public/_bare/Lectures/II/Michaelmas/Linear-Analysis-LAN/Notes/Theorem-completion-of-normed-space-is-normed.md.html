<p>
    The <a href="/tripos-notes/Lectures/II/Michaelmas/Linear-Analysis-LAN/Notes/Definition-completion-of-metric-space.html">completion</a> <span class="inline-math">$\tilde X$</span> of a <a href="/tripos-notes/Lectures/II/Michaelmas/Linear-Analysis-LAN/Notes/Definition-norm-normed-space.html">normed space</a> <span class="inline-math">$X$</span> is also a normed space,
    and the isometric embedding <span class="inline-math">$j: X \to \tilde X$</span> is linear.
</p>
<p>
    <a href="/tripos-notes/Lectures/II/Michaelmas/Linear-Analysis-LAN/Notes/Proof-completion-of-normed-space-is-normed.html">Proof</a>
</p>
<ul>
<li>
    <p>
        We can take the completion to be <span class="inline-math">$\tilde X = \overline{\sb{\hat x}{x\in X}}\subseteq X^{\ast\ast}$</span>
        with the <a href="/tripos-notes/Lectures/II/Michaelmas/Linear-Analysis-LAN/Notes/Proposition-isometric-embedding-into-bidual.html">canonical embedding</a> <span class="inline-math">$\hat{\ }$</span>.
    </p>
    
</li>
