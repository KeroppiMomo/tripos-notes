<p>
    Let <span class="inline-math">$K$</span> be a topological space.
</p>
<p>
    If <span class="inline-math">$A$</span> is a closed <a href="/tripos-notes/Lectures/II/Michaelmas/Linear-Analysis-LAN/Notes/Definition-subalgebra.html">subalgebra</a> of <span class="inline-math">$C^\R(K)$</span>,
    then <span class="inline-math">$A$</span> is a lattice,
    i.e. if <span class="inline-math">$f,g\in A$</span>,
    then <span class="inline-math">$\max\set{f,g}, \min\set{f,g}\in A$</span>.
</p>
