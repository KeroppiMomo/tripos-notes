<p>
    Let <span class="inline-math">$X$</span> be a <a href="/tripos-notes/Lectures/II/Michaelmas/Linear-Analysis-LAN/Notes/Definition-Banach-space.html">Banach space</a>.
</p>
<p>
    Suppose <span class="inline-math">$Y,Z$</span> are subspaces of <span class="inline-math">$X$</span>
    such that <span class="inline-math">$X = Y + Z$</span> and <span class="inline-math">$Y \cap Z = \set{0}$</span>.
    The following are equivalent:
</p>
<ol start="1">
<li>
    <p>
        <span class="inline-math">$Y$</span> and <span class="inline-math">$Z$</span> are closed subspaces;
    </p>
    
</li><li>
    <p>
        <span class="inline-math">$X = Y$</span><a href="/tripos-notes/Lectures/II/Michaelmas/Linear-Analysis-LAN/Notes/Definition-direct-sum-of-normed-spaces.html"><span class="inline-math">${}\oplus{}$</span></a><span class="inline-math">$Z$</span>;
    </p>
    
</li><li>
    <p>
        <span class="inline-math">$P_Y: X \to Y$</span> given by <span class="inline-math">$P_Y(y + z) = y$</span> is continuous.
    </p>
    
</li>
</ol>
<p>
    <a href="/tripos-notes/Lectures/II/Michaelmas/Linear-Analysis-LAN/Notes/Proof-Banach-space-as-direct-sum.html">Proof</a>
</p>
