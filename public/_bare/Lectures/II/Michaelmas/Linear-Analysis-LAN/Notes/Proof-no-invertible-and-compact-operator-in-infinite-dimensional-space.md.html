<p>
    If <span class="inline-math">$T \in \mathcal{G}(X) \cap \mathcal{K}(X)$</span>,
    then by the <a href="/tripos-notes/Lectures/II/Michaelmas/Linear-Analysis-LAN/Notes/Definition-compact-operator.html#^ideal">ideal property of compact operators</a>,
    <span class="inline-math">$\id = TT\inv$</span> is also compact.
    However <span class="inline-math">$\overline{\id(B_X)} = B_X$</span> is <a href="/tripos-notes/Lectures/II/Michaelmas/Linear-Analysis-LAN/Notes/Theorem-finite-dimensional-normed-space-iff-unit-ball-is-compact.html">not compact</a> in an infinite-dimensional space..
</p>
