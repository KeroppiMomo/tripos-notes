<p>
    Since <span class="inline-math">$\overline{T(MB_X)}\supseteq B_Y$</span>,
    <span class="inline-math">$T(MB_X)$</span> is <span class="inline-math">$δ$</span>-dense in <span class="inline-math">$B_Y$</span> for all <span class="inline-math">$δ&gt;0$</span>,
    so <span class="inline-math">$T(\frac{M}{1-δ}B_X) \supseteq B_Y$</span>.
</p>
<p>
    Then
    <span class="display-math">$$ \begin{align*}
        T(MD_Y) \supseteq T(M(1-ε)B_X) \supseteq (1-ε)(1-δ)B_Y
    \end{align*} $$</span>
    holds for all <span class="inline-math">$δ,ε&gt;0$</span>.
    Hence <span class="inline-math">$T(MD_Y) \supseteq D_Y$</span>.
</p>
