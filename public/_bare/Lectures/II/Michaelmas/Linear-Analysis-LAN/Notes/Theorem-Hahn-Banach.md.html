    (Non-examinable in II Linear Analysis)
</p>
<p>
    Let <span class="inline-math">$X$</span> be a normed space and <span class="inline-math">$Y\subseteq X$</span> be a subspace.
</p>
<p>
    For any <span class="inline-math">$g\in{}$</span><a href="/tripos-notes/Lectures/II/Michaelmas/Linear-Analysis-LAN/Notes/Definition-dual-normed-space.html"><span class="inline-math">$Y^\ast$</span></a>, there exists <span class="inline-math">$f\in X^\ast$</span>
    such that <span class="inline-math">$f|_Y = g$</span> and <span class="inline-math">$\|f\| = \|g\|$</span>.
</p>
