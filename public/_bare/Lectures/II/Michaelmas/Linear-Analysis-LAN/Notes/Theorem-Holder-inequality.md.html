<p>
    Let <span class="inline-math">$1\leq p&lt;q\leq \infty$</span> such that <span class="inline-math">$1/p + 1/q = 1$</span>.
    <span class="inline-math">$q$</span> is called the <em>conjugate index</em> of <span class="inline-math">$p$</span>.
</p>
<p>
    If <span class="inline-math">$x\in l_p$</span> and <span class="inline-math">$y\in l_q$</span>, then
    <span class="display-math">$$ \begin{align*}
        \|x\cdot y\|_1 \leq \|x\|_p \|y\|_q.
    \end{align*} $$</span>
</p>
