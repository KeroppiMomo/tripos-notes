<p>
    Let <span class="inline-math">$H$</span> be a <a href="/tripos-notes/Lectures/II/Michaelmas/Linear-Analysis-LAN/Notes/Definition-Hilbert-space.html">Hilbert space</a>.
</p>
<p>
    <span class="inline-math">$T\in \mathcal{B}(H)$</span> is said to be <em>normal</em>
    if <a href="/tripos-notes/Lectures/II/Michaelmas/Linear-Analysis-LAN/Notes/Theorem-adjoint-map-in-Hilbert-spaces.html"><span class="inline-math">$T^\ast$</span></a><span class="inline-math">$T = TT^\ast$</span>.
</p>
