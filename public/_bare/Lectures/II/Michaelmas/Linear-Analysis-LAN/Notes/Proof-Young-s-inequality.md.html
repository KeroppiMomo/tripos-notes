<p>
    If either <span class="inline-math">$a$</span> or <span class="inline-math">$b$</span> is zero, we are done, so assume not.
</p>
<p>
    <span class="inline-math">$\log: (0, \infty) \to \R$</span> is <a href="/tripos-notes/Lectures/IB/Easter/Optimisation-Op/Notes/Definition-convex-function.html">concave</a>, so
    <span class="display-math">$$ \begin{align*}
        \log\left(\frac{a^p}{p} + \frac{b^q}{q}\right) \leq \frac{1}{p}\log a^p + \frac{1}{q} \log b^q = \log ab
    \end{align*} $$</span>
    and the inequality follows by taking <span class="inline-math">$\exp$</span>.
</p>
