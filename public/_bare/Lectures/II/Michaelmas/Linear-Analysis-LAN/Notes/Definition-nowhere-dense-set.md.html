<p>
    Let <span class="inline-math">$X$</span> be a topological space.
</p>
<p>
    A subset <span class="inline-math">$A\subseteq X$</span> is said to be <em>nowhere dense</em> if equivalently
</p>
<ol start="1">
<li>
    <p>
        <span class="inline-math">$\op{int} \overline{A} = \emptyset$</span>;
    </p>
    
</li><li>
    <p>
        for any non-empty open set <span class="inline-math">$U\subseteq X$</span>, we have <span class="inline-math">$U \not\subseteq \overline{U \cap A}$</span>.
    </p>
    
</li>
</ol>
