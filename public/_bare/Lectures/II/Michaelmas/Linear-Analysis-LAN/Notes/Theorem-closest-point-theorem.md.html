<p>
    Let <span class="inline-math">$H$</span> be a <a href="/tripos-notes/Lectures/II/Michaelmas/Linear-Analysis-LAN/Notes/Definition-Hilbert-space.html">Hilbert space</a>.
</p>
<p>
    If <span class="inline-math">$Y$</span> is a closed subspace of <span class="inline-math">$H$</span>,
    then for any <span class="inline-math">$x\in H$</span>,
    there exists a unique <span class="inline-math">$y\in Y$</span>
    such that <span class="inline-math">$\|x - y\| = d(x,Y)$</span>.
</p>
