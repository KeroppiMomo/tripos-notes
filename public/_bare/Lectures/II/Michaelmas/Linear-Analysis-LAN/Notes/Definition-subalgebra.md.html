<p>
    Let <span class="inline-math">$A$</span> be an <a href="/tripos-notes/Lectures/IA/Michaelmas/Vectors-and-Matrices-VM/Definition-vector-space.html">algebra</a>.
</p>
<p>
    A subset <span class="inline-math">$B\subseteq A$</span> is a <em>subalgebra</em> of <span class="inline-math">$A$</span>
    if it is a <a href="/tripos-notes/Lectures/IB/Michaelmas/Linear-Algebra-LA/Notes/Definition-vector-subspace.html">vector subspace</a> of <span class="inline-math">$A$</span>
    and <span class="inline-math">$xy\in B$</span> for all <span class="inline-math">$x,y\in B$</span>.
</p>
<p>
    <span class="inline-math">$B$</span> is a <em>unital subalgebra</em> if in addition, <span class="inline-math">$1\in B$</span>.
</p>
