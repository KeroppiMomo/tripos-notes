<p>
    Let <span class="inline-math">$(E, \mathcal{O})$</span> be a <a href="/tripos-notes/Lectures/IB/Michaelmas/Analysis-and-Topology-AT/Notes/Definition-topology-topological-space-open-set.html">topological space</a>.
