<p>
    Let <span class="inline-math">$f,g: (E,\mathcal{A},μ) \to [0,\infty]$</span> be non-negative measurable functions
    and <span class="inline-math">$a,b\geq 0$</span>.
    <a href="/tripos-notes/Lectures/II/Michaelmas/Probability-and-Measure-PM/Notes/Definition-integral-of-non-negative-measurable-function.html">Integrals</a> satisfy
    <span class="display-math">$$ \begin{align*}
        \int (af + bg) \d μ = a \int f \d μ + b \int g \d μ.
    \end{align*} $$</span>
</p>
