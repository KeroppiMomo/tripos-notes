<p>
    Let <span class="inline-math">$(E,\mathcal{A})$</span> and <span class="inline-math">$(F,\mathcal{B})$</span> be two <a href="/tripos-notes/Lectures/IA/Lent/Probability-Pr/Notes/Definition-sigma-algebra-measurable-space.html">measurable spaces</a>.
</p>
<p>
    A function <span class="inline-math">$f: E\to F$</span> is <em>measurable</em>
    if <span class="inline-math">$f\inv(B) \in \mathcal{A}$</span> for all <span class="inline-math">$B\in \mathcal{B}$</span>.
</p>
<blockquote>
    <!-- BEGIN BLOCK ID comp -->
    <p id="^comp">
        Composition of measurable functions is measurable.
    </p>
    
    <!-- END BLOCK ID comp -->
    
</blockquote>
