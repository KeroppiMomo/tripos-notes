<p>
    Following the same proof <a href="/tripos-notes/Lectures/II/Michaelmas/Probability-and-Measure-PM/Notes/Proof-linearity-of-integral-of-simple-function.html">here</a>,
    <span class="inline-math">$g-f$</span> is simple and by hypothesis non-negative,
    so using <span class="inline-math">$g = f + (g-f)$</span>,
    <span class="display-math">$$ \begin{align*}
        \int g \d μ = \int f \d μ + \int (g-f) \d μ \geq \int f \d μ.
    \end{align*} $$</span>
</p>
