<p>
    Let <span class="inline-math">$A = f\inv([a,\infty]) = \sb{x\in E}{f(x) \geq a}$</span>,
    which is measurable as <span class="inline-math">$f$</span> is measurable.
</p>
<p>
    Using
    <span class="display-math">$$ \begin{align*}
        f \geq a \,\mathbb{1}_A,
    \end{align*} $$</span>
    we get
    <span class="display-math">$$ \begin{align*}
        \int f \d μ \geq a \int \mathbb{1}_A \d μ = a\, μ(A).
    \end{align*} $$</span>
</p>
