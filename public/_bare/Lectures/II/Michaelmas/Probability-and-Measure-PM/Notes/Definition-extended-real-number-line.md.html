<p>
    The <em>extended real number line</em> is
    <span class="display-math">$$ \begin{align*}
        \overline{\R} = \R \cup \set{-\infty, +\infty}.
    \end{align*} $$</span>
</p>
<p>
    <span class="inline-math">$\overline{\R}$</span> is homeomorphic to <span class="inline-math">$[-1, 1]$</span>.
</p>
