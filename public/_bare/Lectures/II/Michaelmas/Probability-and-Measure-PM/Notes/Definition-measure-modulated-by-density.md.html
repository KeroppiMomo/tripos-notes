<p>
    Let <span class="inline-math">$μ$</span> be a measure on <span class="inline-math">$(E,\mathcal{A})$</span>
    and <span class="inline-math">$f: E\to [0,\infty]$</span> be a non-negative measurable function.
</p>
<p>
    The <em>measure modulated by density <span class="inline-math">$f$</span></em>,
    denoted <span class="inline-math">$f\cdot μ$</span>, is the measure on <span class="inline-math">$E$</span>
    <a href="/tripos-notes/Lectures/II/Michaelmas/Probability-and-Measure-PM/Notes/Definition-integral-of-non-negative-measurable-function.html">given by</a>
    <span class="display-math">$$ \begin{align*}
        (f\cdot μ)(A) := \int \mathbb{1}_A f \d μ =: \int_{A} f \d μ.
    \end{align*} $$</span>
</p>
