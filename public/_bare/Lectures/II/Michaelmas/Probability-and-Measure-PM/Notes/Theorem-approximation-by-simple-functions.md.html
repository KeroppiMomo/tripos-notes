<p>
    Let <span class="inline-math">$f: (E,\mathcal{A})\to [0,\infty]$</span> be a non-negative <a href="/tripos-notes/Lectures/II/Michaelmas/Probability-and-Measure-PM/Notes/Definition-measurable-function.html">measurable function</a>.
</p>
<p>
    There exists an increasing sequence <span class="inline-math">$f_n: E\to [0,\infty)$</span>
    of non-negative <a href="/tripos-notes/Lectures/II/Michaelmas/Probability-and-Measure-PM/Notes/Definition-simple-function.html">simple functions</a>
    such that <span class="inline-math">$\limup_{n\to \infty} f_n \to f$</span> pointwise.
</p>
