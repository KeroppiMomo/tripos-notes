<p>
    Let <span class="inline-math">$(E,\mathcal{A},μ)$</span> be a measure space.
</p>
<p>
    If <span class="inline-math">$f: E \to [0,\infty]$</span> is a non-negative measurable function,
    then for all <span class="inline-math">$a&gt;0$</span>,
    <span class="display-math">$$ \begin{align*}
        μ(f\inv([a,\infty])) \leq \frac{1}{a} \int f \d μ.
    \end{align*} $$</span>
</p>
