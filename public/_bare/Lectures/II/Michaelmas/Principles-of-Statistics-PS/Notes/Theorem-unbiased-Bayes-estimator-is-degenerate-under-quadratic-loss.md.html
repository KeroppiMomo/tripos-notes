<p>
    (<a href="/tripos-notes/Lectures/II/Michaelmas/Principles-of-Statistics-PS/Notes/Definition-loss-risk.html">Context</a>)
    Let <span class="inline-math">$δ(x)$</span> be an estimator of <span class="inline-math">$θ$</span>.
</p>
<p>
    Under the quadratic loss <span class="inline-math">$L(δ,θ) = (δ - θ)^2$</span>, if
</p>
<ol start="1">
<li>
    <p>
        <span class="inline-math">$δ$</span> is a <a href="/tripos-notes/Lectures/II/Michaelmas/Principles-of-Statistics-PS/Notes/Definition-Bayes-risk-Bayes-rule.html"><span class="inline-math">$π$</span>-Bayes rule</a> for some prior <span class="inline-math">$π$</span> on <span class="inline-math">$Θ$</span>; and
    </p>
    
</li><li>
    <p>
        <span class="inline-math">$δ$</span> is <a href="/tripos-notes/Lectures/IB/Lent/Statistics-St/Notes/Definition-bias-of-estimator.html">unbiased</a>,
    </p>
    
</li>
</ol>
<p>
    then <span class="inline-math">$δ(X) = θ$</span> almost surely.
</p>
