<p>
    Let <span class="inline-math">$X_1, \ldots, X_n$</span> be iid samples of <span class="inline-math">$X \sim F$</span>.
</p>
<p>
    The <em>Monte Carlo estimator</em> for <span class="inline-math">$\expect g(X)$</span> is
    <span class="display-math">$$ \begin{align*}
        \hat I = \frac{1}{n} \sum_{i=1}^{n} g(X_i).
    \end{align*} $$</span>
</p>
<blockquote>
    <p>
        <span class="inline-math">$\var(\hat I) = \var(g(X))/n$</span>.
    </p>
    
</blockquote>
<blockquote>
    <p>
        The <a href="/tripos-notes/Lectures/IA/Lent/Probability-Pr/Notes/Theorem-strong-law-of-large-numbers.html">strong law of large number</a>
        says <span class="inline-math">$\hat I \xrightarrow{a.s.} \expect g(X)$</span>.
    </p>
    
</blockquote>
