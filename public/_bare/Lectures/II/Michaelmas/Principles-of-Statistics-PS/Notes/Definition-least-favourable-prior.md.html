<p>
    (<a href="/tripos-notes/Lectures/II/Michaelmas/Principles-of-Statistics-PS/Notes/Definition-Bayes-risk-Bayes-rule.html">Context</a>)
    A prior <span class="inline-math">$λ$</span> on <span class="inline-math">$Θ$</span> is said to be <em>least favourable</em> if
    <span class="display-math">$$ \begin{align*}
        R_λ(δ_λ) \leq R_π(δ_π) &amp;&amp;\text{for all priors $π$}.
    \end{align*} $$</span>
