<p>
    Let <span class="inline-math">$X \sim{}$</span><a href="/tripos-notes/Lectures/IA/Lent/Probability-Pr/Notes/Normal-distribution.html"><span class="inline-math">$N(μ, σ^2)$</span></a> and <span class="inline-math">$g: \R\to \R$</span> be a bounded differentiable function.
</p>
<p>
    If <span class="inline-math">$\expect|g&#x27;(X)|&lt;\infty$</span>, then
    <span class="display-math">$$ \begin{align*}
        \expect[(X - μ) \, g(X)] = σ^2 \expect[g&#x27;(X)].
    \end{align*} $$</span>
</p>
<p>
    <a href="/tripos-notes/Lectures/II/Michaelmas/Principles-of-Statistics-PS/Notes/Proof-Stein-s-lemma-normal-random-variable.html">Proof</a>
</p>
<blockquote>
    <p>
        The operator <span class="inline-math">$\mathcal{A}: g \mapsto (x-μ)g - g&#x27;$</span> is known as a <em>Stein operator</em>.
    </p>
    
</blockquote>
