<p>
    (<a href="/tripos-notes/Lectures/II/Michaelmas/Principles-of-Statistics-PS/Notes/Definition-loss-risk.html">Context</a>)
    Given a prior distribution <span class="inline-math">$π$</span> on <span class="inline-math">$Θ$</span>,
    the <em><span class="inline-math">$π$</span>-posterior risk</em> of a decision rule <span class="inline-math">$δ$</span> given an observation <span class="inline-math">$x\in \mathcal{X}$</span> is
    <span class="display-math">$$ \begin{align*}
        \expect_π[L(δ(x), θ) \mid x] \equiv \int_{Θ} R(δ(x), θ) \,π(θ\mid x) \d θ.
    \end{align*} $$</span>
</p>
