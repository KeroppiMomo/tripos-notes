<p>
    Suppose <span class="inline-math">$X_1, \ldots, X_n$</span> are iid copies of <span class="inline-math">$X\sim N(θ, 1)$</span>
    for some unknown parameter <span class="inline-math">$θ$</span>.
</p>
<p>
    The sample mean <span class="inline-math">$\overline{X_n}$</span> is an <a href="/tripos-notes/Lectures/II/Michaelmas/Principles-of-Statistics-PS/Notes/Definition-admissible-rule.html">admissible</a> and <a href="/tripos-notes/Lectures/II/Michaelmas/Principles-of-Statistics-PS/Notes/Definition-maximal-risk-minimax-rule.html">minimax</a>
    estimator of <span class="inline-math">$θ$</span> under the quadratic loss <span class="inline-math">$L(δ, θ) = (δ - θ)^2$</span>
    (under regularity conditions).
</p>
