<p>
    For a decision rule <span class="inline-math">$δ$</span>,
    its posterior risk is
    <span class="display-math">$$ \begin{align*}
        \expect_π[(δ(x) - θ)^2\mid x] ={}&amp; δ(x)^2 - δ(x) \expect_π[θ \mid x] + \expect_π[θ^2 \mid x].
    \end{align*} $$</span>
    For each <span class="inline-math">$x$</span>, this is minimised when
    <span class="display-math">$$ \begin{align*}
        δ(x) = \expect_π[θ \mid x].
    \end{align*} $$</span>
</p>
