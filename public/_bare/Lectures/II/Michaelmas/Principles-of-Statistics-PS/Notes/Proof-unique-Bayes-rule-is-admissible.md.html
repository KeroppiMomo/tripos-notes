<p>
    Let <span class="inline-math">$π$</span> be a prior and <span class="inline-math">$δ_π$</span> be the unique <span class="inline-math">$π$</span>-Bayes rule.
    For any other decision rule <span class="inline-math">$δ\neq π$</span>,
    <span class="display-math">$$ \begin{align*}
        R_π(δ) &amp;&gt; R_π(δ_π) \\
        \implies \int_{Θ} R(δ, θ) π(θ)\d θ &amp;&gt; \int_{Θ} R(δ_π, θ) π(θ) \d θ
    \end{align*} $$</span>
    so it cannot be the case that <span class="inline-math">$R(δ, θ) \leq R(δ_π, θ)$</span> for all <span class="inline-math">$θ\in Θ$</span>.
</p>
