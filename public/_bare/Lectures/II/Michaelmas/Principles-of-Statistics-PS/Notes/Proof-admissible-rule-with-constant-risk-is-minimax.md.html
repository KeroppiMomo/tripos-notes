<p>
    If <span class="inline-math">$δ$</span> is not minimax, then there exist <span class="inline-math">$δ&#x27;$</span> such that
    <span class="display-math">$$ \begin{align*}
        \sup_{θ\in Θ} R(δ&#x27;, θ) &lt; \sup_{θ\in Θ} R(δ, θ) = \inf_{θ\in Θ} R(δ, θ)
    \end{align*} $$</span>
    since <span class="inline-math">$R(δ, θ)$</span> is constant in <span class="inline-math">$θ$</span>.
    Therefore <span class="inline-math">$δ&#x27;$</span> dominates <span class="inline-math">$δ$</span> and <span class="inline-math">$δ$</span> is not admissible.
</p>
