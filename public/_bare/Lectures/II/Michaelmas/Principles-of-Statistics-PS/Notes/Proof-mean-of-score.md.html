<p>
    Suffices to check <span class="inline-math">$n=1$</span>.
    <span class="display-math">$$ \begin{align*}
        \expect_θ S_n(θ) ={}&amp; \int_{\mathcal{X}} \pdd{θ} \log f(x, θ) \cdot f(x, θ) \d x \\
        ={}&amp; \int_{\mathcal{X}} \pdfd{f}{θ}(x,θ) \d x \\
        ={}&amp; \pdd{θ} \int_{\mathcal{X}} f(x,θ) \d x &amp;&amp;\text{regularity} \\
        ={}&amp; \pdd{θ} 1 = 0.
    \end{align*} $$</span>
