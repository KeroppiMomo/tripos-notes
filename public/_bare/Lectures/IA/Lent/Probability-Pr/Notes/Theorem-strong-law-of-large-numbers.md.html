<p>
    Let <span class="inline-math">$X_1, X_2, \ldots$</span> be iid copies of <span class="inline-math">$X$</span> taking values in <span class="inline-math">$\R^k$</span>.
    Assume <span class="inline-math">$\expect \|X\|_2 &lt; \infty$</span>.
</p>
<p>
    Then
    <span class="display-math">$$ \begin{align*}
        \frac{1}{n} \sum_{i=1}^{n} X_i \xrightarrow{a.s.}\expect[X_i].
    \end{align*} $$</span>
</p>
