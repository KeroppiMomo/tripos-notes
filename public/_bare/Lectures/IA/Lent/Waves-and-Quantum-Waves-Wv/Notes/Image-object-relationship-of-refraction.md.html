<p>
    Refraction at a spherical surface of radius <span class="inline-math">$R$</span>: for small angles,
    <span class="display-math">$$ \begin{align*}
        \frac{n_1}{u} + \frac{n_2}{v} = \frac{n_2-n_1}{R}
    \end{align*} $$</span>
    (<a href="/tripos-notes/Lectures/IA/Lent/Waves-and-Quantum-Waves-Wv/Notes/Derivation-image-distance-for-refraction-at-spherical-surface.html">Derivation</a>)
</p>
<p>
    Take <span class="inline-math">$R = \infty$</span> for planar surface. (<a href="/tripos-notes/Lectures/IA/Lent/Waves-and-Quantum-Waves-Wv/Notes/Derivation-image-distance-for-refraction-at-planar-surface.html">Derivation</a>)
