<p>
    A thin lens has focal length
    <span class="display-math">$$ \begin{align*}
        \frac{1}{u} + \frac{1}{v} = \left(\frac{n_2}{n_1}-1\right)\left(\frac{1}{R_1} + \frac{1}{R_2}\right) \equiv \frac{1}{f}.
    \end{align*} $$</span>
    (<a href="/tripos-notes/Lectures/IA/Lent/Waves-and-Quantum-Waves-Wv/Notes/Derivation-lens-maker-s-equation.html">Derivation</a>)
</p>
<p>
    The focal length <span class="inline-math">$f$</span> is defined as the image distnace <span class="inline-math">$v$</span> when <span class="inline-math">$u=\infty$</span>.
</p>
