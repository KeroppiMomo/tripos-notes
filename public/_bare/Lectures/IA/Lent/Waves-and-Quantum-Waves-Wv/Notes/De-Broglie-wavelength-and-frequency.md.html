<p>
    Matter behaves as waves.
    De Broglie argues that the wavelength and frequency are
    <span class="display-math">$$ \begin{align*}
        E = hf = \hbar\omega, \\
        p = \frac{h}{\lambda} = \hbar k.
    \end{align*} $$</span>
    where <span class="inline-math">$h$</span> is Planck's constant and <span class="inline-math">$\hbar = h/2\pi$</span> is reduced Planck's constant.
</p>
