<p>
    The pressure difference from atmosphere satisfies
    <span class="display-math">$$ \begin{align*}
        \psi_p \propto \pdfd{\psi}{x}.
    \end{align*} $$</span>
</p>
<ul>
<li>
    <p>
        Open end has <span class="inline-math">$\psi_p = 0 = \pdfd{\psi}{x}$</span>;
    </p>
    
</li><li>
    <p>
        Closed end has <span class="inline-math">$\psi = 0$</span>.
    </p>
    
</li>
</ul>
