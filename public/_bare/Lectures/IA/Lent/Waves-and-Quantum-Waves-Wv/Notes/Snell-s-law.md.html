<p>
    Angle of incidence <span class="inline-math">$\theta_1$</span> and angle of refraction <span class="inline-math">$\theta_2$</span> are related by
    <span class="display-math">$$ \begin{align*}
        n_1 \sin \theta_1 = n_2 \sin\theta_2.
    \end{align*} $$</span>
    (<a href="/tripos-notes/Lectures/IA/Lent/Waves-and-Quantum-Waves-Wv/Notes/Derivation-Snell-s-law.html">Derivation</a>)
</p>
<p>
    Total internal refraction occurs when <span class="inline-math">$\sin\theta_2 &gt; 1$</span>.
</p>
