<p>
    Schrodinger's equation has solution in the form <span class="inline-math">$\hat\psi(x,t) = A\exp ikx$</span>:
    <span class="display-math">$$ \begin{align*}
        -k^2\hat\psi + \frac{2m}{\hbar}(E-V)\hat\psi = 0.
    \end{align*} $$</span>
    so
    <span class="display-math">$$ \begin{align*}
        k = \pm\frac{\sqrt{2m(E-V)}}{\hbar}.
    \end{align*} $$</span>
</p>
