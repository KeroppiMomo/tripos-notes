<p>
    Angle of incidence <span class="inline-math">$\theta_i = \theta_r$</span> angle of reflection. (<a href="/tripos-notes/Lectures/IA/Lent/Waves-and-Quantum-Waves-Wv/Notes/Derivation-law-of-reflection.html">Derivation</a>)
</p>
<p>
    If <span class="inline-math">$n_2 &gt; n_1$</span>, there is a <span class="inline-math">$\pi$</span> phase change upon reflection. If <span class="inline-math">$n_2&lt;n_1$</span>, there is no phase change.
