<p>
    Each small length <span class="inline-math">$dx$</span> of the slit has amplitude <span class="inline-math">$A_0\,dx/a$</span>, so
    <span class="display-math">$$ \begin{align*}
        A &amp;= A_0\int_{-a/2}^{a/2} \exp(ikx\sin\theta) \frac{dx}{a} \\
        &amp;=\frac{A_0}{ika\sin\theta} \left[\exp(ikx\sin\theta)\right]_{-a/2}^{a/2} \\
        &amp;= \frac{2\sin(k(a/2)\sin\theta)}{ka\sin\theta} A_0. \\
    \end{align*} $$</span>
</p>
