<p>
    The velocity <span class="inline-math">$\dot x$</span> is <span class="inline-math">$\pi/2$</span> phase ahead of <span class="inline-math">$x$</span>:
    <span class="display-math">$$ \dot x(t) = -\omega a_0\sin(\omega t + \phi) = \omega a_0\cos\big(\omega t+\phi+\frac\pi2\big) $$</span>
    and the acceleration is <span class="inline-math">$\pi$</span> phase ahead:
    <span class="display-math">$$ \ddot x(t) = -\omega^2 a_0\cos(\omega t + \phi) = \omega^2 a_0\cos(\omega t+\phi+\pi) $$</span>
</p>
