<p>
    When the total energy of the system is in the form
    <span class="display-math">$$ E = \frac12 \alpha \dot x^2 + \frac12 \beta x^2 $$</span>
    is conserved, the system is in simple harmonic motion with angular frequency
    <span class="display-math">$$ \omega = \sqrt{\frac\beta\alpha}. $$</span>
    (<a href="/tripos-notes/Lectures/IA/Lent/Oscillating-Systems-OS/Notes/Derivation-energy-quadratic-in-position-and-velocity-implies-SHM.html">Derivation</a>)
</p>
