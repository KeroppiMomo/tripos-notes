<p>
    If the logarithmic decrement is <span class="inline-math">$\Delta$</span>, the <strong>_amplitude</strong>_ of successive oscillations decays by a factor of <span class="inline-math">$e^{-\Delta}$</span>. The formula is
    <span class="display-math">$$ \Delta = \frac{2\pi\gamma}{\omega_d}. $$</span>
    (<a href="/tripos-notes/Lectures/IA/Lent/Oscillating-Systems-OS/Notes/Derivation-of-logarithmic-decrement.html">Derivation</a>)
</p>
<p>
    The energy of successive oscillations decays by a factor of <span class="inline-math">$e^{-2\Delta}$</span>.
</p>
