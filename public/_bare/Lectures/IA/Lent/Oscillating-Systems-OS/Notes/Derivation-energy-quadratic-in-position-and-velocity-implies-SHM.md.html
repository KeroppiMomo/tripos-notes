<p>
    The total energy <span class="inline-math">$E = \frac12\alpha\dot x^2 + \frac12\beta x^2$</span> is constant over time, so
    <span class="display-math">$$\begin{align*}
    0 &amp;= \dot E \\
    &amp;= \alpha\dot x\ddot x + \beta x\dot x \\
    &amp;= \dot x(\alpha\ddot x + \beta x) \\
    \ddot x &amp;= -\frac\beta\alpha x,
    \end{align*}$$</span>
    which is the SHM equation.
</p>
