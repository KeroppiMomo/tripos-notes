<p>
    The qualify factor <span class="inline-math">$Q$</span> is defined as
    <span class="display-math">$$ Q = \frac{\omega_0}{2\gamma}. $$</span>
</p>
<p>
    For good oscillators, <span class="inline-math">$Q$</span> represents the number of radians of oscillation required for the <strong>_energy</strong>_ to fall by a factor of <span class="inline-math">$e$</span>. (<a href="/tripos-notes/Lectures/IA/Lent/Oscillating-Systems-OS/Notes/Derivation-of-meaning-of-qualify-factor.html">Derivation</a>)
    Such number for the amplitude is <span class="inline-math">$2Q$</span>.
</p>
