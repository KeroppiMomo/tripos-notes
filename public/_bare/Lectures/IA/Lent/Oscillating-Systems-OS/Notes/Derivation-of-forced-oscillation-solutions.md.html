<p>
    Use complex numbers
    <span class="display-math">$$ \ddot z + 2\gamma\dot z + \omega_0^2 z = fe^{i\omega t} $$</span>
    and guess particular solution <span class="inline-math">$z(t) = Ae^{i\omega t}$</span>.
</p>
<p>
    Substituting,
    <span class="display-math">$$ (-\omega^2 + 2i\gamma\omega + \omega_0^2)A = f $$</span>
    <span class="display-math">$$ A = \frac{f}{\omega_0^2 - \omega^2 + 2i\gamma\omega}. $$</span>
</p>
