<p>
    For a constant electric field inside a material,
    <span class="display-math">$$ \begin{align*}
        El = V = IR = qnA\langle v\rangle R \implies R = \frac{El}{qn\langle v\rangle A}
    \end{align*} $$</span>
    and so <span class="inline-math">$E\propto\langle v\rangle$</span>. Then <span class="inline-math">$qn\langle v\rangle/E \equiv \sigma$</span> is a material-dependent property.
</p>
