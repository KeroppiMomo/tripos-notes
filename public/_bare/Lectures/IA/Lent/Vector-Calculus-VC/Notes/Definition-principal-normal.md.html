<p>
    Let <span class="inline-math">$\v x(s)$</span> be a curve,
    and suppose <a href="/tripos-notes/Lectures/IA/Lent/Vector-Calculus-VC/Notes/Definition-curvature-of-a-curve.html"><span class="inline-math">$κ(s)$</span></a><span class="inline-math">${}\neq 0$</span> at some <span class="inline-math">$s$</span>.
    The principal normal at a point <span class="inline-math">$\v x(s)$</span> is
    <span class="display-math">$$ \v n = \frac1\kappa\dvd[2]xs = \frac1\kappa\dvd ts. $$</span>
    <span class="inline-math">$1/\kappa$</span> ensures this is a unit vector.
</p>
