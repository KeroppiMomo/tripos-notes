<p>
    Charges in a wire moving across a transverse <span class="inline-math">$\v B$</span> field experiences Lorentz force <span class="inline-math">$\v F = q\v v\times \v B$</span>.
    The force moves it across a distance of <span class="inline-math">$\v l$</span>, so there is a motional emf
    <span class="display-math">$$ \begin{align*}
        \mathcal{E} = (\v v\times\v B)\cdot\v l.
    \end{align*} $$</span>
</p>
