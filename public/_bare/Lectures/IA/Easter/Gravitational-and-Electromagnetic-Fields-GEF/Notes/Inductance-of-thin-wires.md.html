<p>
    The mutual inductance
    between wire <span class="inline-math">$i$</span> (along curve <span class="inline-math">$C_i$</span> with current <span class="inline-math">$I_i$</span>)
    and wire <span class="inline-math">$j$</span> (along curve <span class="inline-math">$C_j$</span> with current <span class="inline-math">$I_j$</span>) is
    <span class="display-math">$$ \begin{align*}
        L_{ij} = \frac{μ_0}{4π} \int_{C_i} \int_{C_j} \frac{\d \v x_i\cdot \d \v x_j}{|\v x_i - \v x_j|} = L_{ji}.
    \end{align*} $$</span>
    (<a href="/tripos-notes/Lectures/IA/Easter/Gravitational-and-Electromagnetic-Fields-GEF/Notes/Derivation-inductance-of-thin-wires.html">Derivation</a>)
</p>
