<p>
    Electric potential is defined in a conservative electric field as
    <span class="display-math">$$ \begin{align*}
        \v E = -\nabla\Phi.
    \end{align*} $$</span>
    A point charge <span class="inline-math">$Q$</span> gives an electrostatic potential
    <span class="display-math">$$ \begin{align*}
        \Phi = \frac{Q}{4\pi\epsilon_0 r}.
    \end{align*} $$</span>
</p>
<p>
    Voltage is potential difference.
</p>
