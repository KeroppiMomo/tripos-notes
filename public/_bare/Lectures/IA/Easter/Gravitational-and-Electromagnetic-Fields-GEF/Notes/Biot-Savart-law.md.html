<p>
    Taking a current element <span class="inline-math">$I\, d\v l$</span> as the origin, it causes a magnetic field at <span class="inline-math">$\v r$</span>
    <span class="display-math">$$ \begin{align*}
        d\v B = \frac{\mu_0 I\,d\v l\times \vhat r}{4\pi r^2}.
    \end{align*} $$</span>
</p>
