<li>
    <p>
        The line joining the Sun to a particular planet sweeps out equal areas in equal time.
    </p>
    
</li>
</ol>
<p>
    Angular momentum is conserved since gravity is a central force.
    Area swept per unit time is
    <span class="display-math">$$ \begin{align*}
        \dfd{A}{t} = \frac{1}{2}|\v r\times \v v| = \frac{L}{2m}
    \end{align*} $$</span>
    so it is constant.
</p>
