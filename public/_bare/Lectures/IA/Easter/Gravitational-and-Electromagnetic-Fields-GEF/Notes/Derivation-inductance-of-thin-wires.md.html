<p>
    The <a href="/tripos-notes/Lectures/IB/Lent/Electromagnetism-EM/Notes/Faraday-s-law.html">magnetic flux</a> through wire <span class="inline-math">$i$</span> due to wire <span class="inline-math">$j$</span>
    is
    <span class="display-math">$$ \begin{align*}
        \mathcal{F}_{ij} ={}&amp; \int_{C_i} \v A_j(\v x_i) \cdot \d \v x_i \\
        ={}&amp; \frac{μ_0 I_j}{4π} \int_{C_i} \int_{C_j} \frac{\d \v x_j}{|\v x_i - \v x_j|} \cdot \d \v x_i
    \end{align*} $$</span>
    using the <a href="/tripos-notes/Lectures/IB/Lent/Electromagnetism-EM/Notes/Magnetic-field-due-to-thin-wire.html">Biot-Savart law</a>.
</p>
