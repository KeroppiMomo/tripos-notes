    <span class="display-math">$$ \begin{align*}
        2a = \frac{r_0}{1-e} + \frac{r_0}{1+e} \implies r_0 = a(1-e^2).

<p>
    Ellipse is the locus of points that has constant sum of distances to the two foci, so by symmetry,
    <span class="display-math">$$ \begin{align*}
        a^2 = b^2 + (ae)^2.
    \end{align*} $$</span>
