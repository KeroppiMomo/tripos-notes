<p>
    For <span class="inline-math">$\v a,\v b\in\mathbb R^3$</span>, define
    <span class="display-math">$$ \v a\times\v b = |\v a||\v b|\sin\theta\ \vhat n $$</span>
    where <span class="inline-math">$\theta$</span> is the angle between <span class="inline-math">$\v a$</span> and <span class="inline-math">$\v b$</span>, and <span class="inline-math">$\vhat n$</span> is the unit vector perpendicular to <span class="inline-math">$\v a,\v b$</span> in the right-handed sense.
</p>
