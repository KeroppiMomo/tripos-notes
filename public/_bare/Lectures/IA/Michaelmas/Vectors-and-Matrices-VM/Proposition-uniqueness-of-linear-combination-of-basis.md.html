<p>
    If <span class="inline-math">$\v u_1,\v u_2,\ldots,\v u_n$</span> is a basis of a vector space <span class="inline-math">$V$</span>, then for any vector <span class="inline-math">$\v v\in V$</span>,
    <span class="inline-math">$\v v$</span> written as a linear combination of basis is unique.
