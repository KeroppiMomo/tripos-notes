<p>
    For any vectors <span class="inline-math">$\v u,\v v\in\mathbb C^n$</span> where
    <span class="display-math">$$ \v u = \sum_{i=1}^n u_i \v e_i, \quad u_i\in\mathbb C $$</span>
    <span class="display-math">$$ \v v = \sum_{i=1}^n v_i \v e_i, \quad v_i\in\mathbb C $$</span>
    define their dot or inner product
    <span class="display-math">$$ \v u\cdot\v v = \langle\v u|\v v\rangle = \sum_{i=1}^n\overline{u_i} v_i.$$</span>
</p>
