<p>
    For <span class="inline-math">$\v a,\v b\in\mathbb R^2$</span> or <span class="inline-math">$\mathbb R^3$</span>, define
    <span class="display-math">$$ \v a\cdot\v b = |\v a||\v b|\cos\theta $$</span>
    where <span class="inline-math">$\theta$</span> is the angle between <span class="inline-math">$\v a$</span> and <span class="inline-math">$\v b$</span>.
</p>
