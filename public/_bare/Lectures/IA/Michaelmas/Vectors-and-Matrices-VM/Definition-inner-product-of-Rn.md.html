<p>
    For any two vectors <span class="inline-math">$\v x,\v y\in\mathbb R^n$</span> where
    <span class="display-math">$$\begin{align*}
    \v x &amp;= \sum_{i=1}^n x_i\v e_i \\
    \v y &amp;= \sum_{i=1}^n y_i\v e_i,
    \end{align*}$$</span>
    define its dot or inner product
    <span class="display-math">$$ \v x\cdot\v y = \langle \v x | \v y\rangle = \sum_{i=1}^n x_iy_i. $$</span>
</p>
