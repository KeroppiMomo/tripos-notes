<p>
    For a vector space <span class="inline-math">$V$</span>, we say <span class="inline-math">$\{\v v_1, \v v_2, \ldots, \v v_n\}$</span> spans <span class="inline-math">$V$</span>, or it is a spanning set of <span class="inline-math">$V$</span>, when every vector <span class="inline-math">$\v v\in V$</span> can be written as a linear combination of <span class="inline-math">$\v v_1,\ldots, \v v_n$</span>, i.e. there exists scalars <span class="inline-math">$c_1,\ldots,c_n$</span> such that
    <span class="display-math">$$ \v v = \sum_{i=1}^n c_i \v v_i. $$</span>
</p>
