<p>
    For all <span class="inline-math">$\v x,y\in\mathbb R^n$</span>,
    <span class="display-math">$$\v x\cdot\v y\leq|\v x||\v y|$$</span>
    with equality iff <span class="inline-math">$\v x=\v 0$</span> or <span class="inline-math">$\v y=\v 0$</span> or <span class="inline-math">$\v x=\lambda\v y$</span> for some <span class="inline-math">$\lambda\in\mathbb R$</span>.
</p>
