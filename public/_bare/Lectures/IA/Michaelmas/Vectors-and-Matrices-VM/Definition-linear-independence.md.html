<p>
    A list of vectors <span class="inline-math">$\v v_1,\v v_2,\ldots, \v v_n\in V$</span> is linearly independent when for some scalars <span class="inline-math">$c_1,\ldots, c_n$</span>,
    <span class="display-math">$$ \sum_i c_i\v v_i = \v 0 \implies c_i=0\quad\forall i.$$</span>
</p>
<p>
    If it is not linearly independent, then it is linearly dependent.
</p>
