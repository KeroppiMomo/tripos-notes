<p>
    For one particle with rest mass <span class="inline-math">$m$</span>, its total energy <span class="inline-math">$E$</span> and momentum <span class="inline-math">$p$</span> follows
    <span class="display-math">$$ E^2 - (pc)^2 = (mc^2)^2. $$</span>
