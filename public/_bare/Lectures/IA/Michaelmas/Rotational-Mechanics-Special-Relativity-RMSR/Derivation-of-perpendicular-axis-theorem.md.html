<p>
    Since every particle is on the same plane,
    <span class="display-math">$$\begin{align*}
    I_z &amp;= \sum_i m_i r_i^2 \\
    &amp;= \sum_i m_i (x_i^2 + y_i^2) &amp;&amp;\text{Pythagoras} \\
    &amp;= \sum_i m_ix_i^2 + \sum_i m_iy_i^2 \\
    &amp;= I_x + I_y.
    \end{align*}$$</span>
</p>
