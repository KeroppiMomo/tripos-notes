<p>
    For a lamina lying on the <span class="inline-math">$x$</span>-<span class="inline-math">$y$</span> plane, with the <span class="inline-math">$z$</span> axis in the direction perpendicular to the lamina. The moment of inertia along the three axes are related by
    <span class="display-math">$$ I_z = I_x + I_y. $$</span>
    (<a href="/tripos-notes/Lectures/IA/Michaelmas/Rotational-Mechanics-Special-Relativity-RMSR/Derivation-of-perpendicular-axis-theorem.html">Derivation</a>)
