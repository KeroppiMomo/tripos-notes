<p>
    Since any force <span class="inline-math">$\v F$</span> acts along the axis of rotation of the gyroscope, its moment <span class="inline-math">$\v G = \dv L$</span> is perpendicular to <span class="inline-math">$\v L$</span> at all times. Therefore the magnitude of <span class="inline-math">$\v L$</span> does not change.
