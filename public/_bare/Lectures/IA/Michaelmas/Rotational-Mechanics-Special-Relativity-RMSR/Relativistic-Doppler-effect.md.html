<p>
    If light with frequency <span class="inline-math">$f&#x27;$</span> is emitted from a source at rest in frame <span class="inline-math">$S&#x27;$</span>, the frequency observed in <span class="inline-math">$S$</span> is
    <span class="display-math">$$ f = \sqrt{\frac{c-v}{c+v}} f&#x27;. $$</span>
    (<a href="/tripos-notes/Lectures/IA/Michaelmas/Rotational-Mechanics-Special-Relativity-RMSR/Derivation-of-relativistic-Doppler-effect.html">Derivation</a>)
</p>
