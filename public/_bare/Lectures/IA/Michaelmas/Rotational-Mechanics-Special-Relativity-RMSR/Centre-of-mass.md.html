<p>
    The centre of mass of a system of masses is defined as
    <span class="display-math">$$ \v R = \frac{\sum_i m_i \v r_i}{\sum_i m_i} = \frac1M \sum_i m_i \v r_i $$</span>
    <span class="display-math">$$ \v R = \frac1M \int_\text{body} \vec r \,dm. $$</span>
</p>
<p>
    Principle of superposition holds.
</p>
