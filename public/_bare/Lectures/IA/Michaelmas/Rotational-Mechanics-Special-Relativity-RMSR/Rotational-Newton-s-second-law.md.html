<p>
    Suppose a rigid body is rotating about a fixed axis <span class="inline-math">$A$</span>. Then
    <span class="display-math">$$ \v G_{ext} = I \ddv\theta$$</span>
    where <span class="inline-math">$\v G_{ext}$</span> is the total external moment about <span class="inline-math">$A$</span>, <span class="inline-math">$I$</span> is the moment of inertia about <span class="inline-math">$A$</span>, and <span class="inline-math">$\ddv\theta$</span> is the angular acceleration.
    (<a href="/tripos-notes/Lectures/IA/Michaelmas/Rotational-Mechanics-Special-Relativity-RMSR/Derivation-of-rotational-Newton-s-second-law.html">Derivation</a>)
</p>
