<p>
    We derive by calculating the norm of the 4-momentum:
    <span class="display-math">$$\begin{align*}
    \left\|\pmat{E/c \\ p_x \\ p_y \\ p_z}\right\|^2 &amp;= \|m\v U\|^2 \\
    \frac{E^2}{c^2} - (p_x^2 + p_y^2 + p_z^2) &amp;= m^2c^2 \\
    E^2 - (pc)^2 &amp;= (mc^2)^2
    \end{align*}$$</span>
</p>
