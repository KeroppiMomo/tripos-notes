<p>
    Along the direction of relative motion, if the length of an object measured in the rest frame <span class="inline-math">$S&#x27;$</span> (proper length) is <span class="inline-math">$L_0$</span>, then the length measured in <span class="inline-math">$S$</span> is
    <span class="display-math">$$ L = \frac{L_0}{\gamma}. $$</span>
</p>
<p>
    The length remains unchanged perpendicular to relative motion.
</p>
