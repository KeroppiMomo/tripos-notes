<p>
    For each particle,
    <span class="display-math">$$\begin{align*}
    K_i &amp;= \frac12 m_i v_i^2 \\
    &amp;= \frac12 m_i (r_i\omega)^2 \\
    &amp;= \frac12 m_i r_i^2 \omega^2,
    \end{align*}$$</span>
    so summing,
    <span class="display-math">$$ K = \sum_i K_i = \Big(\sum_i \frac12 m_i r_i^2\Big) \omega^2 = I\omega^2. $$</span>
</p>
