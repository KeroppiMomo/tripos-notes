<p>
    Analogous to <span class="inline-math">$\v F_{ext} = d\v p/dt$</span>, the rotational equivalence is about any point,
    <span class="display-math">$$ \v G_{ext} = \frac{d\v L}{dt}. $$</span>
    (<a href="/tripos-notes/Lectures/IA/Michaelmas/Rotational-Mechanics-Special-Relativity-RMSR/Derivation-of-rate-of-change-of-angular-momentum-equals-external-moments.html">Derivation</a>)
</p>
<p>
    For a rotating rigid body, integrating from <span class="inline-math">$\v G = I\dv\omega$</span> gives
    <span class="display-math">$$ \v L = I\v\omega $$</span>
    about any axis.
</p>
