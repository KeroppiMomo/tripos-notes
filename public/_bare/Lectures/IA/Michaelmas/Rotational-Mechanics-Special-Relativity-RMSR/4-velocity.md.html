<p>
    The 4-velocity of an object is
    <span class="display-math">$$ \v U \equiv \dfd{\v s}\tau = \gamma_v(c, \v v) = \gamma_v\pmat{c \\ v_x \\ v_y \\ v_z }$$</span>
    where <span class="inline-math">$\tau$</span> is the proper time and <span class="inline-math">$\gamma_v = 1/\sqrt{1 - v^2/c^2}$</span>. (<a href="/tripos-notes/Lectures/IA/Michaelmas/Rotational-Mechanics-Special-Relativity-RMSR/Derivation-4-velocity.html">Derivation</a>)
</p>
<p>
    Lorentz transformation also applies to 4-velocity
    <span class="display-math">$$ \v U&#x27; = \Lambda\v U. $$</span>
</p>
