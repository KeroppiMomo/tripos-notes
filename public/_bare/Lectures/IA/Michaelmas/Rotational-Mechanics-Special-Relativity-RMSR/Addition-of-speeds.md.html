<p>
    If an object is travelling at velocity <span class="inline-math">$\v u&#x27; = (u_x&#x27;, u_y&#x27;)$</span> in frame <span class="inline-math">$S&#x27;$</span>, the observed velocity in frame <span class="inline-math">$S$</span> is
    <span class="display-math">$$ \v u = \Big(\frac{u_x&#x27; + v}{1+vu_x&#x27;/c^2}, \frac{u_y&#x27;}{\gamma(1+vu_x&#x27;/c^2)}\Big). $$</span>
    (<a href="/tripos-notes/Lectures/IA/Michaelmas/Rotational-Mechanics-Special-Relativity-RMSR/Derivation-of-addition-of-speeds-formula.html">Derivation</a>)
</p>
