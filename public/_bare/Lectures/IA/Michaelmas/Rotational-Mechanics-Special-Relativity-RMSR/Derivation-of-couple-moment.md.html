<p>
    Suppose <span class="inline-math">$-\vec F$</span> acts at position vector <span class="inline-math">$\vec r$</span> and <span class="inline-math">$\vec F$</span> acts at position vector <span class="inline-math">$\v r + \v a$</span>. Then
    <span class="display-math">$$ \v G = (\v r + \v a) \times \v F - \v r \times \v F = \v a \times \v F. $$</span>
</p>
