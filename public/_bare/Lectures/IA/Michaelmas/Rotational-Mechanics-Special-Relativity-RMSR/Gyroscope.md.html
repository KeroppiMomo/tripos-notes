<p>
    In a gyroscope, the torque <span class="inline-math">$\v G$</span> is always perpendicular to the angular momentum <span class="inline-math">$\v L$</span>, so
    <span class="display-math">$$ \v G = \v \Omega \times \v L $$</span>
    where <span class="inline-math">$\v \Omega$</span> is the rate of precession.
    (<a href="/tripos-notes/Lectures/IA/Michaelmas/Rotational-Mechanics-Special-Relativity-RMSR/Derivation-of-angular-momentum-in-gyroscope.html">Derivation</a>)
</p>
