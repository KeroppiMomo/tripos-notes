<p>
    For an object which has mass <span class="inline-math">$m$</span> and velocity <span class="inline-math">$\v v$</span> measured in an inertial frame, its momentum in the frame is
    <span class="display-math">$$ \v p = \gamma_v m\v v $$</span>
    where <span class="inline-math">$\gamma_v = 1/\sqrt{1-v^2/c^2}$</span>.
    (<a href="/tripos-notes/Lectures/IA/Michaelmas/Rotational-Mechanics-Special-Relativity-RMSR/Derivation-of-relativistic-momentum.html">Derivation</a>)
</p>
<p>
    In a frame, total momentum of a system is conserved.
</p>
