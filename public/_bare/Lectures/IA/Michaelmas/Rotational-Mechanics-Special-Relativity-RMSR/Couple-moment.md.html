<p>
    Two forces <span class="inline-math">$\v F$</span> and <span class="inline-math">$-\v F$</span> act at two different positions separated by a displacement <span class="inline-math">$\v a$</span> (points from where <span class="inline-math">$-\v F$</span> is to where <span class="inline-math">$\v F$</span> is). Then about <em>any origin</em>, the moment of the couple is
    <span class="display-math">$$ \v G = \v a \times \v F. $$</span>
    (<a href="/tripos-notes/Lectures/IA/Michaelmas/Rotational-Mechanics-Special-Relativity-RMSR/Derivation-of-couple-moment.html">Derivation</a>)
</p>
