<p>
    A force <span class="inline-math">$\vec F$</span> does work to a body
    <span class="display-math">$$ dW = \vec F \cdot d\vec r $$</span>
    <span class="display-math">$$ W = \int_{\vec r_1}^{\vec r_2} \vec F\cdot d\vec r $$</span>
    where <span class="inline-math">$\vec r$</span> is the displacement of the body.
</p>
