<p>
    Impulse is the change of momentum:
    <span class="display-math">$$ \Delta \vec p = \int_i^f \vec F\, dt. $$</span>
</p>
<p>
    We can use impulse to find out the average force:
    <span class="display-math">$$ F_{avg} \equiv \frac{1}{\Delta t} \int_{t_0}^{t_0+\Delta t} \vec F\,dt = \frac{\Delta\vec p}{\Delta t}. $$</span>
</p>
