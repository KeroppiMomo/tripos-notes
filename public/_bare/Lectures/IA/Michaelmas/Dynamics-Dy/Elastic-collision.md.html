<p>
    When a mass <span class="inline-math">$m_1$</span> moving at velocity <span class="inline-math">$u$</span> collides head-on with a stationary mass <span class="inline-math">$m_2$</span>, the final velocities are
    <span class="display-math">$$ v_1 = \frac{m_1-m_2}{m_1+m_2} u, \quad v_2 = \frac{2m_1}{m_1+m_2} u. $$</span>
    (<a href="/tripos-notes/Lectures/IA/Michaelmas/Dynamics-Dy/Derivation-of-final-velocities-after-elastic-collision.html">Derivation</a>)
</p>
