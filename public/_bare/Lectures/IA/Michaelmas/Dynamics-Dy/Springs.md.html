<p>
    Ideal spring obeys Hooke's law:
    <span class="display-math">$$ F = kx = \lambda\Big(\frac xl\Big) $$</span>
    where <span class="inline-math">$x$</span> is the extension, <span class="inline-math">$l$</span> is the length of the spring, <span class="inline-math">$k$</span> is the spring constant, and <span class="inline-math">$\lambda$</span> is constant for a particular type of spring.
</p>
