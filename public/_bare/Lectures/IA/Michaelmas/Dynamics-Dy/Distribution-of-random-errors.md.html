<p>
    We assume random errors to follow a Gaussian (normal) distribution:
    <span class="display-math">$$ P(x) \propto \exp\Big(-\frac12\big(\frac{x-X}{\sigma}\big)^2\Big)$$</span>
    where <span class="inline-math">$X$</span> is the true value and <span class="inline-math">$\sigma$</span> is the standard deviation.
</p>
