<p>
    If <span class="inline-math">$P(n)$</span> holds for some <span class="inline-math">$n\in\mathbb N$</span>, then there is a minimal <span class="inline-math">$m\in\mathbb N$</span> such that <span class="inline-math">$P(m)$</span> holds.
</p>
<p>
    Alternatively, every non-empty subset of <span class="inline-math">$\mathbb N$</span> has a minimal element.
</p>
